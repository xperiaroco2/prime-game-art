# The ship engine's start console as numbers, in centimetres (art#263's stations; the engineer, 2026-10-24: "make the
# console's drawing in cm", then "build it in its own session"). The headline sizes are the drawing's
# (prime-game-design ideas/ship-components/stations-final/console-drawing/drawing.js, run through node: its N object),
# traced over the picked concept's straight views (front-ortho.jpg, side-ortho.jpg, top-ortho.jpg; the look:
# ../console-final.jpg) with the body stretched 40 cm, so the button sits at hip height. The smaller sizes (the
# blocks' bevels, the bezels, the emitter's steps) were read off the same views at the drawing's scale (6.1 px per cm
# on the front view, 6.58 on the top view).
# Axes: u across the front (0 the centre line, + to the right as you face the button), d front to back, h up from the
# floor; in Blender x = u, y = -d (the front, the button, at -Y; glTF +Z), z = h. Angles in degrees round the
# vertical axis, 0 the front's middle.
# tools/blender/console_build.py builds the model from these numbers; tools/blender/console_drawing.py draws them.

[measure]                        # where the concept's straight views were measured (drawing.js F, S, T; px)
front = { floor = 885, cx = 766, cut = 700, px_per_cm = 6.1 }          # above `cut` the drawing lifts the view by
side = { floor = 880, cx = 737, cut = 690, px_per_cm = 5.8833 }        # `lift`: the stretch of the body
top = { cx = 758, cy = 470, px_per_cm = 6.5833 }
lift = 40.0

[layout]                         # the blocks round the console: the front block over the button, a cyan channel
segments = 10                    # either side of it, then `segments` equal blocks round the back
front_half = 24.4                # the front block's half angle: u +-22.3 at the body's middle radius
channel_half = 30.2              # to here the cyan channel (u +-27.2)
gap = 0.9                        # the dark joint between two blocks (cm, along the surface)

[plinth]                         # the bronze ring of blocks on the floor
r_bottom = 59.0                  # drawing: 118.0 at the floor
r_top = 60.0                     # 120.0, its widest, where the top chamfer starts
h_top = 15.25
h_chamfer = 11.6                 # the slanted top face from here
r_chamfer = 56.6                 # its inner edge at h_top
r_in = 48.0

[core]                           # the graphite drum behind every block: the dark joints, the rings between the parts
r = 46.5                         # inside the front block's flat face (its chord, 47.9 from the axis at the top)
h0 = 14.0
h1 = 106.6                       # under the emitter's ring and plates

[body]                           # the bronze staves, stretched 40 cm against the concept
h0 = 19.67
h1 = 91.64
r_bottom = 55.41                 # drawing 110.8
r_top = 52.62                    # drawing 105.2
bevel_top = 2.2                  # each stave's slanted top and foot (a wide chamfer that catches the light)
bevel_bottom = 1.6
r_in = 49.5

[rim]                            # the bronze band of blocks round the top
h0 = 93.28
h1 = 109.34
r_foot = 54.6                    # the small chamfer under it
h_face0 = 95.0                   # its upright face
h_face1 = 103.6
r = 55.74                        # drawing 111.5, the widest
r_top = 51.64                    # drawing 103.3, where the big slanted top meets the flat top
r_in = 47.6                      # the flat top's inner edge; inside it the emitter deck

[strips]                         # the three stage strips on the rim's front block
h0 = 96.56
h1 = 100.98
u = [[-21.8, -9.51], [-6.23, 6.07], [9.67, 21.64]]
bezel = 0.7                      # the graphite frame round each
depth = 0.35                     # the light sits this deep in it

[channels]                       # the two cyan strips either side of the button, in the joints of the front block
h0 = 18.85
h1 = 89.18
u = [22.3, 27.2]                 # |u| of their inner and outer edges (drawing: 22.0 ... 27.2)
depth = 1.1                      # the light's face behind the staves' faces

[button]                         # the orange mushroom start button on the front block
h = 81.4                         # the drawing: 85.41; lowered 4 cm (the engineer's review, 2026-10-24: its collar
                                 # reached into the joint under the rim), so the collar ends under the block's top chamfer
collar = 15.57                   # the graphite collar's diameter
proud = 4.42                     # the dome's front ahead of the block's face
collar_proud = 2.4               # the collar's lip ahead of the face
dome = 10.4                      # the orange dome's diameter
dome_proud = 1.7                 # where the dome leaves the collar
seat = 16.4                      # the graphite seat behind the collar (diameter)

[emitter]                        # the hologram projector inside the rim's top
deck_h = 108.0                   # the graphite deck between the rim's blocks and the ring
ring = 82.78                     # drawing: the cyan ring's diameter
ring_width = 1.5
plates_h = 108.6                 # the segmented plates inside the ring
plates_r = 40.4
collar_r = [12.0, 19.8]          # the raised collar round the core: inner and outer radius
collar_h = 110.49                # drawing: the emitter's top
core = 19.75                     # drawing: the glowing core's diameter
core_h = 109.6
beam_top = 128.0                 # the soft light column from the core up into the hologram

[hologram]                       # the ship's own hull mesh at 1:16.3, hollow and see-through
span = 159.84                    # drawing: the hull's 26.1 m span at this width
disc_h = 145.74                  # the hall's disc centre over the floor
tilt = 12.0                      # nose down toward the button
hull_mid_z = 2.5                 # the hull's height (m, the ship's frame) put at disc_h
outline_z = 1.68                 # m: the level cut through the hull's widest edge (its edge light, 1.3 to 2.05)
contour_z = [2.7, 3.7]             # m: the contour cuts over its top
line = 0.32                      # the edge lines' thickness (cm)
grid_line = 0.18                 # the surface grid's
grid_step = 1.62                 # m in the ship (two module lines of 0.81): the surface grid's spacing
lamp = 2.8                       # the eight order lamps' diameter (the concept's beads)
lamp_pitch = 1.15                # m in the ship: their spacing along the wing band
lamp_from = 4.9                  # m from the hall's centre to the first (red) lamp
band_width = 1.9                 # m: the wing band's width (the corridor's 3 m, drawn slimmer)
plan_z = 1.25                    # m: the rooms' plan (the hall's disc, the tip discs, the bands, the lamps, the entrance
                                 # channel) drawn flat at the deck inside the hull, not on its curved top (the engineer's
                                 # review, 2026-10-24: the disc sat over the hull and the rooms climbed its hump)
