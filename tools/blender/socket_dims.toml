# The ship's crystal socket as numbers, in centimetres (art#263's stations: four on the hall's walls, each holding one
# energy crystal; the engineer, 2026-10-25: "the main thing is that we now draw everything precisely, by
# coordinates"). The headline sizes are the drawing's: prime-game-design commit ea27a81,
# ideas/ship-components/stations-final/socket-drawing/drawing.js, run through node (its N object), traced over the
# picked sheet's straight views front-ortho.jpg and side-ortho.jpg (the look: ../socket.jpg). The smaller sizes (the
# chamfers, the layers' insets, the slots' bezels, the strip's groove) were read off the same views at the drawing's
# scale (14.61 px per cm on the front view, 13.78 on the side view).
# Axes: u across the front (0 the centre line, + to the right as you face the socket), d out of the wall (0 the wall's
# face), h up from the hall's floor. In Blender x = u, y = -d (glTF +Z out of the wall), z = h; the origin on the
# wall's face at floor level under the crystal's axis.
# Polygons are right halves from the top of the centre line round to its bottom ([u, h]), mirrored for the left
# (socket_drawing.loop), except the claw, a whole polygon mirrored as the left claw.
# Every h below is drawn with the crystal's middle at [mount] drawn_at; the build moves them all by h - drawn_at, so
# moving the socket (the engineer may still lower it to 120) is the one number [mount] h.
# tools/blender/socket_build.py builds the model from these numbers; tools/blender/socket_drawing.py draws them.

[mount]
h = 140.0                        # MOUNT: the crystal's middle (its tip plus half of 34.9) above the hall's floor
drawn_at = 140.0                 # the h the numbers below were drawn at
axis_d = 17.0                    # the crystal's axis out of the wall
crystal = 34.9                   # the built crystal, tip to the loop's top (tools/blender/crystal_dims.toml)
cap = [24.3, 26.8, 13.5]         # its cap's band above the tip (z0, z1) and its width across flats (an octagon)
cap_built = 13.62                # the built cap across at its band, measured in Blender (its bronze rims stand out)

[measure]                        # where the drawing measured its straight views (drawing.js F and SD; px)
front = { cx = 511.5, bottom = 1370.0, px_per_cm = 14.613 }   # the bottom row is the frame's bottom, h `bottom_h`
side = { wall = 345.0, bottom = 1330.0, px_per_cm = 13.778 }  # x = the wall's face
bottom_h = 87.38

[depth]                          # out of the wall (cm)
plate = 6.7                      # drawing: the back plate's face
layer = 12.2                     # drawing: the middle layer, the outer blocks' face
lip = 20.0                       # socket-2: the inner bezel round the bay, raised over the strip and the ring
ring = 19.0                      # the inner ring's rim outside the strip (side view: its lower part at 615 px)
strip = 19.3                     # the strip's light between the bezel and the rim, a step proud of the rim
front = 21.1                     # drawing: the frame's face, the bottom block
header = 20.4                    # socket-3: the neck block between the claws' hinges, a step proud of the lip's
                                 # 20.0 (step 2's header, 20.6 and 24 wide, ran under both claws: one hoop)
claw = [13.0, 22.2]              # drawing: the claws' tips at 22.2; 13.0 the jaw finger's back beside the cap
claw_plate = 20.15               # socket-3: the claw's arm is a plate in front of the lip (20.0): it swings clear
bay = 9.5                        # drawing: the bay's floor behind the crystal, deepened so the cap fits
collar = [9.4, 21.4]             # the cup under the crystal's tip (side view: its front at 640 px), on the axis
                                 # (its depth 2 x 4.4); its stem from 9.4 back to the bay's floor

[outline]                        # the back plate: drawing.js OUTLINE (46.7 wide, the waist 39.1 at h 131.2)
pts = [[0.0, 168.3], [11.54, 168.3], [23.39, 154.9], [23.39, 137.06], [19.55, 131.24], [23.39, 126.1],
       [23.39, 106.9], [6.4, 87.4], [0.0, 87.4]]
plate_chamfer = 0.5
inset = 0.9                      # the outer blocks inside the plate's edge: the plate shows as a dark step (1.0
                                 # put the bottom blocks' underside in the bottom block's plane, h 88.4)
layer_chamfer = 2.0              # the outer blocks' wide front chamfer
fine = 0.3                       # socket-2: the small edge bevel on each side of every broad chamfer
seam = 0.5                       # socket-2: the dark gap between two outer blocks (the plate shows in it)
# socket-2: the outer frame as separate blocks (the sheet's): the seams on rays from the bay's middle (u 0,
# h mount - 9) through these right-half points, mirrored: beside the top block, the upper corner (clear of the upper
# slot), the waist, under the lower slot, the bottom corner
seams = [[11.54, 168.3], [21.7, 156.8], [19.55, 131.24], [15.0, 105.0], [6.4, 87.4]]

[bay]                            # the bay round the crystal: drawing.js STRIP (the bay runs along the cyan strip:
                                 # 28.9 wide at its top, 20.1 at the collar), down beside the bottom block to 104.5
pts = [[0.0, 159.45], [5.65, 159.45], [10.58, 158.8], [12.9, 156.6], [14.49, 153.2], [14.49, 132.5], [12.9, 129.2],
       [10.03, 126.4], [10.03, 116.85], [6.68, 112.7], [5.38, 104.5], [0.0, 104.5]]

[ring]                           # the inner ring round the bay: its outer edge, one point per bay point (the
                                 # outer blocks' amber slots stay clear of it)
pts = [[0.0, 163.0], [5.65, 163.0], [11.8, 162.6], [15.2, 159.8], [16.85, 155.0], [16.85, 131.0], [15.0, 128.4],
       [13.9, 126.6], [14.2, 116.0], [11.6, 108.5], [10.6, 100.0], [0.0, 100.0]]
lip = 0.8                        # socket-2: the inner bezel's width from the bay's edge
strip = 2.0                      # the strip's outer edge from the bay's edge (the strip 1.2 wide; step 1: 0.9)
chamfer = 0.25                   # the rim's (it is 0.36 wide at the upper sides)
lip_chamfer = 0.2                # each side of the bezel (and a fine bevel of 0.06): its front 0.28 wide

[header]                         # socket-3: the neck block under the turned neck, between the claws' hinges (u
                                 # +-5.37) with a dark gap to each barrel: two claws, not one hoop with a header;
                                 # its bottom keeps step 2's 0.95 over the crystal's loop
pts = [[0.0, 164.6], [4.2, 164.6], [4.2, 160.2], [3.3, 158.4], [0.0, 158.4]]
chamfer = 0.8

[claw]                           # the right claw (drawing.js CLAW), mirrored for the left. Two changes for the built
                                 # crystal: its inner jaw at u 6.84 (the built cap 6.81 out, 0.3 mm clear: the sheet
                                 # drew 6.88 for the concept's 15.1 cap, the drawing's "close 0.8 a side"), and the
                                 # jaw reaching down to 148.0 (drawn 149.0), so it holds 1.4 of the cap's 2.5 band;
                                 # socket-3: its two outer corners cut (12.6, 161.3; 12.2, 150.6), a curved arm
pts = [[5.03, 163.1], [9.83, 163.3], [12.6, 161.3], [13.73, 158.6], [13.73, 152.5], [12.2, 150.6], [9.83, 149.2],
       [6.84, 148.0], [6.84, 155.2], [5.03, 158.6]]
chamfer = 0.6
# socket-3: the claws open (the engineer, 2026-10-25, prime-game#1095 comment 6392150248; prime-game-design 1df9a42,
# drawing.js HINGE [590, 268], OPEN 35, PULL 15): each claw a leaf (claw_r; claw_l mirrored) swinging round its root
# on the neck in the wall's plane, up and outward; the crystal slides straight out along +d, free after `pull`
hinge = [5.37, 162.79]           # drawing.js HINGE through its uF, hF
open_drawn = 35.0                # drawing.js OPEN, a placeholder
open = 25.0                      # built: the jaw finger reaches the bay's lip at 29 degrees (the build's swing
                                 # check: clear to 28, swing_clear_deg); at 35 it would cut the lip and the strip
pull = 15.0                      # drawing.js PULL
knuckle = 1.0                    # the barrel round the hinge (radius), turning on a graphite pin out of the ring
# the arm in two segments (the sheet's knuckled claw), cut on the line through these two points, cut_gap wide
cut = [[6.6, 156.2], [13.73, 155.0]]
cut_gap = 0.4
# the jaw finger behind the arm's lower segment, d claw[0] .. claw_plate: it holds the cap's band from the side
finger = [[6.84, 153.6], [8.0, 153.6], [8.0, 148.47], [6.84, 148.0]]

[block]                          # the bottom block, the frame's face; its sides along the bay down to 104.5
