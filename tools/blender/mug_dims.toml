# The lobby's mug of beer (art #392): Gate 1's drawing as numbers, every size in cm. The engineer's pick of
# 2026-11-23: concept 3, the faceted glass stein with a glass handle
# (<raw>/2026-11-23-lobby-mug-concepts/mug3_stein/image-0.png), without copper. The contract with the game
# (the shared note art-mug-392/contract.md) wins where it and the concept disagree: 15 cm tall, 9 cm across, the
# handle on +x reaching 8 cm, its opening about 2.4 cm wide between y 3.5 and 12.5; the nodes Mug, Beer (hidden for
# an empty mug) and Grip; about 1.5k triangles.
#
# The frame (Godot axes, the game's): the origin at the middle of the base's underside, y up, the handle on +x; seen
# from +z the handle is on the right, as a right hand holds it (the contract's "front -z" had it on the left: +z is the
# side the holder sees). The game places the mug by its Grip marker, so only the Grip's frame binds.

[body]                  # the glass, turned: rings of (y, outer radius); `fluted` rings carry the flutes
sides = 24              # points round a ring: 12 flutes, each a panel and a groove
rings = [
  [0.0, 4.30, false],
  [0.9, 4.50, false],   # the foot ring
  [1.5, 4.15, false],   # the waist over the foot
  [2.6, 4.40, true],    # the flutes start
  [7.0, 4.45, true],
  [11.4, 4.50, true],   # the flutes end
  [11.9, 4.50, false],
  [15.0, 4.55, false],  # the rim
]
groove = 0.06           # a groove lies this share of the radius inside its panels (0.035 did not read)
wall = 0.40             # the glass's wall
floor_y = 1.4           # the inside floor: the thick base the concept shows
rim_round = 0.25        # the rim's lip

[handle]                # a D loop of glass, swept along a path in the xy plane (z 0) through these points
path = [[4.1, 12.6], [5.6, 12.9], [7.0, 12.5], [7.45, 11.2], [7.4, 5.2], [6.9, 4.0], [5.6, 3.5], [4.1, 3.8]]
width = 1.2             # the section across the path (x where the bar runs upright): the bar spans x 6.8..8.0
depth = 1.6             # along z
samples = 28            # points along the path

[beer]
top_y = 11.0            # the beer's level under the foam
inset = 0.06            # inside the glass
foam_top = 18.2         # the head's crown over the rim (the concept's tall overflowing head)
# the head's profile over the rim: [height over the rim, radius as a share of the rim's]; it swells 3.5 % past it
foam_profile = [[0.5, 1.035], [1.3, 1.03], [2.1, 0.9], [2.7, 0.65], [3.05, 0.35], [3.2, 0.06]]

[grip]                  # the Grip marker: the handle's upright bar, at mid height; +Y up the bar, -Z toward the mug
at = [7.4, 8.0, 0.0]

[look]                  # base sRGB, metallic, roughness, emission, alpha
glass = [[0.55, 0.63, 0.66], 0.0, 0.02, 0.0, 0.14]     # clear: dark and thin (a light base read milky)
beer = [[0.60, 0.31, 0.035], 0.0, 0.1, 0.03, 0.94]     # a deep gold (0.74, 0.40 read orange)
foam = [[0.97, 0.94, 0.87], 0.0, 0.8, 0.0, 1.0]

[placement]             # for the review shots only: on the bar's top near the tap (the bar's frame, cm)
on_bar = [60.0, 110.0, 20.0]
yaw_deg = 90.0          # the mug's +z (the holder's side) toward the hall (+x), the handle toward the hall's -z
