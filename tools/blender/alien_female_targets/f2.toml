# The shared alien body's female variant f2 (art #196, clothes step 2; alien_female_geom.py): a little chest (soft,
# round, no nipples), wider hips and seat, a slightly narrower waist; height, limbs, hands, feet and neck unchanged.
# f2 (the engineer, 2026-10-28: a little chest that shows through the clothes, wider hips): f1's chest hardly
# read on the full figure, so the rounds go 3.0 cm forward, a little fuller; hips and seat a little more than f1.
# Still an adult cartoon figure, never a pin-up (the axolotl's sketches, 2026-10-28-alien-clothes-s1/ax_overall and ax_turtle).
# Heights on the S4b body: crotch about 0.82 m, navel 1.00, chest 1.14, armpit 1.30, neck ring 1.39.
name = "f2"
note = "the shape that reads in clothes: chest 3.0 cm, hips 2.6 cm a side, seat 2.2 cm, waist 1.0 cm a side"

[chest]        # two rounds pushed forward on the front half
amount_m = 0.030
z = 1.12
half_z = 0.095
x = 0.058
half_x = 0.075
ramp_m = 0.04

[seat]         # two rounds pushed back on the back half
amount_m = 0.022
z = 0.84
half_z = 0.11
x = 0.065
half_x = 0.09
ramp_m = 0.05

[hips]         # the sides out, linear in x: amount_m at ref_x
amount_m = 0.026
z = 0.87
half_z = 0.13
ref_x = 0.135

[waist]        # the sides in
amount_m = 0.010
z = 1.00
half_z = 0.07
ref_x = 0.106

[mask]         # a vertex moves by its summed weight on these bones
bones = ["Hips", "Spine", "Chest", "UpperChest", "LeftUpperLeg", "RightUpperLeg"]

[limits]
still_above_z = 1.25   # nothing above moves (shoulders, neck, head)
still_below_z = 0.70   # nothing below moves (knees, shins, feet)
max_delta_m = 0.035
