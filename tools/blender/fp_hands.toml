# The first-person hands (art#136, xperiaroco2/prime-game#1587): concept A, "the hand as on the character" (the
# engineer's pick, 2026-11-10, prime-game#1095 c6764216585): the alien's own forearms and hands at true size, the
# striped sleeve to mid-forearm, cut from the character build and posed in the camera's space.
# tools/blender/fp_hands_build.py reads this file; tools/blender/fp_hands_run.py drives the build, the export and the
# shots (docs/animations.md, "The first-person hands").
#
# Space: the camera's, in metres, x right, y forward (the view direction), z up; the eye at the origin. The GLB maps
# it to Godot's camera space (x right, y up, -z forward): the hands' root goes under the Camera3D with no offset.
# A hand's frame: p, the wrist (the Hand bone's head); f, the fingers' direction (wrist to the middle knuckle); n,
# the back of the hand's normal. Grips are alien_hands.toml's (relaxed, runfist) or this file's [grips].

[source]
# the character build the arms are cut from: the axolotl of H1u, the hands merged in #373 (art#196), the
# striped top on her; rebuilt from the frozen body when there is one
char = "2026-11-11-fp-hand-model/m25/fp_hand_char.blend"
# since 2026-11-11 the detailed first-person hand (concept A refined, specs/fp_hand_dims.toml): fp_hand_model.py's
# build of the axolotl H1u character with its body replaced by the two first-person arms (the rig's hand and finger
# bones moved to the model's joints, the morph `fist` its corrective); was the H1u character itself
crystal = "energy-crystal/lit1/energy_crystal.glb"   # assets/prop/energy_crystal's GLB (the raw copy, same hash)
skin_inside_cuff_m = 0.035   # the skin is kept from this far inside the sleeve's cuff out to the fingertips
sleeve = false               # the bare arm first (the engineer, 2026-11-11): the skin from above the elbow, no
                             # garment; each outfit's own sleeve is laid on later
sleeve_above_elbow_m = 0.14  # the sleeve is kept from this far above the elbow out to its cuff: enough that its cut
                             # end stays behind the frame's corner, short of the upper arm (the first build kept it
                             # whole and it entered the frame)

[rig]
fps = 60
# the upper arm's head (the shoulder joint) in the camera's space: lower and further forward than the
# anatomical 0.13 / -0.14 / -0.26, the usual first-person placement, so the elbow stays under the frame and
# the forearm can reach the middle of the view; the arm's own lengths are the character's
shoulder_R = [0.20, 0.04, -0.42]
shoulder_L = [-0.20, 0.04, -0.42]
elbow_R = [1.0, -0.2, -1.0]     # where the elbow points (a direction, before it is made square to the arm)
elbow_L = [-1.0, -0.2, -1.0]
palm_m = 0.02                   # a held hand: the palm's middle this far off the surface (half the hand's thickness)
reach_m = 0.045                 # and the wrist this far back from the palm's middle, along the fingers
twist_share = 0.9               # the forearm takes this share of the hand's twist about the forearm (the rest stays
                                # at the wrist): a turned hand turns the forearm, as a real one does, never the wrist
# the viewmodel (since the engineer's rejection of the first build, 2026-11-11): a pose with a wrist `bend` sets its
# forearm's direction itself (the hand's length bent by at most [view] bend_max_deg at the wrist), and the upper arm
# runs from the elbow back along upper_* out of the frame; the shoulder joint goes wherever that ends
upper_R = [-0.10, 0.90, -0.40]  # the upper arm's direction, shoulder to elbow: mostly forward, so the shoulder ends
upper_L = [0.10, 0.90, -0.40]   # up behind the eye and the upper arm never enters the frame
elbow_max_deg = 30.0            # the elbow bends at most this far, so the upper arm runs on near the forearm's line
                                # out of the frame (a deeper bend put the elbow's crease in view)
park_L = { p = [-0.26, 0.02, -0.62], f = [0.3, 1.0, 0.2], n = [-0.2, 0.0, 1.0] }   # the free left hand, below the frame

[view]
# the hands' own camera (the usual first-person viewmodel): a narrower lens than the world's 75 degrees, so true-size
# hands sit low at the frame's edges as in the target frames instead of reaching up into a wide view; the game renders
# the hands' layer through a second camera with this vertical field of view, following the player's camera
fov_deg = 50.0
crystal_scale = 1.3   # the held crystal drawn this much bigger in first person (CrystalSocket's own scale), the usual
                      # viewmodel cheat: at true size the hands read too big for it (the engineer's pick, 2026-11-11)
bend_max_deg = 20.0   # the most a wrist bends from the forearm's line, up or sideways (a straight, unbroken wrist)
# the target frame per key pose (batch 2026-11-11-fp-hand-frames, the engineer's direction of 2026-11-11), which
# fp_hands_fit.py fits the pose to by silhouette
# (the hold, 2026-11-11-fp-hand-frames/hold, is no target since 2026-11-12: [poses.crystal] copies the reference)
targets = { idle = "2026-11-11-fp-hand-frames/idle/image-0.png", fist_out = "2026-11-11-fp-hand-frames/punch/image-0.png", crystal_hit = "2026-11-11-fp-hand-frames/crystal_hit/image-0.png" }
# the empty hall the concept frames were made over (the ship package v9's night render), for the arm's silhouette:
# what differs from it
background = "2026-11-08-fp-hand-concepts/_refs/ship_hall.png"

[grips.rest]      # the free hand at rest in the view: alien_hands.toml's relaxed curled a little more, so the
                  # fingers read soft and slightly curled, as in concept A, never a pointing index
Index = [18, 22, 8]
Middle = [26, 28, 10]
Ring = [32, 32, 12]
Little = [36, 34, 12]
mirror = true
spread = 5
Thumb = [6, 14, 10]
ThumbTurn = [10, 0]

[grips.cap]       # a hand round the crystal (the cap 13.5 cm across flats, the body 11 across corners): the
                  # fingers round its back, the thumb along it; fit_hold scales each digit's curl to the surface
Index = [30, 35, 15]
Middle = [32, 36, 16]
Ring = [34, 38, 16]
Little = [34, 38, 16]
mirror = true
spread = 3
Thumb = [10, 12, 8]
ThumbTurn = [30, 25]


[grips.fist]      # the punch's fist on the detailed hand (fp_hand_model.py's fit, specs/fp_hand_dims.toml [fist]):
                  # the first phalanges half bent, the middle phalanges the fist's front, the thumb tucked down
                  # the index's side; the morph `fist` (weight 1 with it) is the fist's own surface
Index = [55, 90, 50]
Middle = [57, 90, 50]
Ring = [60, 90, 50]
Little = [0, 0, 0]
mirror = true
Thumb = [25, 30, 40]
ThumbTurn = [-20, 35]

[poses.idle]      # the right hand low in the lower right corner, the back of the hand to the eye, relaxed: concept A's
                  # idle frame measured (the cuff at 78 % across and 88 % down, the knuckles at 70 % and 75 %, the
                  # hand about a quarter of the frame's height)
R = { p = [0.26, 0.33, -0.165], f = [-0.35, 0.75, 0.55], n = [0.35, -0.75, 0.55] }
grip_R = "rest"

[poses.fist_out]  # the punch's contact: concept A's fist frame measured (the fist's middle at 62 % across and 54 %
                  # down, about a fifth of the frame's height), the arm long from the lower right corner
R = { p = [0.11, 0.24, -0.06], f = [-0.05, 1.0, 0.45], n = [0.3, -0.45, 1.0] }
grip_R = "fist"

[poses.crystal]   # Gate R (specs/fp_hand_dims.toml [reference.card] crystal_hold; the engineer's pick 2026-11-12, an
                  # item carried with two hands from its sides): the crystal upright in the middle, low (the hands cut by
                  # the frame's bottom, as in the reference), tilted 15 degrees away from the eye so the cap and its
                  # loop read; both hands on its flanks at one height (15 cm up the crystal, just under the skirt),
                  # the backs of the hands turned up toward the eye, mirrored, the fingers round its back, the thumbs up
                  # along the near faces; the forearms come in diagonally from the frame's bottom corners (the critic's
                  # note on t20: the reference shows its forearm): the wrist bent 15 degrees toward the little finger
                  # (with the palm on a side, the thumb is up: the forearm rises) and cocked 20 toward its back (the
                  # forearm comes from outside). Picked from the grids
                  # 2026-11-11-fp-hands/hold1..hold7 beside the reference. The hands in the crystal's own space
                  # (origin the tip, z up its length, -y its front, which faces the eye), each from where its palm
                  # touches (Poses.on_crystal) and then seated by fit_hold. Was a torch hold fitted to an AI frame
crystal = { p = [0.0, 0.4095, -0.4458], up = [0.0, 0.2588, 0.9659], front = [0.0, -1.0, 0.0] }
R_c = { z = 0.15, toward = [1.0, 0.0, 0.5], r = 0.054, wrap = [0.0, 1.0, 0.3], bend = [20.0, -15.0] }
L_c = { z = 0.15, toward = [-1.0, 0.0, 0.5], r = 0.054, wrap = [0.0, 1.0, 0.3], bend = [20.0, 15.0] }
grip_R = "cap"
grip_L = "cap"

[clips.Idle_Loop]           # breathing: a slow drift of the hand, a few millimetres and about a degree
pose = "idle"
seconds = 3.0
sway = { pos = [0.0025, 0.0015, 0.004], rot = [1.0, 0.6, 0.8], cycles = [1, 1, 1] }

[clips.Run_Loop]            # the run: the hand bobs with each step (two per loop) and swings once a loop
pose = "idle"
seconds = 0.70              # replaced by the character's Jog_Fwd_Loop length when the build finds it
run = { bob = 0.022, side = 0.020, fwd = 0.010, roll = 5.0, pitch = 3.0, yaw = 2.0, lift = [0.0, -0.01, 0.01] }

[clips.Crystal_Idle_Loop]
pose = "crystal"
seconds = 3.0
sway = { pos = [0.002, 0.0015, 0.004], rot = [0.8, 0.6, 0.6], cycles = [1, 1, 1] }

[clips.Crystal_Run_Loop]
pose = "crystal"
seconds = 0.70
run = { bob = 0.020, side = 0.016, fwd = 0.008, roll = 4.0, pitch = 3.0, yaw = 2.0, lift = [0.0, -0.01, 0.0] }

# The hits: at most one each 0.5 s (GDD "Melee: any item hits"), so each clip is 0.5 s and ends in its hold pose.
# A key: t (s), the pose's fields to change (R, grip_R, crystal), `fist` (the morph's weight), `ease` (how the
# segment that ends at this key moves: in, out, inout, linear), `shoulder_R` (the shoulder joint's shift, m).
[clips.Punch]
pose = "idle"
seconds = 0.5
hit = 0.15                  # the contact, for the game's hit sound and the shake
# the keys are mixes of the two fitted frames (idle and fist_out): w 0 is the idle, 1 the contact, below 0 a
# pull-back, above 1 past it
keys = [
  { t = 0.0 },
  { t = 0.06, R = { mix = ["idle", "fist_out", -0.2], dp = [0.0, -0.02, -0.01] }, grip_R = "fist", fist = 1.0, ease = "inout" },
  { t = 0.15, R = "fist_out", grip_R = "fist", fist = 1.0, ease = "out" },
  { t = 0.21, R = { mix = ["idle", "fist_out", 0.93] }, grip_R = "fist", fist = 1.0, ease = "out" },
  { t = 0.34, R = { mix = ["idle", "fist_out", 0.3] }, grip_R = "fist", fist = 1.0, ease = "inout" },
  { t = 0.5, fist = 0.0, ease = "inout" },
]

[clips.Crystal_Hit]         # a two-handed swing to the hit frame (crystal_hit, fitted): the crystal drawn back past the
                            # hold, brought across to the contact, a short follow-through and back; the hands stay on it
pose = "crystal"
seconds = 0.5
hit = 0.18
keys = [
  { t = 0.0 },
  { t = 0.10, crystal = { mix = ["crystal", "crystal_hit", -0.45], dp = [0.0, -0.02, 0.0] }, ease = "inout" },
  { t = 0.18, crystal = "crystal_hit", ease = "in" },
  { t = 0.24, crystal = { mix = ["crystal", "crystal_hit", 1.12] }, ease = "out" },
  { t = 0.5, ease = "inout" },
]
