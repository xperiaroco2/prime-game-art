[[pairs]]
pack = "Interact"
ual = ["Interact", "PickUp_Table"]
[[pairs]]
pack = "Punch_Left"
ual = ["Punch_Jab"]
[[pairs]]
pack = "HitRecieve"
ual = ["Hit_Chest", "Hit_Head"]
[[pairs]]
pack = "Roll"
ual = ["Roll"]
[[pairs]]
pack = "Idle_Gun"
ual = ["Pistol_Idle_Loop"]
[[pairs]]
pack = "Gun_Shoot"
ual = ["Pistol_Shoot"]
[[pairs]]
pack = "Idle_Sword"
ual = ["Sword_Idle"]
[[pairs]]
pack = "Sword_Slash"
ual = ["Sword_Attack"]
[[pairs]]
pack = "Wave"
ual = ["Idle_Talking_Loop"]

