# Art #25: the feet of Meshy's locomotion. `sets` are lanes of any clip keys, top to bottom: (a) Meshy's own rig, (b)
# the clip retargeted onto our toe bones, the best UAL1 or pack clip; `clips` (as in ual_locomotion) the rigid shoes
# over the toe bones of a Meshy clip.
[[feet]]
name = "meshy_feet_men"
body = "men"
sets = [["meshy_own:Walking", "meshy:Walking", "ual:Walk_Loop"],
        ["meshy_own:Running", "meshy:Running", "ual:Jog_Fwd_Loop"],
        ["meshy_own:RunFast", "meshy:RunFast", "ual:Sprint_Loop"],
        ["meshy_own:Walk_Backward", "meshy:Walk_Backward", "pack:Run_Back"]]
[[feet]]
name = "meshy_feet_women"
body = "women"
sets = [["meshyw_own:Walking_Woman", "meshyw:Walking_Woman", "meshy:Walking", "ual:Walk_Loop"],
        ["meshyw_own:Running", "meshyw:Running", "ual:Jog_Fwd_Loop"],
        ["meshyw_own:RunFast", "meshyw:RunFast", "ual:Sprint_Loop"],
        ["meshy:Walk_Backward", "pack:Run_Back"]]
[[feet]]
name = "meshy_toes"
body = "men"
clips = ["meshy:Walking", "meshy:RunFast"]
