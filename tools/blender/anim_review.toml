pack = "Idle"
ual = ["Idle_Loop"]
[[pairs]]
pack = "Walk"
ual = ["Walk_Loop"]
[[pairs]]
pack = "Run"
ual = ["Jog_Fwd_Loop", "Sprint_Loop"]
