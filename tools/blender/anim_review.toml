# The animation review's settings (tools/run.py anim-review; docs/animations.md). Paths are relative to the raw
# folder (ART_RAW_DIR, default D:/prime-art-raw).

ual = "quaternius/Universal_Animation_Library/Universal Animation Library[Standard]/Unreal-Godot/UAL1_Standard.glb"
ual_rm = "quaternius/Universal_Animation_Library/Universal Animation Library[Standard]/Unreal-Godot/UAL1_Standard_RM.glb"
toe_bones = true  # the donors get the toe bones (see [bodies])

# Further Universal Animation Library files on UAL1's 65-bone rig, each one more source of clips: its clips are keyed
# "<key>:<clip>" as UAL1's are "ual:<clip>", retargeted with the same bone map. `file` is in place, `rm` has root
# motion, `label` names the source in pictures (art #24; sources/quaternius_ual2_standard.toml).
[libraries.ual2]
file = "quaternius/Universal_Animation_Library_2/Universal Animation Library 2[Standard]/Unreal-Godot/UAL2_Standard.glb"
rm = "quaternius/Universal_Animation_Library_2/Universal Animation Library 2[Standard]/Unreal-Godot/UAL2_Standard_RM.glb"
label = "UAL2"

# Meshy's animations on our own characters (art #25, batch 4, raw:2026-10-b4-animations/, private: the library's
# provenance is undisclosed). A Meshy library is one rig: Meshy's auto-rig of m1_rex (men) or w1_ivy (women), 24 bones,
# no fingers (tools/blender/retarget_maps/meshy_um.toml). `file` holds the library actions merged by one animation
# task; `extra` are the other GLBs of the same rig whose actions join it (the rig's own walking and running, the
# text-to-motion crawl animated on the man's rig); `rename` gives Meshy's action names our clip names, `skip` leaves
# out the one-frame bind pose; `in_place` clips have their hips' travel taken out (they walk or crawl away, or
# stagger 0.94 m sideways: Hit_Reaction, which would walk into the next lane of a pair); `own`
# names the character whose own rig and weights play the "<key>_own:<clip>" clips (comparison (a)). No `rm`: Meshy
# has no root-motion file of its own.
[libraries.meshy]
file = "2026-10-b4-animations/man-library/animate-merged_animations.glb"
extra = ["2026-10-b4-animations/man-rig/rig-Animation_Walking_withSkin.glb",
         "2026-10-b4-animations/man-rig/rig-Animation_Running_withSkin.glb",
         "2026-10-b4-animations/man-crawl/animate-Animation_01a10322-c879-7192-a408-0a474c65fc6c_withSkin.glb"]
rename = { walking_man = "Walking", running = "Running", retarget_clip = "Crawl_Prompt" }
skip = ["clip0"]
in_place = ["Walk_Backward", "Crawl_and_Look_Back", "Crawl_Prompt", "Carry_Heavy_Object_Walk", "Hit_Reaction"]
label = "Meshy"
own = "m1_rex"
map = "meshy_um.toml"
rigid_map = "meshy_um_rigid.toml"
[libraries.meshyw]
file = "2026-10-b4-animations/woman-library/animate-merged_animations.glb"
extra = ["2026-10-b4-animations/woman-rig/rig-Animation_Walking_withSkin.glb",
         "2026-10-b4-animations/woman-rig/rig-Animation_Running_withSkin.glb"]
rename = { walking_man = "Walking", running = "Running" }
skip = ["clip0"]
label = "Meshy woman"
own = "w1_ivy"
map = "meshy_um.toml"
rigid_map = "meshy_um_rigid.toml"

# Meshy text to motion (art #33): one FBX per clip on an SMPL-H skeleton (52 bones with fingers), retargeted straight
# onto our rig with smpl_um.toml (no Meshy rig, no animate step). Owned output of the Pro plan, ai_generated.
# `format = "smplh_fbx"`: `file` is the rig (every file has the same rest, lifted onto the floor by the loader,
# tools/blender/retarget_smpl.py), `clips` names each clip's file (every file's action is "Base Layer"); the clip names
# are the batch items' ids. `in_place` clips have their travel taken out for the review's lanes; `own` plays a clip on
# the SMPL-H mannequin ("tm_own:<clip>"). No `rm`, no `rigid_map` (the toe bones are always on).
[libraries.tm]
format = "smplh_fbx"
file = "2026-10-b4-animations/crawl-motion/text_to_motion-clip.fbx"
label = "TTM"
map = "smpl_um.toml"
own = "SMPL-H mannequin"
in_place = ["crawl", "backward-jog", "strafe-left", "shove-stumble", "getup-from-all-fours", "backward-run",
            "strafe-left-r2", "crawl-r2"]
[libraries.tm.clips]
crawl = "2026-10-b4-animations/crawl-motion/text_to_motion-clip.fbx"
backward-jog = "2026-10-b5-anim-mvp/backward-jog/text_to_motion-clip.fbx"
strafe-left = "2026-10-b5-anim-mvp/strafe-left/text_to_motion-clip.fbx"
turn-left-90 = "2026-10-b5-anim-mvp/turn-left-90/text_to_motion-clip.fbx"
shove-stumble = "2026-10-b5-anim-mvp/shove-stumble/text_to_motion-clip.fbx"
package-lift = "2026-10-b5-anim-mvp/package-lift/text_to_motion-clip.fbx"
rollup-to-all-fours = "2026-10-b5-anim-mvp/rollup-to-all-fours/text_to_motion-clip.fbx"
getup-from-all-fours = "2026-10-b5-anim-mvp/getup-from-all-fours/text_to_motion-clip.fbx"
# batch 6 (art #66): the A7 re-rolls, review candidates beside the MVP's stopgaps
backward-run = "2026-10-b6-anim-rerolls/backward-run/text_to_motion-clip.fbx"
strafe-left-r2 = "2026-10-b6-anim-rerolls/strafe-left-r2/text_to_motion-clip.fbx"
rollup-to-all-fours-r2 = "2026-10-b6-anim-rerolls/rollup-to-all-fours-r2/text_to_motion-clip.fbx"
crawl-r2 = "2026-10-b6-anim-rerolls/crawl-r2/text_to_motion-clip.fbx"

# Animation sets (art #33; tools/blender/anim_sets/, docs/animations.md "Animation sets"): `tools/run.py anim-set`
# builds and exports a set; the review plays its clips as "<set>:<clip>" ("mvp:Jog_Fwd_Loop"), built in the review's
# own process from the same settings, and plays a set's locomotion at the game's speeds divided by the clip's
# speed_m_s (what the game does).
[sets]
mvp = "anim_sets/mvp.toml"

# Layered clips "<base>|<upper>" (tools/blender/anim_keys.py): the base clip's hips and legs under the upper clip's
# `upper` bone and every bone below it (spine, head, arms, fingers), as an engine layers an upper-body clip. `clips`
# are layered clips that a run over all clips (or over one of their sources) measures beside the plain ones.
[layer]
upper = "Torso"
clips = ["ual:Idle_Loop|ual2:Walk_Carry_Loop",  # the carry idle: UAL2 has no idle carry
         "mvp:Idle_Loop|mvp:Push_Upper_Loop", "mvp:Idle_Loop|mvp:Talk_Upper_Loop",  # the MVP layers (art #33)
         "mvp:Idle_Loop|mvp:Carry_Upper_Loop"]

# The clips play on pack originals, each also its body type's skeleton and action donor, given the assembler's toe
# bones Toe.L and Toe.R (tools/blender/um/toes.py, art #25; `toe_bones = false` leaves them out): the pack's clips key
# no toe and play as before, a library's toes drive them through its bone map. A library's `map` and `rigid_map`
# (files in tools/blender/retarget_maps/) default to ual_um.toml and ual_um_rigid.toml (the toes at rest).
[bodies.men]
character = "refs/Ultimate_Modular_Men_Pack/Business Man.glb"
pack = "refs/Ultimate_Modular_Men_Pack"
[bodies.women]
character = "refs/Ultimate_Modular_Women_Pack/Suit.glb"
pack = "refs/Ultimate_Modular_Women_Pack"

# Pack clips that loop (UAL marks its loops with a _Loop suffix; Sword_Idle loops as well).
[loops]
pack = ["Idle", "Idle_Gun", "Idle_Gun_Pointing", "Idle_Neutral", "Idle_Sword", "Run", "Run_Back", "Run_Left",
        "Run_Right", "Run_Shoot", "Walk"]
ual = ["Sword_Idle"]
meshy = ["Walking", "Running", "RunFast", "Walk_Backward", "Carry_Heavy_Object_Walk", "Prone_Reach_Help"]
meshyw = ["Walking", "Running", "RunFast", "Walking_Woman"]

# Locomotion at the game's speeds (the game's content/modes/base_mode.tres: walk 4.5 m/s, sprint 7.0 m/s). Each
# row plays its clips side by side on a treadmill moving at `speed`, each at the rate that makes its feet keep up:
# UAL clips by their root-motion speed (UAL1_Standard_RM.glb, scaled to the body), pack clips by their feet.
# "blend:A+B" is a cycle-synced blend of two UAL clips (lined up on the left heel strike), weighted to reach the speed.
[[rates]]
name = "walk_4.5"
label = "the game's walk"
speed = 4.5
clips = ["ual:Jog_Fwd_Loop", "blend:Walk_Loop+Jog_Fwd_Loop", "pack:Run"]
[[rates]]
name = "sprint_7.0"
label = "the game's sprint"
speed = 7.0
clips = ["ual:Sprint_Loop", "blend:Jog_Fwd_Loop+Sprint_Loop", "pack:Run"]
# The package carried at the game's walk (art #24): UAL2's carry walk (0.65 m/s by root motion) as an upper-body
# layer over the walk recommended above, against the walk alone.
[[rates]]
name = "carry_4.5"
label = "the game's walk with the package"
speed = 4.5
clips = ["blend:Walk_Loop+Jog_Fwd_Loop|ual2:Walk_Carry_Loop", "blend:Walk_Loop+Jog_Fwd_Loop"]

# Side-by-side clips on the same character: the pack's clip against the corresponding UAL1 clips (pack, ual), or a
# name and any clip keys (name, clips; tools/blender/anim_keys.py). Pairs of art #24 (UAL2) are at the end.
