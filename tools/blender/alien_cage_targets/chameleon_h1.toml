# alien_body_targets/chameleon_a.toml), the shape from the Meshy t-posed body (--target:
# 2026-10-24-alien-body-pilot-3d/chameleon_t, the pre-remeshed GLB). The keys not set here keep S4b's numbers; the
# cage's S1c-frame numbers are moved onto chameleon_a's skeleton by CAGE_REMAP.
