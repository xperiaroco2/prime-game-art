# The station fit's settings per body (art #196, step D3; body_fit_geom.py, body_fit_run.py). The dims tables beside
# this file are generated (body_dims_measure.py, never hand-edited); what the fit adds to them lives here. mm.

[A]
# The concept's forearm and hand hang in front of the belly in its side view (A.toml's note), and the side rows
# around the hand are a straight interpolation, not a measurement: the body's own front is kept there (trunk and
# legs), easing back to the table over the zone's 30 mm ends.
keep_front = [[640.0, 1000.0]]  # the trunk's belly and the upper thigh (the hand's rows)

[B]
keep_front = []
# B's rest from A's (B1's alien_body_b_geom with these numbers; the D2 plan's point 1). The height scale is B's
# neck ring over A's (the tables), the Neck and Head about B's ring by B.toml's neck_bone_below / head_bone_above.
shoulder_joint_x = 129.0      # the UpperArm heads' |x|
hip_joint_x = 113.0           # the UpperLeg heads' |x|
neck_below_ring = 50.8        # the Neck bone's head under the ring (the Head's stays 48.3 above it)
# The hands and feet: A's at our size (the engineer, 2026-10-29), scaled per axis by the two tables' B/A ratios
# (body_fit_run.limb_scales: the keys' hand and foot lengths and widths), never set here.
# Her neck base: B's concept puts the ring at the collar, where her shoulder slopes start (the shoulder line 8 mm
# under it). The ring stays the standard one; the trunk's `length` mm under it widen into a slope from the ring's
# half width (kept over the `collar` mm under it: a vertical tangent) to the table's at `length`, as
# u ** `power`, eased in over `ease` mm from its bottom, at most `max_ratio` of the body (body_fit_geom.neck_base_half;
# D3b's first B, eased over 20 mm and uncapped, grew a lip at the neck base). Never narrower than the body.
neck_base = { length = 60.0, collar = 6.0, power = 1.5, ease = 60.0, max_ratio = 1.15 }
# Her chest: two soft rounds, no nipples. The table's side front ahead of the line from the crease to the upper
# chest is the rounds' depth; across x it peaks at the rounds' centres and eases to `floor` between them.
chest_sigma_x = 42.0
chest_floor = 0.45
