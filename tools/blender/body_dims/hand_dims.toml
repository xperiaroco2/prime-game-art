# The alien's hand and wrist: the spec (art #196, Hands H1b). Both bodies share the hand (B's is A's scaled along and
# across its Hand bone, docs/clothes.md); every length here is a share of the side's Hand bone (A 67.1 mm), so one
# table serves both. Built by tools/blender/alien_hand_run.py (alien_hand_geom.py), checked by its report.
# The concept (body_dims/A.toml [arms], [hand]; the approved front view): the forearm 6 cm before the wrist 67.5 mm
# wide, the wrist 62.1, the hand 126.1 at its widest (front view, the thumb's side): forearm / wrist 1.087, the
# narrowest point at the joint, no lump after it; four digits (the thumb and three fingers), thick and round with
# soft domed tips. The hand's length stays ours (217 mm against the concept's 248: the engineer's "our size", D3b).

[wrist]
s_fore = -0.55            # the band's start, behind the joint (A: -36.9 mm; the forearm's last clean ring stays)
s_palm = 0.62             # the band's end in the palm (A: +41.6 mm), before the thumb's and fingers' roots
wrist_width_ratio = 0.95  # the joint's width / the forearm's at s_fore (the concept: 62.1 / 65.5 at the same share)
wrist_thick_ratio = 0.86  # the joint's thickness / the forearm's (flatter toward the palm, never a pinch)
taubin = 80               # relaxation rounds on the band (the neck, the lump and the uneven rows go)
# the checks (alien_hand_run.py fails above them)
row_gap_max_mm = 4.5      # reported, not failed (moving keeps the vertex count): the largest gap between the band's vertices along the arm within +-0.3 of the joint
fold_max_mm = 2.0         # the deepest fold bent 30 degrees each way (the crease): sections square to the forearm at -15 mm, to the bisector at -7.5/0/+7.5, to the bent hand at +15/+30 (alien_hand_run.PLANES)
taper_monotone = true     # the band's width falls from the forearm to the joint and rises into the palm

[rings]                   # H1c: new rows on the wrist (a topology change; alien_hand_mesh.py rings)
band = [-0.75, 0.62]      # every skin edge between these shares of the Hand bone from the wrist is cut
cuts = 1                  # cuts per edge (the grid: 2 cuts gave nothing more)
smooth = 8                # rounds smoothing the LowerArm/Hand split across the band only (24 raised the up-bend fold)

[fingers]
root_at = 0.18            # where the root radius is measured, past the knuckle
taper = 0.12              # the radius lost from the root to the dome's start (the old tips lost about 30 %)
ramp = [0.0, 0.21]        # the move ramps in from the knuckle over this span

[thumb]
root_at = 0.90            # past the thenar (the metacarpal is 0.59 of the Hand bone)
taper = 0.15
ramp = [0.60, 0.85]       # the thumb's root in the palm stays (the band's held side)

[thenar]                  # H1d: the palm's bumps at the thumb's root (H1b's moves) relaxed in place (alien_hand_run.py relax)
radius = 0.6              # the region: within this many Hand lengths of the ThumbMetacarpal bone ...
inner = 0.7               # ... at full strength within this share of the radius, easing to nothing at the radius
finger_max = 0.3          # vertices more than this on the fingers, past the thumb's metacarpal or on the forearm stay
rounds = 24               # Taubin rounds (the topology and every vertex outside the region unchanged)
