# Pilot M1 (art #196, bodies_a): the axolotl woman's body from her Meshy surface as it is, moved onto H5's refit
# skeleton (tools/blender/alien_meshy_body.py --targets). Heights and widths in m; the Meshy frame is the GLB's own
# (x to her left, -y her front, the sole on z 0), the rig frame the refit skeleton's.
name = "axolotl_m1"
# her Meshy body (T-pose, 1.897 m with Meshy's head; 466k triangles) and the skinned body whose skeleton, clips and
# weights M1 takes (H5 v1)
meshy = "2026-10-24-alien-body-pilot-3d/axolotl_t/multi_image_to_3d-pre_remeshed_model.glb"
rig_body = "research/2026-10-22-roster/design/pilot3d/bodies_a/h5/v1/alien_body.blend"

# The heights, [rig z, Meshy z]: H5's WRAP_Z (alien_cage_targets/axolotl_h5.toml): the ankle, knee, crotch, armpit,
# shoulder top and the neck's narrowest.
wrap_z = [[0.0, 0.0], [0.17, 0.15], [0.518, 0.50], [0.748, 0.735], [1.231, 1.28], [1.312, 1.38], [1.374, 1.455]]

# The arm along x, [Meshy |x|, rig |x|]: the shoulder joint, the elbow (the narrowest before the forearm's swell,
# measured per 2 cm: 0.38 to 0.42) and the wrist (the narrowest, 0.64 to 0.66) onto her bones' heads (0.176, 0.456,
# 0.691). Past the wrist the hand keeps its scaled length (`hand`).
arm_x = [[0.17, 0.176], [0.41, 0.456], [0.65, 0.691]]
arm_band_z = [1.20, 1.27]  # Meshy z: the trunk's side below the armpit stays; the arm's shift fades in over this
arm_blend_x = [0.17, 0.30]  # Meshy |x|: the arm's shift fades in from the shoulder joint to past the deltoid
arm_station_x = [0.36, 0.66]  # Meshy |x|: the arm's section centres are measured here (inboard: the trunk mixes in)

# The hand: Meshy's is 0.29 m from the wrist to the fingertip, the concept's 0.184 (H5's bones): scaled about the
# wrist's centre by `scale` (all three axes), blended in over `blend` past the wrist.
hand = { wrist = 0.65, scale = 0.66, blend = 0.05 }
keep_hands = true  # Meshy's hands, weighted by H5's (false: not built yet; H5's hands would be welded on)

# The legs onto their bones: the section centres measured per 2 cm in Meshy z over leg_station_z; their shift to the
# bone line fades out over leg_fade_z (Meshy z) into the hips; below foot_z the foot moves as one with its ankle.
leg_station_z = [0.15, 0.66]
leg_fade_z = [0.62, 0.76]
foot_z = 0.15

# The neck ring (rig frame): the cut at H5's ring height; the neck narrowed about its axis from neck_scale_from_z to
# the ring so the ring's half-width is ring_half_x: H5's 0.0567 times 1.11 (the cut lands about 1 % under it) (the head scaled up uniformly by about
# 10 %, the concept's ratio; the weld scales the head's neck waist onto the ring).
ring_z = 1.390
ring_half_x = 0.0630
neck_scale_from_z = 1.33

# Triangles: the Meshy mesh first collapsed to decimate_pre (head included), the cut body then to body_tris.
decimate_pre = 140000
body_tris = 23000

# The spots smoothed (Meshy frame, before the map): spheres [x, y, z, r, passes] (the nipples: each chest side's
# most forward point, measured 0.058/-0.065, -0.112/-0.118, 1.223/1.225) and soft boxes [x0, x1, y0, y1, z0, z1,
# passes] (the navel; the crotch's front; the perineum), margin 0.02 m; a Laplacian of factor 0.5 per pass, each
# vertex for its spot's passes (the spheres small: a wider one flattens the breast itself).
smooth = { margin = 0.02, spheres = [[0.058, -0.112, 1.223, 0.026, 45], [-0.065, -0.118, 1.225, 0.026, 45]], boxes = [
    [-0.035, 0.035, -0.25, -0.05, 0.90, 1.04, 20],
    [-0.055, 0.055, -0.20, 0.00, 0.68, 0.84, 30],
    [-0.05, 0.05, -0.04, 0.09, 0.64, 0.74, 30],
] }

# The chest a bit fuller (the engineer, art #196), rig frame: [x, z] each side, the push along -y, the falloff radius.
bust = { centre = [0.062, 1.18], push = 0.012, radius = 0.08 }
# The push's peak sits on the apexes and points them (the first build's chest close-ups): each apex (rig frame, the
# nipples' spots moved by the map and the push) smoothed again, [x, y, z, r, passes].
smooth_after = { spheres = [[0.058, -0.124, 1.182, 0.045, 60], [-0.065, -0.130, 1.183, 0.045, 60]] }

# The transferred weights smoothed per group (not the fingers'): the first build's shoulders creased in the A pose
# and its knees pinched to a point.
# Then the joints that still pinched, [|x|0, |x|1, y0, y1, z0, z1, repeat] in the rig frame: the knees, the hips'
# front (H5's WEIGHT_ZONES), the shoulders.
weight_smooth = { factor = 0.5, repeat = 4, zones = [
    [0.03, 0.20, -0.15, 0.15, 0.42, 0.62, 12],
    [0.02, 0.22, -0.22, 0.03, 0.64, 0.88, 12],
    [0.12, 0.30, -0.10, 0.20, 1.12, 1.34, 10],
] }
