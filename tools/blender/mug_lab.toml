# The mug lab's spec (research, pipeline A): concept 3's stein as numbers, every size in cm, Godot axes (y up, the
# handle on +x). The contract with the game holds: the glass 15 cm tall and about 9 cm across, the handle reaching
# about 8 cm on +x, the origin at the middle of the base's underside; the head over the rim to about 18.2 cm.

[body]
panels = 12               # vertical glass panels round the body (the concept's facets)
segs_per_panel = 6        # points across a panel, denser at its edges
row_step = 0.6            # the outer rows' coarse step
dense_step = 0.15         # ... and their step within dense_span of every feature height
dense_span = 1.1
# the groove radius by height [y, r]: a heavy foot, a waist, the panelled body, a smooth band under the rim
profile = [[0.0, 4.25], [0.25, 4.45], [2.0, 4.45], [2.35, 4.12], [2.7, 4.22], [12.4, 4.30], [12.9, 4.42], [15.0, 4.50]]
# flat-topped bulges over the groove radius, one per panel: the foot's short panels and the body's tall ones with
# round (arched) ends; corner is capped at the panel's half width
pillows = [
  { y0 = 0.3, y1 = 2.0, groove = 0.35, corner = 0.3, height = 0.12, edge = 0.15 },
  { y0 = 2.9, y1 = 12.3, groove = 0.25, corner = 5.0, height = 0.26, edge = 0.35 },
]
rim_y = 15.0
lip = 0.25                # the rim's roll
inner_r = 3.85            # the smooth inner wall
floor_y = 2.2             # the inside floor: the heavy glass base
floor_round = 0.6
underside = [[4.0, 0.0], [3.4, 0.12], [1.5, 0.3]]   # [r, y] rings from the outer edge in; a shallow dome
sharp_deg = 40.0          # edges sharper than this stay crisp (the grooves)

[handle]                  # a D loop swept through these [x, y] points (z 0); its ends sink into the wall
path = [[4.0, 12.7], [5.6, 13.0], [7.0, 12.6], [7.5, 11.2], [7.45, 5.2], [6.95, 4.0], [5.6, 3.5], [4.0, 3.8]]
samples = 40
section_segs = 16
width = 1.3               # in the loop's plane
depth = 1.7               # across it (z)
squareness = 0.6          # superellipse exponent: 1 an ellipse, lower a rounder rectangle
taper = 0.08

[thumb]                   # the thumb rest on the handle's top (off: round 1's critics read the box as a spike)
on = false
at = [6.4, 13.35, 0.0]
size = [1.5, 0.55, 1.5]
tilt_deg = 12.0
bevel = 0.22

[beer]
inset = 0.04              # inside the glass wall
full_level = 12.6         # the beer's level under the foam when full

[foam]                    # one canonical mesh; the Godot foam shader shapes it from the fill (mug_look.gd)
segments = 96
side_rows = 10
dome_rows = 12
head_top = 18.2           # the crown when full

[grip]
at = [7.45, 8.0, 0.0]
