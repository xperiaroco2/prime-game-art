# The lobby's pinball machine as numbers, in centimetres (art #374, Gate 1: the hero prop's drawing). Read off the
# concept the manager picked (<raw>/lobby/pinball/ref/concept_p2.png: a two-tone teal-grey cabinet, copper trims and
# rivets, tapered legs with cyan rings at the feet, cyan rings round the side buttons and the front medallion, a
# backbox with a dark screen in a cyan line, the night Earth on the playfield) and fitted to the game's contract
# (prime-game 77ac43d5 scenes/pinball/pinball_table.tscn and its PinballTableSpec; copies in <raw>/lobby/pinball/ref/).
# Where the concept and the contract disagree, the contract wins: the concept's field is a real machine's 51 x 107 cm,
# the contract's is 72 x 130 cm, so the cabinet is wider and longer than the picture's and keeps its proportions
# elsewhere (the legs' taper, the backbox's height against the body, the screen's share of the backbox).
#
# Frames (Godot axes, y up):
# - the cabinet frame: the origin on the floor under the footprint's middle, the player on -z, the backbox at +z;
# - the table frame (the contract's; TableMount's): the playfield's top at y 0, -z up the table, the flippers at +z.
#   TableMount turns it 180 degrees about y (the table's +z toward the player) and tilts it by `tilt_deg` (the far end
#   up), so the flat physics table is drawn tilted; t = [x, y, z] below are table-frame points.
# tools/blender/pinball_build.py builds both GLBs from these numbers; tools/blender/pinball_drawing.py draws them.

[contract]                       # the game's table (never changed here): sizes in cm, positions in the table frame
field = [72.0, 130.0]            # the playfield inside: x -36..36 (the side walls' outer faces), z -65..65
ball_r = 3.0                     # the ball's radius; its centre runs at y 3
wall_side = [6.0, 10.0, 130.0]   # WallLeft, WallRight: box, centres at x -+33, y 3, z 0
wall_side_x = 33.0
wall_top = [72.0, 10.0, 6.0]     # WallTop: box, centre y 3, z -63
wall_top_z = -63.0
inlane = [22.0, 10.0, 2.0]       # InlaneLeft/Right: boxes at [-+22, 3, 37], turned -+41.2 deg about y
inlane_at = [22.0, 37.0]
inlane_yaw = 41.2
flipper = [8.5, 5.0, 2.0]        # FlipperLeft/Right: the box beside the pivot (x 0..8.5 left, -8.5..0 right)
flipper_at = [13.0, 45.0]        # the pivots at [-+13, 3, 45], at rest turned -+25 deg about y
flipper_rest_deg = 25.0
flipper_swing_deg = 50.0         # PinballTableSpec.flipper_swing_deg
flipper_speed_deg_s = 1500.0     # PinballTableSpec.flipper_speed_deg_s
bumper = [4.0, 10.0]             # Bumper: cylinder radius, height; at [-10, 3, -25]
bumper_at = [-10.0, -25.0]
kicker = [3.0, 10.0]             # Kicker: at [12, 3, -5]
kicker_at = [12.0, -5.0]
target = [10.0, 10.0, 3.0]       # Target: box at [0, 3, -58.5]
target_z = -58.5
ball_start = [20.0, 25.0]        # BallStart [x, z], turned 10 deg; Drain [0, 56]
drain_z = 56.0
body_y = 3.0                     # every contract body's origin height (the ball's centre line)

[placement]                      # the machine in the lobby (layouts/lobby/hall.toml's frame)
spot = [1800.0, 0.0, 220.0]      # the greybox's PinballSpot: the player stands here facing +z
origin = [1800.0, 0.0, 344.0]    # the cabinet's origin: its front 40 cm from the spot (the greybox's front, z 2.6 m)

[table]                          # TableMount: the playfield's middle, its top surface
tilt_deg = 6.5                   # the far end up
front_y = 92.0                   # the playfield's front edge (table z 65) above the floor
field_z = -10.93                 # the playfield middle's cabinet z (the body's run centred over the footprint)
field_thick = 1.5                # the playfield board under y 0
glass_y = 10.0                   # the glass's top in the table frame (the walls reach y 8)
glass_thick = 0.5
art_inset = 0.0                  # the field's art (the night Earth, a later step) lies on the board's top

[body]                           # the cabinet's box, tilted with the table; its sizes in the table frame
outer_w = 82.0                   # across the side walls (the concept: the side walls about 6 % of the body's width)
wall_t = 5.0                     # the side walls: x 36..41 (the inside exactly the contract's 72 cm)
front_z = 73.0                   # the front end (table z): the field's 65 + an 8 cm apron with the lockdown bar
back_z = -95.0                   # the back end, under the backbox
bottom_y = -26.0                 # the body's underside (26 cm below the field, as the concept's body depth)
rail_y = [10.0, 13.5]            # the copper top rails, over the contract's walls and holding the glass
rail_in = 30.0                   # the rails' inner edge (x): over the side walls' inner faces
rail_out = 42.0                  # their outer edge: a 1 cm lip outside the side walls
lockdown_z = [65.0, 74.0]        # the copper lockdown bar across the front, at the rails' height
trim = 1.2                       # the copper trims along the body's edges: width
chamfer = 0.6                    # the edge chamfer on the body, legs and backbox
panel_light = 0.42               # the lighter grey triangles on the front and the side walls' front: their share

[front]                          # the front panel's features (the concept: a medallion between two buttons)
medallion_r = [9.5, 7.5, 6.5, 5.0]   # copper ring outer, cyan ring outer, cyan inner, the dark dome's radius
medallion_y = -12.0              # its middle below the field's plane (table y)
button_r = [3.4, 2.6, 1.8]       # the side buttons: copper body, cyan ring outer, inner
button_len = 3.0                 # how far each stands out of its side wall
button_z = 64.0                  # table z (8 cm behind the front face) and y of their middle
button_y = -6.0
rivet_r = 0.6                    # the copper rivets on the front's corners and the backbox's corners
rivet_pitch = 9.0

[legs]                           # four tapered legs (the concept: square, flared at the foot, copper collars)
inset = [7.0, 9.0]               # their tops' centres in from the body's sides (x) and ends (z, table)
top = 9.0                        # square at the top (under the body)
waist = 6.0                      # square at the foot's collar
splay = 4.0                      # how far each foot stands outward of its top (x) and outward along z
collar_h = 2.5                   # the copper collar above the foot
ring_h = 1.4                     # the cyan light ring (r 4.1) above the foot's pad
ring_r = 4.1
foot_r = [4.6, 3.0]              # the foot's pad: radius, height (bronze, on the floor)

[backbox]                        # upright on the body's back end
w = 82.0
z = [58.6, 83.5]                 # cabinet z of its front and back faces (from the body's back end, table z -70..-95)
y = [119.0, 190.0]               # from the body's top to 1.9 m
screen = [66.0, 38.0]            # the display: three text lines of about 9 cm (best and owner, score, balls)
screen_y = 162.0                 # its middle
screen_recess = 1.2
frame_line = [1.6, 0.9]          # the cyan line round the screen: its gap from the screen, its width
cap_h = 2.5                      # the copper cap on top and the trims on its edges
medallion_r = [4.2, 3.2, 2.4]    # under the screen: copper, cyan ring, the dark dome
medallion_y = 132.0

[markers]                        # the game's markers, cabinet frame (the greybox's TableMount, CloseUp, Display)
closeup_dist = 160.0             # CloseUp: this far from TableMount along a line 55 deg down, fov 50
closeup_down_deg = 55.0
closeup_fov = 50.0
display_ahead = 0.4              # Display: on the screen's middle, this far in front of its glass; its +z faces -z
