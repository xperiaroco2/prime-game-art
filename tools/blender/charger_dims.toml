# The ship's crystal charger as numbers, in centimetres (art#263's stations; two of them, one in each lens room's
# alcove on the aft wall: layouts/ship/ship.toml [[stations.spot]] renewer_e, renewer_w).
# The head (the slot, the carrier, the track ring, the four prongs, the button) is from its drawing, prime-game-design
# commit a53ce6f (ideas/ship-components/stations-final/charger-drawing/drawing.js, `node drawing.js`: its N object),
# drawn over the engineer's pick of 2026-10-25 (prime-game#1095 comment 6401197371).
# The body since lens room C (art#263, 2026-10-28): a faceted pedestal set into the wall's alcove, from the lens
# room's drawing, prime-game-design commit 7f335c2 (ideas/ship-components/lens-room/drawing/drawing.js: C.ped, C.axis,
# C.back, C.open; the concept c_lounge.jpg). It replaced the stepped dome on four legs (charger-legs.jpg), whose
# numbers are in this file's history.
# Frame: u across the front (0 the crystal's axis, + to the right as you face the button), d out of the wall along
# the spot's normal (0 the spot's vertex), h up from the floor. The model's origin is (u 0, d 0, h 0): the spot's `at`
# on the floor. tools/blender/charger_build.py builds from these; tools/blender/charger_drawing.py draws them.
# Sizes the drawings do not give (seams, bevels, bezels, strip places) are marked "sheet".

[frame]
top = 139.7                      # the outer prongs' tops (N.outerTop)
axis_d = 38.0                    # C.axis: the track ring (r 23.6) clears the alcove's back panel by 4.4
back = 10.0                      # C.back: the alcove's back panel, a flat chord across the vertex; the pedestal's
                                 # back stands on it
reach = 70.0                     # no part beyond d 70: the unit stays inside the opening (the drawing's "виступ 70",
                                 # the spots' depth_m 0.70)
open = [46.0, 50.0, 46.0]        # C.open: the opening's half width at the back panel and at the jambs' face (d 46);
                                 # its cheeks splay between
wall_gap = 0.5                   # the least gap to the opening's cheeks
# The spot sits on a vertex of the lens room's 12-sided wall (tools/blender/ship_interior.py tip_vertices: facets of
# 21.954 deg at r 2.05 m), so the wall folds toward the room by half a facet either side of u 0; the alcove's back
# panel (d 10) covers that fold where the charger stands.
back_fold_deg = 10.977

[base]                           # the pedestal (C.ped): its plan outline (u, d) and heights
side = 44.0                      # the back and the sides: u +-44 from d 10 to chamfer_d
chamfer_d = 46.0                 # the chamfers run (+-44, 46) -> (+-22, 68)
front = 22.0                     # the front face: u +-22 at d front_d
front_d = 68.0
plinth = 10.0                    # the graphite plinth, h 0..10
body = 86.0                      # the bronze body's top, under the deck slab
deck = 99.1                      # the deck slab's top, h 86..99.1 (N.top)
well = 94.0                      # the well's floor round the slot: the track ring, the slot ring, the collar's foot
well_r = 24.2                    # C.wellR: the well's wall (the deck slab's inner face)
lip = [1.5, 3.0, 2.0]            # the plinth's and the deck slab's overhang on the sides, the chamfers, the front:
                                 # C.ped.lip 3 on the chamfers; the sides 1.5 to clear the cheeks at d 10 by 0.5, the
                                 # front 2 to keep the unit inside the reach 70
plate = 2.0                      # sheet: the body's bronze plates on a graphite core; the seams between them show it
seam = 0.55                      # sheet: the dark joint between two plates
band = [46.0, 52.0]              # sheet (lens C step 3, a_power.jpg): a recessed band round the body between the
                                 # lower and upper courses, the graphite core 1.9 behind the plates, a cyan line in it
frieze = 66.0                    # sheet (step 3): the upper course's joint, a frieze course under the deck slab
plinth_toe = [1.5, 1.0]          # sheet (step 3): the plinth's toe: h 0..1.5 set back 1.0 (a shadow line on the floor)
plinth_bevel = 3.0               # sheet (step 3): the plinth's top bevelled over its last 3 cm, back to the plates
brackets = [[13.0, 21.0], [55.0, 63.0]]   # lens C step 4 (a_power.jpg's riveted brackets): h, a bronze bracket
                                 # across each of the four front corners on the lower and the upper course
bracket = [6.0, 2.6, 1.0]        # its width across the corner, its depth (into the corner's fold) and how far it
                                 # stands proud of the corner (front corners: 68.9 < the reach 70)
bracket_side = [3.4, 2.0, 0.4]   # the side/chamfer folds' smaller ones: they stay inside the lips' u +-45.5 (45.0)
chamfer = 1.1                    # sheet: the broad chamfer on every plate edge
edge = 0.28                      # sheet: the small bright bevel on its folds

[button]                         # the start button (N.button, N.buttonD) on the pedestal's front face
h = 75.9
lens = 8.0
ring = 11.6                      # sheet: the bezel ring's diameter
travel = 1.0                     # pressed in along its normal

[lights]                         # sheet: the strips on the pedestal's plates (graphite bezels, the light inset)
width = 2.2
chamfer_cyan = [[18.0, 42.0], [55.0, 64.0]]   # h: a cyan strip up each chamfer plate's middle, one per course
                                 # (step 3: split by the recessed band; step 4: the upper one ends under the frieze)
windows = [76.0, 6.0, 2.6]       # step 4 (a_power.jpg's short lit windows under the deck): h, length, height of the
                                 # frieze's cyan windows, two per chamfer plate and two on the front beside the button
window_u = [7.0, 13.5]           # the windows' centres: from the chamfer plate's middle, and u on the front plate
band_cyan = 1.2                  # sheet (step 3): the thin cyan line in the recessed band (height), on every plate
front_amber = [16.0, [18.0, 44.0]]   # u, h: an amber pair on the front plate's lower half
side_amber = [[18.0, 40.0], 80.0]    # d, h: an amber strip along each side plate under the deck slab
bezel = 0.6                      # the graphite bezel round a light
proud = 0.8                      # the bezel's face out of its plate
inset = 0.45                     # how far the light sits in its bezel (still out of the plate)

[slot]                           # the crystal's slot (N.slot) and the deck's rings
collar = [7.8, 10.4]             # the collar's bore and outer radius
collar_top = 95.7                # N.slot
glow = [11.0, 12.6]              # sheet: the cyan slot ring between the collar and the track ring (radii)
bore_bottom = 86.6
tip = 95.1                       # the built crystal's tip at rest (N.tip), in the carrier's pit

[carrier]                        # the cup under the crystal: a leaf, rises and spins
r = 7.0
top = 97.4                       # its pivot: the middle of its rim (sheet: the bronze cup round the crystal's foot)
h = 10.0
pit = [4.0, 0.6]                 # the pit's radius at the rim and at its floor; the floor 0.1 under the tip
rise = 6.0

[ring]                           # the track ring with the inner prongs: a leaf, spins
r0 = 13.5
r1 = 23.6                        # N.track 19 is its middle
h = 3.0
groove = 0.3
light = [18.0, 20.0]             # the cyan channel on its top (radii)

[outer]                          # the fixed outer prongs on the u axis (N.outer, N.outerTop): an (r, h) profile swept
                                 # round the axis over +-half_deg; in front their u is r cos(half_deg)
half_deg = 13.0
root_deg = 15.0                  # the root block and the cap a little wider (sheet: chunky)
cap_deg = 14.0
root = [[24.5, 99.1], [38.4, 99.1], [40.2, 104.0], [25.5, 104.0]]   # on the deck (charger-3; b5: 94..101)
column = [[25.8, 104.6], [40.4, 104.6], [42.2, 110.5], [42.2, 121.5], [39.4, 128.4], [27.6, 128.4], [27.6, 110.0]]
cap = [[24.0, 129.0], [39.0, 129.0], [39.0, 131.5], [33.2, 139.7], [21.4, 139.7], [19.6, 137.7], [19.6, 132.2],
       [21.6, 130.2]]
cyan = [[35.0, 105.6], [35.6, 120.0], [33.0, 127.4]]      # on the front face (the arc's end toward the room)
cyan_cap = [[33.0, 130.0], [27.0, 137.0]]
amber = [[30.0, 107.0], [30.0, 126.4]]
amber_inner = [111.5, 126.0]     # an amber strip up the inner face (r 27.6), toward the crystal
strip_w = [2.2, 2.0]             # cyan, amber (b4's 1.3 read thin)

[inner]                          # the inner prongs on the track ring (N.inner, N.innerTop), the same family
half_deg = 12.0                  # charger-3: 11 read spindly beside the sheet's hooks
column = [[16.8, 94.0], [22.8, 94.0], [22.8, 115.0], [16.8, 115.0]]   # charger-3: to 115 (b5 116.2) for the bigger head
head = [[15.0, 115.6], [22.6, 115.6], [22.6, 119.0], [20.0, 123.1], [13.2, 123.1], [11.0, 121.0], [11.0, 114.6],
        [12.2, 113.4], [13.8, 113.4], [15.0, 114.6]]
# charger-3: the hook bigger, as on the sheet (b5: r 13.0..22.6, h 116.8..123.1, small at distance): its top kept
# (N.innerTop), in to r 11.0 over the crystal and its lip hanging to 113.4 with the electrode at its tip, 1 cm off the
# crystal's widest (the cap's band, r 7.8)
amber = [[19.9, 97.5], [19.9, 114.6]]
amber_w = 1.8
electrodes = [[11.0, 116.0, 1.5], [16.8, 101.0, 1.0]]   # r of the face, h, radius
