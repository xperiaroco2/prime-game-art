# The ship's crystal charger as numbers, in centimetres (art#263's stations; two of them, one on each lens room's aft
# wall: layouts/ship/ship.toml [[stations.spot]] renewer_e, renewer_w). From its drawing, prime-game-design commit
# a53ce6f (ideas/ship-components/stations-final/charger-drawing/drawing.js, `node drawing.js`: its N object), drawn
# over the engineer's pick of 2026-10-25, the squat base raised on four long legs like the ship's own
# (charger-legs.jpg; prime-game#1095 comment 6401197371): front-ortho.jpg and top-ortho.jpg redrawn straight, the legs
# lengthened 27 cm in their pistons. The charger is round; its side is taken from the front (the generated side view
# was wrong and is not used).
# Frame: u across the front (0 the crystal's axis, + to the right as you face the button), d out of the wall along
# the spot's normal (0 the wall's face), h up from the floor. The model's origin is (u 0, d 0, h 0): the spot's `at`
# on the floor. tools/blender/charger_build.py builds from these; tools/blender/charger_drawing.py draws them.
# Sizes the drawing does not give (block angles, seams, bevels, bezels, strip widths, the legs' joints) are read off
# the sheet (charger-legs.jpg, its front-ortho.jpg at 8.74 px per cm) and marked "sheet".

[frame]
top = 139.7                      # the outer prongs' tops (N.outerTop)
axis_d = 53.5                    # the crystal's axis from the wall: the drawing's half footprint is 52.5; the base's
                                 # widest circle (r 50.2) then clears the lens room's wall facets by 2.3 cm
wall_gap = 2.0                   # the least gap to the wall's facets (the base, the back legs' pads)
# The spot sits on a vertex of the lens room's 12-sided wall (tools/blender/ship_interior.py tip_vertices: facets of
# 21.954 deg at r 2.05 m), so the wall folds toward the room by half a facet, 10.977 deg, either side of u 0. The
# round base stands clear of it (no cut back); the back legs turn toward the sides to keep their pads off it.
back_fold_deg = 10.977

[base]                           # the squat stepped dome (N.baseBottom, N.widestH, N.widest, N.tierTop)
drawn_bottom = 64.8              # fix1: the drawing's N.baseBottom, for the drawing's label (the build uses bottom)
bottom = 60.0                    # the lower tier's underside, the legs' tops (charger-3: a skirt 4.8 under
                                 # N.baseBottom 64.8: the base's mass dominates, the legs read as struts, as on the sheet)
widest = 72.8                    # the widest girth (N.widestH)
band_top = 83.0                  # sheet: the lower tier's straight band, then its top bevel (charger-3: taller;
                                 # b5's 79.4 read as a thin table on stilts beside the sheet's heavy dome)
lower_top = 86.0                 # sheet: the lower tier's top, the step to the upper tier (b5: 82)
r_bottom = 45.0                  # sheet: the underside's edge (the drawing's 40 at 65.9 read as a dark shelf: steeper;
                                 # charger-3: b5's 44 tapered like a table top, broader reads as a dome on struts)
r_widest = 50.2                  # Ø 100.4 (N.widest)
r_lower_top = 49.0               # sheet
r_upper = 43.0                   # the upper tier's side (charger-3: broader, b5 41; N.tierTop Ø 82 is its top edge)
upper_band = 95.4                # sheet: the upper tier's side, then its bevel to the deck (b5: 91.6)
deck = 99.1                      # the deck, the base's top: N.top 99.1 taken literally (charger-3; b5's 94 was the
                                 # deck under the slot and read thin); the slot sunk in a well below it
well = 94.0                      # the well's floor round the slot: the track ring, the slot ring and the collar's foot
                                 # (b5's deck); its wall the deck ring's inner face
r_deck_edge = 41.0               # where the bevel meets the deck: N.tierTop, Ø 82 (b5: the tier's side; 38.6 here)
r_inner = 34.0                   # the upper tier's blocks' inner edge; the deck ring inside it
seam = 0.55                      # sheet: the dark joint between two blocks
lower_edges = [24.0, 54.0, 84.0, 114.0, 144.0, 180.0]   # sheet: block edges, deg from the front (mirrored)
upper_edges = [14.0, 40.0, 66.0, 114.0, 140.0, 166.0, 180.0]
deck_ring = [24.2, 33.8]         # sheet: the deck's inner course of blocks (radii) round the track ring
chamfer = 1.1                    # sheet: the broad chamfer on every block edge
edge = 0.28                      # sheet: the small bright bevel on its folds

[panel]                          # the button's trapezoid facet on the lower tier's front block (sheet)
half_deg = 24.0
top = [14.0, 80.4]               # half width, h
bottom = [8.2, 67.6]
recess = 2.2                     # how far the graphite plate sits behind the block's chord face

[button]                         # the start button (N.button, N.buttonD)
h = 75.9
lens = 8.0
ring = 11.6                      # sheet: the bezel ring's diameter
travel = 1.0                     # pressed in along its normal

[lights]                         # the light slots, mirrored across u 0 (deg from the front, h); sheet
width = 2.0                      # the tier strips' height (b4's 1.3 read thin at 3 m)
cyan_lower = [{ deg = [27.5, 50.5], h = [80.2, 82.2] }, { deg = [117.5, 140.5], h = [80.2, 82.2] }]
amber_lower = [{ deg = [67.0, 71.0], h = [74.0, 82.2] }, { deg = [158.0, 162.0], h = [74.0, 82.2] }]
amber_upper = [{ deg = [45.0, 61.0], h = [89.4, 92.2] }, { deg = [145.0, 161.0], h = [89.4, 92.2] }]
amber_deck = [[17.0, 25.0], [29.0, 37.0], [143.0, 151.0], [155.0, 163.0]]   # dashes on the upper tier's bevel
bezel = 0.6                      # the graphite bezel round a light
proud = 0.8                      # the bezel's face out of its block
inset = 0.45                     # how far the light sits in its bezel (still out of the block)

[slot]                           # the crystal's slot (N.slot) and the deck's rings
collar = [7.8, 10.4]             # the collar's bore and outer radius
collar_top = 95.7                # N.slot
glow = [11.0, 12.6]              # sheet: the cyan slot ring between the collar and the track ring (radii)
bore_bottom = 86.6
tip = 95.1                       # the built crystal's tip at rest (N.tip), in the carrier's pit

[carrier]                        # the cup under the crystal: a leaf, rises and spins
r = 7.0
top = 97.4                       # its pivot: the middle of its rim (sheet: the bronze cup round the crystal's foot)
h = 10.0
pit = [4.0, 0.6]                 # the pit's radius at the rim and at its floor; the floor 0.1 under the tip
rise = 6.0

[ring]                           # the track ring with the inner prongs: a leaf, spins
r0 = 13.5
r1 = 23.6                        # N.track 19 is its middle
h = 3.0
groove = 0.3
light = [18.0, 20.0]             # the cyan channel on its top (radii)

[outer]                          # the fixed outer prongs on the u axis (N.outer, N.outerTop): an (r, h) profile swept
                                 # round the axis over +-half_deg; in front their u is r cos(half_deg)
half_deg = 13.0
root_deg = 15.0                  # the root block and the cap a little wider (sheet: chunky)
cap_deg = 14.0
root = [[24.5, 99.1], [38.4, 99.1], [40.2, 104.0], [25.5, 104.0]]   # on the deck (charger-3; b5: 94..101)
column = [[25.8, 104.6], [40.4, 104.6], [42.2, 110.5], [42.2, 121.5], [39.4, 128.4], [27.6, 128.4], [27.6, 110.0]]
cap = [[24.0, 129.0], [39.0, 129.0], [39.0, 131.5], [33.2, 139.7], [21.4, 139.7], [19.6, 137.7], [19.6, 132.2],
       [21.6, 130.2]]
cyan = [[35.0, 105.6], [35.6, 120.0], [33.0, 127.4]]      # on the front face (the arc's end toward the room)
cyan_cap = [[33.0, 130.0], [27.0, 137.0]]
amber = [[30.0, 107.0], [30.0, 126.4]]
amber_inner = [111.5, 126.0]     # an amber strip up the inner face (r 27.6), toward the crystal
strip_w = [2.2, 2.0]             # cyan, amber (b4's 1.3 read thin)

[inner]                          # the inner prongs on the track ring (N.inner, N.innerTop), the same family
half_deg = 12.0                  # charger-3: 11 read spindly beside the sheet's hooks
column = [[16.8, 94.0], [22.8, 94.0], [22.8, 115.0], [16.8, 115.0]]   # charger-3: to 115 (b5 116.2) for the bigger head
head = [[15.0, 115.6], [22.6, 115.6], [22.6, 119.0], [20.0, 123.1], [13.2, 123.1], [11.0, 121.0], [11.0, 114.6],
        [12.2, 113.4], [13.8, 113.4], [15.0, 114.6]]
# charger-3: the hook bigger, as on the sheet (b5: r 13.0..22.6, h 116.8..123.1, small at distance): its top kept
# (N.innerTop), in to r 11.0 over the crystal and its lip hanging to 113.4 with the electrode at its tip, 1 cm off the
# crystal's widest (the cap's band, r 7.8)
amber = [[19.9, 97.5], [19.9, 114.6]]
amber_w = 1.8
electrodes = [[11.0, 116.0, 1.5], [16.8, 101.0, 1.0]]   # r of the face, h, radius

[legs]                           # four legs angled out like the ship's landing legs (N.legTop, N.legLift, N.foot)
angles = [50.0, 120.0]           # deg from the front (mirrored); the back pair turned toward the sides: at 135 their
                                 # pads would stand in the wall's facets
pad_s = [57.5, 52.0]             # the pads' centres from the axis, front and back pair (N.foot 105: the outer
                                 # corners at 45 deg); the back pair tucked 5.5 cm
hip = [40.0, 59.8]               # s, h: the strut's top in its bracket under the base (front-ortho: the legs stand under
                                 # the rim, near upright from the front)
ankle_h = 10.0                   # the pad's top
strut = [37.0, 59.8]             # h: the bronze upper strut from .. to
strut_size = [[13.0, 11.5], [15.0, 13.0]]   # sheet: across, along s at its foot and its top (front-ortho: 15 across)
gland = [35.6, 38.4]             # sheet: the graphite gland where the rod leaves the strut
rod = [17.0, 39.0]               # h: the dark steel piston rod (lengthened 27 cm, N.legLift)
rod_r = 3.6
sleeve = [9.5, 21.0]             # h: the bronze ankle sleeve
sleeve_size = [[13.0, 12.0], [11.5, 10.5]]
pad = [22.0, 15.0, 2.5, 9.5]     # sheet: the pad's foot square (front-ortho: 24), its top square, its plinth's
                                 # height, its top's h
strut_light = [43.0, 55.0, 3.0]  # h0, h1, width: the amber slot on the strut's outer face
pad_bars = [[4.6, 1.5], [7.4, 1.5]]   # sheet: the pads' two amber bars on each face: h of the middle, height
