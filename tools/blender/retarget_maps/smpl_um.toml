# Meshy text to motion's SMPL-H skeleton (52 bones, read from batch 4's crawl and batch 5's seven clips, art #33, on
# 2026-10-06) -> Ultimate Modular "CharacterArmature" (62 bones and the assembler's toe bones Toe.L and Toe.R: 64).
# Read by tools/blender/retarget_map.py; the method is in docs/animations.md ("Text to motion"), the format in
# ual_um.toml's head.
#
# The rig: Pelvis (the top bone: no root; its location keys carry the travel) > Spine1 > Spine2 > Spine3 > Neck > Head,
# L/R_Collar > L/R_Shoulder (the upper arm) > Elbow > Wrist under Spine3, L/R_Hip > Knee > Ankle > Foot under Pelvis.
# Fingers: Index, Middle, Ring and Pinky 1..3 are the phalanges (1 at the knuckle), Thumb1..3 with 1 the metacarpal.
# No leaf or end bones. Every file is one clip (one FBX) on the same rest, a T-pose facing -Y with its left at +X.
#
# - The floor shift: the rest is centred on the pelvis (the mannequin's soles at z = -1.161) while the animation stands
#   on z = 0. The loader (tools/blender/retarget_smpl.py) lifts the armature onto the floor and takes the lift back out
#   of Pelvis's location keys, so the rest and the motion share the floor, as on the other rigs.
# - No root: the target Root stays at rest and Body, carried in the frame of the SMPL-H Pelvis, takes the travel.
# - The feet: L_Ankle is an ankle joint (as Meshy's LeftFoot); the IK carries our heel pivot where it carries it.
# - The toes: L_Foot and R_Foot, the ball joints 14 cm in front of the ankles, drive Toe.L and Toe.R.
# - The fingers map by anatomy, as UAL's do: the phalanges 1..3 to Index2..4 (and Middle, Ring, Pinky), the thumbs 1:1,
#   our metacarpals Index1..Pinky1 at rest. They never move in a text-to-motion clip: every one holds SMPL-H's mean
#   relaxed hand (about 31 degrees per joint), a constant curl.
# - No [align]: the upper arms rest 2.6 degrees apart (Meshy's auto-rig: 10 to 15).

title = "Meshy text to motion (SMPL-H) -> Ultimate Modular"
hips = ["Pelvis", "Body"]

[height]  # the hip joints: their mean rest height above the floor (after the floor shift) gives the translation scale
source = ["L_Hip", "R_Hip"]
target = ["UpperLeg.L", "UpperLeg.R"]

[bones]
Pelvis = "Body"
Spine1 = "Abdomen"
Spine2 = "Torso"
Spine3 = "Chest"
Neck = "Neck"
Head = "Head"
L_Collar = "Shoulder.L"
L_Shoulder = "UpperArm.L"
L_Elbow = "LowerArm.L"
L_Wrist = "Wrist.L"
L_Index1 = "Index2.L"
L_Index2 = "Index3.L"
L_Index3 = "Index4.L"
L_Middle1 = "Middle2.L"
L_Middle2 = "Middle3.L"
L_Middle3 = "Middle4.L"
L_Ring1 = "Ring2.L"
L_Ring2 = "Ring3.L"
L_Ring3 = "Ring4.L"
L_Pinky1 = "Pinky2.L"
L_Pinky2 = "Pinky3.L"
L_Pinky3 = "Pinky4.L"
L_Thumb1 = "Thumb1.L"
L_Thumb2 = "Thumb2.L"
L_Thumb3 = "Thumb3.L"
L_Hip = "UpperLeg.L"
L_Knee = "LowerLeg.L"
L_Ankle = "Foot.L"
L_Foot = "Toe.L"
R_Collar = "Shoulder.R"
R_Shoulder = "UpperArm.R"
R_Elbow = "LowerArm.R"
R_Wrist = "Wrist.R"
R_Index1 = "Index2.R"
R_Index2 = "Index3.R"
R_Index3 = "Index4.R"
R_Middle1 = "Middle2.R"
R_Middle2 = "Middle3.R"
R_Middle3 = "Middle4.R"
R_Ring1 = "Ring2.R"
R_Ring2 = "Ring3.R"
R_Ring3 = "Ring4.R"
R_Pinky1 = "Pinky2.R"
R_Pinky2 = "Pinky3.R"
R_Pinky3 = "Pinky4.R"
R_Thumb1 = "Thumb1.R"
R_Thumb2 = "Thumb2.R"
R_Thumb3 = "Thumb3.R"
R_Hip = "UpperLeg.R"
R_Knee = "LowerLeg.R"
R_Ankle = "Foot.R"
R_Foot = "Toe.R"

[follow]
"Foot.L" = "LowerLeg.L"
"Foot.R" = "LowerLeg.R"

[[legs]]
target = ["UpperLeg.L", "LowerLeg.L", "Foot.L"]
source_foot = "L_Ankle"

[[legs]]
target = ["UpperLeg.R", "LowerLeg.R", "Foot.R"]
source_foot = "R_Ankle"

[rest]  # Root (no source root), Hips (Body carries the pelvis), the finger metacarpals, PT: the knee pole targets
bones = [
  "Root", "Hips", "Index1.L", "Middle1.L", "Ring1.L", "Pinky1.L", "Index1.R", "Middle1.R", "Ring1.R", "Pinky1.R",
  "PT.L", "PT.R"
]

[unused]  # none: SMPL-H has no leaf or end bones
bones = []

[source_rig]  # the 52 bones of every text-to-motion FBX of batches 4 and 5, in the files' order, read on 2026-10-06
bones = [
  "Pelvis", "L_Hip", "L_Knee", "L_Ankle", "L_Foot", "R_Hip", "R_Knee", "R_Ankle", "R_Foot", "Spine1", "Spine2",
  "Spine3", "Neck", "Head", "L_Collar", "L_Shoulder", "L_Elbow", "L_Wrist", "L_Index1", "L_Index2", "L_Index3",
  "L_Middle1", "L_Middle2", "L_Middle3", "L_Pinky1", "L_Pinky2", "L_Pinky3", "L_Ring1", "L_Ring2", "L_Ring3",
  "L_Thumb1", "L_Thumb2", "L_Thumb3", "R_Collar", "R_Shoulder", "R_Elbow", "R_Wrist", "R_Index1", "R_Index2",
  "R_Index3", "R_Middle1", "R_Middle2", "R_Middle3", "R_Pinky1", "R_Pinky2", "R_Pinky3", "R_Ring1", "R_Ring2",
  "R_Ring3", "R_Thumb1", "R_Thumb2", "R_Thumb3"
]

[target_rig]  # the 62 bones of every Ultimate Modular Men and Women GLB and the toes
bones = [
  "Root", "Body", "Hips", "Abdomen", "Torso", "Chest", "Neck", "Head", "Shoulder.L", "UpperArm.L", "LowerArm.L",
  "Wrist.L", "Index1.L", "Index2.L", "Index3.L", "Index4.L", "Middle1.L", "Middle2.L", "Middle3.L", "Middle4.L",
  "Ring1.L", "Ring2.L", "Ring3.L", "Ring4.L", "Pinky1.L", "Pinky2.L", "Pinky3.L", "Pinky4.L", "Thumb1.L", "Thumb2.L",
  "Thumb3.L", "Shoulder.R", "UpperArm.R", "LowerArm.R", "Wrist.R", "Index1.R", "Index2.R", "Index3.R", "Index4.R",
  "Middle1.R", "Middle2.R", "Middle3.R", "Middle4.R", "Ring1.R", "Ring2.R", "Ring3.R", "Ring4.R", "Pinky1.R",
  "Pinky2.R", "Pinky3.R", "Pinky4.R", "Thumb1.R", "Thumb2.R", "Thumb3.R", "UpperLeg.L", "LowerLeg.L", "UpperLeg.R",
  "LowerLeg.R", "Foot.L", "PT.L", "Foot.R", "PT.R", "Toe.L", "Toe.R"
]
