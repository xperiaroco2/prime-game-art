# The alien's hand shapes in the loco clips (art #196, Hands H1; tools/blender/alien_hands_math.py, alien_hands.py).
# The mocap finger motion of every clip is replaced, not capped: each clip's finger bones take one grip per hand, or a
# short set of keyed grips ([share 0..1 of the clip, grip] or [share, left grip, right grip]); the arms and wrists keep
# the clip's motion. The grips: the photo poses' library (alien_poses.toml [grips]: fist, point, flat, heart, behind;
# reused, never redefined here) and this file's own. A grip: per finger [base, middle, tip] curl in degrees (the
# thumb: metacarpal, proximal, distal), `all` for the rest, `ThumbTurn` [roll, swing] the thumb's base turned about its
# length and toward the palm, `spread` + `mirror` the fingers drawn together on both hands (alien_pose_math.grip_quats).
# A clip takes the first [clips] pattern matching its Godot name (no prefix, no _Loop; fnmatch, file order), else the
# default grip.

[set]
poses = "alien_poses.toml"
default = "relaxed"
skip = ["PoseArms_*", "PoseLegs_*"]  # the photo poses keep their own grips

[grips.relaxed]  # Idle, Walk, Talk, Crouch (H1b): the curl grows from the index to the outer finger, the thumb lies
                 # alongside the index, never facing the fingers (the old even 30/30/30 C read as holding a cup)
Index = [8, 14, 8]
Middle = [16, 24, 12]
Ring = [26, 34, 18]
Little = [26, 34, 18]
mirror = true
spread = 12
Thumb = [2, 8, 6]
ThumbTurn = [4, -6]

[grips.loose]    # the run (H1b): a soft loose fist, the curl growing to the outer finger, the thumb laid over the
                 # index's middle segment (no "O" of thumb and index tips)
Index = [72, 62, 14]    # H1c: the fold led by the knuckle, the tips tucked (48/56/26 closed an "O" with the thumb)
Middle = [78, 68, 16]
Ring = [84, 74, 18]
Little = [84, 74, 18]
mirror = true
spread = 6
Thumb = [24, 30, 18]
ThumbTurn = [42, 60]    # across the index's middle segment (past rest 0.64 cm: the thumb resting on the index)

[clips."Jog_*"]
grip = "loose"

[clips."Sprint_*"]
grip = "loose"

[clips."Strafe_*"]
grip = "loose"

[clips."Jump_Start"]  # the crouch relaxed, the hands opening flat into the air
keys = [[0.0, "relaxed"], [0.6, "relaxed"], [1.0, "flat"]]

[clips."Jump_Air"]
grip = "flat"

[clips."Jump_Land"]
keys = [[0.0, "flat"], [0.5, "relaxed"]]
