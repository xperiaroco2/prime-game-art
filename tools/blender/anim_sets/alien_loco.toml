# ---- the reels (P3; P4: the back clips' rows P3's above P4's): one per view, <name>__<view>; travel: the stripes' heading (a clip carried along another
# direction than its own); the treadmill_reels.gd cameras front, three_quarter (front left), back, side (its left);
# each pair: P2's clip (before) above P3's
[[reel]]
name = "Strafe_Left"
views = ["front", "three_quarter", "back"]
clips = [{ clip = "Strafe_Left__p2", speed = 3.0 }, { clip = "Strafe_Left", speed = 3.0 }]

[[reel]]
name = "Diagonal_45"
views = ["front", "three_quarter", "back"]
clips = [{ clip = "Jog_Fwd_Left__p2", speed = 3.5 }, { clip = "Jog_Fwd_Left", speed = 3.5 }]

[[reel]]
name = "Jog_Bwd"
views = ["side", "front", "three_quarter", "back"]
clips = [{ clip = "Jog_Bwd__p3", speed = 2.5 }, { clip = "Jog_Bwd", speed = 2.5 }]

[[reel]]
name = "Jog_Bwd_caps"  # the back cap's grid, the engineer's call (no video)
views = ["side", "three_quarter"]
video = false
cols = 3
clips = [{ clip = "Jog_Bwd__c20", speed = 2.0 }, { clip = "Jog_Bwd__c25", speed = 2.5 },
         { clip = "Jog_Bwd__c30", speed = 3.0 }]

