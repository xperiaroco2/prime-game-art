clips = [{ clip = "Crouch_Fwd__p2", speed = 2.0 }, { clip = "Crouch_Run__p2", speed = 2.8 },
         { clip = "Crouch_Fwd", speed = 2.0 }, { clip = "Crouch_Run", speed = 2.8 }]

