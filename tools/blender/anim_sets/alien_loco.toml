bend_min_deg = 20.0
head_level = -10.0
lift_m = -0.03
bob_m = 0.03
flight_m = 0.02
pin = true
arms_from = { clip = "Jog_Fwd", k = 0.5, w = 1.0, phase = 0.5 }
even_steps = true
arms_carry = { side_m = 0.20, front_m = 0.17, dz_m = 0.01, swing_m = 0.05, rise = 0.35, out_deg = 12.0 }
