# The alien's locomotion set (art #196, option A step 3): the game's move clips made from the built R2b characters'
# UAL clips and step 2's text-to-motion loops (alien_ttm.py), with step 1's edits (alien_stride_math: cycle, stride,
# arm_swing, mirror), written onto each character by tools/blender/alien_loco.py (docs/animations.md, "The alien's
# locomotion set"). Every loop starts on the left foot's contact (cycle, foot "Left").
#
# Per [[clip]]:
# - name: the game's clip name (avatar_clips.gd); the action is CharacterArmature|<name>_Loop, which Godot imports as
#   <name>, looping; a name with "__" is a variant or an alternative beside the game's clip;
# - source: the action it is made from (the build's UAL clip, or a step 2 loop TM_<item>_Loop from `ttm`);
#   mirror: instead, the clip of that name mirrored left to right (each of its speeds);
# - speeds: the stride fitted so the loop covers each speed (m/s) at rate 1.0 (stride's scale = speed / v0); the
#   first under the name, each further one under <name>__s<speed x 10> (or <name>_s<..> for a name with "__");
#   none: the clip at its own speed;
# - frames: the loop retimed to this many frames (24 fps) before the stride;
# - arm_swing: the arms' swing scaled toward the clip's mean (1.0: unchanged);
# - arms_from: {clip, k, w}: the arms given that made clip's swing (alien_stride_math.arms_from: its swing about its
#   mean x k, on a held pose blended from this clip's mean, w 0, to the donor's, w 1), for a clip whose hands clamp;
# - max_scale: the stride scaled at most this much; the rest of the speed goes into the cadence (a higher rate);
# - bend_min_deg: a knee bend floor on the swing frames (stride: no locked knee at a kick's extension);
# - play_at: the game's speeds it is played at, each reported with its rate (speed / v0) and the footstep beat.
# [[grid]]: a clip's variants (arm_swing x frames), each <name>__arm<k x 100>_f<frames>; the one written under the
# name is picked by the numbers (alien_loco_math.pick_default): the cadence nearest the footstep beat at its speed,
# its planted feet within the slide bound; arm_swing has no number to pick by, the ties go to default_arm_swing.

[set]
raw_base = "research/2026-10-22-roster/design/pilot3d/anim_bare"  # under the raw root
build = "r2b/build"  # <build>/<char>/<char>_char.blend
ttm = "loco/s2/chameleon_char_ttm.blend"  # step 2's loops (the axolotl shares the skeleton)
mocap = "loco/p1/chameleon_char_100s.blend"  # the strafe pilot P1's 100STYLE loops MC_Neutral_<take>_Loop
out = "loco/p4"  # build/<char>/ and reels/ (step 3: loco/s3, step 4b: loco/s4b, P2: loco/p2, P3: loco/p3)
chars = ["chameleon", "axolotl"]
foot = "Left"
stride_flag = 2.0  # a stride scaled more than this is flagged
rate_clamp = [0.25, 4.0]  # the game's rate clamp
# the game's footstep clock (prime-game client/world/footstep_cadence.gd): 0.45 s per step at the walk, 0.32 at the
# sprint, the stride between them lerped by speed, interval = stride / speed
walk_mps = 4.5
sprint_mps = 7.0
walk_interval_s = 0.45
sprint_interval_s = 0.32

[[clip]]
name = "Walk"  # the game never plays it yet; at its own speed, the 2.0 sneak's rate reported
source = "Walk_Loop"
play_at = [2.0]

[[grid]]
name = "Jog_Fwd"
source = "Jog_Fwd_Loop"
speeds = [4.5]
arm_swing = [1.0, 0.75, 0.6]
frames = [22, 21]
default_arm_swing = 0.75  # step 1's proof and the plan's 0.65-0.75
play_at = [4.5, 2.0]

[[clip]]
name = "Sprint_Fwd"
source = "Sprint_Fwd_Loop"  # the build's 4 degree lean kept: stride moves only the hips' travel and the legs
speeds = [7.0]
play_at = [7.0]

[[clip]]
name = "Crouch_Fwd"
source = "TM_crouch-run_Loop"
speeds = [2.0]
bend_min_deg = 20.0  # the heel strike's straight knee (3.5 degrees) bent
head_level = -5.0  # the eyes on the way ahead, not the floor (the take: 48 degrees down; P2)
orient = { whole = true, travel = -2.0 }  # the take turned 13.6 degrees as a whole, turned back (P3; -2: the head at +2)
play_at = [2.0]

[[clip]]
name = "Crouch_Run"  # the 2.0 clip at a higher cadence (rate about 1.3), not a longer stride (step 4's critic)
source = "TM_crouch-run_Loop"
speeds = [2.8]
max_scale = 1.15
bend_min_deg = 20.0
head_level = -5.0
orient = { whole = true, travel = -2.0 }
play_at = [2.8]

[[clip]]
name = "Crouch_Fwd__p2"  # P2's crouch clips (turned 13 degrees as a whole), the facing reel's before
source = "TM_crouch-run_Loop"
speeds = [2.0]
bend_min_deg = 20.0
head_level = -5.0
play_at = [2.0]

[[clip]]
name = "Crouch_Run__p2"
source = "TM_crouch-run_Loop"
speeds = [2.8]
max_scale = 1.15
bend_min_deg = 20.0
head_level = -5.0
play_at = [2.8]

[[clip]]
name = "Crouch_Run__s4b"  # step 4b's Crouch_Run (its head on the floor), the reels' before
source = "TM_crouch-run_Loop"
speeds = [2.8]
max_scale = 1.15
bend_min_deg = 20.0
play_at = [2.8]

[[clip]]
name = "Crouch_Fwd__ual"  # the baseline row: the build's UAL crouch as it is
source = "Crouch_Fwd_Loop"
play_at = [2.0, 2.8]

# ---- the strafe pilot P2: the side, diagonal and back clips (art #196). orient: absolute headings (degrees, 0 at the
# aim, positive toward the left): the hips' mean turned to `hips`, the feet's travel to `travel`, the chest and head
# counter-twisted back to the aim (alien_loco_math.orient, orient_warp); from: a made clip of the set as the source;
# cadence: the steps per second the loop is retimed to before the stride takes the rest of the speed; lean_deg: the
# trunk leant forward (alien_loco_math.LEAN_SPLIT); head_level: the head's mean front pitch brought to this (degrees).

# step 4b's clips, kept for the reels only (today's behaviour beside the new clips)
[[clip]]
name = "Strafe_Left__s4b"
source = "TM_b5-strafe-left_Loop"
speeds = [3.0]
arms_from = { clip = "Jog_Fwd", k = 0.75, w = 1.0 }
play_at = [3.0]

[[clip]]
name = "Jog_Bwd__s4b"
source = "TM_b6-backward-run_Loop"
speeds = [3.0]
max_scale = 1.5
bend_min_deg = 20.0
arms_from = { clip = "Jog_Fwd", k = 0.75, w = 1.0 }
play_at = [3.0, 2.5]

# the side run: the approved Jog_Fwd (22 frames, left contact first) turned toward the travel, fitted to 3.0; P2's
# hip grid (45/60/75) picked 60. P3 (the critic): the hips lifted 5 cm on the kept feet (lift_m: the least knee bend
# 45-52 -> 20-30; 3 and 4 cm left 40 and 35), the ankles 3 cm wider apart (widen_m), the upper arms 14 degrees in
# (arms_in_deg: the hands 0.39/0.36 m from the torso -> about 0.32/0.29)
[[clip]]
name = "Strafe_Left"
from = "Jog_Fwd"
speeds = [3.0]
orient = { hips = 60.0, travel = 90.0, split = [["Spine", 0.1], ["Chest", 0.15], ["UpperChest", 0.15], ["Neck", 0.35], ["Head", 0.25]] }
bend_min_deg = 20.0
lift_m = 0.05
widen_m = 0.03
arms_in_deg = 14.0
play_at = [3.0]

[[clip]]
name = "Strafe_Right"
mirror = "Strafe_Left"
play_at = [3.0]

[[clip]]
name = "Strafe_Left__p2"  # P2's side run, the reels' before
from = "Jog_Fwd"
speeds = [3.0]
orient = { hips = 60.0, travel = 90.0, split = [["Spine", 0.1], ["Chest", 0.15], ["UpperChest", 0.15], ["Neck", 0.35], ["Head", 0.25]] }
bend_min_deg = 20.0
play_at = [3.0]

# the forward diagonals: Jog_Fwd turned to a 45 degree travel at 3.5 (the speed ellipse through 4.5 ahead, 3.0 aside);
# P3: the hips 3 cm up (the knees 41/37 -> 27/21), the arms 14 degrees in
[[clip]]
name = "Jog_Fwd_Left"
from = "Jog_Fwd"
speeds = [3.5]
orient = { hips = 35.0, travel = 45.0, split = [["Spine", 0.1], ["Chest", 0.15], ["UpperChest", 0.15], ["Neck", 0.35], ["Head", 0.25]] }
bend_min_deg = 20.0
lift_m = 0.03
arms_in_deg = 14.0
play_at = [3.5]

[[clip]]
name = "Jog_Fwd_Right"
mirror = "Jog_Fwd_Left"
play_at = [3.5]

[[clip]]
name = "Jog_Fwd_Left__p2"  # P2's diagonal, the reels' before
from = "Jog_Fwd"
speeds = [3.5]
orient = { hips = 35.0, travel = 45.0, split = [["Spine", 0.1], ["Chest", 0.15], ["UpperChest", 0.15], ["Neck", 0.35], ["Head", 0.25]] }
bend_min_deg = 20.0
play_at = [3.5]

# the backpedal: the mocap back run (0.90 m/s, 3 steps/s), its travel set straight back (the take's runs 15 degrees
# off its hips), its head on the aim, the trunk leant 8 degrees. P3 (the critic): 3.4 steps/s (a 14-frame cycle; P2:
# 4.0, 12 frames: a nervous walk), the rest of the speed in the stride; the hips 3 cm down on the kept feet with a 3 cm
# dip at mid-stance (lift_m, bob_m: bent knees, a bob) and a 2 cm rise over the handover (flight_m: both feet off the
# floor); the feet pinned by the honest test (pin: the left foot drifted 21 mm); Jog_Fwd's arms at half swing, half a
# cycle on (arms_from phase 0.5: the arm against the leg; the take's arms hung, the hands 0.13 m from the torso)
# P4: the take's steps evened (even_steps: 7 and 9 of its 16 frames -> 8 and 8, so 7 and 7 of 14; P3: 6 and 8) and
# the arms solved onto a running carriage (arms_carry: the wrists 0.20 m out, 0.17 m in front of the waist and 1 cm
# over it, +-5 cm against the leg, the elbows behind the trunk, 12 degrees out; P3's arms swung out to the sides)
[[clip]]
name = "Jog_Bwd__c20"
speeds = [2.0]
source = "MC_Neutral_BR_Loop"
orient = { hips = 0.0, travel = 180.0 }
cadence = 3.4
lean_deg = 8.0
bend_min_deg = 20.0
head_level = -10.0
lift_m = -0.03
bob_m = 0.03
flight_m = 0.02
pin = true
arms_from = { clip = "Jog_Fwd", k = 0.5, w = 1.0, phase = 0.5 }
even_steps = true
arms_carry = { side_m = 0.20, front_m = 0.17, dz_m = 0.01, swing_m = 0.05, rise = 0.35, out_deg = 12.0 }
play_at = [2.0]

[[clip]]
name = "Jog_Bwd__c25"
speeds = [2.5]
source = "MC_Neutral_BR_Loop"
orient = { hips = 0.0, travel = 180.0 }
cadence = 3.4
