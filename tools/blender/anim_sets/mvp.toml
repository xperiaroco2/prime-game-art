edits = [{ op = "trim", start_s = 0.13, end_s = 2.13 }, { op = "retime", seconds = 0.9 }]
needs = [{ need = "Pick up a one-handed item from the floor (full standing, upper body moving)", no = 16, layer = "full" }]

[[clips]]
name = "Putdown_One"
from = "Pickup_One"
loop = false
edits = [{ op = "reverse" }, { op = "retime", seconds = 0.8 }]
needs = [{ need = "Put a one-handed item down in front", no = 17, layer = "full" }]

[[clips]]
name = "Pickup_Package"
source = "tm:package-lift"
loop = false
edits = [{ op = "trim", start_s = 0.1, end_s = 1.5 }, { op = "heading", facing = "mean" },
         { op = "retime", seconds = 1.0 }, { op = "floor", mode = "lift" },
         { op = "hand_spacing", gap_m = 0.40, at = "end", deg = 18.5, body = "men" },
         { op = "hand_spacing", gap_m = 0.40, at = "end", deg = 22.9, body = "women" }]
# floor: the squat's toes went 2.8 cm (men) and 1.9 cm (women) into the floor; hand_spacing auto found 18.55 and
# 22.85 degrees for a 0.40 m gap at the end (from 19.1 and 14.0 cm)
needs = [{ need = "Pick up the package with both hands", no = 18, layer = "full" }]

[[clips]]
name = "Putdown_Package"
from = "Pickup_Package"
loop = false
edits = [{ op = "reverse" }]
needs = [{ need = "Put the package down with both hands", no = 19, layer = "full" }]

# ----------------------------------------------------------------------------------------- downed and raised
[[clips]]
name = "Knockdown"
source = "ual:Death01"
loop = false
