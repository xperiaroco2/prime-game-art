# The animation MVP (art #33; docs/animations.md, "Animation sets"): every clip of the game's MVP with its source, its
# edits (tools/blender/anim_edit.py, in order), its loop mode and the needs it serves (the list: raw
# manager/stage1/faces-research.json, key "animation"; `no` is the need's number there). `tools/run.py anim-set` builds
# it per body type into <raw>/anim-sets/mvp/<body>/ (.blend, GLB, reports); anim-review plays its clips as "mvp:<name>".
#
# - A source is a clip key (pack:, ual:, ual2:, tm:) taken as retargeted, with its travel: a library's in_place list is
#   for the review's lanes only. `from` starts from an earlier clip of this set after its edits.
# - A loop's name ends in _Loop. Godot's importer gives such a clip LOOP_LINEAR and drops the suffix: the game sees
#   "Idle", "Jog_Fwd", "Strafe_Left" and so on.
# - `layer`: "full" (the whole body) or "upper" (the `upper` bone below and every bone under it, the game's bone filter
#   for an upper-body layer). Upper layers export every bone; the game masks them.
# - `speed_m_s`: the clip's ground speed at rate 1.0; the game plays it at its speed divided by this (the needs' rate).
# - A step with `body` runs on that body type only. Angles found by an `auto` search are pinned here (the build reports
#   them), so a build is quick and reproducible.

title = "The animation MVP (art #33)"
fps = 30
stem = "anim_mvp"
upper = "Torso"

# ------------------------------------------------------------------------------------------------- standing
[[clips]]
name = "Idle_Loop"
source = "ual:Idle_Loop"
loop = true
edits = [{ op = "arm_offset", abduct_deg = 2.66, body = "women" }]  # auto: hands 1.32 cm in the thighs to 0
needs = [{ need = "Idle, standing; the base under the carry, talk and push layers", no = 1, layer = "full" }]

[[clips]]
name = "Turn_Left"
source = "tm:turn-left-90"
loop = false
edits = [{ op = "heading", facing = "start" }, { op = "trim", start_s = 0.13, end_s = 1.73 },
         { op = "turn", total_deg = 90 }, { op = "retime", seconds = 1.2 },
         { op = "arm_offset", abduct_deg = 5.6, body = "women" }]  # auto: 5.64, hands 3.85 cm in the thighs to 0
needs = [{ need = "Turn in place, 90 degrees to the left (lower body while the yaw follows the mouse)", no = 7, layer = "full" }]

[[clips]]
name = "Turn_Right"
from = "Turn_Left"
loop = false
edits = [{ op = "mirror" }]
needs = [{ need = "Turn in place, 90 degrees to the right", no = 7, layer = "full" }]

# ----------------------------------------------------------------------------------------------- locomotion
[[clips]]
name = "Jog_Fwd_Loop"
source = "ual:Jog_Fwd_Loop"
loop = true
speed_m_s = 4.5
edits = [{ op = "stride", speed_m_s = 4.5, cadence = 2.8 }]
needs = [{ need = "Move forward at 4.5 m/s (the walk)", no = 2, layer = "full", speed_m_s = 4.5, rate = 1.0 }]

[[clips]]
name = "Jog_Bwd_Loop"
source = "ual:Jog_Fwd_Loop"
loop = true
speed_m_s = 4.5
edits = [{ op = "stride", speed_m_s = 4.5, cadence = 2.8 }, { op = "reverse" }]
needs = [{ need = "Move backward at 4.5 m/s", no = 3, layer = "full", speed_m_s = 4.5, rate = 1.0 },
         { need = "Sprint backward at 7.0 m/s", no = 6, layer = "full", speed_m_s = 7.0, rate = 1.556 }]
note = "the forward jog warped and played backwards: the free candidate while Meshy's backward jog is re-rolled"

[[clips]]
name = "Jog_Bwd_TTM_Loop"
source = "tm:backward-jog"
loop = true
export = false
speed_m_s = 4.5
edits = [{ op = "heading", travel = "back" }, { op = "cycle", min_s = 0.6, max_s = 1.0, within = [0.3, 3.7] },
         { op = "stride", speed_m_s = 4.5, cadence = 2.8 }]
note = "review only: Meshy's backward jog barely travels (0.3 m/s), so its stride must grow about 8x (re-roll)"

[[clips]]
name = "Strafe_Left_Loop"
source = "tm:strafe-left"
loop = true
speed_m_s = 4.5
edits = [{ op = "heading", travel = "left" }, { op = "cycle", min_s = 0.55, max_s = 0.9, within = [0.3, 3.7] },
         { op = "stride", speed_m_s = 4.5, cadence = 4.0 }]
# cadence 4.0: at the design's 2.9 the steps had to grow 1.74x (men; 1.57 m) and the legs missed their targets by
# 66 mm on contact frames and 465 mm in flight; 4.0 steps/s gives 1.1 m steps
needs = [{ need = "Strafe left at 4.5 m/s", no = 4, layer = "full", speed_m_s = 4.5, rate = 1.0 },
         { need = "Sprint to the left at 7.0 m/s", no = 6, layer = "full", speed_m_s = 7.0, rate = 1.556 }]

[[clips]]
name = "Strafe_Right_Loop"
from = "Strafe_Left_Loop"
loop = true
speed_m_s = 4.5
edits = [{ op = "mirror" }]
needs = [{ need = "Strafe right at 4.5 m/s", no = 4, layer = "full", speed_m_s = 4.5, rate = 1.0 },
         { need = "Sprint to the right at 7.0 m/s", no = 6, layer = "full", speed_m_s = 7.0, rate = 1.556 }]

[[clips]]
name = "Sprint_Fwd_Loop"
source = "ual:Sprint_Loop"
loop = true
speed_m_s = 7.0
# natural_m_s: UAL Sprint_Loop's root-motion speed scaled to the body (anim-review rates, art #20)
edits = [{ op = "retime", speed_m_s = 7.0, natural_m_s = 8.534, body = "men" },
         { op = "retime", speed_m_s = 7.0, natural_m_s = 9.178, body = "women" }]
needs = [{ need = "Sprint forward at 7.0 m/s", no = 5, layer = "full", speed_m_s = 7.0, rate = 1.0 }]

