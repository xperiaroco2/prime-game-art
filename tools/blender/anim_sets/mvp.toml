         { op = "idle_ends", at = "start", from_clip = "Idle_Loop" }]
needs = [{ need = "Raise a downed player: kneel down", no = 26, layer = "full" }]

[[clips]]
name = "Raise_Work_Loop"
source = "ual:Fixing_Kneeling"
