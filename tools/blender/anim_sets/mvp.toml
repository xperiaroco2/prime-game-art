# -------------------------------------------------------------------------------------------- items, the package
[[clips]]
name = "Carry_Upper_Loop"
source = "ual2:Walk_Carry_Loop"
loop = true
# The side grip (art #65): the 0.45 m package held by its sides, the palms facing each other. UAL2's Walk_Carry holds
# a tray (the palms 44 / 45 degrees up, the hands 0.0 to 2.1 cm apart: men / women); the fingers go nearly straight
# (they lie on the box) and side_grip opens the arms 18.3 to 19.8 / 20.0 to 21.5 degrees per frame: the hands' closest
# vertices 44.7 to 45.3 cm apart on every frame, the palms vertical (0.0 degrees up, within 0.02 of the other hand),
# the hands 1.13 to 1.25 / 1.12 to 1.25 m high and 22 / 25 cm in front, nothing in the torso or the other hand.
# Art #33's tray: hand_spacing to a mean gap of 0.40 m (28.7 / 29.8 degrees, 36.7 to 43 cm).
edits = [{ op = "hands_relax", curl_deg = { Index = [8, 10, 6], Middle = [8, 10, 6], Ring = [10, 12, 8], Pinky = [12, 14, 8], Thumb = [6, 6] } },
         { op = "side_grip", gap_m = 0.45 }]
needs = [{ need = "Carry the package (upper body over the idle and the locomotion)", no = 15, layer = "upper" }]

