         { op = "in_place", mode = "path" }, { op = "retime", seconds = 1.5 }, { op = "floor", mode = "settle" }]
note = "review only: Meshy's get-up floats 6 to 13 cm over the whole clip (re-roll, or a settle edit)"

[[clips]]
