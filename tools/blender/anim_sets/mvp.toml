[[clips]]
name = "Strafe_Left_Loop"
source = "tm:strafe-left"
loop = true
speed_m_s = 4.5
edits = [{ op = "heading", travel = "left" }, { op = "cycle", min_s = 0.55, max_s = 0.9, within = [0.3, 3.7] },
         { op = "stride", speed_m_s = 4.5, cadence = 4.0 }]
# cadence 4.0: at the design's 2.9 the steps had to grow 1.74x (men; 1.57 m) and the legs missed their targets by
# 66 mm on contact frames and 465 mm in flight; 4.0 steps/s gives 1.1 m steps
needs = [{ need = "Strafe left at 4.5 m/s", no = 4, layer = "full", speed_m_s = 4.5, rate = 1.0 },
         { need = "Sprint to the left at 7.0 m/s", no = 6, layer = "full", speed_m_s = 7.0, rate = 1.556 }]

[[clips]]
name = "Strafe_Right_Loop"
from = "Strafe_Left_Loop"
loop = true
speed_m_s = 4.5
edits = [{ op = "mirror" }]
needs = [{ need = "Strafe right at 4.5 m/s", no = 4, layer = "full", speed_m_s = 4.5, rate = 1.0 },
         { need = "Sprint to the right at 7.0 m/s", no = 6, layer = "full", speed_m_s = 7.0, rate = 1.556 }]

[[clips]]
name = "Sprint_Fwd_Loop"
source = "ual:Sprint_Loop"
loop = true
speed_m_s = 7.0
# The stride warp plants the feet at exactly 7.0 m/s (a retime by UAL's root-motion speed left them running 7.46 and
# 7.33 m/s: its feet run 6-7 % faster than its root). The rate keeps the reviewed cadence: 7.0 over the root-motion
# speed scaled to the body, 8.534 (men) and 9.178 m/s (women; anim-review rates, art #20).
edits = [{ op = "stride", speed_m_s = 7.0, rate = 0.8202, body = "men" },
         { op = "stride", speed_m_s = 7.0, rate = 0.7627, body = "women" }]
needs = [{ need = "Sprint forward at 7.0 m/s", no = 5, layer = "full", speed_m_s = 7.0, rate = 1.0 }]

