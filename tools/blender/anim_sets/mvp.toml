# ------------------------------------------------------------------------------------- pushing, the knife
[[clips]]
name = "Shove_Stumble"
source = "tm:shove-stumble"
loop = false
edits = [{ op = "trim", start_s = 0.37, end_s = 1.83 }, { op = "heading", facing = "start" },
         { op = "in_place", mode = "path" }, { op = "arm_offset", abduct_deg = 12 }]
# arm_offset: the hanging hands went into the thighs (6.8 cm men, 7.0 women); auto reached 0 at 12 degrees on the men
# and 4.5 cm at its limit of 12 on the women
needs = [{ need = "Being pushed: the stumble (the game moves the body)", no = 10, layer = "full" }]

[[clips]]
name = "Push_Upper_Loop"
source = "ual:Push_Loop"
loop = true
# auto found 0 degrees on the men (a 1.08 cm gap already) and 4.3 on the women (6.09 cm inside each other to a 1.28 cm
# gap); the women's hands do not reach the push's own legs (arm_offset auto: 0 degrees)
edits = [{ op = "hand_spacing", min_gap_cm = 1.0, deg = 4.3, body = "women" }]
needs = [{ need = "Pushing someone (upper body, low weight)", no = 11, layer = "upper" }]

[[clips]]
name = "Knife_Swing"
source = "pack:Sword_Slash"
loop = false
edits = [{ op = "retime", seconds = 0.45 }]
needs = [{ need = "Use the knife: the swing (upper body)", no = 13, layer = "upper" }]

# -------------------------------------------------------------------------------------------- items, the package
[[clips]]
name = "Carry_Upper_Loop"
source = "ual2:Walk_Carry_Loop"
loop = true
# a mean gap of 0.40 m between the hands (the 0.45 m package): auto found 28.71 degrees on the men and 29.8 on the women
# (with max_deg 35; 25 reached only 34.6 and 32.7 cm), from hands touching (0.7 and 1.1 cm inside each other)
edits = [{ op = "hand_spacing", gap_m = 0.40, at = "mean", deg = 28.7, max_deg = 35, body = "men" },
         { op = "hand_spacing", gap_m = 0.40, at = "mean", deg = 29.8, max_deg = 35, body = "women" }]
needs = [{ need = "Carry the package (upper body over the idle and the locomotion)", no = 15, layer = "upper" }]

[[clips]]
