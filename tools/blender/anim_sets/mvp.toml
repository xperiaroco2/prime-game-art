         { op = "cycle", min_s = 0.5, max_s = 1.0, within = [0.3, 3.7], max_raw_seam_deg = 30 },
         { op = "stride", speed_m_s = 4.5, cadence = 4.0 }, { op = "floor", mode = "lift" }]
# Measured (men / women): the raw run travels 5.5 degrees off straight back at 1.4 / 1.5 m/s (the old jog 0.31); its
# best 1 s cut runs 2.03 / 2.16 m/s at 2.0 steps/s with a raw seam of 24.1 / 28.0 degrees (the right upper arm).
# cadence 4.0 (one grid, men / women): at the jog's 2.8 the stride grew 1.59 / 1.50x (the old jog's 7-8x) and the legs
# missed their contacts by 74 / 83 mm; 3.2: 55 / 58; 3.6: 39 / 37; 4.0 gives 1.125 m steps, 1.13 / 1.07x and 25 / 16 mm.
# floor: the toes went 0.9 / 1.5 cm into the floor
