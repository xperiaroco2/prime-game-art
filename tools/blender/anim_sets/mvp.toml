# ----------------------------------------------------------------------------------------- downed and raised
[[clips]]
name = "Knockdown"
source = "ual:Death01"
loop = false
# The lift takes the impact out of the floor; the settle brings the lying frames (from 0.83 s after the retime, the
# frame after the impact) down onto it: Death01 lies 2.2 cm up, and the game holds its last frame as the downed pose.
edits = [{ op = "floor", mode = "lift", from_s = 1.2 }, { op = "trim", start_s = 0.0, end_s = 2.0 },
         { op = "retime", seconds = 1.35 }, { op = "floor", mode = "settle", from_s = 0.83 },
         { op = "idle_ends", at = "start", from_clip = "Idle_Loop" }]
needs = [{ need = "Knocked down: falls where they stand; its last pose is the downed pose", no = 21, layer = "full" }]

[[clips]]
name = "Crawl_Start"
source = "tm:rollup-to-all-fours"
loop = false
# The source floats its whole length (7.8 cm men, 13.7 cm women at best); the settle puts it on the floor. In the
# review it rolls over and ends on all fours, its hands a little short of the floor: exported as a flagged stopgap.
edits = [{ op = "floor", mode = "settle" }, { op = "trim", start_s = 0.4, end_s = 2.4 },
         { op = "heading", facing = "end" }, { op = "retime", seconds = 1.5 }]
needs = [{ need = "Crawl start: from lying on the back onto all fours (downed)", no = 23, layer = "full" }]
note = "stopgap: Meshy's roll-up floats and its hands stay short of the floor; settled; a re-roll candidate"

[[clips]]
name = "Crawl_Loop"
source = "tm:crawl"
loop = true
speed_m_s = 1.0
# A stopgap: the crawl does not repeat. Its best cut (0.93 s from 0.93 s, men) has a raw seam of 26 degrees in the
# left wrist (37-40 for longer cuts), over the 15 a good cut stays under, so the loop is closed over 26 degrees (re-roll).
edits = [{ op = "heading", travel = "forward" },
         { op = "cycle", min_s = 0.5, max_s = 1.5, within = [0.0, 2.2], max_raw_seam_deg = 30 },
         { op = "floor", mode = "settle" }, { op = "retime", speed_m_s = 1.0 }]
# settle: the cut floats, its lowest vertex 4.9 cm (men) and 3.0 cm (women) above the floor at best
needs = [{ need = "Crawl at 1.0 m/s (downed)", no = 24, layer = "full", speed_m_s = 1.0, rate = 1.0 }]
note = "stopgap: the cut's raw seam is 26 degrees (the left wrist); the crawl is a re-roll candidate"

[[clips]]
name = "Getup_Back"
source = "ual2:LayToIdle"
loop = false
# floor: the toes went 4.0 cm (men) and 4.1 cm (women) into the floor at 0.83 s. idle_ends matches the feet relative
# to Root (match = "root"): the whole body stands up 17 cm (men) and 27 cm (women) from where the idle stands, so the
# idle's feet in the set's frame would be that far from under it
edits = [{ op = "floor", mode = "lift" }, { op = "idle_ends", at = "end", from_clip = "Idle_Loop", match = "root" }]
needs = [{ need = "Stand up after a revive (from lying on the back)", no = 25, layer = "full" }]

[[clips]]
name = "Getup_Fours"
source = "tm:getup-from-all-fours"
loop = false
# The source floats 6 to 13 cm over the whole clip; after the settle it reads as a get-up from all fours in the
# review, lifting off 4.5 cm mid-rise: exported as a flagged stopgap.
edits = [{ op = "trim", start_s = 0.27, end_s = 2.0 }, { op = "heading", facing = "start" },
         { op = "in_place", mode = "path" }, { op = "retime", seconds = 1.5 }, { op = "floor", mode = "settle" }]
needs = [{ need = "Stand up after a revive (from all fours, after the crawl)", no = 25, layer = "full" }]
note = "stopgap: Meshy's get-up floats; settled, it lifts off 4.5 cm mid-rise; a re-roll candidate if the review rejects it"

[[clips]]
