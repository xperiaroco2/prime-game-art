[[clips]]
name = "Push_Upper_Loop"
source = "ual:Push_Loop"
loop = true
# auto found 0 degrees on the men (a 1.08 cm gap already) and 4.3 on the women (6.09 cm inside each other to a 1.28 cm
# gap); the women's hands do not reach the push's own legs (arm_offset auto: 0 degrees). lean: Push_Loop leans 46
# degrees with the hips, which the game's layer from Torso drops, so over an upright idle or jog the hands went up over
# the head (the review, art #33); 30 degrees on Torso put them in front of the face, a push. The full-body clip bends
# 76 degrees: play it as the upper layer only.
edits = [{ op = "hand_spacing", min_gap_cm = 1.0, deg = 4.3, body = "women" }, { op = "lean", deg = 30 }]
