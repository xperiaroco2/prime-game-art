         { op = "stride", speed_m_s = 4.5, cadence = 4.0 }]
# cadence 4.0: at the design's 2.9 the steps had to grow 1.74x (men; 1.57 m) and the legs missed their targets by
# 66 mm on contact frames and 465 mm in flight; 4.0 steps/s gives 1.1 m steps
needs = [{ need = "Strafe left at 4.5 m/s", no = 4, layer = "full", speed_m_s = 4.5, rate = 1.0 },
         { need = "Sprint to the left at 7.0 m/s", no = 6, layer = "full", speed_m_s = 7.0, rate = 1.556 }]

[[clips]]
name = "Strafe_Left_R2_Loop"
source = "tm:strafe-left-r2"
loop = true
export = false
speed_m_s = 4.5
edits = [{ op = "heading", travel = "left" },
         { op = "cycle", min_s = 0.55, max_s = 0.9, within = [0.3, 3.7], max_raw_seam_deg = 30 },
         { op = "stride", speed_m_s = 4.5, cadence = 4.0 }, { op = "floor", mode = "lift" }]
# Measured (men / women): no strafe. The re-roll runs turned towards its travel, 50 degrees left of forward (40 forward
# of sideways; the old strafe 17): after the heading its hips face 77.5 degrees and its head 63.7 off the aim (the old
# 19.5 and -15.9). Its best 0.7 s cut has a raw seam of 9.0 / 8.7 (the old 10.1), the stride grows 1.42 / 1.31x; the
# hands go 11.4 / 8.1 cm into the torso (the old 2.3 / 4.2); floor: the feet went 4.3 / 3.8 cm into it
note = "review only (art #66): batch 6's re-roll of the strafe, a candidate for Strafe_Left_Loop (Strafe_Right_Loop mirrors it)"

