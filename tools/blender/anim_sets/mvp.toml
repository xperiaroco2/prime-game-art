edits = [{ op = "floor", mode = "lift" }]  # the toes went 4.0 cm (men) and 4.1 cm (women) into the floor at 0.83 s
needs = [{ need = "Stand up after a revive (from lying on the back)", no = 25, layer = "full" }]

[[clips]]
