# The kneeling work does not repeat: its best cut of 1 s (2.9 to 3.9 s) has a raw seam of 27 degrees in the right
# forearm (0.5 to 0.6 s cuts: 23 to 29), so the loop is closed over 27 degrees; hand keys or a ping-pong loop later.
edits = [{ op = "floor", mode = "hips" },
         { op = "cycle", min_s = 1.0, max_s = 3.0, within = [1.0, 4.2], max_raw_seam_deg = 30 }]
needs = [{ need = "Raise a downed player: the work, looped for the 3 s", no = 26, layer = "full" }]
