         { op = "in_place", mode = "path" }, { op = "arm_offset", abduct_deg = 12 }]
# retime (art #65): 1.47 s to 0.7 s (21 frames, the nearest to 0.69 s at 30 fps), so the steps match the 2.25 m/s at
# which the game moves the pushed body. arm_offset: the hanging hands went into the thighs (7.0 cm men, 6.6 women after
# the retime); 12 degrees takes them out on the men and to 4.3 cm on one frame on the women (art #33: 4.5 on 4 frames)
