# The alien's clip edits (art #196, A1): the shared alien body's UAL1 clips (alien_body.py step 7) made to look right
# on the bare alien, applied by alien_char_build.py --clip-edits (tools/blender/alien_clip_edit.py, the keys there).
# Not an anim-set settings file: the human MVP set (mvp.toml) is untouched. Angles in degrees.
# Measured on body_v2/r5 (anim_bare/a1/before/reels.json): fists (the fingers' mean curl 66-77 degrees) in Idle,
# Walk, Jog, Sprint and Jump_Land; hand vertices near the trunk or legs on 22-25 of 25 frames in Idle and Walk; the
# lowest vertex 1.2 cm under the floor standing, 8 cm crouching, up to 12.7 cm in the jumps.

[defaults]  # A2: only for the clips listed below; an unlisted clip stays exactly as the body carries it
finger_cap_deg = 22.0  # a relaxed hand: each finger joint at most 22 degrees from straight (a fist is 70-90)
thumb_cap_deg = 18.0
floor = true

[clips.Idle_Loop]
abduct_deg = 6.0

[clips.Talk_Upper_Loop]
abduct_deg = 3.0

# A2: per clip hands; the run arms out so the hands stop crossing into the groin (the critic: Jog f9-12, Sprint f12,
# Walk f17-20)
[clips.Walk_Loop]
abduct_deg = 8.0
finger_cap_deg = 30.0  # a looser hand than the idle's, so walking differs from standing
thumb_cap_deg = 22.0

[clips.Jog_Fwd_Loop]
abduct_deg = 6.0
finger_cap_deg = 50.0  # loose fists, not flat paddles
thumb_cap_deg = 30.0

[clips.Sprint_Fwd_Loop]
abduct_deg = 6.0
finger_cap_deg = 50.0
thumb_cap_deg = 30.0
lean_deg = 4.0  # a slight forward lean

# A2: UAL1 and UAL2 have no other crouch or sneak; UAL's deep wide-kneed crouch read as a froggy squat on the thin
# alien (front knee by the chin, hands hanging below the knees, the head sunk): the hips up with the feet kept, the
# knees in, the hands swung forward to hover in front of the knees, the arms nearly in, the face up
[clips.Crouch_Idle_Loop]
hips_up_cm = 10.0
knees_in_deg = 12.0
abduct_deg = 2.0
swing_deg = 12.0
head_up_deg = 10.0

[clips.Crouch_Fwd_Loop]
hips_up_cm = 10.0
knees_in_deg = 12.0
abduct_deg = 2.0
swing_deg = 12.0
head_up_deg = 10.0

# A2: the in-place push-off's straight stand (the body does not rise in place, so it snapped to a rest pose with limp
# arms between the crouch and the tuck) is cut: the crouch goes into the tuck over 3 frames
[clips.Jump_Start]
cut_straight_deg = 75.0  # the knees bend 113 deg crouched, 43-69 at the push-off (frames 1-3), 86+ in the tuck
cut_gap = 3

[clips.Jump_Land]
abduct_deg = 4.0

[clips.Jump_Air_Loop]
floor = false  # airborne: the game holds it off the floor
