<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alien pilot: colour slots (art #196)</title>
<style>
  body { margin: 0; background: #1d1e21; color: #ddd; font: 14px system-ui, sans-serif; display: flex; height: 100vh; }
  #view { flex: 1; } #panel { width: 300px; padding: 12px; overflow-y: auto; background: #26272b; }
  .row { margin: 8px 0; } label { display: inline-block; width: 70px; } button { margin: 2px; }
  .sw { display: inline-block; width: 18px; height: 18px; border: 1px solid #000; vertical-align: middle; }
  code { color: #9cf; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <div class="row"><b>Presets</b><div id="presets"></div></div>
  <div class="row"><label>skin</label><input type="checkbox" id="skin_on"><input type="color" id="skin" value="#e39c8c"> <span class="sw" id="skin_g"></span></div>
  <div class="row"><label>lips</label><input type="checkbox" id="lips_on"><input type="color" id="lips" value="#a2575a"> <span class="sw" id="lips_g"></span></div>
  <div class="row"><label>details</label><input type="checkbox" id="detail_on"><input type="color" id="detail" value="#a2575a"> <span class="sw" id="detail_g"></span></div>
  <div class="row"><label>gills</label><select id="gills"><option value="gradient">root to tip (details)</option><option value="whole">whole (details)</option><option value="skin">on the skin</option></select></div>
  <div class="row">Unticked: the build's own paint. The swatch after each picker is the colour after the guard rails.</div>
  <div class="row" id="out"></div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { makeColours, PRESETS, hexs, hexc } from "./colour.js";

const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.toneMapping = THREE.AgXToneMapping;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x737578);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(1.5, 2, 2.5); scene.add(key);
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
camera.position.set(0, 0.3, 3.2);
const controls = new OrbitControls(camera, renderer.domElement);
const heads = await (await fetch("heads.json")).json();
const cols = [];
let x = -0.65;
for (const name of ["axolotl", "chameleon"]) {
  const gltf = await new GLTFLoader().loadAsync(`${name}_static.glb`);
  const box = new THREE.Box3().setFromObject(gltf.scene), size = box.getSize(new THREE.Vector3());
  gltf.scene.scale.setScalar(1.1 / size.y);
  gltf.scene.position.set(x, -box.getCenter(new THREE.Vector3()).y * 1.1 / size.y, 0);
  x += 1.3;
  scene.add(gltf.scene);
  cols.push(await makeColours(gltf.scene, `${name}_accent.png`, `${name}_mask.png`, heads[name]));
}
const $ = (id) => document.getElementById(id);
function picks() {
  const p = {};
  if ($("skin_on").checked) p.skin = $("skin").value;
  if ($("lips_on").checked) p.lips = $("lips").value;
  if ($("detail_on").checked) { p.detail = $("detail").value; p.detailOn = true; }
  p.gills = $("gills").value;
  return p;
}
function apply() {
  const p = picks();
  let u;
  for (const c of cols) u = c.set(p);
  for (const [s, k] of [["skin", "skin_color"], ["lips", "lip_color"], ["detail", "detail_color"]]) $(`${s}_g`).style.background = hexs(u[k]);
  $("out").innerHTML = `<code>${JSON.stringify(p)}</code>`;
}
for (const id of ["skin_on", "lips_on", "detail_on", "skin", "lips", "detail", "gills"]) $(id).addEventListener("input", apply);
PRESETS.forEach(([name, p]) => {
  const b = document.createElement("button");
  b.textContent = name;
  b.onclick = () => {
    $("skin_on").checked = "skin" in p; $("lips_on").checked = "lips" in p; $("detail_on").checked = !!p.detailOn;
    if (p.skin) $("skin").value = p.skin; if (p.lips) $("lips").value = p.lips; if (p.detail) $("detail").value = p.detail;
    apply();
  };
  $("presets").appendChild(b);
});
apply();
function resize() { renderer.setSize(view.clientWidth, view.clientHeight); camera.aspect = view.clientWidth / view.clientHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
