  "contract/*", "tools/godot/*", "tools/blender/contract_io.py", "tools/blender/check_model.py",
  "tools/blender/rename_bones.py", "tools/blender/make_contract_fixture.py",
  "tools/runner/commands/_contract.py", "tools/runner/commands/contract.py", "tools/runner/commands/check.py",
  "tools/runner/commands/rename_bones.py", "tools/runner/commands/_checks.py", "tools/runner/commands/_humanoid.py",
]
tests = ["test_contract_*", "test_godot_check*", "test_export_*"]

[area.export]
