  "layouts/house/*", "kits/*", "props/*",
  "tools/runner/house_*.py", "tools/runner/commands/_house_*.py", "tools/runner/commands/house.py",
  "tools/runner/commands/attic.py", "tools/runner/commands/garden.py", "tools/runner/commands/outdoor.py",
  "tools/runner/commands/zones.py", "tools/runner/commands/kit.py", "tools/runner/commands/_kit.py",
  "tools/runner/commands/props.py", "tools/runner/commands/_props.py", "tools/runner/commands/props_library.py",
  "tools/blender/kit_*", "tools/blender/prop_*", "tools/blender/props_*", "tools/blender/plant_*",
  "godot/house/*", "godot/kit/*", "godot/props/*", "godot/garden/*", "godot/outdoor/*",
