[area.alien_loco]
sources = ["tools/blender/alien_loco.py", "tools/blender/alien_loco_math.py", "tools/blender/anim_sets/alien_loco.toml", "godot/alien/treadmill_reels.gd"]  # the alien's locomotion set and treadmill reels (#196, option A step 3); before light's alien_*
tests = ["test_alien_loco_*", "test_alien_stride_*", "test_alien_headlook_*", "test_alien_poses_*"]  # F3: the head-look check runs on the loco build; the poses import alien_loco (COPY, _export)

[area.alien_poses]
sources = ["tools/blender/alien_poses.py", "tools/blender/alien_pose_math.py", "tools/blender/anim_sets/alien_poses.toml", "tools/blender/alien_poses_run.py", "godot/alien/pose_layers.gd", "godot/alien/pose_layers_check.gd", "godot/alien/pose_shots.gd"]  # the photo poses on the alien (#196); before light's alien_*
tests = ["test_alien_poses_*"]

[area.alien_hands]
sources = ["tools/blender/alien_hands.py", "tools/blender/alien_hands_math.py", "tools/blender/anim_sets/alien_hands.toml", "tools/blender/alien_grip_solve.py", "tools/blender/body_dims/hand_grips.toml"]  # the loco clips' hand shapes (#196, Hands H1); before light's alien_*
