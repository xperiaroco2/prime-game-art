[area.alien_stride]
sources = ["tools/blender/alien_stride.py", "tools/blender/alien_stride_math.py", "tools/blender/anim_edit_math.py", "tools/blender/alien_clip_edit.py"]  # the alien locomotion clip tool (#196, option A); before light's alien_*
