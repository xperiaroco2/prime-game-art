[area.alien_hand_mesh]
sources = ["tools/blender/alien_hand_geom.py", "tools/blender/alien_hand_run.py", "tools/blender/alien_hand_mesh.py", "tools/blender/body_dims/hand_dims.toml", "tools/blender/alien_finger_geom.py", "tools/blender/alien_finger_run.py"]  # the hand and wrist rebuilt in place (#196, Hands H1b); before light's alien_*
