[area.alien_headlook]
sources = ["godot/alien/head_look.gd", "godot/alien/head_look_check.gd", "godot/alien/head_look_shots.gd", "tools/blender/alien_headlook_run.py"]  # the head follows the aim (#196, H1, F1); before light's alien_*
