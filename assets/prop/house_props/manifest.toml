# Written for #118 from the raw builds of 2026-10-10, updated for #147 and #150 (the living room; since #150 every library file from props/library/v2); a rebuild changes the hashes below (`manifest-check --hashes` finds it).
# #152: the sofa and armchairs rebuilt in cream into props/library/v3 (a copy of v2); every library file from v3.
# #153: the dining room built into props/library/v4 (a copy of v3) and props/task/v2 (a copy of v1); every file from them.
# #156: the hallway built into props/library/v5 (a copy of v4); every library file from it.
# #158: the WC, the pantry and the stairs built into props/library/v6 (a copy of v5); every library file from it.
# #162: the landing and the bathroom built into props/library/v7 (a copy of v6).
# #162 round 2: the landing runner rebuilt into props/library/v8 (a copy of v7);
# #164: the bedroom and the guest room built into props/library/v9 (a copy of v8);
# #166: the kids' room and the study built into props/library/v10 (a copy of v9);
# #168: the attic built into props/library/v11 (a copy of v10);
# #170: the basement's working rooms built into props/library/v12 (a copy of v11); every library file from it.
id = "house_props"
kind = "prop"
slot = ""
title = "The House's props: the dressing library, the task-station props and the zone props"
notes = "Built by `props-library --build` (props/library.toml: 289 props, 264 procedural, 25 re-painted from CC0 packs), `props` (props/tasks.toml) and the zones (layouts/house/outdoor/zones). Own work, except each file with a source: a CC0 pack model re-scaled and re-painted. All use the kit's texture set (house_kit), which ships once. The [[files]] list all 332 props of the raw build (300 before #170, 286 before #168, 272 before #166, 256 before #164, 246 before #162, 225 before #158, 210 before #156, 198 before #153, 174 before #147's two backsplash runs, 176 before #150's six detail props, 182 before #150's round 2) and the fine pack's 15 files (#147, #150); only the props a committed package needs are committed under export/, the rest stay raw until their package. P2 committed 70 props (#124; 72 since #147 added backsplash_l and backsplash_r: 68 library/, 4 task/), approved by the engineer on 2026-10-11 in PR #125. P3 and P5 committed 34 more (#126), approved by the engineer on 2026-10-11 in PR #127 (the set format has no per-file approval; a later package's approval moves the fields below to its PR, which they now name: P7's, PR #131): library/ cage_lamp, desk, filing_cabinet, fuel_barrel, industrial_pendant, jerrycan, metal_shelving, office_chair, old_bicycle, old_wardrobe, pallet, pipe_run, rolled_carpet, safelight_red, sheeted_furniture, standing_mirror, tool_wall, toolbox_cart, trunk; task/ boiler, bun_shelf, cable_drum, car_parts_shelf, delivery_box_stack, enlarger, generator, meat_freezer, photo_board, pump, switchboard, tray_table, wall_switch, water_tank, wine_rack. P4 committed 10 more (#129), approved by the engineer on 2026-10-12 in PR #130: library/ balcony_chair, bathtub, bunk_bed, double_bed, single_bed, toy_spill, wardrobe; task/ computer_set, photo_printer, toy_chest. P7 (#128) committed 32 more, approved by the engineer on 2026-10-12 in PR #131: library/ birdbath, firewood_stack, garden_bench, garden_post_lamp, greenhouse_shelf, hose_reel, hydrant, mailbox, parked_car, path_light, picnic_table, potting_bench, stepping_stone, streetlight, watering_can, wheelbarrow; task/ bbq_grill, garden_dropoff, herb_bed, herb_board, music_speaker, pose_screen, utility_pole; zones/ bean_bag, cooler_box, deckchair, fire_pit, lantern, photo_backdrop, string_lights_gazebo, string_lights_set, tripod_camera. The game folder house_props/ is flat: a basename two sources share ships from the first source in prop_dirs (task, library), then zones, as <id>.glb, from any other as <id>_<source>.glb (house_export_plot.game_name; P7 ships bean_bag_zones.glb, birdbath_library.glb, cooler_box_zones.glb, deckchair_zones.glb, fire_pit_zones.glb, lantern_zones.glb, photo_backdrop_zones.glb, tripod_camera_zones.glb). #147 rebuilt the kitchen in C2-white (the world look, #143): fridge, stove, kitchen_counter, kitchen_sink, kitchen_upper, task/ assembly_island and order_board re-built (now all procedural, own work), library/ backsplash_l and backsplash_r added (148 props committed in all: 70 + 34 + 10 + 32 + 2), and the fine texture pack shipped: fine/high/ (1024 px) and fine/low/ (512 px) fine_d.png, fine_n0.png, fine_n1.png, made from 4 ambientCG CC0 maps (Wood092, Wood049, Concrete034, Tiles107; props/library.toml [fine]), with prop_fine.gdshader and prop_fine_high.tres / prop_fine_low.tres (the kit_fine material, P2's v4 export); approved by the engineer on 2026-10-13 in PR #149. #150 rebuilt the living room in the world look: library/ armchair, bookcase, coffee_table, dresser, fireplace, rug, sideboard, small_table, sofa and tv_cabinet re-built (now all procedural, own work; armchair, small_table, sofa and tv_cabinet were re-painted CC0 pack models before) and six detail-layer props added: library/ candle_pair, living_tray, magazine_fan, mantel_clock, standing_frame, throw_basket (154 props committed in all); the fine pack grew to eight texture slots: fine/high/ and fine/low/ fine_d1.png (slots 4-7), fine_n2.png and fine_n3.png beside fine_d, fine_n0 and fine_n1, made from 3 more ambientCG CC0 maps (Fabric036, Fabric061, Carpet016), and prop_fine.gdshader and its two materials read them; the 16 props and the fine files come from library v2 (props/library/v2: v1 with #150's build laid over it; layouts/house/house.toml prop_dirs and fine_dir). #150's round 2 re-coloured sofa and armchair (a warm terracotta fabric) and added 16 more living-room props (170 props committed in all): the wall art art_abstract, art_city and art_burger (base layer) and art_photos and art_score (detail layer), drawn procedurally (own work), and the detail-layer props board_games, candle_jars, coffee_books, deco_bowl, deco_vase, floor_plant (its pot the only collider), game_console, laptop, side_lamp, slippers and table_plant. Approved by the engineer on 2026-10-14 in PR #151. Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #154. #153 rebuilt the dining room in the world look: library/ dining_chair (now procedural, own work; it was a re-painted CC0 KayKit model) and chandelier (a three-shade pendant) and task/ dining_table (an oiled-oak table on the fine pack) re-built, and 12 props added (182 props committed in all): the wall art art_still_life (base layer), art_delivery and art_gazebo (detail layer), drawn procedurally (own work), the display_cabinet, the dining_rug and the detail-layer props bottle_rack, fruit_dish, homework, mail_stack, place_setting, serving_board and tulip_vase; every library file now from library v4 (props/library/v4: v3 with #153's build laid over it) and every task file from task v2 (v1 with the dining table rebuilt). Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #155. #156 dressed the hallway in the world look: 15 props added (196 props committed in all: library/doormat.glb, which no package uses since the hallway's hall_doormat replaced it, is no longer committed), all procedural, own work: the base-layer hall_console (an oak console), hall_mirror (an arched mirror; its pane the new mirror_glass paint), coat_hooks (a hook rail with coats and a scarf), hall_bench (with a seat pad and a shoe shelf), hall_runner (a navy runner), umbrella_stand, gallery_wall (six frames hung salon-style) and the wall art art_blueprint (the generator's blueprint), and the detail-layer hall_doormat, key_bowl, parcels, shoe_pairs, sports_bag, wall_calendar and photo_row (a family photo row), drawn procedurally; no other prop changed, every library file now from library v5 (props/library/v5: v4 with #156's build laid over it). Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #157. #158 dressed the ground floor's small rooms (the WC, the pantry and the stairs) in the world look: 21 props added (217 props committed in all), all procedural, own work: the WC's base-layer wc_toilet (a close-coupled toilet), wc_vanity (an oak vanity with a sit-on basin), mirror_cabinet, washer, tumble_dryer, wc_tiles (a tiled lower wall) and the wall art art_wash (a washing-day joke print), and the detail-layer towel_ring, roll_holder, pedal_bin, toilet_brush and reed_diffuser; the pantry's pantry_shelf and pantry_shelf_buns (shelving units stocked with jars, tins, boxes, bottles and, on the second, the burger kitchen's buns), veg_rack (baskets of potatoes and onions), drink_crates, step_stool and broom_set; the stairs' stair_runner (one per half flight), stair_gallery (frames going up the wall) and landing_plant; no other prop changed, every library file now from library v6 (props/library/v6: v5 with #158's build laid over it). Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #161. #162 dressed the upper floor's landing and bathroom in the world look: 10 props added (227 props committed in all), all procedural, own work: the bathroom's room-class bath_tub (a built-in bath with a glass shower screen), bath_vanity (the WC's oak vanity at 0.9 m), bath_shelf (open shelves of bottles), bath_tiles, bath_tiles_short and bath_tiles_shower (tiled lower walls and the shower corner, base layer), and its dressing towel_rail (a heated ladder rail with towels), bath_mat and the wall art art_bubbles (a bath-time joke print); the landing's landing_runner (an 8.5 m terracotta runner); no other prop changed, every library file now from library v8 (props/library/v8: v7, v6 with #162's build laid over it, with the landing_runner rebuilt in round 2: terracotta wool, a deep rust border of the same tone and a soft square motif instead of the slate field and cream lines). Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #163. #164 dressed the upper floor's bedroom and guest room in the world look: 16 props added and 3 no longer committed (240 props committed in all: library/double_bed.glb, single_bed.glb and nightstand.glb, which no package uses since the new beds and bedside tables replaced them, stay in the list and raw), all procedural, own work: the bedroom's room-class bedroom_bed (a double bed: an oak frame, a padded linen headboard, white bedding, a cream duvet, scatter cushions and a rust throw), bedroom_wardrobe (three white doors, a mirror door in the middle), bed_bench (an oak bench at the bed's foot), the dressing dresser_mirror (an arched brass-framed mirror), bedroom_rug (cream wool, a terracotta border) and the detail-layer dresser_set (perfume bottles on a brass tray, a jewellery dish, a hairbrush); the guest room's guest_bed (a made-up single bed), guest_wardrobe (two white doors), clothes_rail (shirts and a jacket on hangers, shoes on an oak shelf), guest_rug (sage, a cream border), suitcase (the guest's navy hard-shell case with a burger sticker), storage_boxes (a tidy stack of labelled boxes) and the detail-layer towel_stack (folded guest towels); both rooms' bedside_table (oak, two drawers), curtains (floor-length cream curtains on a black rod) and the detail-layer bedside_set (a glass of water, a phone on its charging cable, a paperback); no other prop changed, every library file now from library v9 (props/library/v9: v8 with #164's build laid over it). Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #165. #166 dressed the upper floor's kids' room and study in the world look: 14 props added and 3 no longer committed (251 props committed in all: library/bunk_bed.glb, wardrobe.glb and laundry_pile.glb, which no package places since the kids' room's new bed and wardrobe replaced them, stay in the list and raw), all procedural, own work: the kids' room's room-class kids_bed (a single oak bed with a starry navy duvet and a folded yellow blanket), kids_wardrobe (a white two-door wardrobe), kids_bookcase (white shelves of books and toys), toy_cubby (a low cube unit with coloured bins and books), play_rug (a teal play mat with a yellow road border), the wall art art_rocket (a rocket poster), art_dino (a dinosaur print) and art_drawing (a child's burger drawing), and the detail-layer toy_set (a toy rocket, a truck and a ball); the study's room-class study_bookcase (an oak bookcase full of books over a cupboard), study_rug (a terracotta rug with a cream border), pin_board (a cork board with the generator's blueprint and a delivery schedule), monitor_set (a monitor, keyboard, mouse and a mug) and the wall art art_certificate (a framed certificate); no other prop changed, every library file now from library v10 (props/library/v10: v9 with #166's build laid over it). Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #167. #168 dressed the attic as a well-kept family attic: 14 props added (265 committed in all), all procedural, own work: attic_shelving and attic_shelving_b (steel shelving loaded with labelled boxes and crates), storage_box (a labelled cardboard box) and storage_crate (a lidded plastic crate), sheeted_sofa and sheeted_dresser (furniture under dust sheets), leaning_frames (framed pictures leaning on the knee wall), holiday_decor (a boxed tree and garlands), rocking_horse and mannequin (a dress form; both hero-class skips before), sports_kit, and the game's own burger_sign (a burger stall's sign), delivery_bag (a retired delivery bag) and generator_part; old_wardrobe (a present-day white wardrobe), sheeted_furniture, old_bicycle (a city bike) and trunk rebuilt in the present-day look (new bytes, same names; only the attic places them); no other prop changed, every library file now from library v11 (props/library/v11: v10 with #168's build laid over it). Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #169. #170 dressed the basement's storage room, darkroom and corridor as clean, well-organised working rooms: 32 props added and fluorescent_tube (a library prop listed before, now placed in the storage instead of its bare bulbs) committed (298 committed in all), all procedural, own work: the storage's store_shelving and store_shelving_b (steel shelving with labelled crates, boxes and the burger kitchen's stock), bread_rack (the buns' rack), pallet_jack, loaded_pallet (a wrapped delivery pallet), store_workbench, step_ladder, hand_trolley (a delivery trolley), the floor markings floor_bay, floor_lane and floor_hatch, the signs aisle_sign_1 to aisle_sign_3, sign_staff, sign_buns, sign_meat, sign_wine, sign_parts, sign_deliveries and sign_way_out, and the detail-layer clipboard (delivery notes); the darkroom's lab_sink, chem_shelf (chemicals and paper boxes), light_table, print_line and print_line_b (drying lines of clipped party and gazebo prints) and sign_darkroom; the corridor's rubber_runner (rubber matting), work_hooks (work jackets on hooks), fire_extinguisher and fuse_box; no other prop changed, every library file now from library v12 (props/library/v12: v11 with #170's build laid over it). Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #171, which the approval fields name."
