# Written for #118 from the raw builds of 2026-10-10, updated for #147 and #150 (the living room; since #150 every library file from props/library/v2); a rebuild changes the hashes below (`manifest-check --hashes` finds it).
# #152: the sofa and armchairs rebuilt in cream into props/library/v3 (a copy of v2); every library file from v3.
# #153: the dining room built into props/library/v4 (a copy of v3) and props/task/v2 (a copy of v1); every file from them.
# #156: the hallway built into props/library/v5 (a copy of v4); every library file from it.
id = "house_props"
kind = "prop"
slot = ""
title = "The House's props: the dressing library, the task-station props and the zone props"
notes = "Built by `props-library --build` (props/library.toml: 167 props, 142 procedural, 25 re-painted from CC0 packs), `props` (props/tasks.toml) and the zones (layouts/house/outdoor/zones). Own work, except each file with a source: a CC0 pack model re-scaled and re-painted. All use the kit's texture set (house_kit), which ships once. The [[files]] list all 210 props of the raw build (198 before #153, 174 before #147's two backsplash runs, 176 before #150's six detail props, 182 before #150's round 2) and the fine pack's 15 files (#147, #150); only the props a committed package needs are committed under export/, the rest stay raw until their package. P2 committed 70 props (#124; 72 since #147 added backsplash_l and backsplash_r: 68 library/, 4 task/), approved by the engineer on 2026-10-11 in PR #125. P3 and P5 committed 34 more (#126), approved by the engineer on 2026-10-11 in PR #127 (the set format has no per-file approval; a later package's approval moves the fields below to its PR, which they now name: P7's, PR #131): library/ cage_lamp, desk, filing_cabinet, fuel_barrel, industrial_pendant, jerrycan, metal_shelving, office_chair, old_bicycle, old_wardrobe, pallet, pipe_run, rolled_carpet, safelight_red, sheeted_furniture, standing_mirror, tool_wall, toolbox_cart, trunk; task/ boiler, bun_shelf, cable_drum, car_parts_shelf, delivery_box_stack, enlarger, generator, meat_freezer, photo_board, pump, switchboard, tray_table, wall_switch, water_tank, wine_rack. P4 committed 10 more (#129), approved by the engineer on 2026-10-12 in PR #130: library/ balcony_chair, bathtub, bunk_bed, double_bed, single_bed, toy_spill, wardrobe; task/ computer_set, photo_printer, toy_chest. P7 (#128) committed 32 more, approved by the engineer on 2026-10-12 in PR #131: library/ birdbath, firewood_stack, garden_bench, garden_post_lamp, greenhouse_shelf, hose_reel, hydrant, mailbox, parked_car, path_light, picnic_table, potting_bench, stepping_stone, streetlight, watering_can, wheelbarrow; task/ bbq_grill, garden_dropoff, herb_bed, herb_board, music_speaker, pose_screen, utility_pole; zones/ bean_bag, cooler_box, deckchair, fire_pit, lantern, photo_backdrop, string_lights_gazebo, string_lights_set, tripod_camera. The game folder house_props/ is flat: a basename two sources share ships from the first source in prop_dirs (task, library), then zones, as <id>.glb, from any other as <id>_<source>.glb (house_export_plot.game_name; P7 ships bean_bag_zones.glb, birdbath_library.glb, cooler_box_zones.glb, deckchair_zones.glb, fire_pit_zones.glb, lantern_zones.glb, photo_backdrop_zones.glb, tripod_camera_zones.glb). #147 rebuilt the kitchen in C2-white (the world look, #143): fridge, stove, kitchen_counter, kitchen_sink, kitchen_upper, task/ assembly_island and order_board re-built (now all procedural, own work), library/ backsplash_l and backsplash_r added (148 props committed in all: 70 + 34 + 10 + 32 + 2), and the fine texture pack shipped: fine/high/ (1024 px) and fine/low/ (512 px) fine_d.png, fine_n0.png, fine_n1.png, made from 4 ambientCG CC0 maps (Wood092, Wood049, Concrete034, Tiles107; props/library.toml [fine]), with prop_fine.gdshader and prop_fine_high.tres / prop_fine_low.tres (the kit_fine material, P2's v4 export); approved by the engineer on 2026-10-13 in PR #149. #150 rebuilt the living room in the world look: library/ armchair, bookcase, coffee_table, dresser, fireplace, rug, sideboard, small_table, sofa and tv_cabinet re-built (now all procedural, own work; armchair, small_table, sofa and tv_cabinet were re-painted CC0 pack models before) and six detail-layer props added: library/ candle_pair, living_tray, magazine_fan, mantel_clock, standing_frame, throw_basket (154 props committed in all); the fine pack grew to eight texture slots: fine/high/ and fine/low/ fine_d1.png (slots 4-7), fine_n2.png and fine_n3.png beside fine_d, fine_n0 and fine_n1, made from 3 more ambientCG CC0 maps (Fabric036, Fabric061, Carpet016), and prop_fine.gdshader and its two materials read them; the 16 props and the fine files come from library v2 (props/library/v2: v1 with #150's build laid over it; layouts/house/house.toml prop_dirs and fine_dir). #150's round 2 re-coloured sofa and armchair (a warm terracotta fabric) and added 16 more living-room props (170 props committed in all): the wall art art_abstract, art_city and art_burger (base layer) and art_photos and art_score (detail layer), drawn procedurally (own work), and the detail-layer props board_games, candle_jars, coffee_books, deco_bowl, deco_vase, floor_plant (its pot the only collider), game_console, laptop, side_lamp, slippers and table_plant. Approved by the engineer on 2026-10-14 in PR #151. Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #154. #153 rebuilt the dining room in the world look: library/ dining_chair (now procedural, own work; it was a re-painted CC0 KayKit model) and chandelier (a three-shade pendant) and task/ dining_table (an oiled-oak table on the fine pack) re-built, and 12 props added (182 props committed in all): the wall art art_still_life (base layer), art_delivery and art_gazebo (detail layer), drawn procedurally (own work), the display_cabinet, the dining_rug and the detail-layer props bottle_rack, fruit_dish, homework, mail_stack, place_setting, serving_board and tulip_vase; every library file now from library v4 (props/library/v4: v3 with #153's build laid over it) and every task file from task v2 (v1 with the dining table rebuilt). Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #155. #156 dressed the hallway in the world look: 14 props added (196 props committed in all), all procedural, own work: the base-layer hall_console (an oak console), hall_mirror (an arched mirror; its pane the new mirror_glass paint), coat_hooks (a hook rail with coats and a scarf), hall_bench (with a seat pad and a shoe shelf), hall_runner (a navy runner), umbrella_stand and the wall art art_blueprint (the generator's blueprint), and the detail-layer hall_doormat, key_bowl, parcels, shoe_pairs, sports_bag, wall_calendar and photo_row (a family photo row), drawn procedurally; no other prop changed, every library file now from library v5 (props/library/v5: v4 with #156's build laid over it). Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #PRNUM, which the approval fields name.
