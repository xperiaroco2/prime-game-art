notes = "Way B (art#263 comments 6363433518 and 6374327838; builder steps vents-b1, vents-b2 (the look polish: the well lights) vents-b3 (the swept wedge standing open, the heavier frame, the patinated bronze) and vents-b4 (the vent 8 cm into the wall, the frame's sides run back to the wall, the scanner at 1.20 m with the column's top dropped, the hand redrawn as one even stroke round a smooth silhouette)): the body (frame, copper hinge caps, column, light bar, scanner, lamp, feet) and the one gill blade built in headless Blender by tools/blender/ship_vent_b.py as flat-faceted chamfered solids from our own OpenAI concept views (batch 2026-10-23-ship-vent-final; the shapes were drawn after them by hand in code, no image or mesh of them is in the files) and the traced numbers; way A's Meshy body only as the to-scale guide. tools/blender/ship_interior_vent.py places the blade seven times and adds the marker, glows, light pieces and colliders into the station_vent_e and station_vent_w pieces. lights.json (the light pieces' places) is computed by ship_vent_b.py from this body's own geometry in the format way A measured on its Meshy body; the shapes follow our OpenAI concept images, but no AI output (image or mesh) is in these files, hence own-work and ai_generated false. Not approved yet."
