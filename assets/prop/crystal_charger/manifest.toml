notes = "The crystal charger, one in each lens room's alcove on the aft wall (renewer_e, renewer_w): a faceted pedestal (lens room C, 2026-10-28: the back u +-44 on the alcove's back panel at d 10, chamfers to the front face u +-22 at d 68, a graphite plinth h 0..10 with a toe and a bevelled top, bronze plates on a graphite core in three courses with a recessed lit band at h 46..52 and a frieze from h 66 (step 3, after the lens room's a_power.jpg), the frieze's short cyan windows and bronze brackets on the four front corners (step 4), a deck slab h 86..99.1 overhanging it), the crystal's axis 38 cm out, the slot at 95.7 cm, the fixed outer prongs to 142 cm (antennas-2: stacks of 18 chamfered bronze plates with even cyan-lit gaps along a smooth arc inward, the last three plates tapering to a lit slit across each tip toward the crystal (antennas-2b t2); the inner prongs the same family under slim wedge plate caps with a lit slot, the tip electrode half sunk in a socket), the start button at 75.9 cm; leaves: the carrier cup under the crystal (rises 6 cm, spins; crystal_anchor), the track ring with the inner prongs (spins), the button (presses 1 cm). 39,896 triangles, front +Z, origin on the floor at the spot's vertex. The head from the engineer's pick of 2026-10-25 and its drawing in cm (prime-game-design commit a53ce6f, ideas/ship-components/stations-final: charger-legs.jpg, an AI concept used only as a reference, and charger-drawing/), the pedestal from the lens room's drawing (prime-game-design commit 7f335c2, ideas/ship-components/lens-room: c_lounge.jpg, an AI concept used only as a reference, and drawing/); copied to the raw folder. The antennas from the engineer's pick of 2026-10-28, concept b_fins (2026-10-28-ship-charger-antennas/b_fins/image-0.png, an OpenAI image edit of the lens3 render, batches/2026-10-28-ship-charger-antennas.toml, used only as a reference). Built from code in headless Blender (tools/blender/charger_build.py from charger_dims.toml): no part of the model was generated or downloaded. Approval: pending; the antennas changed (the plate stacks) after the 2026-10-28 approval; antennas round 2 (the smooth arc, the tapering tip plates, the wedge caps) awaits the engineer's look (art#263)."
