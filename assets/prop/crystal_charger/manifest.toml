notes = "The crystal charger, one in each lens room's alcove on the aft wall (renewer_e, renewer_w): a faceted pedestal (lens room C, 2026-10-28: the back u +-44 on the alcove's back panel at d 10, chamfers to the front face u +-22 at d 68, a graphite plinth h 0..10, bronze plates on a graphite core, a deck slab h 86..99.1 overhanging it), the crystal's axis 38 cm out, the slot at 95.7 cm, the fixed outer prongs to 139.7 cm, the start button at 75.9 cm; leaves: the carrier cup under the crystal (rises 6 cm, spins; crystal_anchor), the track ring with the inner prongs (spins), the button (presses 1 cm). 29,080 triangles, front +Z, origin on the floor at the spot's vertex. The head from the engineer's pick of 2026-10-25 and its drawing in cm (prime-game-design commit a53ce6f, ideas/ship-components/stations-final: charger-legs.jpg, an AI concept used only as a reference, and charger-drawing/), the pedestal from the lens room's drawing (prime-game-design commit 7f335c2, ideas/ship-components/lens-room: c_lounge.jpg, an AI concept used only as a reference, and drawing/); copied to the raw folder. Built from code in headless Blender (tools/blender/charger_build.py from charger_dims.toml): no part of the model was generated or downloaded. Approval: pending; the new pedestal waits for the engineer's look yes (art#263)."
