title = "The ship: the empty metal manta at night, its pieces, scene and station spots"
notes = "The empty ship of art #263 (layouts/ship, built by tools/blender/ship_build.py) as the game's package: 188 piece GLBs, the shared metal and night sky shaders with their .tres, levels/ship/ship.tscn (1055 placements, the night lights, environment and probes, Stations with 11 spots, Markers/Spawn) and package.json. The throat walls carry the gill set (art #263, PR #357). Ship/Nose (art #263) holds the jaw nose (jaw_lower, the ramp; jaw_upper; the fixed jaw_root), saved open, and Nose/AnimationPlayer with the clips open, close (2.5 s each) and RESET (open); the lobby plays close. Ship/Clearing (art #356, the lobby) holds the clearing: Clearing/Pieces (534 placements of 34 pieces: ground, pines, bushes, ferns, moss, litter, logs, rocks, ground lamps, party string), Clearing/Lights (lamp groups fill, out, party, pool and the glow cells only they light) and Clearing/Ground (the world boundary); the lobby frees the node. Built from code in headless Blender and Godot; no part generated or downloaded. Own work. HANDOFF.md for the game track."
