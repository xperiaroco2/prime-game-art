# Written for #129 and for #150 (the rebuilt living-room props, the Detail node) from the P4 export of 2026-10-13 (`house --export <raw>/review/house/150b/export/p4 --package 4`, round 2: only package.json changed, the warm armchair's sha256); a rebuild
# changes the hashes below (`manifest-check --hashes` finds it). The game's paths: levels/house/rooms/<name>.
# #152 (the engineer's paints of 2026-10-14): re-exported as P4 into <raw>/review/house/152/export/p4 (`house --export ... --package 4`); the files it changed point there.
# #158 (the WC's and pantry's paints): only package.json changed, the shared kit_set.tres's new hash; this package's scenes are unchanged.
# #162 (the landing and the bathroom): re-exported as P4 into <raw>/review/house/162/export/p4 (`house --export ... --package 4`); bathroom.tscn points there.
# #162 round 2 (the landing's sitting area, the terracotta runner): re-exported into <raw>/review/house/162/export/p4b; landing.tscn and package.json point there.
# #164 (the bedroom and the guest room): re-exported as P4 into <raw>/review/house/164/export/p4 (`house --export ... --package 4`); bedroom.tscn, guest_room.tscn and package.json point there.
# #166 (the kids' room and the study): re-exported as P4 into <raw>/review/house/166/export/p4 (`house --export ... --package 4`); kids_room.tscn, study.tscn, bedroom.tscn (its pendant moved off the Name label) and package.json point there.
# #168 (the attic's paint): only package.json changed, the shared kit_set.tres's new hash; this package's scenes are unchanged.
# #82 (the task props in the world look): re-exported as P4 into <raw>/review/house/82/export/p4; only study.tscn and package.json changed.
