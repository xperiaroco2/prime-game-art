title = "The House's second floor: package P4's 7 room scenes"
notes = "Package P4 of the House export (prime-game #523; docs/house.md \"The export\"): the second floor, its balcony and the external stairs down to the yard (#76), one Godot scene per game room, generated by `house --export` from layouts/house. Each instances the kit (assets/kit/house_kit) and the dressing props (assets/prop/house_props) at res://assets/environment/...; package.json beside this file lists every file of the package with its sha256. Own work; it goes to the game under the game's terms (the engineer's E1, 2026-10-11): the public game repo has no licence file, so all rights reserved. #150: re-exported with the rebuilt armchair, bookcase, dresser, rug, sideboard and small_table GLBs (their kit_fine surfaces overridden by prop_fine_high.tres, the fine pack listed in package.json) and #147's Detail node in every room; round 2 re-exported it for the re-coloured armchair (package.json only); approved by the engineer on 2026-10-14 in PR #151. Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #154. #158: only package.json changed (the shared kit_set.tres's hash, with the WC's and the pantry's paints); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #161. #162 dressed the landing (75 props: terracotta runners, consoles with lamps, bookcases, a sitting area with a sofa, two armchairs, a coffee table and a rug, framed family photos and the game's own art, plants, a bench, a laundry basket) and the bathroom (40 props: a bath with a shower screen, the vanity with a mirror cabinet, the toilet, a heated towel rail, shelves of bottles, tiled lower walls) in the world look and gave the bathroom a pale green-grey paint (#d8dfd6); bathroom.tscn re-exported into review/house/162/export/p4, landing.tscn and package.json after the review's round 2 into review/house/162/export/p4b; approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #163. #164 dressed the bedroom (57 props, 43 different: a double bed with a padded headboard, linen, cushions and a throw, two bedside tables with lamps and their small things, a three-door wardrobe with a mirror door, a dresser with an arched mirror, a bench at the bed's foot, a reading chair with a floor lamp, a rug, curtains, framed prints of the game's own world, plants, slippers) and the guest room (52 props, 41 different: two made-up single beds, two bedside tables with lamps, a small wardrobe and a clothes rail, the guest's suitcase and folded towels, a dresser with a mirror, a chair and a laptop, an armchair with a floor lamp, a rug, curtains, plants, framed art and tidy stored boxes) in the world look, on their bordeaux paint (#69413c); bedroom.tscn, guest_room.tscn and package.json re-exported into review/house/164/export/p4; approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #165. #166 dressed the kids' room (65 props, 41 different: a single bed with a starry duvet and a bedside table, a white wardrobe, a desk with a chair and a lamp, the toy chest, a cube unit of toy bins and white shelves of books and toys, a teal play rug with a road border, a beanbag, a rocket poster, a dinosaur print and a child's burger drawing, a plant, small toys) on a new pale sky blue paint (#c9d7de), and the study (64 props, 38 different: the Printer station's desk with a monitor, keyboard and an office chair, oak bookcases full of books, a filing cabinet, a reading armchair with a floor lamp, a cork pin board with the generator's blueprint and a delivery schedule, a framed certificate and art, plants, a terracotta rug) on its navy paint in the world look; the bedroom's pendant moved off its Name label; kids_room.tscn, study.tscn, bedroom.tscn and package.json re-exported into review/house/166/export/p4; approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #167. #168: only package.json changed (the shared kit_set.tres's hash, with the attic's paint); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #169. #82: the task props in the world look (task v3); study.tscn re-exported into review/house/82/export/p4 (their task props' kit_fine surfaces overridden by prop_fine_high.tres); package.json lists the task props' new hashes. Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #174, which the approval fields name. #107 (the merged shell and the batched dressing, a draw-call change with the look unchanged): re-exported from review/house/107/export/p4; every game-facing node and collider unchanged (test_house_contract); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34); #107 is a draw-call change with the look unchanged."
