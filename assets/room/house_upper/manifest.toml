# changes the hashes below (`manifest-check --hashes` finds it). The game's paths: levels/house/rooms/<name>.
# #152 (the engineer's paints of 2026-10-14): re-exported as P4 into <raw>/review/house/152/export/p4 (`house --export ... --package 4`); the files it changed point there.
