notes = "Package P4 of the House export (prime-game #523; docs/house.md \"The export\"): the second floor, its balcony and the external stairs down to the yard (#76), one Godot scene per game room, generated by `house --export` from layouts/house. Each instances the kit (assets/kit/house_kit) and the dressing props (assets/prop/house_props) at res://assets/environment/...; package.json beside this file lists every file of the package with its sha256. Own work; it goes to the game under the game's terms (the engineer's E1, 2026-10-11): the public game repo has no licence file, so all rights reserved. #150: re-exported with the rebuilt armchair, bookcase, dresser, rug, sideboard and small_table GLBs (their kit_fine surfaces overridden by prop_fine_high.tres, the fine pack listed in package.json) and #147's Detail node in every room; round 2 re-exported it for the re-coloured armchair (package.json only); approved by the engineer on 2026-10-14 in PR #151. Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #154. #158: only package.json changed (the shared kit_set.tres's hash, with the WC's and the pantry's paints); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #161. #162 dressed the landing (75 props: terracotta runners, consoles with lamps, bookcases, a sitting area with a sofa, two armchairs, a coffee table and a rug, framed family photos and the game's own art, plants, a bench, a laundry basket) and the bathroom (40 props: a bath with a shower screen, the vanity with a mirror cabinet, the toilet, a heated towel rail, shelves of bottles, tiled lower walls) in the world look and gave the bathroom a pale green-grey paint (#d8dfd6); bathroom.tscn re-exported into review/house/162/export/p4, landing.tscn and package.json after the review's round 2 into review/house/162/export/p4b; approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #163, which the approval fields name."
