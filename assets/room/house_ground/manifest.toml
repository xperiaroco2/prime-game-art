# Written for #124, re-exported for #132 (the wall paints) and for #147 (the C2-white kitchen, the Detail node) from the P2 export of 2026-10-13 (`house --export <raw>/house/export/v4/p2 --package 2`); a rebuild
# changes the hashes below (`manifest-check --hashes` finds it). The game's paths: levels/house/rooms/<name>.
id = "house_ground"
kind = "room"
slot = ""
title = "The House's ground floor: package P2's 15 room scenes"
notes = "Package P2 of the House export (prime-game #523; docs/house.md \"The export\"): the ground floor without the garage, the greenhouse and the garden, one Godot scene per game room, generated by `house --export` from layouts/house. Each instances the kit (assets/kit/house_kit) and the dressing props (assets/prop/house_props) at res://assets/environment/...; package.json beside this file lists every file of the package with its sha256. Own work; it goes to the game under the game's terms (the engineer's E1, 2026-10-11): the public game repo has no licence file, so all rights reserved. #147: the C2-white kitchen (backsplash runs, rebuilt kitchen props with the kit_fine surfaces overridden by prop_fine_high.tres) and a Detail node beside Dressing and Fixtures in every room for the detail-layer props; the approval fields wait for the engineer's yes on the #147 sheet."
tools = ["godot 4.7.2", "prime-game-art house --export (layouts/house)"]
licence = "own-work"
licence_url = "https://github.com/xperiaroco2/prime-game"
