notes = "Package P2 of the House export (prime-game #523; docs/house.md \"The export\"): the ground floor without the garage, the greenhouse and the garden, one Godot scene per game room, generated by `house --export` from layouts/house. Each instances the kit (assets/kit/house_kit) and the dressing props (assets/prop/house_props) at res://assets/environment/...; package.json beside this file lists every file of the package with its sha256. Own work; it goes to the game under the game's terms (the engineer's E1, 2026-10-11): the public game repo has no licence file, so all rights reserved. #147: the C2-white kitchen (backsplash runs, rebuilt kitchen props with the kit_fine surfaces overridden by prop_fine_high.tres) and a Detail node beside Dressing and Fixtures in every room for the detail-layer props; approved by the engineer on 2026-10-13 in PR #149. #150: the living room in the world look (the rebuilt sofa, armchairs, bookcases, TV unit, fireplace, coffee table, sideboard, dresser, rug and side tables, their kit_fine surfaces overridden by prop_fine_high.tres in every P2 room that places them: dining_room, hallway, kitchen, living_room, stairs, wc; six detail-layer props under the living room's Detail node; round 2: the warm sofa and armchairs, wall art and 16 more props, the living room's scene re-exported into review/house/150b/export/p2, and again into review/house/150c/export/p2 for the side table's standing frame moved onto its top; P2 places 93 props, 72 on main: the 22 new living-room props joined and book_row left); approved by the engineer on 2026-10-14 in PR #151. Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #154. #153: the dining room in the world look (the rebuilt dining table, chairs and pendant, the display cabinet, the rug, wall art and the detail layer; only dining_room.tscn and package.json changed, re-exported into review/house/153/export/p2, and again into review/house/153/export/p2b for the table-top items moved off the DiningTable drop-off station). Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #155. #156: the hallway in the world look (the console under an arched mirror, the coat corner with its bench, shoes and sports bag, the runner and doormat, the umbrella stand and parcels by the front door, the generator blueprint, the photo row and calendar; only hallway.tscn and package.json changed, re-exported into review/house/156/export/p2, and again into review/house/156/export/p2b for the fill of its bare walls: floor_lamp, art_city, wall_clock, art_photos, standing_frame and a pendant_shade; and into review/house/156/export/p2c for the density pass: a bookcase on each long wall, three plants, the gallery_wall on the far wall, a larger blueprint, a wider runner, the umbrella stand, parcels and calendar where the door view sees them; art_photos left the hall). Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #157. #158 dressed the ground floor's small rooms in the world look and painted the WC (soft blue-grey #CFD5D3) and the pantry (pale sage #D3D6C3): the WC with a close-coupled toilet, an oak vanity under a mirror cabinet, a washer and tumble dryer, a tiled lower wall, a towel ring, roll holder, pedal bin, toilet brush, reed diffuser and a washing-day joke print; the pantry with two stocked shelving units (one with the burger kitchen's buns), a vegetable rack, drink crates stacked in pairs, baskets, a step stool and a broom set beside its task props; the stairs with a runner on each half flight, a gallery of frames going up the wall and a plant on the landing; the junk clutter (nightstands, kitchen uppers, pack crates) replaced, never with nothing; only wc.tscn, pantry.tscn, stairs.tscn and package.json changed, re-exported into review/house/158/export/p2, and again into review/house/158/export/p2c for the PR's review: the stairs' Name label over the open half (its middle is inside the upper flight) and the pantry's floor stocked with stacked drink crates and baskets. Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #161. #162: only package.json changed (the shared kit_set.tres's hash, with the bathroom's paint); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #163. #166: only package.json changed (the shared kit_set.tres's hash, with the kids' room's paint); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #167. #168: only package.json changed (the shared kit_set.tres's hash, with the attic's paint); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #PR168, which the approval fields name."
