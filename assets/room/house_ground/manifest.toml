# Written for #124, re-exported for #132 (the wall paints), for #147 (the C2-white kitchen, the Detail node) and for #150 (the living room) from the P2 export of 2026-10-13 (`house --export <raw>/review/house/150/export/p2 --package 2`); a rebuild
# changes the hashes below (`manifest-check --hashes` finds it). The game's paths: levels/house/rooms/<name>.
id = "house_ground"
kind = "room"
slot = ""
title = "The House's ground floor: package P2's 15 room scenes"
notes = "Package P2 of the House export (prime-game #523; docs/house.md \"The export\"): the ground floor without the garage, the greenhouse and the garden, one Godot scene per game room, generated by `house --export` from layouts/house. Each instances the kit (assets/kit/house_kit) and the dressing props (assets/prop/house_props) at res://assets/environment/...; package.json beside this file lists every file of the package with its sha256. Own work; it goes to the game under the game's terms (the engineer's E1, 2026-10-11): the public game repo has no licence file, so all rights reserved. #147: the C2-white kitchen (backsplash runs, rebuilt kitchen props with the kit_fine surfaces overridden by prop_fine_high.tres) and a Detail node beside Dressing and Fixtures in every room for the detail-layer props; approved by the engineer on 2026-10-13 in PR #149. #150: the living room in the world look (the rebuilt sofa, armchairs, bookcases, TV unit, fireplace, coffee table, sideboard, dresser, rug and side tables, their kit_fine surfaces overridden by prop_fine_high.tres in every P2 room that places them: dining_room, hallway, kitchen, living_room, stairs, wc; six detail-layer props under the living room's Detail node; round 2: the warm sofa and armchairs, wall art and 16 more props, the living room's scene re-exported into review/house/150b/export/p2); the approval fields wait for the engineer's yes."
tools = ["godot 4.7.2", "prime-game-art house --export (layouts/house)"]
licence = "own-work"
licence_url = "https://github.com/xperiaroco2/prime-game"
public_repo_ok = true
ai_generated = false
approved_by = []
approved_at = ""
approval_pr = ""

