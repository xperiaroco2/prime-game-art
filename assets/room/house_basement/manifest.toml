notes = "Package P3 of the House export (prime-game #523; docs/house.md \"The export\"): the basement, one Godot scene per game room, generated by `house --export` from layouts/house. Each instances the kit (assets/kit/house_kit) and the dressing props (assets/prop/house_props) at res://assets/environment/...; package.json beside this file lists every file of the package with its sha256. Own work; it goes to the game under the game's terms (the engineer's E1, 2026-10-11): the public game repo has no licence file, so all rights reserved. #150: re-exported with the rebuilt sideboard GLB (its kit_fine surfaces overridden by prop_fine_high.tres, the fine pack listed in package.json) and #147's Detail node in every room; approved by the engineer on 2026-10-14 in PR #151. Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #154. #158: only package.json changed (the shared kit_set.tres's hash, with the WC's and the pantry's paints); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #161. #162: only package.json changed (the shared kit_set.tres's hash, with the bathroom's paint); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #163. #166: only package.json changed (the shared kit_set.tres's hash, with the kids' room's paint); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #167. #168: only package.json changed (the shared kit_set.tres's hash, with the attic's paint); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #169. #170: re-exported with the storage room, the darkroom and the corridor dressed as clean working rooms (library v12's 32 basement props, the storage's fluorescent tubes; storage.tscn, darkroom.tscn and corridor.tscn changed); approved under the engineer's blanket yes of 2026-10-14