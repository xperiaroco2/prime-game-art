notes = "Package P5 of the House export (prime-game #523; docs/house.md \"The export\"): the attic and the free roof, one Godot scene per game room, generated by `house --export` from layouts/house. Each instances the kit (assets/kit/house_kit) and the dressing props (assets/prop/house_props) at res://assets/environment/...; package.json beside this file lists every file of the package with its sha256. Own work; it goes to the game under the game's terms (the engineer's E1, 2026-10-11): the public game repo has no licence file, so all rights reserved. #150: re-exported with the rebuilt rug GLB (its kit_fine surfaces overridden by prop_fine_high.tres, the fine pack listed in package.json) and #147's Detail node in every room; approved by the engineer on 2026-10-14 in PR #151. Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #154. #158: only package.json changed (the shared kit_set.tres's hash, with the WC's and the pantry's paints); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #161. #162: only package.json changed (the shared kit_set.tres's hash, with the bathroom's paint); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #163. #166: only package.json changed (the shared kit_set.tres's hash, with the kids' room's paint); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #167. #168 dressed the attic as a well-kept family attic (63 items, main 44; 24 different props, main 11): steel shelving runs and a back-to-back island loaded with labelled boxes and plastic crates, a sofa and a dresser under dust sheets, a white wardrobe, suitcases, a rolled rug, holiday decorations, the rocking horse and a dress form, framed pictures leaning on the knee wall, a city bike, sports kit and the game's own burger-stall sign, a retired delivery bag and a generator part; the knee walls and gables take a warm white paint (#ece7de); the twelve hiding spots, the pick-ups, the clear areas and the free roof's items stay; attic.tscn and package.json re-exported into review/house/168/export/p5; approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #169, which the approval fields name. #107 (the merged shell and the batched dressing, a draw-call change with the look unchanged): re-exported from review/house/107/export/p5; every game-facing node and collider unchanged (test_house_contract); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34); #107 is a draw-call change with the look unchanged. #183: the steep hatch ladder replaced by a walkable stair (40.4 deg, 0.2 m risers) under a 3.125 x 1.14 m hatch with a guard rail; the game-facing Shell nodes change on purpose (export_contract.json re-pinned); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34); #183 is his option B of prime-game PR #1043."
