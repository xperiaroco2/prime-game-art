notes = "Package P7 of the House export (prime-game #523; docs/house.md \"The export\"): the plot (#81: fence, ground, street, outdoor stairs, chill zone, photo gazebo) as outdoor.tscn and the garden and the greenhouse (#80) as room scenes, generated by `house --export` from layouts/house. They instance the kit (assets/kit/house_kit), the props (assets/prop/house_props), the plot's files (assets/environment/house_outdoor) and the plants (assets/environment/house_garden) at res://assets/environment/...; package.json beside this file lists every file of the package with its sha256. Own work; it goes to the game under the game's terms (the engineer's E1, 2026-10-11): the public game repo has no licence file, so all rights reserved. Approved by the engineer on 2026-10-12 in PR #131. Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #154. #158: only package.json changed (the shared kit_set.tres's hash, with the WC's and the pantry's paints); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #161. #162: only package.json changed (the shared kit_set.tres's hash, with the bathroom's paint); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #163. #166: only package.json changed (the shared kit_set.tres's hash, with the kids' room's paint); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #167. #168: only package.json changed (the shared kit_set.tres's hash, with the attic's paint); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #169, which the approval fields name."
