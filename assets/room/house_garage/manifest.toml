title = "The House's garage: package P6's room scene"
notes = "Package P6 of the House export (prime-game #523; docs/house.md \"The export\"): the garage (#79) as one Godot scene, generated by `house --export` from layouts/house (ground.toml's garage room, its gates, side door and back door; dressing/garage.toml). It instances the kit (assets/kit/house_kit) and the props (assets/prop/house_props) at res://assets/environment/...; package.json beside this file lists every file of the package with its sha256. The car on its two-post lift (garage_car, lift_posts, lift_arms: the arms and the car move together, 1.24 m up to the car repair ADR's 1.4 m sill height), the lift panel at LiftPanel with its blind side (a tyre rack and two steel cupboards), the part picture's frame on the east wall, the workbench drop-off, and the world-look dressing on the garage's concrete grey (#8f897d). Own work; it goes to the game under the game's terms (the engineer's E1, 2026-10-11): the public game repo has no licence file, so all rights reserved. Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in the PR the approval fields name. #107 (the merged shell and the batched dressing, a draw-call change with the look unchanged): re-exported from review/house/107/export/p6; every game-facing node and collider unchanged (test_house_contract). #185 (shadow proxies: each merged shell and batch gets a SHADOWS_ONLY twin <name>_shadow.glb, the merged mesh casts none): re-exported from review/house/185/export/p6; every other game-facing node and collider unchanged (test_house_contract); approved under the engineer's blanket yes of 2026-10-14 (#34); #185 is a draw-call change with the look unchanged."
