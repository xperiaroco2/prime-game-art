notes = "The detailed four-digit first-person hand m41 (tools/blender/fp_hand_model.py from specs/fp_hand_dims.toml: concept A refined, three fingers and a thumb, a signed distance field built in code; the rig from tools/blender/fp_rig_seed.json, read from the committed t4), cut and posed in the camera's space under a root bone View at the eye, with a Crystal bone and its CrystalSocket node for the energy crystal; the clips are keyed from tools/blender/fp_hands.toml in headless Blender (own work, no motion source): Idle_Loop 3 s and Run_Loop 0.917 s (both hands as fists, low in the corners), Crystal_Idle_Loop 3 s, Crystal_Run_Loop 0.917 s, Punch 0.5 s (the right fist, contact 0.15 s), Crystal_Hit 0.5 s (an overhead smash, contact 0.20 s); since run mug4 (art#392) also Mug_Idle_Loop 3 s and Mug_Run_Loop 0.917 s (the right hand round the M8 beer mug's handle, assets/prop/mug, the left fist as in Idle_Loop and Run_Loop) and the node MugSocket on the RightHand bone; Godot names drop _Loop. Two morph targets: fist (the right hand) and fist_L (the left), keyed in every clip. The held hands are seated on the energy crystal (assets/prop/energy_crystal, used to fit and check, not shipped here). The skin's base colour texture is a neutral grey pattern computed in code, its factor white: the game multiplies it by the player's body colour (default sRGB 0.40 0.86 0.80). Approved as they are for the M8 demo (the six clips of g5; run mug4 keeps them: its golden frames match g4's, 0.0 changed); the two mug clips wait for the engineer's look at art#392's review; the polish to final quality is art#388. HANDOFF.md for the game side."
