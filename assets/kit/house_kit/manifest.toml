# Written for #118 from the raw builds of 2026-10-10; a rebuild changes the hashes below (`manifest-check --hashes` finds it).
# #152 (the engineer's paints of 2026-10-14): re-exported as P1 into <raw>/review/house/152/export/p1 (`house --export ... --package 1`); the files it changed point there.
# #158 (the WC's and pantry's paints): kit_set.tres from <raw>/review/house/158/export/p2 (P2's export; the paints are one shared material); package.json names its new hash.
# #162 (the bathroom's paint): kit_set.tres from <raw>/review/house/162/export/p4 (P4's export; the paints are one shared material); package.json names its new hash.
# #166 (the kids' room's paint): kit_set.tres from <raw>/review/house/166/export/p4 (P4's export; the paints are one shared material); package.json names its new hash.
# #168 (the attic's paint): kit_set.tres from <raw>/review/house/168/export/p5b (P5's export; the paints are one shared material); package.json names its new hash.
# #183 (the attic stair): re-exported as P1 into <raw>/review/house/183/export/p1 (`house --export ... --package 1`); the three new pieces point there, the rest are unchanged.
id = "house_kit"
kind = "kit"
slot = ""
title = "The House's modular kit v3d: 124 pieces and the shared texture set"
notes = "Built by `kit` from kits/house.json (docs/kit.md) into kits/house/v3c (v3b with the 12 pieces of the warm sand ceiling rebuilt, #152). Own work; the three textures are packed, grey-averaged derivatives of ambientCG CC0 maps (PaintedPlaster017, WoodFloor051, Concrete034). The greenhouse's glass roof pieces (house/80/kit) are byte-identical to the kit's and ship here. Our own work goes to the game under the game's terms (the engineer's E1, 2026-10-11): the public game repo has no licence file, so all rights reserved. Approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #154. #158 added the WC's and the pantry's wall paints to the shared kit_set.tres (from P2's export, review/house/158/export/p2); no kit piece changed; approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #161. #162 added the bathroom's wall paint to the shared kit_set.tres (from P4's export, review/house/162/export/p4); no kit piece changed; approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #163. #166 added the kids' room's wall paint to the shared kit_set.tres (from P4's export, review/house/166/export/p4); no kit piece changed; approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #167. #168 added the attic's warm white paint (#ece7de, the knee walls and gables) to the shared kit_set.tres (from P5's export, review/house/168/export/p5b); no kit piece changed; approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34) in PR #169, which the approval fields name. #183 added stair_attic, floor_boards_4x2_hatch and hatch_guard_attic (kit v3d = v3c plus these three; the attic's walkable stair under a longer hatch, in place of the ladder); approved under the engineer's blanket yes of 2026-10-14 (build the House, judge in a playtest; #34); #183 is his option B of prime-game PR #1043."
tools = ["blender 5.2.2", "prime-game-art kit (kits/house.json)"]
