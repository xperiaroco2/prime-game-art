notes = """Only 100STYLE.zip (1,468,515,354 bytes; md5 3cf627852fd8192024c04a8d0ef49583 as the record lists) from the \
official Zenodo record, linked from the dataset's page https://www.ianxmason.com/100style/; not the 14.75 GB \
labelled data. The record and the page give CC BY 4.0; the page asks creative or commercial work to credit it as \
the credit line above. The zip holds one folder per style with its takes <Style>_<BR|BW|FR|FW|ID|SR|SW|TR1..3>.bvh \
(backward run and walk, forward run and walk, idle, sidestep run and walk, transitions), Dataset_List.csv (the style \
descriptions) and Frame_Cuts.csv (each take's usable frames), plus macOS __MACOSX metadata. The BVH files are read as \
data only. The strafe pilot (art #196) uses the Neutral style ("Normal walking"): Neutral_BR, Neutral_SR, Neutral_FR \
and Neutral_BW, retargeted onto the alien by tools/blender/alien_mocap.py with \
tools/blender/retarget_maps/100style_contract.toml (docs/animations.md)."""

