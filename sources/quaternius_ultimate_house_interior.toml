notes = """Downloaded 2026-10-06 by the locations stage-0 research (art #34) under the engineer's standing permission for free downloads from official sources; the archive is kept as downloaded in D:/prime-art-raw/env/ and unpacked beside it (unpacked files are listed once an asset uses them). Licence as read: quaternius.com pack page: "License: CC0" (linking creativecommons.org/publicdomain/zero/1.0/); the page's Download button opens the publisher's public Google Drive folder, mirrored here file by file (the folder holds loose files, no archive); its License.txt: "License: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication". The FBX folder (123 models), License.txt and Preview.jpg of the publisher's Drive folder (its Blends and OBJ folders were not downloaded). Flat material colours, no textures, 1 to 5 materials per model; scale about 2x (Door_1 4.19 m, Chair_1 1.77 m high: x0.5 for the game). The FBX materials import into Blender with alpha 0 (invisible) and need alpha forced to 1; lab GLB copies are in research/2026-10-06-locations/lab/converted/. Measured (research scripts glbstats.py / fbx_to_glb.py): 123 models, triangles min/median/max 48/324/3596, 0 with a base colour texture."""

