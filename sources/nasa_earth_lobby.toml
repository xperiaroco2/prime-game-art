notes = """Downloaded 2026-10-30 for the lobby hall's window (art #356, step 3b) under the engineer's yes of the same day on art #356 adding US government public-domain imagery from NASA to the allowlist (docs/decisions/2026-10-30-nasa-public-domain.md): credit "Earth imagery: NASA", no NASA logos or insignia, no implied endorsement. Fetched from NASA's own image server eoimages.gsfc.nasa.gov (the files behind the Visible Earth / Earth Observatory pages, now redirected to science.nasa.gov): BlackMarble_2016_3km.jpg (13500 x 6750, Visible Earth record 144898, https://eoimages.gsfc.nasa.gov/images/imagerecords/144000/144898/BlackMarble_2016_3km.jpg), world.topo.bathy.200412.3x5400x2700.jpg (5400 x 2700, record 73909, https://eoimages.gsfc.nasa.gov/images/imagerecords/73000/73909/world.topo.bathy.200412.3x5400x2700.jpg) and cloud_combined_8192.tif (8192 x 4096, record 57747, https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57747/cloud_combined_8192.tif). None is marked as a third party's work. `lobby --earth-tex` scales them to 4096 x 2048 JPEGs in lobby/hall/v5/earth/ (the sources are only read). Step 5a4 (2026-10-31): the same command also cuts the [earth.cap] box (lat -8..82, lon -48..72) from the night map and the clouds at their full resolution into earth_night_cap.jpg (4096 x 3072) and earth_clouds_cap.jpg (2730 x 2048) in lobby/hall/v11/earth/; no new download."""

