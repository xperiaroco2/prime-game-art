# The character contract: what every character model, clothing piece, accessory and prop must be so that one
# skeleton, one animation set and one material serve them all. Read by `tools/run.py check` and validated against
# contract/humanoid.json (generated from Godot, never typed) by `tools/run.py contract --check`.
# Why each rule exists: docs/contract.md. Source: the ADR sketch in the wave 1 report on xperiaroco2/prime-game#165,
# with the engineer's answers of 2026-10-02 (five fingers, the v1 slots, one neutral body, animations only).

version = 1
profile = "humanoid.json" # Godot's SkeletonProfileHumanoid, dumped by tools/godot/dump_profile.gd

[axes]
format = "glTF 2.0"
up = "+Y"                    # glTF; Blender shows it as +Z
front = "+Z"                 # Vector3.MODEL_FRONT; Blender shows it as -Y
left = "+X"                  # the character's own left side
unit_m = 1.0                 # 1 unit = 1 metre
rest_pose = "T"              # arms horizontal, palms down; A-pose sources are re-posed and applied as rest
origin = "between the feet, on the ground"
character_scene_yaw_deg = 180 # the character scene turns the +Z-facing model to face -Z, like the greybox

[body]
height_m = 1.75              # top of the head
height_min_m = 1.70          # the ADR sketch's 1.7 to 1.8 m
height_max_m = 1.80          # never taller than the game's capsule
plasticine_height_max_m = 1.90 # the plasticine (clay) look: its head is 1.3 times the pack's, with hair on top; scaled
                             # so the eyes are at 1.6 m it stands about 1.85 m (the engineer's `eyes16`, 2026-10-12)
eye_height_m = 1.6           # the game's camera height (content/modes/base_mode.tres in prime-game)
eye_tolerance_m = 0.08
feet_tolerance_m = 0.01      # the lowest vertex is within this of y = 0
transform_tolerance = 0.0001 # location 0, rotation 0, scale 1 on every object
capsule_height_m = 1.8       # the game's player capsule, for reference
capsule_radius_m = 0.4
variants = "one neutral body in v1"

[skeleton]
root = "Root"                # on the ground between the feet, never weighted
# Bones that must carry skin weights (22): the trunk, and per side shoulder, arm, hand and leg.
weighted = [
  "Hips", "Spine", "Chest", "UpperChest", "Neck", "Head",
  "LeftShoulder", "LeftUpperArm", "LeftLowerArm", "LeftHand",
  "RightShoulder", "RightUpperArm", "RightLowerArm", "RightHand",
  "LeftUpperLeg", "LeftLowerLeg", "LeftFoot", "LeftToes",
  "RightUpperLeg", "RightLowerLeg", "RightFoot", "RightToes",
]
# Present in the rig, weights allowed but not required.
weights_optional = ["Jaw", "LeftEye", "RightEye"]
# Five fingers per hand (gestures): every bone of every finger chain in the profile is present and weighted.
fingers = ["Thumb", "Index", "Middle", "Ring", "Little"]
fingers_weighted = true
extra_bones = false          # no sockets, jiggle or helper bones in the body; sockets live in the Godot scene
max_weights_per_vertex = 4
min_weight = 0.01            # influences below this are noise (a warning)
weight_sum_tolerance = 0.01  # weights per vertex sum to 1 (a warning; Godot normalizes on import)

# Attachment points. Each is a Marker3D under a BoneAttachment3D in the character scene (never override_pose); every
# item or accessory scene has a Grip Marker3D that lands on its socket. scene_position is in the character scene
# (front -Z, like the greybox in prime-game client/player/remote_player_body.gd); model_position is the same point
# in model space (front +Z). Positions without numbers are measured on the first base body from 8-side shots.
[[sockets]]
name = "Socket_Head"
bone = "Head"
where = "top of the skull"
used_by = "hair or hat"

[[sockets]]
name = "Socket_Face"
bone = "Head"
where = "front of the face, at eye height"
used_by = "face accessory (masks, glasses)"

[[sockets]]
name = "Socket_HandR"
bone = "RightHand"
where = "palm centre, grip axis along the fingers"
used_by = "the hand item"
scene_position = [0.45, 0.95, -0.15]
model_position = [-0.45, 0.95, 0.15]

[[sockets]]
name = "Socket_HandL"
bone = "LeftHand"
where = "palm centre"
used_by = "IK target for two-handed holds"

[[sockets]]
name = "Socket_Carry"
bone = "Chest"
where = "in front of the body at chest height"
used_by = "the two-handed package"
scene_position = [0.0, 0.8, -0.72]
model_position = [0.0, 0.8, 0.72]

[[sockets]]
name = "Socket_Belt"
bone = "Hips"
where = "the left hip"
used_by = "the belt item"
scene_position = [-0.48, 0.85, 0.0]
model_position = [0.48, 0.85, 0.0]

[[sockets]]
name = "Socket_Back"
bone = "UpperChest"
where = "between the shoulder blades, behind the body"
used_by = "back item"

# Customization slots, v1. A player picks one piece per slot; eyes and mouth are their own slots, changeable like the
# hair (the engineer's answer Q7). Cosmetics are public data and never derived from the role.
#   palette  a colour index into the shared palette texture; no mesh
#   face     eyes or mouth: a set of morphs on the template head ([face] below; the shape of the eyes, lids, mouth
#            and lips), each state in `expressions` a morph over it, so blinking, talking and emotes animate without
#            a mesh change; plus the slot's truly separate `parts` (eyeballs; teeth or tusks) as rigid meshes on
#            Socket_Face, checked with `check --kind accessory`
#   rigid    a separate unskinned mesh on a socket, checked with `check --kind accessory`
#   skinned  a mesh bound to profile bones only, weights from the base body, checked with `check --kind clothing`
[[slots]]
id = "skin_colour"
type = "palette"

[[slots]]
id = "eyes"
type = "face"
forms = ["morph"]
parts = ["eyeballs"]         # their look direction: their own morphs (the face kit's look_l, look_r, look_u, look_d)
part_morphs = ["look_l", "look_r", "look_u", "look_d"] # pass on the parts under `check --slot eyes`; other keys warn
socket = "Socket_Face"
check_kind = "accessory"     # the parts; the morphs are judged with the head (`check --kind body`)
budget = "accessory"
expressions = ["open", "blink", "closed"] # the full list waits for the style answers (H2)

[[slots]]
id = "mouth"
type = "face"
forms = ["morph"]
parts = ["teeth", "tusks"]   # either or both, or none
socket = "Socket_Face"
check_kind = "accessory"     # the parts; the morphs are judged with the head (`check --kind body`)
budget = "accessory"
expressions = ["closed", "small", "wide", "round"] # talking shapes; the full list waits for H2

[[slots]]
id = "hair_or_hat"
type = "rigid"
socket = "Socket_Head"
check_kind = "accessory"
budget = "head_item"

[[slots]]
id = "top"
type = "skinned"
check_kind = "clothing"
budget = "clothing"

[[slots]]
id = "bottom"
type = "skinned"
check_kind = "clothing"
budget = "clothing"

[[slots]]
id = "shoes"
type = "skinned"
check_kind = "clothing"
budget = "clothing"

[[slots]]
id = "face_accessory"
type = "rigid"
socket = "Socket_Face"
check_kind = "accessory"
budget = "accessory"

[[slots]]
id = "back_item"
type = "rigid"
socket = "Socket_Back"
check_kind = "accessory"
budget = "accessory"

[sets]
rule = "a set is a preset of pieces: one piece id per slot; a slot it leaves out keeps the player's choice"

[animation]
source = "skeletal clips on the contract skeleton, one shared AnimationLibrary"
# The knockdown is a ragdoll (the engineer, 2026-10-11, prime-game#516 answer 3; art #115): the body falls under
# physics at once and a dead body keeps its ragdoll pose; a revived player stands up at once. Every other state is a
# clip. The character package ships the ragdoll data (`export/<id>.ragdoll.json`); the game builds the PhysicalBone3D
# nodes from it at import (godot/ragdoll/builder.gd is the reference builder). docs/contract.md, "Ragdoll".
ragdoll = "knockdown"
ragdoll_data = "export/<id>.ragdoll.json"
ragdoll_collision = "layer downed (3), mask world (1) only: never players or other ragdolls"
in_place = true              # root_motion_track stays empty
loop_suffix = "_loop"
markers = ["foot_l", "foot_r", "land"]
# Expressions (blink, talk, emotes) are the eyes and mouth pieces' morphs on the head, weighted at runtime; no bones.
face = "eye and mouth expressions are face morphs on the head, weighted at runtime, not bones or texture frames"

# Faces are morphs on one template head (the engineer, 2026-10-18; art #200,
# docs/decisions/2026-10-18-faces-as-morphs.md). The mouth, lips and lids are deformations of the head's own surface,
# not pieces laid on top and not frames in a face texture. Every head shape is a wrap of the template (the same
# vertices in the same order), so each eye and mouth morph works on every head: N heads + M mouths + K eyes are
# N + M + K pieces. `check --kind body` passes a shape key only when every vertex it moves has its largest weight on
# one of `morph_bones` (a tie with another bone counts as on the head), or on `edge_bones` alone (a Chest|Neck tie
# is not) moved at most `edge_mm` in a key that also moves head skin; any other key is a body-shape morph and fails
# (every outfit would need the same keys).
[face]
rule = "eyes and mouth are morphs (glTF morph targets) on one template head; meshes only for truly separate parts"
morph_bones = ["Head", "Jaw", "LeftEye", "RightEye"]
# A soft jaw or chin morph's falloff may reach the top of the neck. Skin on these bones only may move up to edge_mm
# in a key that also moves head skin: a shift that a collar fitted to the neck hides, never a change of the body's
# shape. Provisional, a starting guess; measured again on the first template head.
edge_bones = ["Neck"]
edge_mm = 2.0
template = "every head shape shares the template head's topology, so every eye and mouth morph fits every head"
separate = ["eyeballs", "teeth", "tusks", "hair", "crests", "hats", "clothes"]

# Budgets: triangles after triangulation; vertices as imported (split at UV seams and hard edges, close to what the
# GPU draws). Above the target is a warning, above the cap a failure. "provisional" budgets are a starting guess for
# the first real pieces.
# The character budgets are the engineer's decision of 2026-10-18 (art #212, quality over low-end hardware: the target
# is a mid-range gaming PC, RTX 3060/4060 class), measured with `tools/run.py bench` on a 40,000-triangle stand-in
# (docs/decisions/2026-10-18-character-budgets.md). They replace the foundation ADR's unmeasured sketch (8,000 /
# 12,000, textures 1,024, GLB 5 MB). The pieces add up: the body plus one piece per slot at their targets is
# 22,000 + 3 x 3,000 (clothing) + 3,000 (hair or hat) + 4 x 1,500 (eye and mouth parts, face and back items) =
# 40,000, the character's target; at their caps 59,500, inside its cap.
# Body skin an outfit covers is cut out at assembly, so a dressed character stays near the target.
# `check` judges one file at a time; the assembled character is not judged by it yet.
[budgets.character]
note = "the assembled character LOD0: body plus every piece; 10 players, about 20 skinned bodies with corpses"
triangles_target = 40000
triangles_cap = 60000
vertices_target = 30000
vertices_cap = 45000

[budgets.body]
note = "the base body with five-finger hands, its head included"
triangles_target = 22000
triangles_cap = 30000
vertices_target = 16000      # never more than the whole character's skinned vertices
vertices_cap = 24000

[budgets.head]
note = "the template head, a separate mesh and the only one with face morphs; part of the body budget"
provisional = true
triangles_target = 12000
triangles_cap = 15000
vertices_target = 7000       # every morph is stored densely: about 20 bytes per head vertex per morph in Godot's
                             # video memory, once per unique head mesh, and about 39 in the GLB (bench, art #212)
vertices_cap = 9000

[budgets.clothing]
note = "one skinned piece (top, bottom or shoes)"
provisional = true
triangles_target = 3000
triangles_cap = 5000

[budgets.head_item]
note = "hair or hat"
provisional = true
triangles_target = 3000
triangles_cap = 4500

[budgets.accessory]
note = "a face accessory, back item or belt item; the eyes' and mouth's parts (eyeballs, teeth, tusks)"
provisional = true
triangles_target = 1500
triangles_cap = 2500

[budgets.prop]
note = "a level prop or a third-person hand item (first-person hand items: 3,000 target, 4,000 cap)"
triangles_target = 1500
triangles_cap = 2000

[budgets.limits]
bones = 56                   # the profile; 64 deform and 80 total are the engine-side caps
blend_shapes_body = 0        # body-shape morphs: none (every skinned outfit would need the same keys); face morphs
                             # on the head bones are allowed ([face])
face_morphs_target = 64      # face morphs per mesh above this warn; 52 to 64 cover a full face rig; only on the head
surfaces_per_character_target = 6
surfaces_per_character_cap = 8
texture_character_px = 2048  # the main set: base colour, normal and at most one ORM/roughness map, VRAM Compressed
texture_maps_max = 3
texture_lod_px = 1024        # LOD1 and LOD2's textures
texture_accessory_px = 1024  # small parts and accessories: 512 to 1,024
glb_character_mb = 40        # LOD0 plus hand-made LODs plus 64 head morphs plus 2048 textures, with headroom (bench)
glb_accessory_mb = 4
glb_animation_library_mb = 10

# Levels of detail of the assembled character (art #212). Godot's importer makes automatic LODs (index buffers over
# LOD0's vertices, so skinning and morphs still run over every LOD0 vertex); they stay on, and they did most of the
# saving in the bench: 20 bodies at LOD0 only cost 1.44 ms of GPU, with the automatic LODs 0.64 ms. The levels below
# are the triangle targets for hand-made LOD meshes switched by GeometryInstance3D visibility ranges: optional, for
# when a profile shows skinning or memory cost (in the bench's one scene, a small meeting ring with only 5 of 20 bodies
# beyond 10 m, the hand-made LOD2 saved nothing on top of the automatic LODs; a spread-out crowd was not measured).
# Distances are a starting point at 1440p and a 75 degree FOV, to be tuned in playtest.
[lods]
automatic = "the importer's automatic LODs stay on (meshes/generate_lods); never import a character with them off"
hand_made = "optional: LOD1 and LOD2 as hand-made meshes (their own vertices, no face morphs) under visibility ranges"
shadow_proxy = "optional: a LOD2-class copy with cast_shadow SHADOWS_ONLY and the drawn meshes' shadows off"
shadow_note = """a directional light with 4 splits draws a caster up to 5 times a frame, a shadowed omni lamp up to 6. \
With the automatic LODs the shadow passes already draw low LODs: the proxy saved 0.03 ms at 20 bodies (0.55 ms with \
the LODs off)"""

[[lods.levels]]
name = "LOD0"
triangles_target = 40000
triangles_cap = 60000
from_m = 0.0

[[lods.levels]]
name = "LOD1"
triangles_target = 15000
triangles_cap = 20000
from_m = 4.0

[[lods.levels]]
name = "LOD2"
triangles_target = 6000
triangles_cap = 8000
from_m = 10.0

[[lods.levels]]
name = "LOD3"
optional = true              # far bodies and corpses
triangles_target = 2000
triangles_cap = 3000
from_m = 25.0

# What `check --kind <kind>` enforces. Severities: "fail" (a hard failure, non-zero exit), "warn", "off".
# Every kind also gets the mesh checks: budget, n-gons, loose geometry, non-manifold edges, UVs, applied transforms.
[kinds.body]
budget = "body"
rig = "required"             # required | forbidden
bones = "all"                # all: exactly the profile's bones; subset: only profile bones
fingers = "fail"
height = "fail"
eyes = "warn"
feet = "fail"
facing = "fail"
max_materials = 1

# The alien (docs/decisions/2026-10-19-alien-overlaid-face-four-fingers.md): a body with four fingers per hand. Its
# Little chains stay in the skeleton and carry no weights; Thumb, Index, Middle and Ring are weighted. Every other
# rule is the body's. fingers_unweighted (any kind, default none): fingers whose bones are present and unweighted.
# The engineer, 2026-10-23 (art #196 comment 6374319309): "Кістки пружин під Head дозволяю; гребені й зябра можуть
# стирчати над 1,80 м" (spring bones under Head are allowed; crests and gills may stick out above 1.80 m).
# bones = "all_and_springs": exactly the profile's bones plus whole sets of spring_sets, each bone a descendant of
# spring_parent; any other extra bone, or a set in part, fails. head_top_max_m: the 1.80 m capsule (body.height_max_m)
# bounds the body, the skin whose heaviest bone is not spring_parent or below it; the head's skin (skull, crest,
# gills) may stand above it up to head_top_max_m.
[kinds.alien]
budget = "body"
rig = "required"
bones = "all_and_springs"
spring_parent = "Head"
head_top_max_m = 1.95
fingers = "fail"
fingers_unweighted = ["Little"]
height = "fail"
eyes = "warn"
feet = "fail"
facing = "fail"
max_materials = 1

[kinds.alien.spring_sets]    # each set whole or not at all; the chains Godot's SpringBoneSimulator3D swings
crest = ["Crest1", "Crest2", "Crest3"]
gills = ["GillL1", "GillL2", "GillL3", "GillR1", "GillR2", "GillR3"]

[kinds.clothing]
budget = "clothing"
rig = "required"
bones = "subset"
fingers = "off"
height = "off"
eyes = "off"
feet = "off"
facing = "off"
max_materials = 1

[kinds.accessory]
budget = "accessory"
rig = "forbidden"
bones = "subset"
fingers = "off"
height = "off"
eyes = "off"
feet = "off"
facing = "off"
max_materials = 1

[kinds.prop]
budget = "prop"
rig = "forbidden"
bones = "subset"
fingers = "off"
height = "off"
eyes = "off"
feet = "warn"
facing = "off"
max_materials = 2
