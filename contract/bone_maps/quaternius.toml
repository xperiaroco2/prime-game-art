# Quaternius rig names -> Godot's SkeletonProfileHumanoid names (contract/humanoid.json).
# Confirmed on 2026-10-02 from the real rig (xperiaroco2/prime-game-art#5): UAL1_Standard.glb (Universal Animation
# Library) and Superhero_Male_FullBody.gltf (Universal Base Characters) share one rig of 65 bones with Unreal-mannequin
# names (pelvis, spine_01, clavicle_l ...), except the head bone, which is "Head". It has no twist or IK bones, and no
# Jaw or eye bones: `check` reports those missing until they are added in Blender.

source = "Quaternius"
confirmed = true
prefix_pattern = ''
# End bones past the last finger joint and past the toes. The Base Characters weight some vertices to the finger ones:
# rename-bones moves those weights to the parent bone (the distal joint), and check counts them there.
drop = [
  "thumb_04_leaf_l",
  "index_04_leaf_l",
  "middle_04_leaf_l",
  "ring_04_leaf_l",
  "pinky_04_leaf_l",
  "ball_leaf_l",
  "thumb_04_leaf_r",
  "index_04_leaf_r",
  "middle_04_leaf_r",
  "ring_04_leaf_r",
  "pinky_04_leaf_r",
  "ball_leaf_r",
]

