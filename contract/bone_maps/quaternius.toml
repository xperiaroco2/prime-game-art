# Quaternius rig names -> Godot's SkeletonProfileHumanoid names (contract/humanoid.json).
# UNCONFIRMED: no Quaternius file has arrived yet. This map guesses Unreal-mannequin-style names (pelvis, spine_01,
# clavicle_l ...), which Quaternius' universal animation rigs are said to follow. Fix it from the first file
# (`check --map quaternius` lists the bones it could not map as extra) and set confirmed = true.

source = "Quaternius"
confirmed = false
prefix_pattern = ''
# Twist and IK helper bones of the Unreal mannequin layout; rename-bones deletes them.
drop = [
  "upperarm_twist_01_l",
  "lowerarm_twist_01_l",
  "thigh_twist_01_l",
  "calf_twist_01_l",
  "upperarm_twist_01_r",
  "lowerarm_twist_01_r",
  "thigh_twist_01_r",
  "calf_twist_01_r",
  "ik_foot_root",
  "ik_foot_l",
  "ik_foot_r",
  "ik_hand_root",
  "ik_hand_gun",
  "ik_hand_l",
  "ik_hand_r",
]

