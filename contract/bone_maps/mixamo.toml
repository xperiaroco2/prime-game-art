# Mixamo rig names -> Godot's SkeletonProfileHumanoid names (contract/humanoid.json).
# Used by `check --map mixamo` and `rename-bones --map mixamo`. The names are Mixamo's published FBX naming
# (mixamorig:Hips ...); no Mixamo file is in this repository, and Mixamo output never enters the public game repo.
# Mixamo rigs have no Root and no Jaw: `check` reports them missing until they are added in Blender.

source = "Mixamo"
confirmed = true
# Mixamo prefixes every bone with "mixamorig:" (sometimes "mixamorig1:", "mixamorig2:" ...); stripped first.
prefix_pattern = '^mixamorig[0-9]*:'
# Leaf end bones without weights; rename-bones deletes them.
drop = [
  "HeadTop_End",
  "LeftHandThumb4",
  "LeftHandIndex4",
  "LeftHandMiddle4",
  "LeftHandRing4",
  "LeftHandPinky4",
  "RightHandThumb4",
  "RightHandIndex4",
  "RightHandMiddle4",
  "RightHandRing4",
  "RightHandPinky4",
  "LeftToe_End",
  "RightToe_End",
]

[rename]
Hips = "Hips"
Spine = "Spine"
Spine1 = "Chest"
Spine2 = "UpperChest"
Neck = "Neck"
Head = "Head"
LeftEye = "LeftEye"
RightEye = "RightEye"
LeftShoulder = "LeftShoulder"
LeftArm = "LeftUpperArm"
LeftForeArm = "LeftLowerArm"
LeftHand = "LeftHand"
LeftHandThumb1 = "LeftThumbMetacarpal"
LeftHandThumb2 = "LeftThumbProximal"
LeftHandThumb3 = "LeftThumbDistal"
LeftHandIndex1 = "LeftIndexProximal"
