# Mixamo-style limb names without a prefix, and a spine chain that counts DOWN: Hips -> Spine02 -> Spine01 -> Spine
# -> neck (lower case) -> Head, with both shoulders under Spine. Two helper ends (head_end, headfront) are dropped.
# The rig has no finger, eye, jaw or toe-end bones: the hand is one bone, so the game skeleton's fingers must be added.

