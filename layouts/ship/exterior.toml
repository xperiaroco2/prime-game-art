# The review shots (`ship --shoot`, the exterior lane): [name, title, eye [x, y, h], look [x, y, h], fov, the 2D sheet
# in ref_dir it is compared with side by side]. They replace ship.toml's views of the same name; ship.toml's other
# views (the interior lane's) are shot too.
[shots]
ref_dir = "D:/prime-game-design/ideas/ship-components/2d/"
views = [
  ["out_front", "outside: front, ramp down (turnaround front)", [0.0, -31.0, 6.8], [0.0, 0.0, 1.8], 58.0, "turnaround.jpg"],  # rebuild B: back and wider for J's 30 m span
  ["out_hero", "outside: three-quarter at night (hero)", [-21.0, -24.0, 9.0], [0.8, 1.0, 1.8], 52.0, "hero.jpg"],
  ["out_side", "outside: side (turnaround side)", [-31.0, 1.5, 3.0], [0.0, 1.5, 2.2], 46.0, "turnaround.jpg"],
  ["out_back", "outside: back with the nozzles (turnaround back)", [2.0, 27.5, 4.4], [0.0, 1.0, 2.3], 62.0, "turnaround.jpg"],  # clear of the near pines
  ["detail_seam", "detail: the plates on the east wing (materials-3)", [7.0, 10.5, 7.20], [9.0, 4.5, 4.00], 40.0, "materials-3.jpg"],  # rebuild B: the plated wing's back slope in the moon
  ["detail_floor", "detail: a floor light strip and grate (materials-3)", [3.95, 0.20, 2.30], [5.93, 0.50, 1.20], 50.0, "materials-3.jpg"],  # lens step 2: down the east corridor on its 8.66 deg axis
  ["detail_cables", "detail: a cable channel with clips (materials-3)", [5.54, 0.44, 2.50], [4.92, 1.87, 2.10], 55.0, "materials-3.jpg"],  # lens step 2: the corridor's back wall
  # lens step 2: a lens from outside (the window band, the edge light), its roof windows from above, the tapered tail
  ["out_lens_e", "outside: the east lens, its window band and the edge light", [18.0, -4.5, 2.80], [10.6, 1.2, 2.50], 50.0, "hero.jpg"],
  ["out_lens_roof_e", "outside: the east lens's roof windows from above", [14.8, 4.6, 8.00], [10.9, 1.2, 3.70], 48.0, "hero.jpg"],
  ["out_tail", "outside: the tail tapering to the pods", [13.0, 21.0, 6.10], [1.5, 9.0, 2.80], 50.0, "turnaround.jpg"],
]

# The walk-through video (`ship --walk DIR`, the exterior lane): a camera at eye height (1.65 m over the floor: deck
# 1.2 -> 2.85 (the raise), ground -> 1.7) through camera keys [eye [x, y, h], look [x, y, h], seconds from the previous key],
# smoothed through the keys (Catmull-Rom); outside, up the ramp, the hall, the west corridor and tip room, the east
# corridor and tip room, back down the ramp and a last look at the ship. 1280x720 at fps, H.264 MP4 under max_mb.
[video]
