  ["in_corridor_w", "inside: the west corridor (corridor)", [-3.0, 0.0, 2.2], [-10.0, 0.0, 2.0], 70.0, "corridor.jpg"],
  ["in_tip_e", "inside: the east tip room toward its window (tip-3)", [6.3, 0.9, 1.95], [10.1, -0.35, 1.55], 75.0, "tip-3.jpg"],  # v2: from the corridor's end, the whole room r 1.8
