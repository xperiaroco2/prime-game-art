  ["out_front", "outside: front, ramp down (turnaround front)", [0.0, -21.0, 5.6], [0.0, 0.0, 1.5], 48.0, "turnaround.jpg"],  # join 3: raised as the turnaround's front (the upper slopes and the canopies read)
  ["out_hero", "outside: three-quarter at night (hero)", [-15.0, -17.0, 6.5], [0.8, 0.0, 1.8], 50.0, "hero.jpg"],
  ["out_side", "outside: side (turnaround side)", [-25.0, -3.0, 2.6], [0.0, 0.0, 2.2], 46.0, "turnaround.jpg"],
  ["out_back", "outside: back with the nozzles (turnaround back)", [4.0, 21.0, 3.4], [0.0, 0.0, 2.3], 50.0, "turnaround.jpg"],
  ["in_hall", "inside: the hall from the ramp (hall_in-3)", [0.0, -4.3, 2.2], [0.0, 2.0, 2.0], 75.0, "hall_in-3.jpg"],
  ["in_hall_out", "inside: the hall toward the ramp (hall_out-2)", [0.0, 0.0, 2.25], [0.0, -8.0, 1.6], 52.0, "hall_out-2.jpg"],  # polish 4: from the hall's centre (was y 1.0, the console's spot), the opening wider in frame
