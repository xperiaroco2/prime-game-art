# The empty ship, a wide metal manta (art #263). The numbers win over the pictures' curvature (the engineer).
# Version 2, the mirrored layout (2026-10-22): prime-game docs/design/estate-map.md section 5a (xperiaroco2/prime-game
# #1293) and prime-game-design ideas/ship-components/2d/README.md "The layout mirrored": for the geometry 5a wins over
# plan-3.jpg; the 2D sheets still set the look.
# Plan coordinates from the ship's centre in metres: x east, y south, h up from the ground. Godot: (x, h, y).
# `tools/run.py ship --check` checks every rule below (tools/runner/ship_layout.py, docs/ship.md).
version = 2
raw_dir = "ship/v2"                          # under the raw folder: pieces/, shots/, plan/, logs/, notes/
interior = "layouts/ship/interior.toml"      # the INTERIOR lane's pieces and placements
exterior = "layouts/ship/exterior.toml"      # the EXTERIOR lane's pieces and placements
plan_ref = "D:/prime-game-design/ideas/ship-components/2d/plan-3.jpg"

[size]                                       # the hull variant J, the engineer's pick (art #263 comment 6340589162)
width_m = 30.0                               # J: span 30.0 m (blockout4 report.json: 29.999)
span_max_m = 30.0                            # J's span (was 27.5, the lens tips' blades)
length_m = 18.9                              # J with the nozzle pods, no ramp (blockout4 report.json: 18.9; was 14.0)
length_max_m = 19.4                          # J's 18.9 + the tolerance (was 15.0)
tolerance_m = 0.5
corridor_width_m = 3.0                       # 5a mirrored: straight corridors 3 m wide (v1: 2.5)
tip_outer_m = 10.1                           # 5a mirrored: the tip rooms' outer wall at x +-10.1 (v1: 12.8)

[deck]
ground_h = 0.0
floor_h = 0.6                                # the deck's walking surface, on landing legs (update 2: was 1.0)
slab_m = 0.25                                # floor slabs from floor_h - slab_m up to floor_h
wall_m = 0.2

[player]                                     # the game's capsule and the head room every room keeps above it
capsule_radius_m = 0.4
capsule_height_m = 1.8
head_margin_m = 0.5

# Rooms. clear_h: floor to ceiling at the wall; apex_h: floor to the ceiling's highest point.
[[rooms]]
id = "hall"
shape = "circle"
centre = [0.0, 0.0]
radius = 4.0                                  # 5a mirrored: 8 m across, about 50 m2 (v1: 3.4)
clear_h = 3.2                                 # update 2 (was 3.4 / 4.0): the hull thins
apex_h = 3.8
links = ["mouth", "corridor_w", "corridor_e"]
# rebuild A (variant J): the tip rooms at (+-8.3, 4.0); the corridors straight and diagonal from the hall's wall to
# each tip room's wall. A "strip" room: `axis` [from, to] its centre line (here from the hall's centre to the tip
# room's), `along` [u0, u1] its floor's ends measured along the axis from `from` (where its walls cross the hall's
# circle and the tip room's), `width` across.

[[rooms]]
id = "mouth"                                 # the short passage from the ramp's hinge into the hall
shape = "rect"
x = [-1.3, 1.3]
y = [-4.6, -3.9]                             # v2: the hall's wall at y -4.0; the ramp's hinge stays at -4.6
clear_h = 2.4
exit = "ramp"                                # the only way in or out (5a's side hatch is dropped: one entrance, art#263)

[[rooms]]
id = "corridor_w"
shape = "strip"
axis = [[0.0, 0.0], [-8.3, 4.0]]              # 25.73 deg south of west, 9.214 m centre to centre
along = [3.708, 8.219]                        # v2: x -3.7..-7.3 on the x axis; 4.51 m of floor now
width = 3.0
clear_h = 2.4                                 # update 2 (was 2.6)
links = ["tip_w"]

[[rooms]]
id = "corridor_e"
shape = "strip"
axis = [[0.0, 0.0], [8.3, 4.0]]
along = [3.708, 8.219]
width = 3.0
clear_h = 2.4                                 # update 2 (was 2.6)
links = ["tip_e"]

[[rooms]]
id = "tip_w"
shape = "circle"
centre = [-8.3, 4.0]                          # rebuild A (variant J): was (-8.3, 0); no window (plain wall facets)
radius = 1.8                                  # v2: 3.6 m across, the outer wall at x -10.1
clear_h = 2.5                                 # update 2 (was 2.8 / 3.2)
apex_h = 2.8

[[rooms]]
id = "tip_e"
shape = "circle"
centre = [8.3, 4.0]                           # rebuild A (variant J): was (8.3, 0); no window
radius = 1.8                                  # v2: 3.6 m across, the outer wall at x 10.1
clear_h = 2.5                                 # update 2 (was 2.8 / 3.2)
apex_h = 2.8

# The future stations (estate-map 5a mirrored): NOT built yet; only their spots stay plain and clear. A wall spot: `at`
# the point on the wall's face where the unit hangs flat, `normal` into the room; the wall stays a flat panel
# plain_width_m wide there (no niche, trunk, cable bay, arch or rib sticking out: the pieces with a `foot` in their
# lane file keep off it); a player stands depth_m (the unit) + the capsule's radius in front of it with pass_m of free
# floor behind. A floor spot (the console): `at` its centre, radius_m clear floor. `ship --check` holds all of it.
[stations]
radius_m = 0.35                               # a floor station's footprint radius
depth_m = 0.5                                 # a wall unit's depth from its wall
plain_width_m = 1.6                           # the flat panel at a wall spot
pass_m = 1.6                                  # free floor behind a player standing at a spot

[[stations.spot]]
id = "console"
at = [0.0, 1.0]
room = "hall"

[[stations.spot]]
id = "vent_e"                                 # the hall wall east of the mouth (5a: about (2.6, -2.6)), on the flat
at = [2.664, -2.664]                          # chord at 45 deg (apothem 3.768: the 16-gon's two facets made one)
normal = [-1.0, 1.0]
room = "hall"

[[stations.spot]]
id = "vent_w"
at = [-2.664, -2.664]
normal = [1.0, 1.0]
room = "hall"

[[stations.spot]]
id = "socket_e"                               # the hall wall east of the back; rebuild A: the corridor's opening
at = [1.800, 3.512]                           # (3.2..48.2 deg) took v2's chord at 45 deg (2.664, 2.664): the flat chord
normal = [-0.4561, -0.8899]                   # moved back to 48.2..77.5 deg (2.06 m, apothem 3.946), the spot 1.21 m
room = "hall"

[[stations.spot]]
id = "socket_w"
at = [-1.800, 3.512]
normal = [0.4561, -0.8899]
room = "hall"

[[stations.spot]]
id = "breaker_e"                              # the corridor's front (north) wall, centred between its arches
at = [6.030, 1.241]                           # (u 5.971 along the axis; v2: (5.25, -1.5) on the straight corridor)
normal = [-0.4341, 0.9008]
room = "corridor_e"

[[stations.spot]]
id = "breaker_w"
at = [-6.030, 1.241]
normal = [0.4341, 0.9008]
room = "corridor_w"

[[stations.spot]]
id = "renewer_e"                              # a waist-high washer before the tip room's outer wall, on its axis
at = [9.922, 4.781]                           # (rebuild A: plain wall facets, no window; v2 (10.1, 0)); the player
normal = [-0.9008, -0.4341]                   # stands 1.3 m in, the pass behind runs back toward the corridor
room = "tip_e"
depth_m = 0.9

[[stations.spot]]
id = "renewer_w"
at = [-9.922, 4.781]
normal = [0.9008, -0.4341]
room = "tip_w"
depth_m = 0.9

[ramp]                                       # the mouth ramp, north at the centre; it meets the ground
width_m = 2.6
hinge = [0.0, -4.6]                          # at floor_h, the mouth room's north edge
foot = [0.0, -7.4]                           # at ground_h (launch 3: a long plane, 11 deg)
thickness_m = 0.15

# The hull's footprint: variant J of the blockouts (tools/blender/ship_hull_shape.py, built by ship_hull_j.py; the
# engineer's pick, art #263 comment 6340589162). `ship --check` tests the rooms and pieces inside it and the least skin
# round every room (ship_hull_shape.clearance). Rows [x, lead y, trail y, bottom h, top h, -1] at the plan outline's
# corners from the centre line out, the last (the tip's outermost x) the plate row; mirrored for x < 0. Regenerate them
# with ship_hull_shape.outline_rows() when the shape changes (test_ship_layout checks they match).
[hull]
shape = "J"                                  # ship_hull_shape.VARIANTS key
bottom_h = 0.17                              # J's belly, flat under every room's slab (0.35), rising toward the edges
brow_h = 4.3                                 # the spine's front over the mouth
mouth_half_width_m = 1.3                     # the front face's opening over the mouth room
trail_y = 10.2                               # J's stern face
pod_tail_m = 0.435                           # a nozzle pod's tip past its args length (pod_ring's inner ring)
# (test_ship_hull_detail.py measures it from the builders; `ship --check` reads the nozzle tips from the pods'
# placements and args)
pod_radius_m = 2.0                           # the tip rooms' outer wall round their centre (J: no blade past them)
core = [
  [0, -7.1, 10.2, 0.17, 4.82, -1],
  [2.2, -7.1, 10.2, 0.17, 4.72, -1],
