# Per glTF material (ship.gd _look): v base colour x, r roughness +, m metallic, c colour (and emission colour),
# e emission x (keeps the hue under AgX), a alpha, l its strip lights x (0: glows, lights nothing), rr their range x. Metallic 0.45
# lets the lamps light the silver (at 0.7 it only mirrored the dark rooms); the lamp ring and lamps light nothing,
# so the hall's centre disc stays dark metal.
[light.mats]
int_cyan = {c = [0.05, 0.8, 1.0], e = 0.05, l = 0.0}                # inside 3-1 (grid_in31 C): glows only; 0.04 still washed the corridors teal
