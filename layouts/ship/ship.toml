party_lamp = 1.3
rim_lamp = 1.2
ssil_intensity = 0.4                           # screen-space bounce (1: the lamp ring's band lit a spot on the hall's disc)
sky_horizon = 10.0                             # inside 3-1 (grid_in31 C; was 5): the sky's horizon colour x this (the windows' and the ramp's view)

# Per glTF material (ship.gd _look): v base colour x, r roughness +, m metallic, c colour (and emission colour),
# e emission x (keeps the hue under AgX), a alpha, l its strip lights x (0: glows, lights nothing), rr their range x. Metallic 0.45
# lets the lamps light the silver (at 0.7 it only mirrored the dark rooms); the lamp ring and lamps light nothing,
# so the hall's centre disc stays dark metal.
[light.mats]
int_cyan = {c = [0.05, 0.8, 1.0], e = 0.05, l = 0.0}                # inside 3-1 (grid_in31 C): glows only; 0.04 still washed the corridors teal
int_amber = {c = [1.0, 0.42, 0.06], e = 0.14, l = 2.0, rr = 0.5}    # e 0.14: the strips pass the glow threshold, still amber
int_amber_ring = {c = [1.0, 0.42, 0.06], e = 0.14, l = 0.8, rr = 0.3}  # the hall's floor ring: its own, shorter lights
int_lamp = {c = [1.0, 0.6, 0.26], e = 0.08, l = 0.0}
int_halo = {c = [1.0, 0.45, 0.1], e = 0.5, l = 0.0}                # the floor strips' frosted halo: glows, lights nothing
int_plate = {v = 1.0, r = 0.45, m = 0.3}                            # join 2: at metallic 0.8 the hall's centre disc mirrored the dark lamp cap (a black hole); diffuse now
int_grate = {v = 1.2, r = 0.1, m = 0.6}
int_glass = {a = 0.05, r = -0.03}
int_silver_a = {v = 0.55, r = 0.25, m = 0.45}
int_silver_b = {v = 0.55, r = 0.25, m = 0.45}
int_silver_c = {v = 0.55, r = 0.25, m = 0.45}


