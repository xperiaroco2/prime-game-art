# The empty ship, a wide metal manta (art #263). The numbers win over the pictures' curvature (the engineer).
# Version 2, the mirrored layout (2026-10-22): prime-game docs/design/estate-map.md section 5a (xperiaroco2/prime-game
# #1293) and prime-game-design ideas/ship-components/2d/README.md "The layout mirrored": for the geometry 5a wins over
# plan-3.jpg; the 2D sheets still set the look.
# Plan coordinates from the ship's centre in metres: x east, y south, h up from the ground. Godot: (x, h, y).
# `tools/run.py ship --check` checks every rule below (tools/runner/ship_layout.py, docs/ship.md).
version = 3                                  # lens step 1 (art#263 c6344490367): the lens rooms, the vault
raw_dir = "ship/v3"                          # under the raw folder: pieces/, shots/, plan/, logs/, notes/
interior = "layouts/ship/interior.toml"      # the INTERIOR lane's pieces and placements
exterior = "layouts/ship/exterior.toml"      # the EXTERIOR lane's pieces and placements
plan_ref = "D:/prime-game-design/ideas/ship-components/2d/plan-3.jpg"

[size]                                       # the lens-diamond hull P: the manager's pick under the engineer's standing
                                             # instruction (art#263 c6344490367; <raw>/ship/v2/blockout6/report.json)
width_m = 26.1                               # P: span 26.111 (J: 30.0)
span_max_m = 26.1
length_m = 22.1                              # P as built with the nozzle pods, no ramp (blockout6 22.15; J: 18.9)
length_max_m = 22.65                         # P's 22.15 + the tolerance
tolerance_m = 0.5
corridor_width_m = 3.0                       # 5a mirrored: straight corridors 3 m wide (v1: 2.5)
tip_outer_m = 12.5                           # lens step 1: the lens rooms' outer wall at x +-12.5 (r 2.0 at x 10.5; J 10.1)

[deck]
ground_h = 0.0
floor_h = 0.6                                # the deck's walking surface, on landing legs (update 2: was 1.0)
slab_m = 0.25                                # floor slabs from floor_h - slab_m up to floor_h
wall_m = 0.2

[player]                                     # the game's capsule and the head room every room keeps above it
capsule_radius_m = 0.4
capsule_height_m = 1.8
head_margin_m = 0.5

# Rooms. clear_h: floor to ceiling at the wall; apex_h: floor to the ceiling's highest point.
[[rooms]]
id = "hall"
shape = "circle"
centre = [0.0, -0.4]                          # rebuild E (art#263 c6342342554): 0.4 m forward of step A (C: 1 m)
radius = 4.0                                  # 5a mirrored: 8 m across, about 50 m2 (v1: 3.4)
clear_h = 3.2                                 # update 2 (was 3.4 / 4.0): the hull thins
apex_h = 3.8
links = ["throat", "corridor_w", "corridor_e"]
# lens step 1: the lens rooms ("tip_*") at (+-10.5, 1.2); the corridors straight from the hall's wall to each lens's
# wall, 8.66 deg aft. A "strip" room: `axis` [from, to] its centre line (here from the hall's centre to the tip
# room's), `along` [u0, u1] its floor's ends measured along the axis from `from` (where its walls cross the hall's
# circle and the tip room's), `width` across.

[[rooms]]
id = "throat"                                # rebuild C: the funnel from the mouth at J's nose edge to the hall's wall
shape = "poly"                               # a convex floor polygon [x, y], a positive signed area in plan (x, y):
                                             # counter-clockwise in the (x, y) axes, clockwise seen from above with y
                                             # running south
points = [[-1.65, -7.1], [1.65, -7.1], [2.915, -3.252], [-2.915, -3.252]]
clear_h = 2.3                                 # 2.9 over the ground: the capsule and its margin; walls vertical to
chamfer = [1.45, 0.55]                        # 1.45, then slanted 0.55 in to the ceiling (the corridors' bend)
roof_y = -5.5608                              # the ceiling from here aft (the front is J's open notch, no roof): the
                                              # first module line (5 of 0.810) with 0.15 m of hull over the roof
exit = "ramp"                                # the only way in or out (5a's side hatch is dropped: one entrance, art#263)

[[rooms]]
id = "corridor_w"
shape = "strip"
axis = [[0.0, -0.4], [-10.5, 1.2]]              # 8.66 deg south of west, 10.621 m centre to centre
along = [3.708, 9.2983]                       # lens step 1: the hall's circle to the lens's (r 2.0): 5.59 m of floor
width = 3.0
clear_h = 2.4                                 # update 2 (was 2.6)
links = ["tip_w"]

[[rooms]]
id = "corridor_e"
shape = "strip"
axis = [[0.0, -0.4], [10.5, 1.2]]
along = [3.708, 9.2983]
width = 3.0
clear_h = 2.4                                 # update 2 (was 2.6)
links = ["tip_e"]

[[rooms]]
id = "tip_w"                                # lens step 1: the west lens room (P's lens; ids kept)
shape = "circle"
centre = [-10.5, 1.2]
radius = 2.0                                  # 4 m across, 0.2 m walls; the outer wall at x -12.5
clear_h = 2.35                                # the least: the ceiling slants down outward (clear at the outer wall)
clear_h_in = 2.45                             # at the corridor's side; clear(t) = clear_h + (clear_h_in - clear_h) *
apex_h = 2.45                                 # (r + wall - t) / (2 (r + wall)), t along the axis from the centre (P's)
ceiling = "slant"
# the window band on the outer side: deg round the room's outward axis (the corridor's, from the hall), + aft;
# -65..+45, biased forward: P's trail fin hides the band from +45.0 (blockout6 report.json hidden_deg)
band = {from_deg = -65.0, to_deg = 45.0, sill_h = 1.0, head_h = 2.2}
# the roof windows in the slanted ceiling: centres [along the axis, across (+ aft)] from the room's centre, size
# [along, across] (P's RAY_PANELS, RAY_PANEL)
roof_windows = [[0.35, -0.8], [0.35, 0.8], [1.3, 0.0]]
roof_window_m = [0.9, 0.7]

[[rooms]]
id = "tip_e"                                # lens step 1: the east lens room (P's lens; ids kept)
shape = "circle"
centre = [10.5, 1.2]
radius = 2.0                                  # 4 m across, 0.2 m walls; the outer wall at x 12.5
clear_h = 2.35                                # the least: the ceiling slants down outward (clear at the outer wall)
clear_h_in = 2.45                             # at the corridor's side; clear(t) = clear_h + (clear_h_in - clear_h) *
apex_h = 2.45                                 # (r + wall - t) / (2 (r + wall)), t along the axis from the centre (P's)
ceiling = "slant"
# the window band on the outer side: deg round the room's outward axis (the corridor's, from the hall), + aft;
# -65..+45, biased forward: P's trail fin hides the band from +45.0 (blockout6 report.json hidden_deg)
band = {from_deg = -65.0, to_deg = 45.0, sill_h = 1.0, head_h = 2.2}
# the roof windows in the slanted ceiling: centres [along the axis, across (+ aft)] from the room's centre, size
# [along, across] (P's RAY_PANELS, RAY_PANEL)
roof_windows = [[0.35, -0.8], [0.35, 0.8], [1.3, 0.0]]
roof_window_m = [0.9, 0.7]

[[rooms]]
id = "vault"                                  # lens step 1: a closet behind the hall's back wall, a shell only (no item,
shape = "rect"                                # card or lock logic); not linked, the walk does not enter it
x = [-0.9, 0.9]                               # 1.8 x 2.0 m clear
y = [3.85, 5.85]
clear_h = 2.3                                 # at the door; the ceiling slants down aft to clear_h_back
clear_h_back = 1.6
ceiling = "slant"
closed = true                                 # its door is shut: no exit, no link, not walkable floor
door = {at = [0.0, 3.6], width_m = 1.0, room = "hall"}   # the hall's back wall between the back sockets

# The future stations (estate-map 5a mirrored): NOT built yet; only their spots stay plain and clear. A wall spot: `at`
# the point on the wall's face where the unit hangs flat, `normal` into the room; the wall stays a flat panel
# plain_width_m wide there (no niche, trunk, cable bay, arch or rib sticking out: the pieces with a `foot` in their
# lane file keep off it); a player stands depth_m (the unit) + the capsule's radius in front of it with pass_m of free
# floor behind. A floor spot (the console): `at` its centre, radius_m clear floor. `ship --check` holds all of it.
[stations]
radius_m = 0.35                               # a floor station's footprint radius
depth_m = 0.5                                 # a wall unit's depth from its wall
plain_width_m = 1.6                           # the flat panel at a wall spot
pass_m = 1.6                                  # free floor behind a player standing at a spot

[[stations.spot]]
id = "console"
at = [0.0, 0.6]                               # 1 m aft of the hall's centre (step A: (0, 1))
room = "hall"

[[stations.spot]]
id = "vent_e"                                 # rebuild C: on the throat's slanted east wall (asked (2.3, -5.8)).
at = [2.4090, -4.7912]                        # rebuild F: on the line between wall modules 2 and 3 (3/5 of the wall
normal = [-0.9500, 0.3123]                    # from the mouth (1.65, -7.1) to the hall's vertex (2.915, -3.252)), so
                                              # its 1.6 m plain band lies on those two plain modules, off the jamb
room = "throat"

[[stations.spot]]
id = "vent_w"
at = [-2.4090, -4.7912]
normal = [0.9500, 0.3123]
room = "throat"

[[stations.spot]]
