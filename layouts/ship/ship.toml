# The empty ship, a wide metal manta (art #263, step 1). The numbers win over the pictures' curvature (the engineer).
# Sources: prime-game docs/design/estate-map.md section 5a; the approved 2D in prime-game-design
# ideas/ship-components/2d/ (plan-3.jpg, the top view, is the source of truth for the arrangement).
# Plan coordinates from the ship's centre in metres: x east, y south, h up from the ground. Godot: (x, h, y).
# `tools/run.py ship --check` checks every rule below (tools/runner/ship_layout.py, docs/ship.md).
version = 1
raw_dir = "ship/v1"                          # under the raw folder: pieces/, shots/, plan/, logs/, notes/
interior = "layouts/ship/interior.toml"      # the INTERIOR lane's pieces and placements
exterior = "layouts/ship/exterior.toml"      # the EXTERIOR lane's pieces and placements
plan_ref = "D:/prime-game-design/ideas/ship-components/2d/plan-3.jpg"

[size]                                       # estate-map 5a: about 26 m wide by 14 m long
width_m = 26.0
span_max_m = 27.5                            # manager update 2: the lens tips' blades may reach about 27.5 m
length_m = 14.0
tolerance_m = 0.5

[deck]
ground_h = 0.0
floor_h = 0.6                                # the deck's walking surface, on landing legs (update 2: was 1.0)
slab_m = 0.25                                # floor slabs from floor_h - slab_m up to floor_h
wall_m = 0.2

[player]                                     # the game's capsule and the head room every room keeps above it
capsule_radius_m = 0.4
capsule_height_m = 1.8
head_margin_m = 0.5

# Rooms. clear_h: floor to ceiling at the wall; apex_h: floor to the ceiling's highest point.
[[rooms]]
id = "hall"
shape = "circle"
centre = [0.0, 0.0]
radius = 3.4
clear_h = 3.2                                 # update 2 (was 3.4 / 4.0): the hull thins
apex_h = 3.8
links = ["mouth", "corridor_w", "corridor_e"]

[[rooms]]
id = "mouth"                                 # the short passage from the ramp's hinge into the hall
shape = "rect"
x = [-1.3, 1.3]
y = [-4.6, -3.3]
clear_h = 2.4
exit = "ramp"                                # the only way in or out (5a's side hatch is dropped: one entrance, art#263)

[[rooms]]
id = "corridor_w"
shape = "rect"
x = [-9.1, -3.3]
y = [-1.25, 1.25]
clear_h = 2.4                                 # update 2 (was 2.6)
links = ["tip_w"]

[[rooms]]
id = "corridor_e"
shape = "rect"
x = [3.3, 9.1]
y = [-1.25, 1.25]
clear_h = 2.4                                 # update 2 (was 2.6)
links = ["tip_e"]

[[rooms]]
id = "tip_w"
shape = "circle"
centre = [-10.75, 0.0]
radius = 2.05
clear_h = 2.5                                 # update 2 (was 2.8 / 3.2)
apex_h = 2.8
window = { dir = [-1.0, 0.0], half_angle_deg = 65.0, sill_h = 0.45, head_h = 2.2 }   # glass onto the clearing, not an exit

[[rooms]]
id = "tip_e"
shape = "circle"
centre = [10.75, 0.0]
radius = 2.05
clear_h = 2.5                                 # update 2 (was 2.8 / 3.2)
apex_h = 2.8
window = { dir = [1.0, 0.0], half_angle_deg = 65.0, sill_h = 0.45, head_h = 2.2 }

# The future stations (estate-map 5a): NOT built in step 1; only their spots stay clear. radius_m: the footprint kept
# free; at_wall: stands at a corridor wall (within wall_reach_m of it).
[stations]
radius_m = 0.35
wall_depth_m = 0.5                            # a wall station's depth from its wall
wall_reach_m = 0.6
min_free_width_m = 1.2                       # walking width left beside a station in a corridor

[[stations.spot]]
id = "console"
at = [0.0, 1.0]
room = "hall"

[[stations.spot]]
id = "vent_w"
at = [-5.0, -1.0]
room = "corridor_w"
at_wall = true

[[stations.spot]]
id = "socket_w"
at = [-8.0, -1.0]
room = "corridor_w"
at_wall = true

[[stations.spot]]
id = "panel"
at = [-10.5, 0.0]
room = "tip_w"

[[stations.spot]]
id = "vent_e"
at = [5.0, -1.0]
room = "corridor_e"
at_wall = true

[[stations.spot]]
id = "socket_e"
at = [8.0, -1.0]
room = "corridor_e"
at_wall = true

[[stations.spot]]
id = "renewer"
at = [12.0, 0.0]
room = "tip_e"

[ramp]                                       # the mouth ramp, north at the centre; it meets the ground
width_m = 2.6
hinge = [0.0, -4.6]                          # at floor_h, the mouth room's north edge
foot = [0.0, -7.4]                           # at ground_h (launch 3: a long plane, 11 deg)
thickness_m = 0.15

# The hull's footprint (the skin of tools/blender/ship_hull_skin.py, variant J of launch 3's grid; `ship --check` tests
# the rooms and pieces inside it). Rows [x, lead y, trail y, blade h, ridge h, eave half-depth]: core rows up to the
# tip room's centre, plate rows round the lens tip (its blade at r 3.0) to the swept tip point; mirrored for x < 0.
# Regenerate the rows from ship_hull_skin.outline() when the variant changes.
[hull]
bottom_h = 0.3                              # the belly under every room (it rises toward the edges)
brow_h = 3.45                              # the brow over the mouth
mouth_half_width_m = 1.3                     # the front face's opening over the mouth room
stern_y = 6.9                                # the nozzles' tips
pod_radius_m = 3.0                           # the lens tip's blade (10.75 + 3.0 = 13.75: span 27.5 m)
core = [
  [0, -4.60, 5.00, 0.90, 4.90, 4.20],
  [1.5, -6.50, 5.10, 0.90, 4.74, 3.52],
  [3, -5.84, 5.20, 0.93, 4.42, 2.32],
  [4, -5.40, 5.23, 0.95, 4.21, 1.60],
  [6, -4.65, 5.30, 1.07, 3.74, 1.60],
  [8, -3.90, 5.40, 1.20, 3.69, 1.60],
  [9.1, -3.54, 5.40, 1.36, 3.66, 1.65],
]
plate = [
  [11.35, -2.79, 5.73, 1.70, 3.62, -1],
  [12.15, -2.45, 6.12, 1.70, 3.62, -1],
  [12.75, -2.17, 5.94, 1.70, 3.62, -1],
  [13.25, -1.76, 4.19, 1.70, 3.62, -1],
  [13.6, -1.12, 3.04, 1.70, 3.62, -1],
]

# Review light (the exterior lane tunes it). lamps: [x, y, h, energy, range, r, g, b].
[light]
moon_dir_deg = [-30.0, 35.0]                 # pitch, yaw: from behind the ship (hull 3 grid_out B; [-38, 140] lit flat plates)
moon_energy = 0.6                           # hull 3 grid_out B (was 1.3 from the front: flat moonlit patches)
# hull 3-2: a cool key from the north-west (the hero, front and side cameras' side; the moon stays the rim from behind),
# shadowed, so the inside stays dark; the moon's and the key's shadows fill each other beside the ship
key_dir_deg = [-38.0, -140.0]                # pitch, yaw: travels south-east
key_energy = 0.55
key_color = [0.78, 0.84, 1.0]
key_specular = 1.4
# The night look, picked by the join step's look grid (<raw>/ship/v1/grid/grid2.png, variant H): the interior's metal
# mirrored its strips and lamps (strength 8..12) through the room probes and washed out white; these keep it mid-to-dark
# with saturated cyan and amber. Read by godot/ship/ship.gd (_lk); a missing key keeps the old value.
ambient_energy = 0.12                          # env ambient (was 0.9)
exposure = 1.0                                 # AgX exposure (was 1.2)
emission_scale = 0.12                          # every emissive glTF material's strength x this (keeps the hue)
strip_light_scale = 1.5                        # the OmniLight per emissive cell (from the unscaled strength)
strip_whiten = 0.0                             # those lights' colour lightened by this (was 0.15)
lamp_scale = 0.25                              # the lamps below
probe_intensity = 0.15                         # interior rooms' reflection probes (the tip rooms with windows keep 1.0)
int_value = 0.55                               # the int_silver_* base colour x this
int_rough_add = 0.25                           # + the int_silver_* roughness
hull_rough_add = 0.12                          # + the hull silvers' roughness (was 0.22; hull 3-2: the key needs highlights)
# The room-by-room light (the inside lane's grids, <raw>/ship/v1/grid_in3/{hall,corridor,tip}.png, variant J with
