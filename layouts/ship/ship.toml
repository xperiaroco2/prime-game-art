# The empty ship, a wide metal manta (art #263, step 1). The numbers win over the pictures' curvature (the engineer).
# Sources: prime-game docs/design/estate-map.md section 5a; the approved 2D in prime-game-design
# ideas/ship-components/2d/ (plan-3.jpg, the top view, is the source of truth for the arrangement).
# Plan coordinates from the ship's centre in metres: x east, y south, h up from the ground. Godot: (x, h, y).
# `tools/run.py ship --check` checks every rule below (tools/runner/ship_layout.py, docs/ship.md).
version = 1
raw_dir = "ship/v1"                          # under the raw folder: pieces/, shots/, plan/, logs/, notes/
interior = "layouts/ship/interior.toml"      # the INTERIOR lane's pieces and placements
exterior = "layouts/ship/exterior.toml"      # the EXTERIOR lane's pieces and placements
plan_ref = "D:/prime-game-design/ideas/ship-components/2d/plan-3.jpg"

[size]                                       # estate-map 5a: about 26 m wide by 14 m long
width_m = 26.0
length_m = 14.0
tolerance_m = 0.5

[deck]
ground_h = 0.0
floor_h = 1.0                                # the deck's walking surface, on landing legs
slab_m = 0.25                                # floor slabs from floor_h - slab_m up to floor_h
wall_m = 0.2

[player]                                     # the game's capsule and the head room every room keeps above it
capsule_radius_m = 0.4
capsule_height_m = 1.8
head_margin_m = 0.5

# Rooms. clear_h: floor to ceiling at the wall; apex_h: floor to the ceiling's highest point.
[[rooms]]
id = "hall"
shape = "circle"
centre = [0.0, 0.0]
radius = 3.4
clear_h = 3.4
apex_h = 4.0
links = ["mouth", "corridor_w", "corridor_e"]

[[rooms]]
id = "mouth"                                 # the short passage from the ramp's hinge into the hall
shape = "rect"
x = [-1.3, 1.3]
y = [-4.6, -3.3]
clear_h = 2.6
exit = "ramp"                                # the only way in or out

[[rooms]]
id = "corridor_w"
shape = "rect"
x = [-9.1, -3.3]
y = [-1.25, 1.25]
clear_h = 2.6
links = ["tip_w"]

[[rooms]]
id = "corridor_e"
shape = "rect"
x = [3.3, 9.1]
y = [-1.25, 1.25]
clear_h = 2.6
links = ["tip_e"]

[[rooms]]
id = "tip_w"
shape = "circle"
centre = [-10.75, 0.0]
radius = 2.05
clear_h = 2.8
apex_h = 3.2
window = { dir = [-1.0, 0.0], half_angle_deg = 65.0, sill_h = 0.5, head_h = 2.4 }   # glass onto the clearing, not an exit

[[rooms]]
id = "tip_e"
shape = "circle"
centre = [10.75, 0.0]
radius = 2.05
clear_h = 2.8
apex_h = 3.2
window = { dir = [1.0, 0.0], half_angle_deg = 65.0, sill_h = 0.5, head_h = 2.4 }

# The future stations (estate-map 5a): NOT built in step 1; only their spots stay clear. radius_m: the footprint kept
# free; at_wall: stands at a corridor wall (within wall_reach_m of it).
[stations]
radius_m = 0.35
wall_depth_m = 0.5                            # a wall station's depth from its wall
wall_reach_m = 0.6
min_free_width_m = 1.2                       # walking width left beside a station in a corridor

[[stations.spot]]
id = "console"
at = [0.0, 1.0]
room = "hall"

[[stations.spot]]
id = "vent_w"
at = [-5.0, -1.0]
room = "corridor_w"
at_wall = true

[[stations.spot]]
id = "socket_w"
at = [-8.0, -1.0]
room = "corridor_w"
at_wall = true

[[stations.spot]]
id = "panel"
at = [-10.5, 0.0]
room = "tip_w"

[[stations.spot]]
id = "vent_e"
at = [5.0, -1.0]
room = "corridor_e"
at_wall = true

[[stations.spot]]
id = "socket_e"
at = [8.0, -1.0]
room = "corridor_e"
at_wall = true

[[stations.spot]]
id = "renewer"
at = [12.0, 0.0]
room = "tip_e"

[ramp]                                       # the mouth ramp, north at the centre; it meets the ground
width_m = 2.6
hinge = [0.0, -4.6]                          # at floor_h, the mouth room's north edge
foot = [0.0, -7.0]                           # at ground_h
thickness_m = 0.15

# The hull's footprint (the skin of tools/blender/ship_hull_skin.py, variant F; `ship --check` tests the rooms and
# pieces inside it). Rows [x, lead y, trail y, edge h, top h, core half-depth]: core rows up to the tip room's centre,
# plate rows round the tip fairing to the swept tip (x 13.23, y 5.9); mirrored for x < 0. Regenerate the rows from
# ship_hull_skin.outline() when the variant changes.
[hull]
bottom_h = 0.35                              # the keel under the hall (0.6 under the wings)
brow_h = 3.92                                # the brow over the mouth
mouth_half_width_m = 1.3                     # the front face's opening over the mouth room
stern_y = 6.9                                # the nozzles' tips
pod_radius_m = 2.41                          # the tip fairing's window band
core = [
  [0.0, -4.6, 5.0, 2.3, 5.95, 3.65],
  [1.5, -6.3, 5.08, 1.1, 5.95, 3.4],
  [3.0, -5.82, 5.15, 1.13, 5.3, 2.2],
  [4.0, -5.5, 5.12, 1.13, 4.85, 1.72],
  [6.0, -4.8, 5.05, 1.2, 4.15, 1.72],
  [8.0, -4.1, 5.0, 1.27, 4.15, 1.72],
  [9.1, -3.66, 4.96, 1.3, 4.15, 1.72],
]
plate = [
  [11.35, -2.81, 5.12, 1.38, 4.42, -1],
  [12.15, -2.49, 5.46, 1.38, 4.42, -1],
  [12.65, -2.31, 5.65, 1.38, 4.42, -1],
  [13.05, -1.83, 5.86, 1.38, 4.42, -1],
  [13.23, 5.0, 5.9, 1.38, 1.38, -1],
]

# Review light (the exterior lane tunes it). lamps: [x, y, h, energy, range, r, g, b].
[light]
moon_dir_deg = [-38.0, 140.0]                # pitch, yaw
moon_energy = 1.3                           # tuned by the exterior lane (ext1: 0.55 left the silver black)
# The night look, picked by the join step's look grid (<raw>/ship/v1/grid/grid2.png, variant H): the interior's metal
# mirrored its strips and lamps (strength 8..12) through the room probes and washed out white; these keep it mid-to-dark
# with saturated cyan and amber. Read by godot/ship/ship.gd (_lk); a missing key keeps the old value.
ambient_energy = 0.12                          # env ambient (was 0.9)
exposure = 1.0                                 # AgX exposure (was 1.2)
emission_scale = 0.12                          # every emissive glTF material's strength x this (keeps the hue)
strip_light_scale = 1.5                        # the OmniLight per emissive cell (from the unscaled strength)
strip_whiten = 0.0                             # those lights' colour lightened by this (was 0.15)
lamp_scale = 0.25                              # the lamps below
probe_intensity = 0.15                         # interior rooms' reflection probes (the tip rooms with windows keep 1.0)
int_value = 0.55                               # the int_silver_* base colour x this
int_rough_add = 0.25                           # + the int_silver_* roughness
hull_rough_add = 0.22                          # + the hull silvers' roughness (the moonlit white plates)
lamps = [
  [0.0, 0.0, 4.1, 2.2, 7.0, 1.0, 0.82, 0.6],
  [0.0, -4.0, 3.3, 1.0, 4.0, 1.0, 0.82, 0.6],
  [-6.0, 0.0, 3.3, 1.2, 5.0, 1.0, 0.8, 0.55],
  [6.0, 0.0, 3.3, 1.2, 5.0, 1.0, 0.8, 0.55],
  [-10.75, 0.0, 3.5, 1.2, 4.5, 0.85, 0.95, 1.0],
  [10.75, 0.0, 3.5, 1.2, 4.5, 0.85, 0.95, 1.0],
]

# The capsule walk: up the ramp, through the hall into both tip rooms and back out. Points [x, y, h].
[walk]
points = [[0.0, -9.0, 0.0], [0.0, -7.4, 0.0], [0.0, -4.4, 1.0], [0.0, -1.8, 1.0], [-3.0, 0.0, 1.0],
          [-10.4, 0.0, 1.0], [-3.0, 0.0, 1.0], [3.0, 0.0, 1.0], [10.4, 0.0, 1.0], [3.0, 0.0, 1.0],
          [0.0, -1.8, 1.0], [0.0, -4.4, 1.0], [0.0, -7.4, 0.0], [0.0, -9.0, 0.0]]

# Views: [name, title, eye [x, y, h], look [x, y, h], fov]; the plan view "top" (south up, as plan-3) is added by the
# command and compared side by side with plan_ref.
[shots]
views = [
  ["out_front", "outside: front, ramp down", [0.0, -19.0, 2.4], [0.0, 0.0, 2.2], 55.0],
  ["out_hero", "outside: three-quarter at night", [-17.0, -15.0, 6.0], [0.0, 0.0, 2.0], 50.0],
  ["in_hall", "inside: the hall from the ramp", [0.0, -4.3, 2.6], [0.0, 2.0, 2.4], 75.0],
  ["in_corridor_e", "inside: the east corridor", [3.0, 0.0, 2.6], [10.0, 0.0, 2.4], 70.0],
]
