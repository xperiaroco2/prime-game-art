# The empty ship, a wide metal manta (art #263). The numbers win over the pictures' curvature (the engineer).
# Version 2, the mirrored layout (2026-10-22): prime-game docs/design/estate-map.md section 5a (xperiaroco2/prime-game
# #1293) and prime-game-design ideas/ship-components/2d/README.md "The layout mirrored": for the geometry 5a wins over
# plan-3.jpg; the 2D sheets still set the look.
# Plan coordinates from the ship's centre in metres: x east, y south, h up from the ground. Godot: (x, h, y).
# `tools/run.py ship --check` checks every rule below (tools/runner/ship_layout.py, docs/ship.md).
version = 2
raw_dir = "ship/v2"                          # under the raw folder: pieces/, shots/, plan/, logs/, notes/
interior = "layouts/ship/interior.toml"      # the INTERIOR lane's pieces and placements
exterior = "layouts/ship/exterior.toml"      # the EXTERIOR lane's pieces and placements
plan_ref = "D:/prime-game-design/ideas/ship-components/2d/plan-3.jpg"

[size]                                       # estate-map 5a: about 26 m wide by 14 m long
width_m = 26.0
span_max_m = 27.5                            # manager update 2: the lens tips' blades may reach about 27.5 m
length_m = 14.0                              # checked with the nozzle pods (the ship's length on the map), no ramp
length_max_m = 15.0                          # the manager, art #263: how far the nozzles stick out is open (2D README); 14.49 m at the v2 join
tolerance_m = 0.5
corridor_width_m = 3.0                       # 5a mirrored: straight corridors 3 m wide (v1: 2.5)
tip_outer_m = 10.1                           # 5a mirrored: the tip rooms' outer wall at x +-10.1 (v1: 12.8)

[deck]
ground_h = 0.0
floor_h = 0.6                                # the deck's walking surface, on landing legs (update 2: was 1.0)
slab_m = 0.25                                # floor slabs from floor_h - slab_m up to floor_h
wall_m = 0.2

[player]                                     # the game's capsule and the head room every room keeps above it
capsule_radius_m = 0.4
capsule_height_m = 1.8
head_margin_m = 0.5

# Rooms. clear_h: floor to ceiling at the wall; apex_h: floor to the ceiling's highest point.
[[rooms]]
id = "hall"
shape = "circle"
centre = [0.0, 0.0]
radius = 4.0                                  # 5a mirrored: 8 m across, about 50 m2 (v1: 3.4)
clear_h = 3.2                                 # update 2 (was 3.4 / 4.0): the hull thins
apex_h = 3.8
links = ["mouth", "corridor_w", "corridor_e"]

[[rooms]]
id = "mouth"                                 # the short passage from the ramp's hinge into the hall
shape = "rect"
x = [-1.3, 1.3]
y = [-4.6, -3.9]                             # v2: the hall's wall at y -4.0; the ramp's hinge stays at -4.6
clear_h = 2.4
exit = "ramp"                                # the only way in or out (5a's side hatch is dropped: one entrance, art#263)

[[rooms]]
id = "corridor_w"
shape = "rect"
x = [-7.3, -3.7]                             # v2: straight, from the hall's circle to the tip room's (both at y +-1.5)
y = [-1.5, 1.5]
clear_h = 2.4                                 # update 2 (was 2.6)
links = ["tip_w"]

[[rooms]]
id = "corridor_e"
shape = "rect"
x = [3.7, 7.3]
y = [-1.5, 1.5]
clear_h = 2.4                                 # update 2 (was 2.6)
links = ["tip_e"]

[[rooms]]
id = "tip_w"
shape = "circle"
centre = [-8.3, 0.0]
radius = 1.8                                  # v2: 3.6 m across, the outer wall at -10.1
clear_h = 2.5                                 # update 2 (was 2.8 / 3.2)
apex_h = 2.8
window = { dir = [-1.0, 0.0], half_angle_deg = 65.0, sill_h = 1.0, head_h = 2.2 }   # glass onto the clearing, not an exit

[[rooms]]
id = "tip_e"
shape = "circle"
centre = [8.3, 0.0]
radius = 1.8                                  # v2: 3.6 m across, the outer wall at 10.1
clear_h = 2.5                                 # update 2 (was 2.8 / 3.2)
apex_h = 2.8
window = { dir = [1.0, 0.0], half_angle_deg = 65.0, sill_h = 1.0, head_h = 2.2 }    # join 3: sill 0.45 -> 1.0 (the lens band starts 1.33 m up)

# The future stations (estate-map 5a mirrored): NOT built yet; only their spots stay plain and clear. A wall spot: `at`
# the point on the wall's face where the unit hangs flat, `normal` into the room; the wall stays a flat panel
# plain_width_m wide there (no niche, trunk, cable bay, arch or rib sticking out: the pieces with a `foot` in their
# lane file keep off it); a player stands depth_m (the unit) + the capsule's radius in front of it with pass_m of free
# floor behind. A floor spot (the console): `at` its centre, radius_m clear floor. `ship --check` holds all of it.
[stations]
radius_m = 0.35                               # a floor station's footprint radius
depth_m = 0.5                                 # a wall unit's depth from its wall
plain_width_m = 1.6                           # the flat panel at a wall spot
pass_m = 1.6                                  # free floor behind a player standing at a spot

[[stations.spot]]
id = "console"
at = [0.0, 1.0]
room = "hall"

[[stations.spot]]
id = "vent_e"                                 # the hall wall east of the mouth (5a: about (2.6, -2.6)), on the flat
at = [2.664, -2.664]                          # chord at 45 deg (apothem 3.768: the 16-gon's two facets made one)
normal = [-1.0, 1.0]
room = "hall"

[[stations.spot]]
id = "vent_w"
at = [-2.664, -2.664]
normal = [1.0, 1.0]
room = "hall"

[[stations.spot]]
id = "socket_e"                               # the hall wall east of the back
at = [2.664, 2.664]
normal = [-1.0, -1.0]
room = "hall"

[[stations.spot]]
id = "socket_w"
at = [-2.664, 2.664]
normal = [1.0, -1.0]
room = "hall"

[[stations.spot]]
id = "breaker_e"                              # the corridor's front wall (y -1.5), centred at x 5.25
at = [5.25, -1.5]
normal = [0.0, 1.0]
room = "corridor_e"

[[stations.spot]]
id = "breaker_w"
at = [-5.25, -1.5]
normal = [0.0, 1.0]
room = "corridor_w"

[[stations.spot]]
id = "renewer_e"                              # a waist-high washer before the window (sill 1.0: the window seen over
at = [10.1, 0.0]                              # it); the player stands at (8.8, 0), the pass behind runs to x 6.8
normal = [-1.0, 0.0]
room = "tip_e"
depth_m = 0.9

[[stations.spot]]
id = "renewer_w"
at = [-10.1, 0.0]
normal = [1.0, 0.0]
room = "tip_w"
depth_m = 0.9

[ramp]                                       # the mouth ramp, north at the centre; it meets the ground
width_m = 2.6
hinge = [0.0, -4.6]                          # at floor_h, the mouth room's north edge
foot = [0.0, -7.4]                           # at ground_h (launch 3: a long plane, 11 deg)
thickness_m = 0.15

# The hull's footprint (the skin of tools/blender/ship_hull_skin.py, variant J of launch 3's grid; `ship --check` tests
# the rooms and pieces inside it). Rows [x, lead y, trail y, blade h, ridge h, eave half-depth]: core rows up to the
# tip room's centre, plate rows round the lens tip (its blade at r 3.0) to the swept tip point; mirrored for x < 0.
# Regenerate the rows from ship_hull_skin.outline() when the variant changes.
[hull]
bottom_h = 0.3                              # the belly under every room (it rises toward the edges)
brow_h = 3.45                              # the brow over the mouth
mouth_half_width_m = 1.3                     # the front face's opening over the mouth room
trail_y = 6.4                                # the body's trail: the swept tips' (1.8, 6.4) and the pod housing's y1
pod_tail_m = 0.435                           # a nozzle pod's tip past its args length (pod_ring's inner ring)
# (test_ship_hull_detail.py measures both from the builders; `ship --check` reads the nozzle tips from the pods'
# placements and args)
pod_radius_m = 3.0                           # the lens tip's blade (10.75 + 3.0 = 13.75: span 27.5 m)
# v2 hull lane: the smooth skin's footprint (ship_hull_smooth.outline_rows: x, lead, trail, edge h, top h, -1)
core = [
  [0, -6.15, 5.80, 0.95, 5.11, -1],
  [2, -5.75, 5.49, 0.95, 4.73, -1],
  [4, -5.15, 4.94, 0.95, 4.49, -1],
  [6, -4.45, 4.63, 0.97, 3.50, -1],
  [8.3, -3.75, 4.30, 1.00, 3.59, -1],
  [10.1, -2.37, 3.74, 1.00, 3.30, -1],
  [11, -1.50, 3.40, 1.10, 1.70, -1],
  [12, -0.37, 2.98, 1.65, 2.13, -1],
  [13, 0.87, 2.53, 2.80, 3.08, -1],
]
plate = [
  [13.75, 1.80, 2.20, 3.80, 3.80, -1],
]

# Review light (the exterior lane tunes it). lamps: [x, y, h, energy, range, r, g, b].
[light]
moon_dir_deg = [-30.0, 35.0]                 # pitch, yaw: from behind the ship (hull 3 grid_out B; [-38, 140] lit flat plates)
moon_energy = 0.6                           # hull 3 grid_out B (was 1.3 from the front: flat moonlit patches)
# hull 3-2: a cool key from the north-west (the hero, front and side cameras' side; the moon stays the rim from behind),
# shadowed, so the inside stays dark; the moon's and the key's shadows fill each other beside the ship
key_dir_deg = [-38.0, -140.0]                # pitch, yaw: travels south-east
key_energy = 0.55
key_color = [0.78, 0.84, 1.0]
key_specular = 1.4
# The night look, picked by the join step's look grid (<raw>/ship/v1/grid/grid2.png, variant H): the interior's metal
# mirrored its strips and lamps (strength 8..12) through the room probes and washed out white; these keep it mid-to-dark
# with saturated cyan and amber. Read by godot/ship/ship.gd (_lk); a missing key keeps the old value.
ambient_energy = 0.12                          # env ambient (was 0.9)
exposure = 1.0                                 # AgX exposure (was 1.2)
emission_scale = 0.12                          # every emissive glTF material's strength x this (keeps the hue)
strip_light_scale = 1.5                        # the OmniLight per emissive cell (from the unscaled strength)
strip_whiten = 0.0                             # those lights' colour lightened by this (was 0.15)
lamp_scale = 0.25                              # the lamps below
probe_intensity = 0.15                         # interior rooms' reflection probes (the tip rooms with windows keep 1.0)
int_value = 0.55                               # the int_silver_* base colour x this
int_rough_add = 0.25                           # + the int_silver_* roughness
hull_rough_add = 0.12                          # + the hull silvers' roughness (was 0.22; hull 3-2: the key needs highlights)
