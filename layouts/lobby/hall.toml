[light.ship]
# Step 5a2 (art #356, docs/lobby.md "Step 5a2"): the package's ship under its own light, set by hall.gd per instance
# (never in the ship's files or materials): its meshes on render layer 11; `set` is the one switch. Per set:
#   pendant_k: 1 = the hall's pendants (and their upward fill) light the ship as the hall; below 1 they skip it (they
#     still cast its shadow) and an unshadowed copy of each at this share lights it, its specular pendant_specular;
#   earth_k: the same for the Earth's light (its copy unshadowed, the hall's light still casts the ship's shadow);
#   own_probe: the hall's probes skip the ship and a probe of its own (box `probe`, the hall without the ship
#     captured) reflects on it at probe_intensity with its ambient (ambient_rgb, ambient_energy);
#   key_*, rim_*: unshadowed directionals on the ship only ([azimuth from south toward east, elevation]).
# `lobby --ship-grid DIR` shoots every set in `grid`'s views (the review views and `views` below).
set = "K1"                         # the default (step 5a2); the engineer picks from K1-K3
grid = ["a_entrance", "c_back", "corner_nw", "spawn_ship", "ship_top"]
views = [["ship_top", "the ship's silver top, close up", [9.0, 9.0, -3.0], [0.0, 3.0, -14.0], 50.0]]
probe = [[0.0, 4.0, -13.3], [32.0, 12.0, 36.0]]

