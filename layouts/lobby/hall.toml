[earth]
# Step 3b (the engineer, art #356, 2026-10-30): the night Earth from low orbit behind the window, from NASA's imagery
# (licence NASA-PD, credit "Earth imagery: NASA"; sources/nasa_earth_lobby.toml). `lobby --earth-tex` scales the raw
# sources (src_dir, never written) to game textures in tex_dir; godot/lobby/earth_sky.gdshader draws them as the sky
# (at infinity: no parallax as the player walks). Directions: azimuth in degrees from south (+z, the window) toward
# east (+x), elevation above the horizontal.
variant = "E2"                      # the one switch (the engineer, 2026-10-30: E2, the dawn glow on the limb)
src_dir = "lobby/hall/earth-src"
tex_dir = "lobby/hall/v5/earth"
size = [4096, 2048]                 # the textures' pixels (at most 4096 x 2048)
quality = 92                        # JPEG
maps = { night = "BlackMarble_2016_3km.jpg", day = "world.topo.bathy.200412.3x5400x2700.jpg", clouds = "cloud_combined_8192.tif" }
grid = ["spawn_eye", "corner_nw"]   # `lobby --earth-grid DIR`: these views once per variant
credit = "Earth imagery: NASA"
# Step 4c (the engineer, 2026-10-30: "a picture glued to the eye"): the Earth as an object, a sphere at a finite
# distance (godot/lobby/earth_object.gdshader), so it shows parallax against the mullions and shrinks with the window
# as the player backs away; the stars stay at infinity in the sky. Each distance's radius gives the variant's angular
# radius from `eye` (a spawn looking at the window: what E2 filled). The sky's cubemap pass keeps the Earth at
# infinity for the probes and reflections.
distance = "D2"                     # the one switch (D1 near, D2 middle, D3 far)
eye = [0.0, 1.65, 0.0]
shell = 1.35                        # the traced shell's radius over the planet's (room for the rim's halo and the dawn)
# `lobby --distance-grid DIR`: the distances from the same three positions [name, title, eye, look, fov]
distance_views = [
  ["glass", "1.5 m from the glass", [0.0, 1.65, 14.5], [0.0, 3.95, 30.5], 75.0],
  ["back", "backed off to z -2", [0.0, 1.65, -2.0], [0.0, 3.95, 14.0], 75.0],
  ["side", "to the side, x -10 z 2", [-10.0, 1.65, 2.0], [-10.0, 3.95, 18.0], 75.0],
]
# `lobby --earth-video DIR`: per distance, [eye, look, seconds from the previous key] (the [video] size, fps, fov):
# 1.5 m from the glass, backing off to z -2, then sideways along x -10..10 at z 2, looking at the window
