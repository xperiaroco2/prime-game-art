# The lobby hall (art #356, docs/lobby.md): the numbers of the approved drawing
# (D:/prime-game-design/ideas/lobby-station/hall/drawing/drawing.js, its `H` object and rows table; concepts
# a_entrance.jpg and c_back.jpg) and the engineer's ship placement (art#356 comment 6522500716).
# The frame is the game's levels/lobby/lobby.tscn: x east, z south, y up, the floor at y 0; every position below is in
# it, in metres (Godot's own frame, no conversion). tools/runner/lobby_layout.py loads and checks this file; the
# `lobby` command builds and shoots it.

version = 3
raw_dir = "lobby/hall/v9"          # under the raw folder: pieces/, plan/, logs/, shots/
# The hall's pieces placed: [piece, [x, y, z], yaw degrees about y]; they sit at the origin (the doors are placed on
# their walls by the `lobby` command from [door] doors)
place = [
  ["floor", [0.0, 0.0, 0.0], 0.0],
  ["walls", [0.0, 0.0, 0.0], 0.0],
  ["vault", [0.0, 0.0, 0.0], 0.0],
  ["window_frame", [0.0, 0.0, 0.0], 0.0],
  ["window_glass", [0.0, 0.0, 0.0], 0.0],
  ["arch", [0.0, 0.0, 0.0], 0.0],
]

[hall]
x0 = -20.0                         # H.x0, H.x1, H.zN, H.zS: the straight walls' inner faces, 40 x 40 m
x1 = 20.0
zN = -30.0
zS = 10.0
bulge = 6.0                        # H.bulge: the window arc through (+-20, 10) and (0, 16)
wall = 12.0                        # H.wall: the walls' and the window's height
apex = 15.0                        # H.apex: the ribbed vault's top (rows: "склепіння з ребрами до 15 м посередині")
ribs = [-24.0, -18.0, -12.0, -6.0, 0.0, 6.0]   # H.ribs: the ribs across the hall (z), over the side walls' pilasters
north_pilasters = [-18.0, -6.0, 6.0, 18.0]     # drawing.js northWall(): the north wall's pilasters (x)
tile = 2.0                         # H.tile: the floor plates
# Not in H: the drawing's pilaster glyph is 1.2 x 0.6 m (12 x 6 svg units at 10 per metre), but 1.2 m puts the
# pilaster at z 0 0.1 m into D1 and D2 (z 0.5..3.5); 0.8 m leaves 0.1 m. The wall's thickness and the trims are ours.
pilaster_w = 0.8
pilaster_d = 0.6
wall_t = 0.5
rib_d = 0.5                        # how far a rib hangs below the vault
door_clear_m = 0.1                 # the least gap between a door's opening and a pilaster or the arch
corner_clear_m = 1.0               # the least gap between a door's opening and a corner

[window]
sill = 0.5                         # H.sill
transom = 3.0                      # H.transom: one cross bar
panes = 6                          # H.panes: even along the arc's angle (drawing.js plan(): mullions at i = 0..6)
mullion_w = 0.5                    # not in H: the mullions' width (step 2c: 0.5 m, a stepped cap, shoes, collars)
bar_h = 0.3

[arch]
w = 6.0                            # H.arch: the entrance in the north wall's middle
h = 6.0
depth = 8.0                        # the short corridor, closed at its end (rows: "у кінці зачинені двері")
frame = 0.6                        # not in H: the portal's frame on the hall side

[door]
w = 3.0                            # H.door
h = 4.5
lamp = 5.1                         # the red lamp's centre above the door
# H.doors: D1 and D2 on the side walls at z +2 (concept A), D3 and D4 by the arch at x -+11 (concept C)
doors = [["D1", "W", 2.0], ["D2", "E", 2.0], ["D3", "N", -11.0], ["D4", "N", 11.0]]

[floor]
ring_r = 15.0                      # H.ring: the floor ring round the ship
spawns_z = 2.5                     # H.spawns: ten markers, x -9..9 step 2; step 5a (the engineer, art#356 comment
                                   # 6536044954): at z 2.5 (was the greybox's 0), 2 m from the engine pods, facing the window
spawns_x = [-9.0, -7.0, -5.0, -3.0, -1.0, 1.0, 3.0, 5.0, 7.0, 9.0]
spawn_ship_m = 2.0                 # the least gap between a spawn and the ship's footprint
ship_wall_m = 3.0                  # the least gap between the ship's footprint and every wall and door

[ship]
# The engineer's decisions (art#356): the ship nearer the entrance than drawn, nose north (comment 6522500716, origin
# z -17), then 2.5 m back toward the window (step 5a, 2026-10-30, comment 6536044954) so the closed jaw nose stands 3 m
# from the north wall: its plan origin at lobby (0, 0, -14.5); plan x = lobby x, lobby z = plan y - 14.5, plan h = lobby
# y. The closed nose at z -26.99, the engine pods' ends at z 0.46; the ring centred on the closed ship's middle
# (z -13.26, computed by the check; `lobby --check` prints the numbers).
origin = [0.0, 0.0, -14.5]
pieces_dir = "ship/v5/nose/b4/pieces"   # art #263's built pieces (under the raw folder), never rebuilt from here;
                                   # step 4c: the jaw nose b4 the package was built from (the jaws built closed)
hull = "P"                         # ship_hull_shape.outline("P"): the hull's footprint
pods = ["nozzle_pod_outer", "nozzle_pod_mid"]   # their placed bounds join the footprint (the build report)
tail = "skin_top"                  # its bounds' aft end beyond the outline joins the footprint, as wide as the pods
lanes = ["exterior"]               # the interior is only seen through the canopies' glass: left out in step 1
stand_in = []                      # step 4c: the ramp is gone (the jaw nose, shut)
# Step 4c: art #263's closed ship, its package (prime-game-art#358/#359, assets/environment/ship/HANDOFF.md S7, S8):
# levels/ship/ship.tscn with its Clearing freed and the jaw nose shut. `lobby --check` measures its footprint with the
# nose's pieces (built closed, each at its hinge) against the same rules. The pointed jaw reaches plan y -12.49, lobby
# z -26.99: 3.01 m from the north wall (step 5a's place). use = true (step 5a): the shots, videos and walk instance the
# package's ship.tscn (copied into godot/import/ship_pkg, its res:// paths rewritten; never edited or rebuilt) instead
# of pieces_dir's pieces, and the check holds the closed footprint to the rules. `free`: the package's nodes freed in
# the lobby ("path" a node, "path:Class" the node's children of that class): the clearing (its ground collider too),
# the night clearing's WorldEnvironment (it fights the hall's AgX, glow and exposure) and the moon and cool key (two
# shadowed suns that would light the hall's walls and cast two more ship shadows against the Earth's light). The
# ship's 105 own lamps and its 7 interior probes stay.
package = { dir = "ship/v5/export/v4", nose = ["jaw_lower", "jaw_upper", "jaw_root"], use = true, free = ["Clearing", "Environment", "Lights:DirectionalLight3D"] }
# The forest clearing (layouts/ship/exterior.toml), not in the lobby
drop = ["ground", "pine_a", "pine_b", "pine_c", "pine_d", "pine_e", "pine_f", "pine_g", "pine_s", "rock_a", "rock_b",
        "rock_c", "rock_pile_a", "rock_pile_b", "ground_lamp", "dirt_patch", "dirt_path", "tuft_a", "tuft_b",
        "tuft_dry", "bush_s", "bush_m", "bush_l", "log_a", "log_b", "log_c", "stump", "party_post", "party_lights",
        "fern_a", "fern_b", "moss_a", "moss_b", "litter"]

# The hall's pieces (tools/blender/lobby_build.py builds each by its id): collide = trimesh colliders (`-col`)
[[pieces]]
id = "floor"                       # the slab, the 2 m plates, the ring
collide = true

[[pieces]]
id = "walls"                       # the west, east and north walls with their openings and pilasters
collide = true

[[pieces]]
id = "vault"                       # the vault with its ribs and the lunettes over the north wall and the window
collide = false

[[pieces]]
id = "window_frame"                # the sill, the 7 mullions, the transom and the head along the arc
collide = true

[[pieces]]
id = "window_glass"
collide = true

[[pieces]]
id = "arch"                        # the portal's frame and the corridor: walls, ceiling, floor, closed end
collide = true

[[pieces]]
id = "door"                        # a sealed door: slab, frame, red lamp; built facing +z, placed four times
collide = true

[look]
# Step 2b's look (docs/lobby.md, "Step 2b"): a SCHEME, not one metal. `scheme` picks one of [look.schemes] (the
# engineer picks from the grid, `lobby --grid`). A scheme gives five sRGB colours by role: panel (the main wall and
# vault panels), frame (pilasters, ribs, the wall behind), trim (bands, cornices, door and arch frames), floor and
# accent (the light strips and the ring), and the metallic of the metals and of the trim. Each material below is
# [role, lightness, roughness, emission]: its colour is the role's times the lightness. The builder writes the chosen
# scheme into the GLBs and the shots apply it in Godot (the grid each in turn). The hazard stripes (yellow-black), the
# door lamps (red), the seams and the glass are fixed in every scheme.
scheme = "S4"                      # the engineer's pick (2026-10-30, step 2c)
mats = { lobby_panel = ["panel", 1.0, 0.46, 0.0], lobby_panel2 = ["panel", 0.9, 0.62, 0.0], lobby_panel3 = ["panel", 1.1, 0.54, 0.0], lobby_inset = ["panel", 0.72, 0.58, 0.0], lobby_vault = ["panel", 1.24, 0.5, 0.0], lobby_pilaster = ["frame", 1.0, 0.5, 0.0], lobby_rib = ["frame", 1.22, 0.48, 0.0], lobby_wall = ["frame", 0.6, 0.62, 0.0], lobby_trim = ["trim", 1.0, 0.42, 0.0], lobby_metal = ["frame", 0.78, 0.4, 0.0], lobby_floor_worn = ["floor", 0.94, 0.3, 0.0], lobby_floor = ["floor", 1.0, 0.15, 0.0], lobby_floor2 = ["floor", 0.96, 0.19, 0.0], lobby_floor3 = ["floor", 1.035, 0.12, 0.0], lobby_strip = ["accent", 1.0, 0.4, 1.8], lobby_ring = ["accent", 0.9, 0.35, 0.5] }

