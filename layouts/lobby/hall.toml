# Step 4 (art #356, docs/lobby.md "Step 4"): the hall's real light, the drawing's words: "warm hanging lamps under the
# vault, orange strips on the pilasters, the Earth's cold light from the window; darker in game than on the concept".
# `mood` is the one switch (the shots, the video and the game use it); `lobby --light-grid DIR` shoots every mood in
# `grid`'s views. Every mood holds the same keys (linear colours; Godot light energies under AgX):
#   exposure; ambient_rgb, ambient_energy (a flat fill, never the sky); probe_intensity (the reflection probes);
#   pendant_*: a shadowed SpotLight3D under each pendant's bulb pointing down (angle: the half angle, degrees), the
#     bulb's own emission (bulb_emit); strip_*: an unshadowed OmniLight3D before each pilaster's light strip, the
#     strips' glTF emission times strip_emit; door_*: a red OmniLight3D before each door lamp, its emission times
#     door_emit; corridor_*: unshadowed omnis along the corridor; earth_*: the Earth's cold light, a shadowed
#     DirectionalLight3D from earth_dir [azimuth from south toward east, elevation]; dawn_*: E2's warmer hint, an
#     unshadowed DirectionalLight3D from dawn_dir; glow_intensity, glow_bloom, glow_threshold; ssao_intensity.
