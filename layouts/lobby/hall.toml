pendants_x = [-10.0, 0.0, 10.0]     # the builder's PENDANTS (lobby_build.py): the spots sit under each lens
pendants_z = [-21.0, -9.0, 3.0]
strip_y = 3.2                       # the pilaster strips' middle (the builder's STRIP, v 2.0..4.4)
strip_off = 0.35                    # the omnis in front of a pilaster's face (m)
door_off = 0.4                      # the red omnis in front of the door lamp's wall
