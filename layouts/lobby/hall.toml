  [[0.0, 1.65, 2.0], [0.0, 3.95, 18.0], 3.0],
  [[10.0, 1.65, 2.0], [10.0, 3.95, 18.0], 3.0],
  [[10.0, 1.65, 2.0], [10.0, 3.95, 18.0], 0.4],
]
