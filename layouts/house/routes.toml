# The design doc's routes (prime-game docs/design/house-map.md §7) walked by `tools/run.sh house --walk` (art #78):
# a 1.36 m capsule at the doc's walking speed, 4.5 m/s, through the waypoints below; a route passes when it arrives
# and its walked time is within `tolerance_s` of the doc's. A point is [level, x, y] in the doc's metres (x east,
# y south; the height is the level's floor), or ["stairs", <stairs id>, "up" | "down"]: that flight's own walk
# points (house_layout.walk_request), foot to top. Waypoints go round the dressing's solid props and the pillars; a
# route starts on a station's marker and ends on one, or 2 m short of a station that is a piece of furniture (the
# doc's station reach). The doc counts a change of level as 6 m; the walk climbs the real flights.

speed = 4.5
tolerance_s = 1.0

[[routes]]
id = "wine"
doc = "Delivery: wine: storage (wine) -> pantry -> dining table"
doc_m = 26
doc_s = 5.9
points = [
  ["basement", 16, 26],         # the wine rack's marker
  ["basement", 17.8, 29.5],     # south-west of the pillar at (19, 28) and the box stacks
  ["basement", 27, 32],         # 1 m before the pantry stairs' foot
  ["stairs", "pantry_stairs", "up"],
  ["ground", 27, 24.8],         # the pantry's 1 m landing
  ["ground", 29, 24.8],
  ["ground", 29, 27],
  ["ground", 30, 27],           # the pantry -> dining room door
  ["ground", 31, 27],
  ["ground", 34, 27],           # 2 m short of the dining table (36, 27)
]

