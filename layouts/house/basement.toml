# Concrete pillars (kit v2's `pillar_concrete`, 0.4 m, centred on its node; art #78). The hall's 18 x 20 m cannot hold
# the inventory's 8 on an 8 m grid: 4 on a 10 x 12 m grid, 4 m off the walls, chosen by a grid search for the longest
# clear sight lines (from the passage door to every door and corner, and from every door to the generator: each clears
# a pillar by at least 0.79 m). Storage keeps the inventory's 4, clear of the line from its corridor door to switch A.
