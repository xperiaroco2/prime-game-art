# The generator hall's dressing (art #78, docs/house.md "Dressing"): the props and light fixtures of one room, as data.
# at = [x, h, z]: room-local metres like the room's stations (x east, h above the floor, z south from the room's
# north-west corner) at the prop's pivot (floor: the footprint's centre; wall: the back's bottom centre on the wall's
# face; ceiling: the top's centre). face = the way the prop's front (+Z) looks: N, E, S or W.
# Ids are the dressing library's (props/library.toml, #87) and the task props' (props/tasks.toml, #82). Fixtures are
# the lamps' meshes only (their light is #83a's, layouts/house/lights.toml). Positions are the engineer's to change.
# Pillars: four kit pillars in basement.toml [[pieces]] (a 10 x 12 m grid; the sight lines in docs/house.md).
