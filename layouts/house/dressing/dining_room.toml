# The dining room's dressing (art #75b, docs/house.md "Dressing"): the props and light fixtures of one room, as data.
# at = [x, h, z]: room-local metres like the room's stations (x east, h above the floor, z south from the room's
# north-west corner) at the prop's pivot (floor: the footprint's centre; wall: the back's bottom centre on the wall's
# face; ceiling: the top's centre). face = the way the prop's front (+Z) looks: N, E, S or W (or yaw = degrees).
# Ids are the dressing library's (props/library.toml, #87) and the task props' (props/tasks.toml, #82); an id with
# no GLB yet is generated as a named, sized placeholder box. Positions are the engineer's to change.
# #153, the world look: an oak table and chairs on a slate rug under a three-shade pendant, a sideboard with a large
# still-life print on the west wall, a display cabinet on the north wall; the detail layer half-sets the table (three
# places, bread and a jug at its west end, a fourth place, tulips, homework and a laptop at its east end) and keeps
# a 0.6 m band round the DiningTable station (x 6.0, the delivery chain's drop-off) clear.
room = "dining_room"

[[props]]
id = "dining_table"
at = [6.0, 0, 3.0]
