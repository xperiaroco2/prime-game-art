# The roof deck's dressing and its lookout (art #77, map #73; inventory.md section 6 "Roof deck"): data for
# tools/runner/house_attic.py (docs/house.md). The deck, its parapet, the two chimneys and the cornice brackets are
# the layout's (layouts/house/roof.toml); the lanterns are #83a's (layouts/house/lights.toml). Conventions: attic.toml's.

room = "roof"
rect = [17, 23, 26, 22]
hole = [20, 26, 20, 14]            # the attic stands on the deck: no deck under it
clear = [[40, 31.5, 2.5, 3]]       # outside the roof door (40, 33)
arrive = [41.2, 33.0]              # the roof door's outside: the walk's start

[[items]]
id = "roof_vent"
at = [18.6, 30.0]
[[items]]
id = "roof_vent"
at = [18.6, 37.0]
[[items]]
id = "roof_vent"
at = [41.4, 29.0]
[[items]]
id = "roof_vent"
at = [41.4, 38.0]
[[items]]
id = "antenna"
at = [41.4, 42.6]
[[items]]
id = "roof_water_tank"
at = [18.8, 24.9]
[[items]]
id = "loot_crate"
station = "Loot"                   # the design doc's (41.5, 25)
at = [41.5, 25.0]
yaw = -90.0

# The lookout: what a player sees at eye height 1.6 m. `station` is the layout's Lookout station (roof.toml), the
# design doc's (30, 42.5), in plan metres and the first of the `eyes`; the acceptance: from it the `see` openings of the
# fence (layouts/house/outdoor/plot.toml) at least half in view. NOT MET: 2.5 m behind the 1 m parapet it sees neither
# (0 %). `open` records that the shortfall waits for the engineer (art #77): the check reports it and does not fail;
# without `open` it fails. The second eye (30, 44.2), 0.8 m from the parapet, is a labelled alternative (100 %), the
# option "move the Lookout marker to the parapet"; it is not the acceptance.
[lookout]
station = [30.0, 42.5]
eyes = [[30.0, 42.5], [30.0, 44.2]]
see = ["wicket", "gates"]
open = "art #77, the engineer's call: move the Lookout marker to the parapet (30, 44.2), lower the parapet there, or accept"
