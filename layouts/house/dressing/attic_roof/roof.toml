# The roof deck's dressing and its lookout (art #77, map #73; inventory.md section 6 "Roof deck"): data for
# tools/runner/house_attic.py (docs/house.md). The deck, its parapet, the two chimneys and the cornice brackets are
# the layout's (layouts/house/roof.toml); the lanterns are #83a's (layouts/house/lights.toml). Conventions: attic.toml's.

room = "roof"
rect = [17, 23, 26, 22]
hole = [20, 26, 20, 14]            # the attic stands on the deck: no deck under it
clear = [[40, 31.5, 2.5, 3]]       # outside the roof door (40, 33)
arrive = [41.2, 33.0]              # the roof door's outside: the walk's start

[[items]]
id = "roof_vent"
at = [18.6, 30.0]
[[items]]
id = "roof_vent"
at = [18.6, 37.0]
[[items]]
id = "roof_vent"
at = [41.4, 29.0]
[[items]]
id = "roof_vent"
at = [41.4, 38.0]
[[items]]
id = "antenna"
at = [41.4, 42.6]
[[items]]
id = "roof_water_tank"
at = [18.8, 24.9]
[[items]]
id = "loot_crate"
station = "Loot"                   # the design doc's (41.5, 25)
at = [41.5, 25.0]
yaw = -90.0

# The lookout: what a player sees at eye height 1.6 m. `station` is the layout's Lookout station (roof.toml) in plan
# metres and must be one of the `eyes`; from it the `see` openings of the fence (layouts/house/outdoor/plot.toml) must
# show at least half. The design doc's point (30, 42.5) sees neither over the 1 m parapet (0 %), so the station
# stands at (30, 44.2), 0.8 m from the parapet (100 %); the doc's point stays as a second eye, reported only.
[lookout]
station = [30.0, 44.2]
eyes = [[30.0, 44.2], [30.0, 42.5]]
see = ["wicket", "gates"]
