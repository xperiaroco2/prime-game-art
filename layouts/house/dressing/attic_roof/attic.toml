# The free roof (art #77, the engineer's pick 2026-10-10): no deck. The players climb out of the dormer's window onto
# the south slope; the whole roof is walkable (19 deg), its eave a real edge. `arrive`: outside the dormer's window, on
# the slope west of its open casement (the walk's start). The roof's items stand on the roof's top
# (house_attic.roof_top); the vent pipes and the aerial are the roof's kit pieces, not dressing.
[roof]
arrive = [34.9, 43.6]

[[roof.items]]
id = "loot_crate"
station = "Loot"                   # the layout's Loot station on the north slope (the design doc's north-east corner)
at = [41.0, 26.0]
yaw = -90.0

# The lookout: what a player sees at eye height 1.6 m over the roof's top. `station` is the layout's Lookout station
# (attic.toml: on the south slope, 2.1 m up from the eave) and the first of the `eyes`; the acceptance: from it the
# `see` openings of the fence (layouts/house/outdoor/plot.toml) at least half in view. Without `open` a shortfall fails.
[roof.lookout]
station = [39.0, 41.9]
eyes = [[39.0, 41.9]]
see = ["wicket", "gates"]
