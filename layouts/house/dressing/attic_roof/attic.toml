# The attic's old things and hiding spots (art #77, map #73; inventory.md section 6 "Attic"): data for
# tools/runner/house_attic.py (docs/house.md, "The attic and the free roof"). Plan metres (x east, y south), the
# conventions of the zones (docs/zones.md): `at` the footprint's centre, `yaw` turns the prop's front (+Z) about +Y
# (0 south, 90 east, 180 north, -90 west), `src` "library" (props/library.toml, #87) or a placeholder with its own
# `size` [w, d, h] (the hero props, not in the library). The light fixtures are #83a's (layouts/house/lights.toml).
# Every position is the engineer's to change: edit, then `tools/run.sh attic`.

room = "attic"
rect = [18, 24, 24, 20]
eave_h = 2.2                       # the knee wall; the roof climbs gable_rise_per_m from the eaves on y 24 and 44
# Floor kept free: the hatch and its 1 m apron, the dormer's climb-out (its stair and the way to it), 1 m round
# the Knife3 marker (36, 37).
clear = [[26, 27, 4, 4], [33.4, 39.5, 3.2, 4.5], [35, 36, 2, 2]]
arrive = [28.0, 31.2]              # where a player steps off the ladder (the walk's start)

