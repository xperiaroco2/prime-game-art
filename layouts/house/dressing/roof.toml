# The lookout (the design doc's (30, 42.5)): what a player sees at eye height 1.6 m from the station's point and
# from the parapet in front of it. `see`: the plot's fence openings (layouts/house/outdoor/plot.toml) that must show.
[lookout]
station = [30.0, 42.5]
eyes = [[30.0, 42.5], [30.0, 44.4]]
see = ["wicket", "gates"]
