# against the railing, two armchairs facing each other over a coffee table on a rug, a side table with a lamp, a
# floor lamp and a plant) and a dresser on the west wall; the bench with the photos on the south wall; plants, a
# big fig with a print in the middle of the east wall, a delivery by the study door and the laundry basket by the
# bathroom door. The attic stair (#183: x 0.475 to 4, z 4.75 to
