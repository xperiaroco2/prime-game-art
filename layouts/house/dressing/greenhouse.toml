# The greenhouse's dressing (art #80, docs/house.md "Dressing", docs/house-garden.md): the props and light fixtures of
# one room, as data. at = [x, h, z]: room-local metres (x east, h above the floor, z south from the room's north-west
# corner, plan (58, 6)) at the prop's pivot (floor: the footprint's centre; ceiling: the top's centre). face = the way
# the prop's front (+Z) looks: N, E, S or W. Ids are the dressing library's (#87) and the task props' (#82).
# The glass door is on the west wall at z 6 (plan (58, 12)). Positions are the engineer's to change.
room = "greenhouse"

# The herb board at the entrance (HerbBoard at 4, 9.5), read from the aisle north of it.
[[props]]
id = "herb_board"
at = [4.0, 0, 9.5]
face = "N"
station = "HerbBoard"

# Five raised herb beds (HerbBeds at 9, 5) in a row across the house, 1.5 m aisles between them; read and picked from
# the aisle south of them (z 5.6 to 9.25). The middle bed stands on the marker.
[[props]]
id = "herb_bed"
at = [9.0, 0, 4.1]
yaw = 90
station = "HerbBeds"

[[props]]
