# Bake zones: separate LightmapGI scenes (the spike asks whether they blend). `rooms` lists room ids; `levels` takes
# every room of those levels. `texel_high` and `texel_low`: lightmap texels per metre at the High and Low presets.
[zones.basement]
levels = ["basement"]
texel_high = 8.0
texel_low = 4.0
[zones.ground]
rooms = ["wc", "pantry", "dining_room", "living_room", "stairs", "kitchen", "hallway", "terrace"]
texel_high = 8.0
texel_low = 4.0
[zones.upper]
levels = ["upper", "attic"]
texel_high = 8.0
texel_low = 4.0
[zones.outbuildings]
rooms = ["garage", "greenhouse"]
texel_high = 6.0
texel_low = 3.0
[zones.yard]
rooms = ["yard", "street", "path", "driveway", "garden", "photo_zone", "chill_zone", "outdoor_stairs"]
texel_high = 2.0
texel_low = 1.0

# The bake (LightmapGI) settings every zone shares; the lab's rules: the room is lit by the lamps, the window spots and
# bounce (at most 1.5), never a set fill; the backdrop and emissive decor stay out of the bake.
[bake]
quality = "high"        # low, medium, high, ultra
bounces = 3
bounce_indirect_energy = 1.5
denoiser = true
directional = false
interior = true

[presets.high]
lightmap = "texel_high"
glow_count = 12
ssao = "half"
shadowed_spots = 4
fog = false
[presets.low]
lightmap = "texel_low"
glow_count = 4
ssao = "off"
shadowed_spots = 2
fog = true
