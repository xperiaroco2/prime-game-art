# The House map's light kit (art #83a, docs/house.md "Light"): fixture types, the fixtures per room, the bake zones
# and the Low and High presets. Taste data: the engineer may change any number here and regenerate (`house`).
# Counts per room are inventory.md §8 of the house plan (191 fixtures); positions are generated (`place`); a room's
# `fixed` list adds practicals at given points, `at` = [x, h over the room's floor, y] in plot metres. Every fixture
# is baked (LightmapGI, light_bake_mode Static); a type with `glow = true` may also get the cheap real-time glow
# (unshadowed omni, distance fade) for the nearest `glow_count` of the preset.

[colors]  # linear-ish Godot colours; c2 is the lab's lamp c2 (baked and real-time match, lab round 3)
c2 = [1.0, 0.85, 0.68]
cool = [0.86, 0.93, 1.0]       # functional spaces on purpose (Q23 B): garage tubes, generator pendants, switch cages
safelight = [1.0, 0.12, 0.08]  # the darkroom
green_cold = [0.82, 1.0, 0.9]  # the greenhouse
moon = [0.62, 0.72, 1.0]       # bake-only window spots (D1: moonlight through the windows)

# mount: ceiling (a grid under the ceiling), wall (spaced along the walls, 0.15 m in, clear of doors) or floor (a grid
# inset from the walls); h: the light's height above the room's floor; light: omni or spot (spots point down).
[types.bare_bulb]
mount = "ceiling"
h = 2.7
light = "omni"
energy = 1.0
range = 6.0
glow = true
[types.cage_lamp]
