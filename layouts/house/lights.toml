# Bake-only moon spots through the windows (no mesh, no glow): one per `moon_every` windows of a level, `out` metres
# outside the window at `h` over the floor, aimed `in` metres inside at 0.5 m.
[moon]
every = 2
out = 1.5
in = 2.5
h = 2.6
energy = 0.6
range = 8.0
angle = 35.0

