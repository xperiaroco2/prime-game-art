# The photo zone with the gazebo (art #81b, map #73; inventory.md section 4 "Photo zone (gazebo)"): data for
# tools/runner/house_zones.py. Plan metres: x east, y south (the plot is 80 x 60 m, the street at y 60); Godot puts a
# plan point (x, y) at (x, 0, y). yaw is degrees about +Y (a prop's front is +Z; yaw 90 faces east, -90 west,
# 180 north); `face = [x, y]` turns the front towards a point instead. Every value is the engineer's to change.
# `src`: zones (props/zones.toml), tasks (props/tasks.toml), kit (kits/house.json) or a package that owns the piece
# (#87 the dressing library); pieces another package owns are placeholders until it lands.

zone = "photo_zone"
rect = [4, 6, 10, 10]          # x, y, width (east), depth (south)
ground = "deck + grass"
questions = ["Q17 default A: a hexagonal timber pavilion with string lights, a painted backdrop and the pose screen"]

[opening]                      # the walking approach comes in through the zone's low railing here
side = "east"
at = 14.0
from = 9.0
to = 13.0

[railing]                      # the zone's edge: the kit's gazebo railing round the rectangle, the opening left free
piece = "railing_gazebo"

[gazebo]                       # the kit's six deck sectors, six roof sectors and the finial (kit_geom.gazebo)
centre = [9.0, 11.0]
yaw = -30.0                    # turns the open sector (sector 0) to face east, towards the opening
post_radius = 2.68             # the kit: radius 2.8 less 0.12 to the posts' centres
post = 0.14
deck_h = 0.15
post_h = 2.4
roof_radius = 3.0

[[items]]
id = "pose_screen"
src = "tasks"
station = "PoseScreen"         # inventory.md section 7: the photo spot and the pose screen at (9, 11)
at = [9.0, 11.0]
yaw = 90.0
y = 0.15                       # on the deck

