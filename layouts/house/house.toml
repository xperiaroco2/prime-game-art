# The house generator's settings (art #75, docs/house.md). One file per level beside this one.
# The kit: its spec in the repo and its GLBs under the raw folder (kit v3: the 0.35 roof pitch, #77; v2 #86; v1's ids are kept).
# v3b: #77's full v3 build in its own folder (v3/ holds a stale in-between build of #77, left untouched); a plain `kit` builds here.
kit_spec = "kits/house.json"
kit_dir = "kits/house/v3b"
# Where the generated scenes find a piece and each other inside the godot/ project (godot/import/ is ignored).
kit_res = "res://import/kit_{id}.glb"
scene_res = "res://import/house"
levels = ["basement", "ground", "upper", "attic"]
# The dressing (#75b, docs/house.md "Dressing"): one file per room in dressing/; the prop catalogues that give each id
# its size and pivot (later files win); the raw folders its GLB is looked for in, in order; its res:// path when staged.
dressing_dir = "dressing"
prop_specs = ["props/tasks.toml", "props/library.toml"]
# #150: the living room's rebuilt and detail props come from their review build until the manager moves them into
# a library version (the raw v1 is not overwritten without the engineer's yes); every other prop from v1.
prop_dirs = ["props/task/v1", "review/house/150/build", "props/library/v1"]
prop_res = "res://import/prop_{id}.glb"
# Per-room wall paint (Q11 = B, the engineer 2026-10-10; look.md section 4): the inner plaster's colour per room id; a
# room not listed keeps the kit's (role wall_int, #3a6264). Teal is the base, oxblood the bedrooms, ink-blue only the
# study; the garage is a neutral concrete grey (the basement's walls are the kit's concrete already). The lab's rule:
# the biggest plane in a frame is never amber. The scene writer puts it on the room's root (`metadata/wall_paint`);
# the kit's material (godot/kit/kit_materials.gd `paint`) recolours that room's inner plaster.
[wall_paint]
kitchen = "#3a6264"
hallway = "#3a6264"
living_room = "#3a6264"
dining_room = "#3a6264"
stairs = "#3a6264"
landing = "#3a6264"
bedroom = "#69413c"
guest_room = "#69413c"
study = "#1f2a48"
garage = "#8f897d"

# The game-ready package (`house --export DIR [--package N]`, art #119, docs/house.md "The export"): the paths follow the
# game's ARCHITECTURE 11.1 (`assets/environment/<id>/<id>.glb`); the kit and the props are sets, one folder each, a GLB
# per piece (prime-game #523 question G3/G11). Room scenes go where the game keeps its greybox rooms.
[export]
asset_res = "res://assets/environment/{set}/{id}.glb"
room_dir = "levels/house/rooms"
kit_set = "house_kit"
prop_set = "house_props"
kit_textures = ["set_d.png", "set_n0.png", "set_n1.png"]  # the kit's shared texture set, under <kit_dir>/textures
label = { h = 2.4, font_size = 72, outline_size = 16 }  # the room's Name label, as on the game's greybox rooms
# The world look's fine pack (#143, #147; docs/props.md "World look rules"): its build (fine.json and one texture
# folder per tier) under the raw folder; a package with a prop on it ships house_props/fine/<tier>/, the shader and
# one material per tier; the room scenes put `fine_tier`'s material on the props' kit_fine surfaces.
fine_dir = "review/house/150/build/textures/fine"  # #150: the eight-slot pack (v1 holds the four-slot one)
fine_tier = "high"

# Footstep surfaces (art #122; the game's FootstepSurface, its ARCHITECTURE 4.7.40): the kit pieces a player walks on,
# by id pattern (the first match wins), and the game's surface (concrete, wood, carpet or grass) their instance in a
# room scene carries as `metadata/surface`; a floor tile at least half under a rug (no collider) is carpet instead. The
# export check needs a layer-1 collider under each of them and a surface under every ray down onto the shell.
[export.surfaces]
"floor_boards_*" = "wood"
"floor_lino_*" = "concrete"
"floor_concrete_*" = "concrete"
"slab_*" = "concrete"
"roof_flat_*" = "concrete"
"roof_pitched_*" = "concrete"  # the free roof (art #77, #126): the game has no tile sound
"stairs_main" = "wood"
"stairs_basement" = "concrete"
"stairs_balcony" = "concrete"
"stairs_outdoor_*" = "concrete"
"ladder_attic" = "wood"
"stair_dormer" = "wood"
"ground*" = "grass"
"chimney_attic*" = "concrete"  # the chimneys' tops over the free roof (#126)
"dormer_*" = "concrete"  # the dormer's own roof
"gazebo_sector*" = "wood"  # the photo gazebo's deck (#128)

# Low dressing props the floor's rays meet before the floor (a player stands on them), by id pattern (art #126).
[export.prop_surfaces]
"rolled_carpet" = "carpet"
"pallet" = "wood"
"stepping_stone" = "concrete"  # the plot's and the garden's stepping stones (#128)
"fire_pit" = "concrete"  # the chill zone's stone fire pit (#128)
"watering_can" = "concrete"  # the greenhouse's and the garden's metal can: hard, the floor it stands on (#128)
"fireplace" = "concrete"  # the living room's stone hearth catches the floor rays (#150)

# The kit's families on the look-approval sheet (`house --package-sheet`, art #124): one tile each, in this order, by
# id pattern (the first match wins); a piece no pattern matches goes to the last family.
[export.kit_families]
openings = ["*door*", "*window*", "fence_gates_*", "fence_wicket_*", "glass_wall_*", "glass_corner", "glass_end", "glass_post"]
walls = ["wall_*", "pillar_*", "parapet_*", "beam_*"]
floors = ["floor_*", "ceiling_*", "slab_*", "porch_*"]
stairs = ["stair*", "ladder_*", "railing_balcony_*"]
roof = ["roof_*", "glass_roof_*", "gable_*", "glass_gable_*", "chimney_*", "dormer_*", "cornice_*"]
outdoor = ["fence_*", "gate_post", "gazebo_*", "railing_gazebo_*"]

# Extra views on a package's look-approval sheet (`house --package-sheet`, art #126), after the room's door view: `at`
# and `look` plan metres, `eye` (default 1.6) and `look_h` (default 1.0) heights over the room's floor or, with
# `over_roof`, over the roof's top there (house_attic.roof_top); `sun` adds a key light outside the room's lamps;
# `with` shows other packages' rooms in place beside it.
[[export.sheet_views]]
room = "kitchen"
title = "kitchen: the north-wall worktops"
at = [38.0, 33.6]  # #147: the C2-white run, its backsplashes and wall cabinets
look = [37.6, 30.0]
look_h = 1.0
[[export.sheet_views]]
room = "living_room"
title = "living room: across the sofa to the fireplace"
at = [22.6, 38.4]  # #150: behind the main sofa, the mantel, the rug and the armchairs
look = [22.0, 43.0]
look_h = 0.9
[[export.sheet_views]]
room = "living_room"
title = "living room: the TV corner and the shelves"
at = [24.8, 40.5]  # #150: from the east armchair across the room to the TV unit
look = [18.6, 34.0]
look_h = 0.9
[[export.sheet_views]]
room = "attic"
title = "attic: from the west gable"
at = [19.5, 34.0]
look = [40.0, 34.0]
[[export.sheet_views]]
room = "attic"
title = "roof: from dormer, 1.6 m"
at = [34.9, 43.6]  # the dormer's climb-out (dressing/attic_roof/attic.toml's roof.arrive)
look = [39.0, 41.9]  # the Lookout station
over_roof = true
sun = true
[[export.sheet_views]]
room = "attic"
title = "roof: from lookout, 1.6 m"
at = [39.0, 41.9]
look = [30.0, 36.0]
look_h = 0.5
over_roof = true
sun = true
[[export.sheet_views]]
room = "balcony"
title = "balcony: down the external stairs"
at = [39.0, 23.6]  # the balcony's east end, over the flight's top (Door2, the gap at x39)
look = [39.0, 16.0]  # near the flight's foot on the yard (upper.toml's balcony_stairs)
look_h = -2.6  # under the balcony's floor: the flight drops 3.2 m
sun = true
with = ["yard"]  # the flight is the yard's (P2's yard.tscn), not the balcony scene's
[[export.sheet_views]]
room = "balcony"
title = "balcony: the external stairs from the yard"
at = [35.5, 12.5]  # on the yard north-west of the flight's foot
eye = -1.6  # 1.6 m over the yard: the balcony's floor is 3.2 m up
look = [39.0, 18.0]
look_h = -1.4
sun = true
with = ["yard"]
# P7's views (#128): `room = "plot"` stands in plan metres over the plot's ground (y 0), the package's rooms round it.
[[export.sheet_views]]
room = "plot"
title = "yard: from the front path"
at = [30.0, 57.0]
look = [30.0, 44.0]
sun = true
[[export.sheet_views]]
room = "plot"
title = "street: from the far kerb"
at = [18.0, 65.0]
look = [40.0, 58.0]
sun = true
[[export.sheet_views]]
room = "plot"
title = "garden: from its south-west"
at = [49.0, 28.0]
look = [62.0, 16.0]
sun = true
[[export.sheet_views]]
room = "plot"
title = "greenhouse: inside"
at = [60.0, 12.0]
look = [72.0, 12.0]
sun = true
[[export.sheet_views]]
room = "plot"
title = "chill zone: at the grill"
at = [14.0, 55.0]
look = [8.0, 50.0]
sun = true
[[export.sheet_views]]
room = "plot"
