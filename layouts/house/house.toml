# The house generator's settings (art #75, docs/house.md). One file per level beside this one.
# The kit: its spec in the repo and its GLBs under the raw folder (kit v3: the 0.35 roof pitch, #77; v2 #86; v1's ids are kept).
# v3b: #77's full v3 build in its own folder (v3/ holds a stale in-between build of #77, left untouched).
# v3c (#152): v3b with the pieces the warm sand ceiling (#D8C7B4) changes rebuilt over it; a plain `kit` builds here.
kit_spec = "kits/house.json"
kit_dir = "kits/house/v3c"
# Where the generated scenes find a piece and each other inside the godot/ project (godot/import/ is ignored).
kit_res = "res://import/kit_{id}.glb"
scene_res = "res://import/house"
levels = ["basement", "ground", "upper", "attic"]
# The dressing (#75b, docs/house.md "Dressing"): one file per room in dressing/; the prop catalogues that give each id
# its size and pivot (later files win); the raw folders its GLB is looked for in, in order; its res:// path when staged.
dressing_dir = "dressing"
prop_specs = ["props/tasks.toml", "props/library.toml"]
# #150: library v2 is v1 with the living room's rebuilt and detail props laid over it (v1 is never overwritten);
# #152: library v3 is v2 with the cream sofa and armchairs rebuilt over it (v2 is never overwritten).
# #153: library v4 is v3 with the dining room's props laid over it; task v2 is v1 with the world-look dining table.
# #156: v5 is v4 with the hallway's props; #158: v6 is v5 with the WC's, the pantry's and the stairs' props.
# #162: v7 is v6 with the landing's and the bathroom's props; v8 is v7 with the rebuilt landing runner (round 2).
# #164: v9 is v8 with the bedroom's and the guest room's props laid over it.
# #166: v10 is v9 with the kids' room's and the study's props laid over it.
# #168: v11 is v10 with the attic's 18 props laid over it.
# #170: v12 is v11 with the basement's 32 working-room props laid over it.
# #172: v13 is v12 with the basement's plant rooms' and the darkroom island's 39 props laid over it.
# #79: v14 is v13 with the garage's 11 props (the car, its lift and panel, the blind side, the part picture, the
# pegboard, the compressor, the garden tools) laid over it.
# #82: task v3 is task v2 with the 19 task-chain props rebuilt in the world look laid over it.
prop_dirs = ["props/task/v3", "props/library/v14"]
prop_res = "res://import/prop_{id}.glb"
# Per-room wall paint (the engineer's choice of 2026-10-14, #152; before it Q11 = B of 2026-10-10, look.md section 4):
# the inner plaster's colour per room id; a room not listed keeps the kit's (role wall_int, #3a6264). The living room
# is terracotta on every wall; the kitchen, hallway, dining room, stairs and landing a warm greige (they were teal);
# the WC a soft blue-grey #cfd5d3 and the pantry a pale sage #d3d6c3 (#158), the bathroom a pale green-grey #d8dfd6
# over its white tiles (#162; both the manager's present-day defaults under the engineer's blanket yes of 2026-10-14);
# oxblood the bedrooms, a pale sky blue #c9d7de the kids' room (#166, the same blanket yes), ink-blue only the
# study; the attic's knee walls and gables a warm white #ece7de, painted boards under the warm sand roof (#168, the same
# blanket yes); the garage is a neutral concrete grey (the basement's walls are the kit's concrete already). Under every
# room the kit's ceiling is warm sand (#152). The lab's rule: the biggest plane in a frame is never amber. The scene writer puts it on the room's root
# (`metadata/wall_paint`); the kit's material (godot/kit/kit_materials.gd `paint`) recolours that room's inner plaster.
[wall_paint]
kitchen = "#d9d1c5"
hallway = "#d9d1c5"
living_room = "#a3533b"
dining_room = "#d9d1c5"
stairs = "#d9d1c5"
landing = "#d9d1c5"
wc = "#cfd5d3"
pantry = "#d3d6c3"
bathroom = "#d8dfd6"
bedroom = "#69413c"
guest_room = "#69413c"
kids_room = "#c9d7de"
study = "#1f2a48"
attic = "#ece7de"
garage = "#8f897d"

# The game-ready package (`house --export DIR [--package N]`, art #119, docs/house.md "The export"): the paths follow the
# game's ARCHITECTURE 11.1 (`assets/environment/<id>/<id>.glb`); the kit and the props are sets, one folder each, a GLB
# per piece (prime-game #523 question G3/G11). Room scenes go where the game keeps its greybox rooms.
[export]
asset_res = "res://assets/environment/{set}/{id}.glb"
room_dir = "levels/house/rooms"
kit_set = "house_kit"
prop_set = "house_props"
kit_textures = ["set_d.png", "set_n0.png", "set_n1.png"]  # the kit's shared texture set, under <kit_dir>/textures
label = { h = 2.4, font_size = 72, outline_size = 16 }  # the room's Name label, as on the game's greybox rooms
# The world look's fine pack (#143, #147; docs/props.md "World look rules"): its build (fine.json and one texture
# folder per tier) under the raw folder; a package with a prop on it ships house_props/fine/<tier>/, the shader and
# one material per tier; the room scenes put `fine_tier`'s material on the props' kit_fine surfaces.
fine_dir = "props/library/v14/textures/fine"  # #150: the eight-slot pack (v1 holds the four-slot one); v3 to v14 the same bytes
fine_tier = "high"

# Footstep surfaces (art #122; the game's FootstepSurface, its ARCHITECTURE 4.7.40): the kit pieces a player walks on,
# by id pattern (the first match wins), and the game's surface (concrete, wood, carpet or grass) their instance in a
# room scene carries as `metadata/surface`; a floor tile at least half under a rug (no collider) is carpet instead. The
# export check needs a layer-1 collider under each of them and a surface under every ray down onto the shell.
[export.surfaces]
"floor_boards_*" = "wood"
"floor_lino_*" = "concrete"
"floor_concrete_*" = "concrete"
"slab_*" = "concrete"
"roof_flat_*" = "concrete"
"roof_pitched_*" = "concrete"  # the free roof (art #77, #126): the game has no tile sound
"stairs_main" = "wood"
"stairs_basement" = "concrete"
"stairs_balcony" = "concrete"
"stairs_outdoor_*" = "concrete"
"ladder_attic" = "wood"
"stair_dormer" = "wood"
"ground*" = "grass"
"chimney_attic*" = "concrete"  # the chimneys' tops over the free roof (#126)
"dormer_*" = "concrete"  # the dormer's own roof
"gazebo_sector*" = "wood"  # the photo gazebo's deck (#128)

# Low dressing props the floor's rays meet before the floor (a player stands on them), by id pattern (art #126).
[export.prop_surfaces]
"rolled_carpet" = "carpet"
"pallet" = "wood"
"stepping_stone" = "concrete"  # the plot's and the garden's stepping stones (#128)
"fire_pit" = "concrete"  # the chill zone's stone fire pit (#128)
"watering_can" = "concrete"  # the greenhouse's and the garden's metal can: hard, the floor it stands on (#128)
"fireplace" = "concrete"  # the living room's stone hearth catches the floor rays (#150)

# The kit's families on the look-approval sheet (`house --package-sheet`, art #124): one tile each, in this order, by
# id pattern (the first match wins); a piece no pattern matches goes to the last family.
[export.kit_families]
openings = ["*door*", "*window*", "fence_gates_*", "fence_wicket_*", "glass_wall_*", "glass_corner", "glass_end", "glass_post"]
walls = ["wall_*", "pillar_*", "parapet_*", "beam_*"]
floors = ["floor_*", "ceiling_*", "slab_*", "porch_*"]
stairs = ["stair*", "ladder_*", "railing_balcony_*"]
roof = ["roof_*", "glass_roof_*", "gable_*", "glass_gable_*", "chimney_*", "dormer_*", "cornice_*"]
outdoor = ["fence_*", "gate_post", "gazebo_*", "railing_gazebo_*"]

