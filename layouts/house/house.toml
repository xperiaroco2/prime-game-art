# Extra sets copied whole (files matching `files` under the raw folder `dir`), each into its own folder.
# `build = "outdoor"`: the export writes the plot's files fresh from layouts/house/outdoor/ (`outdoor`'s pure-Python
# build, its ground one mesh per footstep surface, art #128) into DIR/_build/house_outdoor, not from `dir`; the flats'
# PNGs stay out (backdrop.glb embeds them).
[export.sets.house_outdoor]
dir = "house/81/build"
build = "outdoor"
files = ["outdoor.glb", "backdrop.glb", "sky.png"]
[export.sets.house_garden]
dir = "house/80/plants"
files = ["*.glb"]

# Package 7's plot scene (art #128, house_export_plot.py): everything outside the house no room scene holds, at plan
# coordinates. `garden`: the garden's build (garden.json) under the raw folder; `prop_src`: the folder of each prop
# source the garden and the zones name (`#87` is the library). The flat house_props/ names follow prop_dirs, then these
# folders: the first source holding an id ships `<id>.glb`, any other `<id>_<source>.glb`.
[export.plot]
scene = "levels/house/outdoor.tscn"
garden = "house/80/build/garden.json"
prop_src = { tasks = "props/task/v3", library = "props/library/v14", "#87" = "props/library/v14", zones = "props/zones/v1" }
# The zones' generic plants (`#87` bush and garden_tree, no library GLB) as the garden's plants (house_garden).
plants = { bush = "bush_boxwood", garden_tree = "garden_tree_apple" }

# The packages of the plan (P1-P8): a package writes its rooms, every GLB they instance, and its sets. `rooms` lists
# room ids or level names; `except` takes rooms out again. No --package writes them all.
[[export.packages]]
n = 1
name = "kit"
kit = true
[[export.packages]]
n = 2
name = "ground"
rooms = ["ground"]
except = ["garage", "greenhouse", "garden"]
[[export.packages]]
n = 3
name = "basement"
rooms = ["basement"]
[[export.packages]]
n = 4
name = "upper"
rooms = ["upper"]
[[export.packages]]
n = 5
name = "attic"
rooms = ["attic"]
[[export.packages]]
n = 6
name = "garage"
rooms = ["garage"]
[[export.packages]]
n = 7
name = "outdoor"
rooms = ["greenhouse", "garden"]
sets = ["house_outdoor", "house_garden"]
plot = true
[[export.packages]]
n = 8
name = "task_props"
task_props = true
