# art#196 roster round 5: the engineer (2026-10-22) asked for references from animated films about aliens and
# monsters. The research (r5/report.md under D:/prime-art-raw/research/2026-10-22-roster/design/) turned their design
# principles into twelve concepts (m61..m67, w61..w65); the men follow five rules: a soft skull (no keratin, horn or
# beak), a blend of two or three sources with one silhouette, one alien eye idea under heavy acting lids, a big
# closed mouth with lips, one male signal. Each item is an edit with two references: rf2 for the style (round 4's
# lead, framing sentence and style tail), and one kept head of rounds 2 to 4 for the face language only (eye
# rendering, lids, lips, mood, finish), never its head shape. Blends are written mostly as shapes; a few prompts compare a shape to an animal (a seal, a cat, a fish fin).
# The standing permission for OpenAI images: art#196 comment 6291187194 (2026-10-20), medium for exploration,
# within this batch's dollar cap. No game, film, studio or character names; no real people. Schema:
# docs/openai-images.md.
# m64 and m61 ran first (2026-10-22) and were looked at: both held. After the other ten, every variant of m66
# (the lamps as eye bags on a bald dome), m67 (the second reference's flat head copied), w61 (a human
# ponytail), w62 (a hair bun) and w65 (a tall dome, not the wide pebble) missed; m66r, m67r, w61r, w62r and
# w65r are their one revised prompt each.
id = "2026-10-22-alien-roster-r5"
service = "openai-images"
purpose = "art#196 roster round 5: twelve alien head candidates (seven men, five women) from the design principles of animated alien and monster films, each a blend of two or three animals written as shapes, with a kept head's face language, three variants each, as 2D concepts for the engineer to judge."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
cost_cap_usd = 5.0
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-20"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6291187194"
model = "gpt-image-2.5-sunburst"
quality = "medium"

[defaults]
size = "1024x1280"
n = 3

# m61: lidded eye stalks (man, mid forties), face language from h01
[[items]]
id = "m61"
kind = "edit"
prompt = "The first reference image shows only the rendering style, the finish, the light, the background, and the neck and shoulders to use. The head itself is a completely new design, described below: do not copy the first reference's crest, eyes, eyelids, nostrils, lips or coral colour. The second reference image shows only the face language to keep (eye rendering, lids, lips, mood, finish), never its head shape or features: do not copy its curled crest, its striped crown, its turret eye sockets or its head shape. Framing: the whole head with a little room above it, then the long slender neck and the top of the narrow shoulders, ending in a clean rounded bust edge inside the frame, the head turned clearly into three-quarter view. The description of the head: A single alien head that reads as an adult man in his mid forties. The head is a wide, low, soft bean shape, clearly wider than tall, smooth and rounded all over, with no crest and nothing hard on it; a broad, heavy, soft, rounded muzzle fills the whole lower front of the head like a big fleshy river animal's muzzle. From the top front of the head rise two short, thick, soft eye stalks of the same smooth skin, set well apart, each about as tall as the eye on it is wide, leaning slightly outward and drooping a little forward under the weight of the eyes. On top of each stalk sits one big round cartoon eye with a white, a dark iris and a round dark pupil, under a heavy, smooth, domed upper lid closed halfway: a bored, unimpressed look. These two are the only eyes; below them the face has only a smooth soft brow, no eye sockets. The mouth runs wide across the muzzle, closed, with thick, soft, readable lips in a deeper tone of the skin, one corner lifted in a faint smirk. Two small nostril slits on top of the muzzle. Soft heavy jowls at the back of the jaw are his male signal. A darker tone on the crown and the stalks, paler on the muzzle and the throat. Not antennae, not a crab, not a snail, no shell, no claws. His age shows in the heavy lids, the jowls and the set of the mouth, not in wrinkles. Expression at rest: unimpressed, bored, dryly amused. Stylised 3D character render of the head alone: a head-and-shoulders bust in a three-quarter view turned about 45 degrees toward the viewer's left, centred and large in the frame, on a long slender neck with narrow smooth shoulders, the same neck and shoulders for every head of the set. Smooth soft-matte designer vinyl toy finish with a subtle soft glow in the skin, clean simple big shapes, no pores, no wrinkles, no fine texture, not clay, not realistic skin. One clean mid-teal skin with a paler tint of the same colour on the face and throat, so the colour can be changed later; every marking is only a darker or lighter tone of the skin, and the lips are a deeper tone of the skin. An alien, never a human with coloured skin: no human ears, no hair. Adult, cool and striking, never childish, never grotesque. One closed mouth. Soft even studio light with a gentle rim light; a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos."
