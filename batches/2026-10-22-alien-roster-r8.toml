# art#196 roster round 8: three men from round 7 reworked. The engineer (2026-10-22) marked m82r (the gentle giant),
# m89 (the serene monk, the first try: "the second one is cool") and m87r (the young jock) as maybe, "a cool concept,
# needs a little rework". Two different reworks per man, each an edit of that man's own round-7 PNG (first image)
# with rf2 for the style only (second image), n 1: variants of one prompt come out nearly alike, so each rework is its
# own prompt. The giant read big and kind but not giant, with a faint smile: m82a puts the size into a heavy brow and
# jaw on the shared neck, m82b into a giant's neck and shoulders; both lose the smile. The serene one keeps the round
# calm head, the lowered lids and the long lobes, becomes a man (the side lobes read as a woman's bob) and loses the
# third eye, with no sacred iconography: m89a slim long earlobes and a broad jaw, m89b a heavier statue-like man. The
# jock gets level brows, no smirk and more alien eyes and nose: m87a big blue eyes and slit nostrils, m87b a thick
# neck and slit-pupil eyes. The standing permission for OpenAI images: art#196 comment 6291187194 (2026-10-20),
# medium for exploration, within this batch's dollar cap. No game, film, studio, character or religious-figure
# names; no real people. Schema: docs/openai-images.md.
# The six ran first (2026-10-22) and were looked at: both serene reworks missed (m89a kept a human nose, full lips and
# lobes beside the cheeks, so the gender stayed unclear; m89b became a heavy, jowly, sleepy man), so m89c is the one
