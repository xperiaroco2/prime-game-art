# 4. Props and accessories: a picture first, then 3D.
[[items]]
id = "p-cap"
kind = "text_to_image"
prompt = "a simple stylized baseball cap for a low-poly cartoon game, rounded chunky shape, one flat solid colour, three-quarter view, plain white background"
params = { aspect_ratio = "1:1" }

[[items]]
id = "p-cap-3d"
kind = "image_to_3d"
images = [{ from = "p-cap" }]
params = { target_polycount = 800 }

[[items]]
id = "p-backpack"
kind = "text_to_image"
prompt = "a simple stylized hiking backpack for a low-poly cartoon game, chunky rounded shapes, two flat solid colours, three-quarter view, plain white background"
params = { aspect_ratio = "1:1" }

[[items]]
id = "p-backpack-3d"
kind = "image_to_3d"
images = [{ from = "p-backpack" }]
params = { target_polycount = 1000 }

[[items]]
id = "p-knife"
kind = "text_to_image"
prompt = "a simple stylized kitchen knife for a low-poly cartoon game, chunky blade and wooden handle, flat solid colours, side view, plain white background"
params = { aspect_ratio = "1:1" }

[[items]]
id = "p-knife-3d"
kind = "image_to_3d"
images = [{ from = "p-knife" }]
params = { target_polycount = 600 }

[[items]]
id = "p-package"
kind = "text_to_image"
prompt = "a simple stylized cardboard delivery package with brown tape for a low-poly cartoon game, chunky box shape, flat solid colours, three-quarter view, plain white background"
params = { aspect_ratio = "1:1" }

[[items]]
id = "p-package-3d"
kind = "image_to_3d"
images = [{ from = "p-package" }]
params = { target_polycount = 500 }
