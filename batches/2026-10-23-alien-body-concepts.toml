# art#196, the body (the engineer, 2026-10-23, chat: "Тіло: робіть 2D-концепти, до $3"; recorded in the approval_ref
# comment). The current 3D body was judged a cheap mannequin, so the body below the head is designed in 2D first, for
# him to pick from. Two aliens of the approved roster, the chameleon man (m01) and the axolotl woman (w01); per alien two
# bare builds and two sets of "just some nice clothes" (present-day casual, well made; no hats, no glasses). Edits of
# each alien's own roster bust, so the head, face, colours and smooth toy finish stay theirs. Medium (exploration), one
# image per concept (#276), 1024x1536 portrait. Both share one humanoid skeleton (the contract's), so the builds keep
# the same height and limb layout. No game, film, studio, character or real-person names; no style names of other works.
id = "2026-10-23-alien-body-concepts"
service = "openai-images"
purpose = "art#196: full-body 2D concepts of the chameleon man and the axolotl woman (two bare builds and two casual outfits each), for the engineer to pick the body below the approved heads."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
cost_cap_usd = 3.0
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-23"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6374319309"
model = "gpt-image-2.5-sunburst"
quality = "medium"

[defaults]
size = "1024x1536"
n = 1

[[items]]
id = "ch_bare_a"
kind = "edit"
prompt = "The reference image is a finished head-and-shoulders design of the chameleon man, an adult alien character. Keep his head exactly as it is: the same head shape with the tall curled crest and its darker bands, the same big heavy-lidded bored eyes, the two nostril dots, the wide closed lips, the same teal skin with the pale mint throat, and the same smooth soft-matte designer vinyl toy finish and soft studio light. Now design his whole body and show him full length, head to feet. Build: lean and athletic, long limbs, shoulders a little broader than the hips, a flat stomach, a cool grown-up cartoon character, not childish, about five heads tall. The neck flares smoothly into the shoulders as in the reference, never a thin tube. The pale mint front panel of the throat continues down the chest and belly to the groin, with a soft edge to the teal sides; the darker teal bands of the crest echo faintly as a few stripes on the back, the upper arms and the thighs. Hands with four slender fingers and a thumb each, rounded fingertips, clearly drawn and relaxed open. Feet that belong to this species: long feet with the toes in two opposed groups and rounded toe tips, bare. No clothes; a smooth simplified body like a toy figure, with no nipples, no navel and no genitals. A neutral relaxed standing pose, weight even, arms hanging loose a little away from the body, hands open and relaxed, not fists. Front three-quarter view, the whole figure in the frame with a little space above the crest and below the feet, one character only, on a plain flat light-grey background. No text, no labels, no logos, no props."
