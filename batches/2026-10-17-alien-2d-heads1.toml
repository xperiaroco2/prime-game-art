[variants.heads]
prompt = "Character design sheet for a stylized 3D game: one row of eight alien head-and-shoulders busts, all in front view, the same size, evenly spaced on one plain mid-grey studio background, soft key light, gentle rim light, soft shadows. Premium handmade plasticine look: smooth clean sculpted forms, soft matte clay skin with a barely visible handmade surface, no pores, no wrinkles, no HD texture detail. All eight busts share exactly the same eyes and exactly the same mouth at the same height: big glossy bead eyes set wide and high, white with small dark pupils and one sharp highlight, heavy sculpted upper eyelids giving a bored deadpan look; a wide closed frog-line mouth with rolled clay lips and a fuller lower lip. No human nose, at most two tiny nostril slits; no human ears. Only the head shape changes, from left to right: 1 a smooth back-swept dome with a short blade crest; 2 a tall cone head; 3 a fish-like head with a small chin and fins in place of ears; 4 a lizard-like head with a longer flat muzzle and a low brow ridge; 5 a round lemon-shaped head with a short antenna pair; 6 a broad wedge head with two small side fins; 7 a tall narrow egg head with a swept-back fin crest; 8 a head with a soft frilled amphibian collar crest. Each bust has a different saturated skin hue with a lighter tone on the face and throat, and warmer reddish eyelid rims and lips: teal, coral, periwinkle, jade, lemon yellow, lilac, tangerine, cobalt. Adult, cool, funny and appealing, made with care. Not realistic, not childish, not grotesque: no blush stickers, no sparkle eyes, no smile, no slime, no text, no numbers, no labels, no logo."

