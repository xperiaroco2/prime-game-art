# test), in the visual target's style (D:/prime-art-raw/research/2026-10-17-visual-target/visual-target.md). Text to
# image, no anchor (the grey human anchor pulled the last concepts toward a human face). 2 on nano-banana-pro (9 credits),
# 2 on gpt-image-2-5-sunburst (12). Written by the art manager, not committed. Schema: docs/meshy.md.

id = "2026-10-17-alien-2d-heads1"
purpose = "2D concept sheet 1 for art#196: eight alien head-shape families with identical eyes and mouth, to pick the families the engineer likes."
plan = "Meshy paid plan (monthly; bought by the engineer on 2026-10-17)"
