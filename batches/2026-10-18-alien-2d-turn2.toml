prompt = "Character turnaround for 3D modelling of one stylized humanoid alien man, full body in a neutral A-pose, arms angled down away from the body, feet apart, plain light-grey background, even soft studio light, no dramatic shadows. Premium handmade plasticine look: smooth chunky simplified clay forms, soft matte clay skin, no pores, no wrinkles, no muscle detail. Normal adult human proportions, about six heads tall because of the big head: a normal-length neck, normal shoulders, a normal human torso with a slight soft belly, normal arm and leg lengths, slim limbs, simple soft hands with four fingers, simple rounded feet with three toes, no clothes, a smooth body like a clay figurine with no anatomical details. Teal skin with a lighter mint face, throat, chest and belly with a soft organic split, warmer reddish knuckles, elbows and knees. Head: a smooth back-swept domed head with a short curved blade crest sweeping back, no nose (two tiny nostril slits), no ears, big glossy white bead eyes set wide and high with small dark pupils and heavy half-closed lids with warm reddish rims, bored deadpan, a wide frog-line mouth with rolled coral lips and a fuller lower lip, mouth closed. The same character in every view, the same proportions and colours. Not realistic, not childish, no text, no labels, no logo."

