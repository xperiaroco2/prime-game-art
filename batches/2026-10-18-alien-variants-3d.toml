# art#196, night of 2026-10-18: Meshy 3D of each face-part variant turnaround (batch 2026-10-18-alien-variants-img),
# the same settings as the approved base (2026-10-18-alien-3d-base1), so agents can wrap each onto the base topology
# and keep the difference as a morph. Front view first (found by width and belly brightness). Not committed.
id = "2026-10-18-alien-variants-3d"
purpose = "Meshy 3D of the alien base's face-part and head-shape variants, the sources of the parts' morphs (art#196)."
plan = "Meshy paid plan (monthly; bought by the engineer on 2026-10-17)"
terms_url = "https://www.meshy.ai/terms-of-use"
licence = "owned by the customer on a paid plan (Meshy Terms of Use 3.2, updated 2026-09-19); no attribution required"
credit_cap = 260
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-18"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6243717930"

[defaults.multi_image_to_3d.params]
ai_model = "meshy-7.1"
geometry_resolution = "2k"
should_texture = true
texture_resolution = "2k"
pose_mode = "a-pose"
target_formats = ["glb"]

