kind = "edit"
prompt = "The reference image shows the chameleon man, a finished character design. Make a clean expression sheet of this head-and-shoulders bust: six versions of the same head in a grid of three columns and two rows, all in the same three-quarter view, the same size and scale: top row neutral, happy with a wide closed-mouth smile, sad; bottom row angry, surprised with the mouth open in an O, talking with the mouth half open. Each expression clear and appealing, made by the lids, the brows or brow area, the cheeks and the mouth, the same character in every cell. Keep the same character exactly: the same head shape, features, proportions, skin colours and markings, the same smooth soft-matte designer vinyl toy finish, the same slender neck and narrow smooth shoulders, the same soft even studio light on a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos, no numbers."
