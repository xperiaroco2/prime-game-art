prompt = "The reference image shows only the rendering style, the finish, the light, the background, and the neck and shoulders to use. The head itself is a completely new design, described below: do not copy the reference's crest, eyes, eyelids, nostrils, lips or coral colour. Framing: the whole head with a little room above it, then the long slender neck and the top of the narrow shoulders, ending in a clean rounded bust edge inside the frame, the head turned clearly into three-quarter view. The description of the head: A single alien head that reads as an adult woman in her early seventies. At a glance, the features alone suggest the kind of woman she is: a stern old matriarch, the head of a big family; the type is carried only by the shapes of the head and the face, never by anything worn or held, and never by an expression. Above the brow the skull rises straight up into a tall, smooth, rounded beehive dome, narrow and upright, almost twice as tall as the face, in a darker tone of the skin, with two soft, shallow horizontal ridges around it like the coils of a stacked beehive hairstyle; it is clearly the skull itself, the same smooth skin, never hair and never a hat. A long, narrow, dignified face below it with high, sharp cheekbones and softly hollow cheeks. Two narrow, almond-shaped eyes with whites, pale grey irises and horizontal bar pupils, under heavy upper lids lowered halfway, so that she looks down the long, smooth nose ridge at the viewer; short, neat lashes. The nose is a long, smooth, narrow ridge ending in two small slit nostrils. A small mouth, closed, with thin, pressed, readable lips in a deeper tone of the skin, the corners set perfectly level. A small, firm, pointed chin, held slightly raised; a long, upright neck. Her age shows only in the heavy lids, the hollows under the cheekbones and a soft line along the jaw, never in wrinkles. A grand old lady, strict and proper, used to being obeyed. Not a witch, not a villain, never grotesque. Resting face: strict, composed, dignified, perfectly calm, a quiet authority. A calm, neutral face at rest: no visible emotion, no frown, no grin, no open mouth, no teeth. Nothing worn and nothing held: no hat, no cap, no headband, no hair clip, no glasses, no earrings, no jewellery, no props. Stylised 3D character render of the head alone: a head-and-shoulders bust in a three-quarter view turned about 45 degrees toward the viewer's left, centred and large in the frame, on a long slender neck with narrow smooth shoulders, the same neck and shoulders for every head of the set. Smooth soft-matte designer vinyl toy finish with a subtle soft glow in the skin, clean simple big shapes, no pores, no wrinkles, no fine texture, not clay, not realistic skin. One clean mid-teal skin with a paler tint of the same colour on the face and throat, so the colour can be changed later; every marking is only a darker or lighter tone of the skin, and the lips are a deeper tone of the skin. An alien, never a human with coloured skin: no human ears, no hair. Adult, cool and striking, never childish, never grotesque. One closed mouth. Soft even studio light with a gentle rim light; a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos."
