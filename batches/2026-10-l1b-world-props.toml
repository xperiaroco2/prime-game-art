# Locations stage 1 (art #34), batch l1b: image-to-3D of the better concept of each prop from batch l1a, for the
# test of Meshy world props in the bright handmade stop-motion set look. Schema: docs/meshy.md.
# Picked after looking at all eight l1a concepts (2026-10-07): the armchair, throw and tree from text alone (c1: crisp
# handmade felt, knit, sponge and terracotta, saturated; the throw concept drapes over a wooden post standing in for a
# sofa arm, which Meshy builds into the mesh); the yarn basket from image-to-image (c2: the whole object in frame with
# clean, rounded forms). Same approval as l1a; the l1a + l1b total stays within the 200-credit cap set by the locations
# manager and leaves at least 40 credits for the character track (its condition, art #34 issuecomment-6034496087).

id = "2026-10-l1b-world-props"
purpose = "3D meshes of four soft handmade miniature-set props (a felt armchair, a draped knitted throw, a yarn basket, a sponge-and-wire potted tree) to judge Meshy against kit pieces and our scripted pieces under the set shader."
plan = "Meshy Pro (monthly)"
terms_url = "https://www.meshy.ai/terms-of-use"
licence = "owned by the customer on a paid plan (Meshy Terms of Use 3.2, updated 2026-09-19); no attribution required"
credit_cap = 120
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-07"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/34#issuecomment-6034473404"

[defaults.image_to_3d.params]
ai_model = "meshy-7.1"
should_remesh = true
topology = "triangle"
target_polycount = 3000
should_texture = true
enable_pbr = false
texture_resolution = "2k"
target_formats = ["glb"]

[[items]]
id = "w-armchair-3d"
kind = "image_to_3d"
images = [{ file = "raw:2026-10-l1a-world-concepts/w-armchair-c1/text_to_image-image_01a11593-298d-76de-aaa4-aa92ae01ed20_0.png", provenance = "Meshy text-to-image concept from batch 2026-10-l1a-world-concepts, item w-armchair-c1 (our prompt, paid plan)", sha256 = "4b377b4707ebd65238e91cff0c961919731bc67dd7d4e4d3fbef4fabb0299df4" }]

