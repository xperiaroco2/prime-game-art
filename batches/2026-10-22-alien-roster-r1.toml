prompt = "Character line-up concept sheet for a stylish adult cartoon alien cast: front view, full body, ten characters standing side by side in ONE row, evenly spaced, all exactly the same height and size, feet on the same line, a relaxed neutral standing pose with the arms slightly away from the body. Match the style, rendering and body of the reference images exactly: the same slender toy-like alien body for all ten (identical proportions and height, a long neck, narrow shoulders, slim limbs, hands with three fingers and a thumb, simple rounded feet, a smooth featureless body with no anatomy details), the same two-tone teal skin on every character (a darker teal on the top and back of the head, the back and the outer limbs; a pale mint face, throat and belly), coral lips and coral eyelids, white eyes with dark irises and a small catch light. ONLY the heads differ: each one a distinct, memorable alien head silhouette with its own charisma and attitude, cool, confident and attractive, adult cartoon appeal, never childish, never a human with coloured skin. Every mouth is closed. The ten heads, left to right (the first five read as men, the last five as women): 1. the head of the reference images: a tall smooth skull sweeping up into one curled backward crest, heavy-lidded bored eyes under thick coral eyelids, two nostril slits, full glossy coral pout lips; 2. a broad low dome with two short blunt horns at the temples and a heavy brow ridge, small narrowed confident eyes, a wide flat closed mouth in a smug one-sided smirk, a strong wide jaw; 3. a long narrow head stretching far back into a smooth cone, big round wide-set eyes, a small hooked upper lip that overhangs the lower one like a little beak; 4. a round bald dome with two long thin antennae ending in soft balls, droopy half-closed eyes, a big rounded chin, a sly lopsided closed grin; 5. a tall fin ridge running from the brow over the top of the head to the back like a mohawk, two swept-back ear fins, intense narrowed eyes under a thick brow ridge, a square jaw, firmly pressed lips; 6. the head of the reference images with long dark eyelashes: the curled backward crest, half-lidded eyes with coral lids and lashes, a full glossy coral pout; 7. a smooth tall heart-shaped dome with two long soft head tendrils falling back like a ponytail, almond eyes with long lashes and winged coral lids, small heart-shaped lips; 8. a round head ringed at the back by a fan-shaped frill of soft rounded spines, big glossy eyes with long lashes, a coy closed half-smile with one upturned corner; 9. a long sleek head with two smooth horns curving backward, sharp cat-eye lids with lashes, plump coral lips in a knowing closed smirk; 10. a small round head with a big round bulb on top like a top-knot bun, big bright doe eyes with lashes, a few darker freckle dots on the cheeks, small pursed lips. Stylised 3D character render, smooth soft-matte designer vinyl toy finish with a subtle soft glow in the skin, clean simple big shapes, no pores, no wrinkles, no fine texture, not clay, not realistic skin; soft even studio light with a gentle rim light; a plain flat neutral mid-grey background. No clothes. No text, no numbers, no labels, no logos."
