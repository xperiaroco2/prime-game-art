# art#196 roster round 1 (direction D of the 2026-10-21 clean-slate research): 2D concepts of ten finished alien heads
# (five read as men, five as women) on one shared body, an outfit sheet for that body, and one head in eight skin
# colours. Edits with our own approved images as style references (rf2, u1's front view, the lash sheet el2; our own
# Meshy generations). Medium for every item (exploration, several variants each). Items run in phases: l1 and o1
# first; l2 (the line-up's heads in 3/4) is an edit of the l1 image picked by eye, and c1 (skin colours) an edit of
# the strongest head picked from l2. The engineer's yes: art#196 comment 6326683249 (2026-10-22), within this
# batch's dollar cap. No game, film, studio or character names; no real people. Schema: docs/openai-images.md.

