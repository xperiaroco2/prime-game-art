# art#196, 2D concepts, sheets 6 and 7 (the handover's order, step 3). Sheet 6, the interchangeability mix: sheet 1's
# eight head families, each wearing a different combination of his kept eyes (GPT e2: 1, 2, 3, 4, 5, 7, 8) and mouths
# (GPT m2: all eight), to show that any part fits any head. Sheet 7: the one base character (sheet 1's back-swept dome,
# teal, eyes 1, mouth 1) at full body in four present-day outfits, so only the outfit changes (the release-quality
# rule: one base character, a grid only to tune one thing). Both models, one try each.
# Written by the art manager, not committed. Schema: docs/meshy.md.

id = "2026-10-17-alien-2d-parts3"
purpose = "2D concept sheets 6 and 7 for art#196: the parts mixed across head families, and the base character at full body in four outfits."
plan = "Meshy paid plan (monthly; bought by the engineer on 2026-10-17)"
