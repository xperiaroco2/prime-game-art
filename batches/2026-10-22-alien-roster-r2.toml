approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-20"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6291187194"
model = "gpt-image-2.5-sunburst"
quality = "medium"

[defaults]
size = "1024x1280"
n = 3

# h01: h01_chameleon_greaser (man)
[[items]]
id = "h01"
kind = "edit"
prompt = "Redraw the alien head of the first reference image as one head-and-shoulders bust. Keep the head's shape exactly as in the first reference: the same skull, the same big curled crest, the same big domed eyes with heavy bored lids, the same nostril slits, the same wide flat lips and receding chin. Match the rendering, finish and light of both references. Change only the colours to the scheme below: the eyelids and lips are tones of the skin, not coral. The description of the head: A single alien head that reads as an adult man in his late twenties. A tall smooth skull that sweeps up and curls forward over the brow into one big rounded crest, like a breaking wave or a slicked-up quiff. Big round domed eyes set toward the sides of the head, half-closed by thick heavy lids: bored and unimpressed. No brows. Two short nostril slits. A wide, flat, closed mouth with level corners, broad lips that are not swollen. A soft receding chin with no jaw corner. Three faint darker bands across the crest. Expression at rest: bored cool. Stylised 3D character render of the head alone: a head-and-shoulders bust in a three-quarter view turned about 45 degrees toward the viewer's left, centred and large in the frame, on a long slender neck with narrow smooth shoulders, the same neck and shoulders for every head of the set. Smooth soft-matte designer vinyl toy finish with a subtle soft glow in the skin, clean simple big shapes, no pores, no wrinkles, no fine texture, not clay, not realistic skin. One clean mid-teal skin with a paler tint of the same colour on the face and throat, so the colour can be changed later; every marking is only a darker or lighter tone of the skin, and the lips are a deeper tone of the skin. An alien, never a human with coloured skin: no human ears, no hair. Adult, cool and striking, never childish, never grotesque. One closed mouth. Soft even studio light with a gentle rim light; a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos."
