# art#196 roster round 2: the ten head concepts of the 2026-10-22 design research
# (D:/prime-art-raw/research/2026-10-22-roster/design/report.md, concepts.json) as 2D heads, one request per head,
# three variants each: the head alone, a head-and-shoulders bust in 3/4 on neutral grey, our smooth stylized toy look.
# Heads 1 and 3 stay from round 1 and are edits of their crops of l2 image 0 (head 3 gets goggle rims and small
# pupils); the eight new heads are edits with rf2 as the style reference only. The prompts are the concepts' prompts
# with a short lead naming what the references are for. The standing permission for OpenAI images: art#196 comment
# 6291187194 (2026-10-20), medium for exploration, within this batch's dollar cap. No game, film, studio or
# character names; no real people. Schema: docs/openai-images.md.

id = "2026-10-22-alien-roster-r2"
service = "openai-images"
purpose = "art#196 roster round 2: ten designed alien heads (5 men, 5 women) from the design research's concepts, three variants each, as 2D concepts for the engineer to judge one by one."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
