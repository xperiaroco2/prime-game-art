  { file = "raw:2026-10-30-alien-clothes-s2/views/left.png", provenance = "left profile (facing left) cut from our own OpenAI generation, batch 2026-10-30-alien-clothes-s2 item ax_dung_hi (gpt-image-2.5-sunburst), padded to a square, art#196", sha256 = "b5bdd45792a5e6c772aca726000f266b360243e60d1595b5b530d49ca3c5a19b" },
