# art#196, step 0 of the hybrid order (handover comment 6264648420): the face sheet and the clay restudy. After the
# engineer rejected the ultra night's Meshy sculpt ("a parody of plasticine"), this batch asks three questions in 2D,
# on the one approved head (target frame f2a, game distance f1a):
# - c*: the clay look, restudied as real hand-sculpted modelling clay (chunky lumps, seams where pieces meet, uneven
#   edges, thumb-pressed forms), never a fine micro-texture on a smooth body. Described in words only: no game, film
#   or studio is named in any prompt.
# - e3*: five eye designs on that same head, each drawn as a glossy eyeball under separate clay lid shells, so the
#   chosen one can be built as parts (a blink rotates the lids). The five come from his kept sheet-2 eyes (e2).
# - m3*: five mouths on that same head, each a separate clay piece pressed onto the face, as replacement mouths in
#   clay animation. The five come from his kept sheet-3 mouths (m2).
# GPT Image only (concepts), image to image from f2a (and f1a for the game-distance try). Under the standing
# permission for Meshy generation within the plan's credits (2026-10-03, art#16). Schema: docs/meshy.md.

id = "2026-10-19-alien-2d-face1"
purpose = "art#196 step 0: the clay restudy, five eyes and five mouths on the approved head, all as buildable clay parts."
plan = "Meshy paid plan (monthly; bought by the engineer on 2026-10-17)"
terms_url = "https://www.meshy.ai/terms-of-use"
licence = "owned by the customer on a paid plan (Meshy Terms of Use 3.2, updated 2026-09-19); no attribution required"
credit_cap = 110
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-03"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/16"

[defaults.image_to_image.params]
ai_model = "gpt-image-2-5-sunburst"
remove_background = false

# --- c: the clay restudy -------------------------------------------------------------------------------------------

[[items]]
id = "c1a"
kind = "image_to_image"
params = { aspect_ratio = "2:3" }
prompt = "The exact character from the reference image, same head-and-shoulders framing, three-quarter view, same present-day kitchen softly out of focus behind him, same bored deadpan look at the viewer: keep his head shape, the back-swept crest, the big glossy eyes with heavy half-closed lids, the wide rolled coral lips, the two nostril dots, the teal skin with the lighter mint face, throat and chest. Remake him as a real hand-sculpted modelling-clay puppet, as if a sculptor built him from separate pieces of oil-based plasticine by hand: chunky, slightly lumpy forms; visible seams and soft creases where pieces were pressed together, around the lids, the lips, the crest and where the neck meets the head; edges that are rounded and a little uneven, never perfectly crisp; broad shallow thumb-pressed dents and smoothing strokes on the cheeks, skull and shoulders; the teal and the mint blended by hand so the border between them is slightly irregular, with a faint smear. Matte clay with only a soft waxy sheen on the high points. The lips are one thick rolled sausage of coral clay laid on the face. The lids are thick clay caps over the eyeballs. The eyeballs are hard glossy white beads, perfectly smooth, with a bright highlight. Never a fine fingerprint or crumpled-paper texture on a smooth body, never plastic, never smooth CG. Lit like a frame from a modern game: soft shadows, warm lamp light and cool window light. Adult cartoon tone, appealing and cool. One character only. No text, no labels, no logo."
images = [
  { file = "raw:2026-10-18-alien-2d-target1/f2a/image_to_image-image_01a14ff7-292f-7298-b8ac-2ffd6833f34b_0.png", provenance = "own Meshy generation, batch 2026-10-18-alien-2d-target1 item f2a (the approved target frame), art#196", sha256 = "525a0896efb3d8fd5e5283266a86cb244c2660f6a8379f40ab6c88e73c0210ca" },
]

