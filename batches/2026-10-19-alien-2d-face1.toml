# --- m3: five mouths on the same head ----------------------------------------------------------------------------

[[items]]
id = "m3a"
kind = "image_to_image"
params = { aspect_ratio = "16:9" }
prompt = "A character design sheet on a plain mid-grey background: five identical clay busts of the exact character from the reference image in one even row, all seen straight from the front, same size, same head shape, same back-swept crest, same big glossy eyes with heavy half-closed lids, same nostril dots, same teal skin with the lighter mint face, same calm neutral lighting. Only the mouth differs, and every mouth is a separate piece of clay pressed onto the same flat mouth area of the face, with a visible soft seam around it, the way replacement mouths are swapped on a clay animation puppet. From left to right: 1) his own wide thick rolled coral lips, closed, deadpan; 2) full glossy pink-red lips, slightly pouting; 3) a slightly open mouth with two big square front teeth with a gap between them; 4) a wide flat frown with two small pointed fangs poking up from the lower lip; 5) thin coral lips in a lopsided smirk, one corner raised. Real hand-sculpted modelling clay: chunky forms, rounded uneven edges, thumb-pressed dents, matte with a soft waxy sheen; the teeth are smooth cream-coloured clay. Adult cartoon tone, cool, not childish. No text, no numbers, no labels."
images = [
