# --- e3: five eyes on the same head ------------------------------------------------------------------------------

[[items]]
id = "e3a"
kind = "image_to_image"
params = { aspect_ratio = "16:9" }
prompt = "A character design sheet on a plain mid-grey background: five identical clay busts of the exact character from the reference image in one even row, all seen straight from the front, same size, same head shape, same back-swept crest, same wide rolled coral lips and nostril dots, same teal skin with the lighter mint face, same calm neutral lighting. Only the eyes differ, and every pair is built the same way: hard glossy eyeballs set in the head, with separate thick clay lid shells (an upper and a lower lid) wrapped over them, so the lids could close over the eyeball. From left to right: 1) his own big white eyeballs with small dark pupils and heavy half-closed teal lids with a reddish rim, bored; 2) yellow eyeballs with thin vertical slit pupils and narrow lids, sly; 3) huge round white eyeballs with tiny pinprick pupils and the lids pulled wide open, manic; 4) uneven eyes, the left one bigger and wide open, the right one smaller under a lowered sceptical lid; 5) his own two eyes plus a third, smaller eyeball with its own clay lids in the middle of the forehead. Real hand-sculpted modelling clay: chunky forms, seams where pieces meet, rounded uneven edges, thumb-pressed dents, matte with a soft waxy sheen; the eyeballs perfectly smooth and glossy with a bright highlight. Adult cartoon tone, cool, not childish. No text, no numbers, no labels."
images = [
  { file = "raw:2026-10-18-alien-2d-target1/f2a/image_to_image-image_01a14ff7-292f-7298-b8ac-2ffd6833f34b_0.png", provenance = "own Meshy generation, batch 2026-10-18-alien-2d-target1 item f2a (the approved target frame), art#196", sha256 = "525a0896efb3d8fd5e5283266a86cb244c2660f6a8379f40ab6c88e73c0210ca" },
]

