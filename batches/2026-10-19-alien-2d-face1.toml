[[items]]
id = "c2a"
kind = "image_to_image"
params = { aspect_ratio = "3:2" }
prompt = "The exact character and scene from the reference image: full body, standing relaxed in the same bright present-day living room, seen at eye height from about three metres away as another player sees him in a first-person game, one hand slightly raised. Keep his head, crest, eyes, lips, colours, slim adult human proportions, four separate fingers per hand and three toes. Remake him as a real hand-sculpted modelling-clay puppet built from separate pieces of oil-based plasticine: chunky, slightly lumpy forms; seams and soft creases where pieces meet (lids, lips, crest, neck, wrists, knees); rounded, slightly uneven edges; broad thumb-pressed dents and smoothing strokes that still read from three metres away; teal and mint blended by hand with an irregular border; matte clay with a soft waxy sheen. The fingers are separate rolled clay pieces with small gaps between them. The eyeballs are hard glossy white beads. Never a fine fingerprint or crumpled-paper texture on a smooth body, never plastic, never smooth CG. Lit like a frame from a modern game rendered in real time: soft shadows, ambient occlusion, warm lamp light and cool daylight. Adult cartoon tone, appealing and cool. One character only. No text, no labels, no logo, no user interface."
