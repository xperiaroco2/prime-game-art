[variants.m]
prompt = "Redraw the first reference image, a 3D model sheet of ONE sculpted object (stylised cartoon lips), keeping EVERYTHING the same: the same three rows (row 1 straight from the front, row 2 a three-quarter view turned 45 degrees to its left, row 3 an exact side profile turned 90 degrees to its left), the same position and size of the object in every row, the same plain flat light-grey background, the same soft even studio light, the same full, soft, glossy coral-red colour and finish, the same cupid's bow of two rounded peaks, the same fine pointed corners, the same flat smooth back. Change ONLY the shape, as in the second reference image: the lips PRESSED firmly together, as when saying the sound M: the line between them a tight straight-ish crease with no gap, both lips a little flatter and slimmer than at rest and slightly rolled in, the mouth a touch wider, the lips still full, soft and pouty, never thin. Isolated: no face, no skin, no head, no teeth, no tongue, nothing around them. The shape stays perfectly consistent and symmetric between the views. Smooth soft-matte stylised surface with one soft highlight, premium designer vinyl toy finish, no pores, no fine texture, no cast shadow on the background. No text, no numbers, no labels."

[variants.small]
prompt = "Redraw the first reference image, a 3D model sheet of ONE sculpted object (stylised cartoon lips), keeping EVERYTHING the same: the same three rows (row 1 straight from the front, row 2 a three-quarter view turned 45 degrees to its left, row 3 an exact side profile turned 90 degrees to its left), the same position and size of the object in every row, the same plain flat light-grey background, the same soft even studio light, the same full, soft, glossy coral-red colour and finish, the same cupid's bow of two rounded peaks, the same fine pointed corners, the same flat smooth back. Change ONLY the shape, as in the second reference image: the lips SLIGHTLY PARTED, a narrow lens-shaped dark opening between them in the middle third of the mouth, about a fifth of one lip's height at its tallest, closing to nothing well before the corners; the lips relaxed and soft, pushed very slightly forward, the same size as at rest. The opening is a shallow smooth dark-red recess closed at the back, no teeth, no tongue. Isolated: no face, no skin, no head, nothing around the lips. The shape stays perfectly consistent and symmetric between the views. Smooth soft-matte stylised surface with one soft highlight, premium designer vinyl toy finish, no pores, no fine texture, no cast shadow on the background. No text, no numbers, no labels."

