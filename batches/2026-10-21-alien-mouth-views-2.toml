# art#196 M20 (brief UPDATE 42), the hybrid pout, stage 1: the pout mp1's lips in the two other closed shapes, M (the
# lips pressed together) and small (slightly parted, a narrow dark opening), drawn as the same isolated soft sculpture
# as M19's rest sheet (batch 2026-10-21-alien-mouth-views item rest-h): the same three views stacked in rows (front,
# 3/4, side), the same light, scale and colour, so the three closed pieces read as one mouth. The rows are cut apart
# for Meshy's multi-image to 3D (batch 2026-10-21-alien-mouth-3d-2). Edits with the rest sheet first and mp1's own
# panel as the shape reference (our generations): medium for the variants (n = 3), then high for the chosen sheet.
# The engineer's yes (the hybrid pout): art#196 comment 6319459349, within this batch's dollar cap. No game names.
# Schema: docs/openai-images.md.

