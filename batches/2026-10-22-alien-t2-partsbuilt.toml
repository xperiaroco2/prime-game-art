[[items]]
id = "c1_stick_m"
kind = "generate"
prompt = "a man. His head is one tall, narrow upright log of rolled clay with a rounded top, about twice as tall as it is wide, rising straight out of the neck like a stick. Two glossy white bead eyes with dark irises sit on two short, separate clay stalks that sprout from the upper sides of the stick and lean slightly apart. Each eye has its own thick, separate clay eyelid cap, half-lowered for a dry, unimpressed look. A wide, flat, separately rolled clay mouth piece in deeper teal is pressed across the lower stick, closed, with a slight one-sided smirk, its soft seam visible. Two thick, short clay sausage brows sit low on the stick between the stalks, angled into a sceptical frown. Lean, slightly broad shoulders."

[[items]]
id = "c2_bean_f"
kind = "generate"
prompt = "a woman. Her head is one smooth clay bean shape, tilted a little to one side, the wider end on top. Two large glossy dark bead eyes are pressed close together onto the front, each in its own separate pale-mint clay eye cup with a separate clay eyelid piece trimmed with three or four fine rolled clay lashes, half-closed for a knowing, confident look. A small, neat, separately rolled mouth piece in a deeper teal-rose, a subtle closed smile with a little lift at one corner. Two slender, gently arched clay sausage brows float just above the eye cups, clearly separate. Two small nostril dots. A long slender neck, narrow shoulders, an elegant poise."

