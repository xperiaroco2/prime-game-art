# art#196, test T2 (the engineer, 2026-10-22, art#196 comment 6344356802): aliens designed from scratch as characters
# built of parts: a simple clay base form with separate pieces stuck on (two eyes, possibly on stalks, a mouth, clay
# "sausage" brows), the way a hand-made clay world builds odd creatures from a few primitives; the separateness is the
# design, so swapping mouth, eyelid and brow pieces gives expressions. Six concepts with different base forms (a tall
# stick, a bean, a stack of stones, a cone, a ball on a stalk neck, a flat disc), 3 male and 3 female, then a
# swap-only expression sheet (rest, smile, sad, surprised, angry) for the two strongest, as edits of their concept
# images. Medium (exploration), n = 1 per concept (#276). Standing permission art#196 comment 6291187194. No game,
# film, studio or character names; no photos; no real people.
id = "2026-10-22-alien-t2-partsbuilt"
service = "openai-images"
purpose = "art#196 T2: six parts-built clay alien concepts from scratch (separate eyes, mouths and sausage brows on simple base forms) and swap-only expression sheets for the two strongest."
