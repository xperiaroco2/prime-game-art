[[items]]
id = "ch_turn"
kind = "edit"
quality = "medium"
size = "1536x1024"
prompt = "The reference image shows the chameleon man, a finished full-body character design. Make a clean character turnaround sheet of his whole body, head to feet: three full-length views side by side in one row, evenly spaced, the same size and the same height, at the same scale, the feet on one level: on the left the front view looking straight at the viewer, in the middle the exact side profile facing left, on the right the back view. The same neutral relaxed standing pose in every view: standing straight, feet a little apart, arms hanging a little away from the body so the arms, hands and legs are clearly separated from the torso, hands open and relaxed with the fingers readable. Every part of the body must be readable from each side, so its shape can be built in 3D. Keep the same character exactly: the same head, crest, face, proportions, the neck widening smoothly into the shoulders, the hands with four fingers and a thumb, the long two-group feet, the skin colours, the pale front panel and the stripes, the same smooth soft-matte vinyl toy finish, the same soft even studio light on a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos, no numbers."
