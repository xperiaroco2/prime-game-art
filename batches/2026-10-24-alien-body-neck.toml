# art#196, the 3D bodies of the chameleon man and the axolotl woman. The engineer picked body A for both (2026-10-24,
# chat: "Тіла мені подобається саме А варіант. Вони самі адекватні."; recorded in the approval_ref comment). Every A
# concept narrows the neck to a tube where the approved roster busts flare it into the shoulders, so one high edit per
# alien widens the neck into the shoulders as in the bust and changes nothing else (focused work on one piece: high);
# then, from that edit, one medium turnaround per alien (front, side, back in one image) as the 3D route's views. The
# standing OpenAI permission (#196 comment 6291187194) covers it within the cap. No game, film, studio, character or
# real-person names; no style names of other works.
id = "2026-10-24-alien-body-neck"
service = "openai-images"
purpose = "art#196: the chosen A bodies with the neck widened into the shoulders as in the roster busts (high), and a front/side/back turnaround of each (medium) for the 3D body."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
cost_cap_usd = 1.0
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-24"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6383047155"
model = "gpt-image-2.5-sunburst"
quality = "high"

[defaults]
size = "1024x1536"
n = 1

[[items]]
id = "ch_neck"
kind = "edit"
prompt = "The first reference image is the finished full-body design of the chameleon man, an adult alien character. Reproduce it exactly, the same picture, with one change only: his neck. In the first image the neck is a thin straight tube that meets the shoulders at a sharp corner. Make it like the neck in the second reference image, his approved head-and-shoulders bust: the same slim neck under the jaw, which then widens smoothly downward in a soft concave sweep, like sloping trapezius muscles, flowing into the shoulders so that neck and shoulders read as one continuous shape, never a tube stuck onto the body. The pale mint throat continues down the front of the widened neck into the pale chest panel as before. Keep everything else exactly as in the first image: the head, its crest and bands, the face, the eyes, the lips, the skin colours and stripes, the body's proportions and build, the arms, the hands and fingers, the legs and feet, the pose, the camera angle, the framing, the smooth soft-matte vinyl toy finish, the light and the plain grey background. No text, no labels, no logos, no props."
images = [
