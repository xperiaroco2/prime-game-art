  { file = "raw:research/2026-10-22-roster/design/final/m01-chameleon.jpg", provenance = "m01, the chameleon man of the approved 2D roster (art#196, 2026-10-22), our own OpenAI generation", sha256 = "9a4109f9495e3d9ccc72b2517d6036c431799435e204bed3bc7024880bcf6750" },
]

