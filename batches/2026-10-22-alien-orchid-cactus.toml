kind = "edit"
prompt = "The reference image shows only the rendering style, the finish, the light, the background, and the neck and shoulders to use. The head itself is a completely new design, described below: do not copy the reference's crest, eyes, eyelids, nostrils, lips or coral colour. Framing: the whole head with a little room above it, then the long slender neck and the top of the narrow shoulders, ending in a clean rounded bust edge inside the frame, the head turned clearly into three-quarter view. The description of the head: A single alien head that reads as an adult man in his late forties, a dry, laconic, weathered loner of the desert by his features alone. The head is a tall, ribbed, columnar cactus: a tall rounded column with deep smooth vertical ribs running up the skull, and one short rounded cactus arm growing out of one side of the head and bending upward. Along the ribs, small soft rounded tufts where spines would be, a few short soft spines only, nothing sharp to the eye. Deep-set narrow eyes with whites under heavy, level, sun-squinted lids. A long, flat, closed mouth with firm, thin lips, a dry line. A long, strong, square jaw is his male signal. A darker green-teal tone on the ribs, paler in the grooves and on the face and throat. One small closed flower bud on the top of the head is the only accent. Not a monster, never grotesque. A calm, neutral face at rest: no visible emotion, no open mouth, no teeth. Nothing worn and nothing held: no hat, no glasses, no jewellery, no props. Stylised 3D character render of the head alone: a head-and-shoulders bust in a three-quarter view turned about 45 degrees toward the viewer's left, centred and large in the frame, on a long slender neck with narrow smooth shoulders, the same neck and shoulders for every head of the set. Smooth soft-matte designer vinyl toy finish with a subtle soft glow in the skin, clean simple big shapes, no pores, no wrinkles, no fine texture, not clay, not realistic skin. One clean mid-teal skin with a paler tint of the same colour on the face and throat, so the colour can be changed later; every marking is only a darker or lighter tone of the skin, and the lips are a deeper tone of the skin. An alien, never a human with coloured skin: no human ears, no hair. Adult, cool and striking, never childish, never grotesque. One closed mouth. Soft even studio light with a gentle rim light; a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos."
