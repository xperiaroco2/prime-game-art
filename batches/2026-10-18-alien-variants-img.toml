# art#196, night of 2026-10-18: the face-part variants as AI sculpts. GPT Image edits the approved base turnaround
# (u1's three views) with ONE part changed; Meshy 3D follows in a second batch; agents wrap each variant onto the base
# topology as morph deltas. The engineer agreed in advance to the manager's night recommendations (art#196 comment
# 6243717930). Written by the art manager, not committed. Schema: docs/meshy.md.

id = "2026-10-18-alien-variants-img"
purpose = "Turnarounds of the alien base with one face part or the head shape changed, the sources of the parts' morphs (art#196)."
plan = "Meshy paid plan (monthly; bought by the engineer on 2026-10-17)"
terms_url = "https://www.meshy.ai/terms-of-use"
licence = "owned by the customer on a paid plan (Meshy Terms of Use 3.2, updated 2026-09-19); no attribution required"
credit_cap = 90
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-18"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6243717930"

[defaults.image_to_image.params]
ai_model = "gpt-image-2-5-sunburst"
generate_multi_view = true
remove_background = false

[variants.edit]
prompt = "PLACEHOLDER"

