# art#136 (xperiaroco2/prime-game#1587, the M8 sit-down prime-game#1095 c6721181350): three concepts for the first-person hand, each
# in three frames (idle at the screen's lower edge, holding the energy crystal, a fist), for the engineer's pick at his next review.
# Concept A true-size hand in the sleeve, B oversized foreshortened hand, C sleeve pushed up, bare forearm. Edits of our own renders:
# the approved four-digit alien hand (art#196), the approved energy_crystal, the ship's hall. Medium (exploration), n = 1, one image per
# frame; the crystal and fist frames are edits of that concept's idle frame so the hand stays one hand. No game, film, studio, character
# or person names.
id = "2026-11-08-fp-hand-concepts"
service = "openai-images"
purpose = "art#136: three concepts for the first-person hand (idle, holding the energy crystal, a fist) for the engineer's pick; pictures only."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
cost_cap_usd = 1.5
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-11-08"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6291187194 (the standing permission of 2026-10-20: OpenAI images within a batch's cost_cap_usd); art variants asked for at the M8 sit-down, https://github.com/xperiaroco2/prime-game/issues/1095#issuecomment-6721181350"
model = "gpt-image-2.5-sunburst"
quality = "medium"

[defaults]
size = "1536x864"
n = 1

[[items]]
id = "a_idle"
kind = "edit"
prompt = "One frame from inside a first-person video game, 16:9: the camera is the player's own eyes at standing height, looking straight ahead. We see only the player's own arm, as you see your own arm in a first-person game. A right forearm and hand enter from the lower right corner of the frame and reach up and inward, seen from behind: we see the back of the hand, with the thumb on the left, inner side. The hand is relaxed, the fingers slightly curled, resting low near the lower right corner; hand and forearm take about a quarter of the frame's height, true to an ordinary body's proportions. The forearm is in the reference's long sleeve, horizontal navy and off-white stripes, with a plain white cuff at the wrist; the sleeve shows for about half the forearm before it leaves the frame. The hand is exactly the alien hand in the reference close-ups: smooth, soft, matte teal skin with a faint vinyl-toy sheen, no fingernails, no veins, no hair, no wrinkles. It has FOUR digits only, never five: three thick rounded fingers and one thumb, a broad palm, short sausage-like fingers with round tips. Count the digits on every hand: three fingers and one thumb, four in all, never five. The background is the ship's round interior hall from the last reference, kept as it is, dim and cool, a little soft in focus, so that the hand reads first. A real-time game render with a smooth soft toy look. No on-screen interface, no crosshair, no text, no labels, no logos, no watermark, no other people, no gloves, no rings, no claws."
images = [ { file = "raw:2026-11-08-fp-hand-concepts/_refs/hand_open.png", provenance = "our alien hand and striped sleeve, Blender close-ups of art#196 (2026-10-31-hands/closeups/hands_Idle_Loop.png, first row, cropped)", sha256 = "ec5c8f225460d1bef16f31c477b0bd4b83f8eb3fbc6aa2e34fbf54d81da584a6" }, { file = "raw:2026-11-08-fp-hand-concepts/_refs/hand_fist.png", provenance = "our alien hand's fist, thumb pose H1u, Blender close-ups of art#196 (2026-10-31-hands/h1u/g1/close_axolotl.png, third row, cropped)", sha256 = "8cc0f23338b1073d0544c9ea569d0e11142a8024a4d0f149ba4fb5ec49d9c190" }, { file = "raw:2026-11-08-fp-hand-concepts/_refs/ship_hall.png", provenance = "our ship's round hall, Godot night render of ship package v9 (ship/v5/export/v9/_check/shots/in_hall.png)", sha256 = "afcd5bec4f2fbf5dc882bef4b834789de3cf3ee54f3110de98978daeaaa0030e" } ]

[[items]]
id = "a_crystal"
kind = "edit"
prompt = "The first reference is our earlier frame of this same first-person view. Keep the same hand, the same skin, the same sleeve or forearm, the same ship background, the same camera and the same light; change only what is asked here. The second reference is our energy crystal; copy it exactly and do not redesign it: a long faceted glowing cyan crystal with pale facet lines, tipped with a point at the bottom, under a dark graphite and bronze octagonal cap with small lit windows and a bronze loop handle on top. It is 35 cm long and about as thick as the hand is wide, a heavy object about as long as a forearm. Its cyan light falls on the fingers and the wrist. Now both hands hold the crystal low in front of the chest, at the bottom centre of the frame: the left hand comes in from the lower left and cups the crystal's body from below near the point, the right hand holds the bronze and graphite cap. Both forearms in the same striped sleeves. The crystal is carried upright and slightly tilted, like carrying something precious and heavy; it takes about the lower half of the frame's middle. The hand is exactly the alien hand in the reference close-ups: smooth, soft, matte teal skin with a faint vinyl-toy sheen, no fingernails, no veins, no hair, no wrinkles. It has FOUR digits only, never five: three thick rounded fingers and one thumb, a broad palm, short sausage-like fingers with round tips. Count the digits on every hand: three fingers and one thumb, four in all, never five. A real-time game render with a smooth soft toy look. No on-screen interface, no crosshair, no text, no labels, no logos, no watermark, no other people, no gloves, no rings, no claws."
