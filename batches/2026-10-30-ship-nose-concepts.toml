# art#263, the ship's new nose, concept round 1 (the engineer, 2026-10-30, chat, translated: the ship is a wide flat metal manta
# ray, but the nose is a boxy entry tunnel bolted on the front; it looks like "a ship with a box added" and closed it is ugly.
# Reshape the WHOLE nose as part of the manta's own form: flat, angular, the hull's lines running into it, and it should open
# beautifully like a ship in a film. His sketch: closed, the nose tapers to a sharp tip like the tail; half open, it splits
# horizontally into an upper and a lower jaw; open, the upper jaw stays as the roof over the entrance and the lower jaw swings
# down to the ground as the ramp. The throat behind the mouth stays (about 2.3 m tall, 3.3 m wide). He chose concepts first.)
# Six edits of our own ship's Godot renders, medium (exploration), one image per concept. Forms and materials only; no film,
# game, studio or ship names; no people.
id = "2026-10-30-ship-nose-concepts"
service = "openai-images"
purpose = "art#263: six concepts for the ship's new nose, one manta-prow form that splits into upper and lower jaws (three views of his idea, two alternatives, a closed side silhouette), for the engineer's pick."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
cost_cap_usd = 2.0
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-30"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6291187194 (the standing permission of 2026-10-20: OpenAI images within a batch's cost_cap_usd); the engineer chose concepts first, 2026-10-30, art#263"
model = "gpt-image-2.5-sunburst"
quality = "medium"

[defaults]
size = "1536x1024"
n = 1

[[items]]
id = "a_jaw_closed_34"
kind = "edit"
prompt = "The reference image is a night render of our own spaceship landed in a pine forest clearing: a wide, flat manta-ray shaped hull of brushed grey-blue metal with thin white-blue light lines along its edges, amber under-hull glow, a glass cockpit dome, short landing legs, the forest and ground around it. Keep the ship, the camera, the sky, the forest, the ground, the metal material and the night lighting exactly as in the reference, and keep the hull, wings, cockpit, legs and tail unchanged. Change ONLY the nose (the front end): the boxy tunnel-shaped entry block bolted onto the front must disappear and the whole nose is redrawn as part of the manta's own form: flat, angular, faceted, the hull's panel seams and edge light lines flowing straight into it, the same brushed metal and the same crisp panel language as the rest of the hull. The entrance passage inside is a person-sized room-height opening about 2.3 m tall and 3.3 m wide. No people, no text, no labels, no logos. CLOSED, seen from the 3/4 front. The nose is a sleek angular manta prow, low and flat, tapering in plan and in side profile to one sharp tip, like the tapering tail at the other end. Thin dark seam lines show where the prow is split horizontally into an upper jaw and a lower jaw (a clean horizontal parting line running back along both flanks), the jaws shut tight and flush, nothing sticking out, no box, no door frame."
images = [ { file = "raw:2026-10-30-ship-nose-concepts/_refs/ref_closed_34.png", provenance = "our ship (ship v5), Godot night render, 3/4 front, nose closed (lobby/closed-2/a_lobby.png), cropped to 1500x1000 without the caption", sha256 = "6edca0760d87d5bb6dfcd3adc247ed734f121309d36aaad964d8b1c2f038e2cd" } ]

