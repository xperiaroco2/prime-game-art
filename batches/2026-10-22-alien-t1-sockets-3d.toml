# art#196, test T1 "socketed head", step 1, the 3D (the engineer's request, art#196 comment 6344356802; Meshy
# generation within the plan's credits is a standing permission, art#16). The chameleon man's head WITH RECESSES (a
# shallow mouth dish, two empty round eye sockets, no brows) as a raw Meshy head from the three views cut out of this
# test's OpenAI turnaround (batch 2026-10-22-alien-t1-sockets-2d, ch_sockets; front, side, back padded to squares on
# the sheet's grey, 16 % margin), and the eight separate face pieces that seat into the recesses, one image_to_3d each
# from that batch's product images.
#
# Parameters (docs/meshy.md): the head as the pilot (batch 2026-10-22-alien-pilot-3d): meshy-7.1 multi-image at 2k
# geometry (the sockets' rims and the mouth dish are small forms), textured 4k with PBR, lighting removed, remeshed to
# 100,000 triangles with the dense original kept: 35 credits. The pieces at the cheapest settings that keep their
# shape: the four mouths on meshy-7.1 at standard geometry (rolled lips, the corners and the O's hole are the detail a
# lighter model smears), textured: 30 each; the two open eyes, the closed eye and the brow are simple solids (a ball
# with a lid shell, a dome, a rolled sausage), so meshy-6-lite, textured at 2k (its only size): 15 each. Every piece
# remeshed to 30,000 triangles; remove_lighting only on the meshy-7.1 mouths (Meshy refuses the key with
# meshy-6-lite, HTTP 400, even false: the first run's eye_open, no credits charged); plenty for a piece a few centimetres across that step 2 cleans up anyway. Estimate
# 35 + 4 x 30 + 4 x 15 = 215 credits, cap 260. No game, film, studio, character or person names (the images are the
# prompt). Schema: docs/meshy.md.

id = "2026-10-22-alien-t1-sockets-3d"
purpose = "art#196 T1 step 1: the chameleon man's socketed head (mouth recess, empty eye sockets) as a raw Meshy multi-image-to-3D head and its eight separate face pieces as image-to-3D models, to judge how the pieces seat into the recesses."
plan = "Meshy paid plan (monthly; bought by the engineer on 2026-10-17)"
terms_url = "https://www.meshy.ai/terms-of-use"
licence = "owned by the customer on a paid plan (Meshy Terms of Use 3.2, updated 2026-09-19); no attribution required"
credit_cap = 260
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-22"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6344356802"

[defaults.multi_image_to_3d.params]
ai_model = "meshy-7.1"
geometry_resolution = "2k"
should_texture = true
enable_pbr = true
texture_resolution = "4k"
remove_lighting = true
should_remesh = true
topology = "triangle"
target_polycount = 100000
save_pre_remeshed_model = true
target_formats = ["glb"]

[defaults.image_to_3d.params]
ai_model = "meshy-7.1"
should_texture = true
enable_pbr = true
texture_resolution = "2k"
should_remesh = true
topology = "triangle"
target_polycount = 30000
target_formats = ["glb"]

