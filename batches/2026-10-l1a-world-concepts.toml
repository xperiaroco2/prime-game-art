# Locations stage 1 (art #34), batch l1a: concept images for a test of Meshy world props in the bright handmade
# stop-motion set look. Four props, two concepts each: one from text alone, one by image-to-image from our own stage-0
# set renders. The better concept of each prop goes to image-to-3D in batch l1b. Schema: docs/meshy.md.
# Approved by the engineer on 2026-10-07 (option "a": a test from October's leftover credits), with a cap of 200 credits
# for l1a and l1b together; the character track's 30-credit reserve for #33 stays untouched.

id = "2026-10-l1a-world-concepts"
purpose = "Concepts for a test of whether Meshy can make soft handmade miniature-set props for the world (a felt armchair, a draped knitted throw, a yarn basket, a sponge-and-wire potted tree) that hold together with kit pieces, our scripted pieces and the clay people under the set shader."
plan = "Meshy Pro (monthly)"
terms_url = "https://www.meshy.ai/terms-of-use"
licence = "owned by the customer on a paid plan (Meshy Terms of Use 3.2, updated 2026-09-19); no attribution required"
credit_cap = 72
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-07"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/34#issuecomment-6034473404"

[defaults.text_to_image.params]
ai_model = "nano-banana-pro"
remove_background = true
aspect_ratio = "1:1"

[defaults.image_to_image.params]
ai_model = "nano-banana-pro"
remove_background = true

[[items]]
id = "w-armchair-c1"
kind = "text_to_image"
prompt = "a small handmade miniature armchair made for a stop-motion animation film set: hand-cut foam padding covered in mustard-yellow wool felt with visible blanket-stitch seams, plump slightly uneven cushions, short turned wooden legs painted teal, soft rounded edges, crafted by hand at tabletop scale, rich saturated colours, matte surfaces, single object, three-quarter view, plain white background"

[[items]]
id = "w-armchair-c2"
kind = "image_to_image"
prompt = "a single small armchair in the same handmade miniature film-set style as the reference images: felt-covered foam padding with visible stitching, plump slightly uneven cushions, short turned wooden legs, rich saturated colours, matte surfaces, single object, three-quarter view, plain white background"
images = [
