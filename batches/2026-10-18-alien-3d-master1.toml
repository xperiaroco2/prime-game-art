# art#196, the "ultra first" master (the engineer, 2026-10-18 ~16:00 UTC): the best the generator gives, before any
# optimisation. The same approved three views (sheet 10b's turnaround u1), T-pose (palms down, fingers straight), the
# highest geometry multi-image to 3D takes (2k) and an 8k PBR texture (base colour, normal, roughness), no remesh. Two
# generations of the same input (u1, u2), because a generation varies (t1 fused the fingers, t2 kept them apart).
# Under the standing permission for Meshy generation within the plan's credits (2026-10-03, art#16). Schema:
# docs/meshy.md.

id = "2026-10-18-alien-3d-master1"
purpose = "The ultra master of the alien base for art#196: T-pose, 2k geometry, 8k PBR texture, two generations."
plan = "Meshy paid plan (monthly; bought by the engineer on 2026-10-17)"
terms_url = "https://www.meshy.ai/terms-of-use"
licence = "owned by the customer on a paid plan (Meshy Terms of Use 3.2, updated 2026-09-19); no attribution required"
