# art#276: the quality comparison the engineer asked for (2026-10-22): one image per concept, and perhaps a better
# quality for that one image; compare the cost and the result. Round 7's item m83 (batch 2026-10-22-alien-roster-r7,
# the sleazy salesman he kept) run again with the same prompt and the same rf2 reference, once at medium and once at
# high, n 1 each. The standing permission for OpenAI images: art#196 comment 6291187194 (2026-10-20), medium for
# exploration, high for focused work on one piece, within this batch's dollar cap. No game, film, studio or
# character names; no real people. Schema: docs/openai-images.md.
id = "2026-10-22-openai-quality-compare"
service = "openai-images"
purpose = "art#276: the same prompt and reference as roster round 7's m83, once at medium and once at high quality, to compare the cost per image and what visibly changes."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
