[defaults]
size = "1024x1280"
n = 1

# m83-medium: round 7's m83 (the sleazy salesman the engineer kept), the same prompt and reference, quality medium
[[items]]
id = "m83-medium"
kind = "edit"
quality = "medium"
prompt = "The reference image shows only the rendering style, the finish, the light, the background, and the neck and shoulders to use. The head itself is a completely new design, described below: do not copy the reference's crest, eyes, eyelids, nostrils, lips or coral colour. Framing: the whole head with a little room above it, then the long slender neck and the top of the narrow shoulders, ending in a clean rounded bust edge inside the frame, the head turned clearly into three-quarter view. The description of the head: A single alien head that reads as an adult man in his mid forties. At a glance, the features alone suggest the kind of man he is: a sleazy salesman; the type is carried only by the shapes of the head and the face, never by anything worn or held, and never by an expression. The head is a narrow, smooth oval, slightly longer than wide, with a slick, polished, wet-look shine on the crown. On top, one smooth glossy lobe of the skull itself sweeps from a sharp side parting low over to one side of the head and curls tightly down over that side, like a slicked, oiled comb-over moulded from the skin, giving the head an asymmetric silhouette; the other side of the crown is flat and sleek. Two narrow almond cartoon eyes with whites and dark irises, each with a horizontal, rectangular slit pupil, set a little close together under smooth, heavy, half-lowered upper lids, the gaze sliding sideways toward the viewer, sizing him up. Thin, high, arched brow ridges. Along the top of the upper lip runs a thin, neat, perfectly straight line of darker raised skin, like a pencil moustache. A long mouth, closed, a fraction too wide for the face, with thin, smooth, readable lips in a deeper tone of the skin, one corner lifted in the faintest practised smirk. A narrow, pointed, smooth chin. The pencil line and the pointed chin are his male signal. A darker tone on the slick swept lobe, paler on the face and the throat. Not a villain, not a snake, never grotesque. Resting face: smooth, calculating, a practised composure, the faintest smirk. A calm, neutral face at rest: no visible emotion, no frown, no grin, no open mouth, no teeth. Nothing worn and nothing held: no hat, no cap, no glasses, no pipe, no cigar, no jewellery, no props. Stylised 3D character render of the head alone: a head-and-shoulders bust in a three-quarter view turned about 45 degrees toward the viewer's left, centred and large in the frame, on a long slender neck with narrow smooth shoulders, the same neck and shoulders for every head of the set. Smooth soft-matte designer vinyl toy finish with a subtle soft glow in the skin, clean simple big shapes, no pores, no wrinkles, no fine texture, not clay, not realistic skin. One clean mid-teal skin with a paler tint of the same colour on the face and throat, so the colour can be changed later; every marking is only a darker or lighter tone of the skin, and the lips are a deeper tone of the skin. An alien, never a human with coloured skin: no human ears, no hair. Adult, cool and striking, never childish, never grotesque. One closed mouth. Soft even studio light with a gentle rim light; a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos."
images = [
  { file = "raw:2026-10-19-alien-release-look/rf2/image_to_image-image_01a154a7-63c1-720a-9d8f-39ba1e53026a_0.png", provenance = "rf2, the approved look target (head and shoulders, 3/4), our own Meshy generation, batch 2026-10-19-alien-release-look item rf2, art#196", sha256 = "6359ed7e2255c2a582d2f1b5b903da8e355fdd870ae841f27f1cd5ed2b1df6e2" },
