# art#196 roster round 4, "a new ten": the engineer (2026-10-22) likes heads built from real animals, insects and
# fish and asked for a new ten (5 men, 5 women) from more references: fish, birds, insects, dinosaurs and other
# reptiles. The research and the picks: D:/prime-art-raw/research/2026-10-22-roster/design/r4/ (references_r4.md,
# concepts_r4.json and .md). Each item is an edit with rf2 as the style reference only, round 3's lead, framing
# sentence and style tail unchanged; every prompt writes the animal's own eyes and mouth (round 3's lesson). The
# standing permission for OpenAI images: art#196 comment 6291187194 (2026-10-20), medium for exploration, within this
# batch's dollar cap. No game, film, studio or character names; no real people. Schema: docs/openai-images.md.
# m41 and w42 ran first (2026-10-22) and were looked at: both held. After the other eight, every variant of m42
# (a hair quiff over a human pout), m43 (a helmet visor over a human chin) and w41 (the classic big black alien
# eyes and small human lips) missed; m42r, m43r and w41r are their one revised prompt each.
id = "2026-10-22-alien-roster-r4"
service = "openai-images"
purpose = "art#196 roster round 4: a new ten alien head candidates (five men, five women), each built from one real animal (bird, reef fish, insect, dinosaur, reptile), three variants each, as 2D concepts for the engineer to judge."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
cost_cap_usd = 5.0
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-20"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6291187194"
model = "gpt-image-2.5-sunburst"
quality = "medium"

[defaults]
size = "1024x1280"
n = 3

# m41: shoebill (man, early sixties)
[[items]]
id = "m41"
kind = "edit"
prompt = "The reference image shows only the rendering style, the finish, the light, the background, and the neck and shoulders to use. The head itself is a completely new design, described below: do not copy the reference's crest, eyes, eyelids, nostrils, lips or coral colour. Framing: the whole head with a little room above it, then the long slender neck and the top of the narrow shoulders, ending in a clean rounded bust edge inside the frame, the head turned clearly into three-quarter view. The description of the head: A single alien head that reads as an adult man in his early sixties. The head is a shoebill's: an enormous, broad, deep, bulbous bill shaped like a wooden clog makes up the front half of the head, wider and taller than the skull behind it, its top strongly keeled along the middle and ending in a sharp, short, downward hooked nail at the tip. The bill's closed edge runs back in one long straight seam that turns down a little at the corner: that is the only mouth, no lips. Behind the bill a compact rounded skull, smaller than the bill, with a short tuft of a few soft smooth points at the back of the crown. Two round eyes set at the front of the skull just above the base of the bill, both looking forward over it: a pale iris a little lighter than the skin, a small solid dark round pupil, no whites, the upper lid a flat straight line across the top of the iris: an unblinking, statue-still stare. Faint irregular darker blotches on the bill. No nose, only two thin slits along the top of the bill near its base. His age shows in the flat heavy lids and the set of the face, not in wrinkles. Expression at rest: motionless, unimpressed, staring straight through the viewer. Stylised 3D character render of the head alone: a head-and-shoulders bust in a three-quarter view turned about 45 degrees toward the viewer's left, centred and large in the frame, on a long slender neck with narrow smooth shoulders, the same neck and shoulders for every head of the set. Smooth soft-matte designer vinyl toy finish with a subtle soft glow in the skin, clean simple big shapes, no pores, no wrinkles, no fine texture, not clay, not realistic skin. One clean mid-teal skin with a paler tint of the same colour on the face and throat, so the colour can be changed later; every marking is only a darker or lighter tone of the skin, and the lips are a deeper tone of the skin. An alien, never a human with coloured skin: no human ears, no hair. Adult, cool and striking, never childish, never grotesque. One closed mouth. Soft even studio light with a gentle rim light; a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos."
