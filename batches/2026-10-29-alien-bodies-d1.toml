[[items]]
id = "a_c1"
kind = "edit"
prompt = "The reference image is the approved turnaround of one finished character, the chameleon man, an adult alien, in dungarees. Keep his head exactly as it is, the same size relative to the body: the tall rounded head crest curling back with its soft bands, the big heavy-lidded bored eyes, the two nostril dots, the wide closed lips, the teal skin with the paler throat. Keep his height and the style and light of the sketch. Concept 1, the sketch's body as drawn: keep exactly the body proportions, limb lengths and limb thickness of the reference sketch, only without the clothes, so the body would fill those same clothes: the same slim, slightly tubular arms and legs, the same hands and the same overall height. He is clearly an adult man: shoulders a little broader than the hips, a straight waist, a simple flat smooth chest. Draw the body unclothed only so that a modeller can read its shapes: it is one smooth, soft, seamless surface like an unpainted soft vinyl collectible toy figure, the same teal skin as the head with the paler throat and a slightly paler front of the torso, a soft-matte finish. It has no anatomical detail anywhere: no nipples, no navel, the pelvis and the area between the legs one smooth closed continuous surface like a mannequin, nothing drawn there, no muscles cut into the surface, no ribs, no visible bones, no veins, no scales. Each hand has exactly four digits: three thick, soft, rounded fingers and one thumb, never a fifth finger, relaxed and slightly open. Simple soft rounded feet. The neck is a clean smooth cylinder from the collarbones up to just under the head, the same width all the way, and a thin soft groove line goes once around the top of the neck right under the jaw and the back of the skull, drawn in every view, marking where the head sits on the neck. The mood is a grown-up stylised animated-feature alien: appealing, simple, soulful, adult, never childish, never a baby or a chibi, never a pin-up, nothing sexualised, a neutral calm face, no pose. Layout: one character model sheet of four full-length views side by side at exactly the same scale and height, feet on one shared ground line, left to right: the straight front view, the front three-quarter view turned to the left, the straight left side profile, and the straight back view. Each view is an orthographic-like straight view at chest height, no perspective, no foreshortening. The same neutral relaxed A-pose in every view: standing straight, weight on both feet, feet about hip width apart, arms straight and held about 30 degrees out from the body so the arms and the torso do not touch, palms facing the thighs. A little space above the head and below the feet. Plain flat light-grey background, the same soft studio light and soft-matte rendering as the reference sketches, a soft contact shadow under the feet. No clothes, no shoes, no text, no labels, no arrows, no grid, no logos, no props, no hat, no glasses, no jewellery."
