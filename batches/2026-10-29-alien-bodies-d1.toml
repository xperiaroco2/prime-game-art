# art#196 step D1, bodies by drawing (the engineer, 2026-10-29 ~15:00 UTC, chat, brief
# <raw>/manager/clothes/d1-brief.md): the crystal's route, a concept, then a drawing in mm, then the 3D body built
# from the drawing. These are the concepts: bodies A (the chameleon man) and B (the axolotl woman) unclothed, front,
# three-quarter, side and back, three distinct concepts per body (c1 the clothes sketches' body as drawn, c2 a little
# more toy appeal, c3 a little more adult and long-limbed), B's chest small but clearly visible, the neck a clean
# cylinder with the head-seat line. Edits of our own approved clothes sketches (and her approved silhouette for B).
# Medium, one image per concept, 2560x1024. Generated by a script; no game, film, studio, character or real-person
# names; no brand marks.
id = "2026-10-29-alien-bodies-d1"
service = "openai-images"
purpose = "art#196 D1: three unclothed body concepts each for the chameleon man (A) and the axolotl woman (B), front / three-quarter / side / back, for the engineer to pick the body the mm drawing and the 3D build follow."
