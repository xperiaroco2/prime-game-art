# art#196 M19 (brief UPDATE 38), the AI mouth route test, stage 2: Meshy multi-image to 3D (meshy-7.1, untextured: the
# colour comes from our lip shader) of the pout mp1's lips as an isolated soft sculpture, rest and A, each from the
# three views of batch 2026-10-21-alien-mouth-views (the high redraws rest-h and a-h, cut into rows: front first,
# then 3/4 and side). tools/blender/alien_mouth_fit.py then fits them onto our mouth socket beside our parametric
# pieces. The engineer's yes: art#196 comment 6318565360, within this batch's credit cap. No game names. Schema:
# docs/meshy.md.

id = "2026-10-21-alien-mouth-3d"
purpose = "art#196 M19: the pout's lips at rest and in the A shape as AI 3D forms (Meshy multi-image to 3D from our GPT Image views), to test whether an AI form makes better lips than our parametric rolls."
plan = "Meshy paid plan (monthly; bought by the engineer on 2026-10-17)"
terms_url = "https://www.meshy.ai/terms-of-use"
licence = "owned by the customer on a paid plan (Meshy Terms of Use 3.2, updated 2026-09-19); no attribution required"
credit_cap = 120
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-21"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6318565360"

[defaults.multi_image_to_3d.params]
ai_model = "meshy-7.1"
geometry_resolution = "2k"
should_texture = false
target_formats = ["glb"]

