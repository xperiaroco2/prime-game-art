[variants.eyes]
prompt = "Character design sheet for a stylized 3D game: one row of eight identical alien head-and-shoulders busts in front view, the same size, evenly spaced on one plain mid-grey studio background, soft key light, gentle rim light, soft shadows. Premium handmade plasticine look: smooth clean sculpted forms, soft matte clay skin with a barely visible handmade surface, no pores, no wrinkles, no HD texture detail. Every bust is the same alien: a smooth back-swept domed head with a short curved blade crest, teal skin with a lighter mint face and throat, a slim neck, no human nose (two tiny nostril slits), no human ears, and exactly the same closed wide frog-line mouth with rolled coral clay lips and a fuller lower lip. Only the eyes change, from left to right: 1 big glossy white bead eyes with small dark pupils and heavy half-closed upper lids, bored; 2 the same beads with vertical slit pupils and a sly narrow look; 3 sleepy droopy lids almost closed with soft eye bags; 4 wide open round eyes with tiny pupils, manic; 5 two bead eyes plus a small third eye above them; 6 two short eye stalks with bead eyes on top; 7 slightly uneven eyes, one bigger, with a raised sceptical lid; 8 almond bead eyes with dark eyeliner rims and a few long simple lashes, smug. Every eye set has warmer reddish lid rims and one sharp highlight. Adult, cool, funny and appealing, made with care. Not realistic, not childish, not grotesque: no blush stickers, no sparkle eyes, no smile, no text, no numbers, no labels, no logo."

