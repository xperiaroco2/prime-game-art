# How-to card styles, round 2, for the UI track (prime-game#150). The engineer, 2026-10-22, UI chat: round 1's
# direction 1 (three-ink screenprint) is the favourite; go deeper into mid-20th-century American commercial art (print
# ads, enamel and tin signs, safety posters with a cartoon mascot), ten sub-directions. Research: prime-game-ui
# docs/research/2026-10-22-howto-card-styles/midcentury.md. Each direction has its own mascot so the model does not fall
# back on the stock little green alien. Two Cooking frames each, two images each, medium, text-only.
# The standing permission for OpenAI images: art#196 comment 6291187194 (2026-10-20). No game, film, studio, brand,
# artist or character names; no real people. Schema: docs/openai-images.md.

id = "2026-10-22-howto-styles-r2"
service = "openai-images"
purpose = "How-to card styles round 2 (prime-game#150): ten mid-century American commercial-art sub-directions on two Cooking frames each, for the engineer to compare."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
