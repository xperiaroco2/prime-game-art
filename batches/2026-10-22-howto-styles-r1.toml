# How-to card styles, round 1, for the UI track (prime-game#150). The engineer, 2026-10-22, UI chat (translated): the
# 3D pilot (batch 2026-10-22-howto-cooking-pilot) "looks like AI slop"; the cards are flat 2D cartoon, the figure need
# not be a game character, and a player must not take them for AI images; go wide first: research, then about ten
# looks. The ten directions and their prompts come from the research of prime-game-ui
# docs/research/2026-10-22-howto-card-styles/report.md. Two frames of the Cooking card per direction (fry the patty
# without burning it; build the burger on its marked plate), two images each, medium, text-only generations.
# The standing permission for OpenAI images: art#196 comment 6291187194 (2026-10-20). No game, film, studio, brand,
# artist or character names; no real people. Schema: docs/openai-images.md.

id = "2026-10-22-howto-styles-r1"
service = "openai-images"
purpose = "How-to card styles round 1 (prime-game#150): ten flat 2D directions on two Cooking frames each, for the engineer to compare on a private page."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
cost_cap_usd = 3.0
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-20"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6291187194"
model = "gpt-image-2.5-sunburst"
quality = "medium"

[defaults]
size = "1024x768"
n = 2
background = "opaque"

[[items]]
id = "s01-screenprint-fry"
kind = "generate"
prompt = "Three-colour screenprint illustration: only three flat ink colours (orange-red #E4572E, teal #2A9D8F, dark navy #2B2D42) on cream paper #F2E8D5, shapes slightly off-register, bold simple shapes, no outlines, overprint where inks overlap. Scene, one frame of a wordless how-to comic, 4:3: a small round-bodied cartoon alien with a big head stands at a small barbecue grill and flips a golden-brown round burger patty with a spatula at just the right moment. To the right, on a plate, a second patty is burnt black and gives off a curl of smoke; the alien glances at it, embarrassed. Empty plain background, nothing behind the scene. Flat 2D only: no gradients, no soft shading, no glow, no rim light, no bokeh, no 3D, no depth of field, no texture detail beyond the named print process, no text, letters, numbers or logos anywhere. Neutral white balance. Big simple shapes that still read as a 160 by 120 pixel thumbnail."

