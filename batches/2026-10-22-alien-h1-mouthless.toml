# art#196, hypothesis H1 (the engineer, art#196 comment 6343841227): Meshy builds the head WITHOUT a mouth (a smooth
# muzzle) and one designed mouth module is fitted into that place. The 2D test of whether that can look as good as the
# approved heads: per pilot head its turnaround with the mouth removed (what Meshy would get), one shared mouth module
# sheet (soft rolled teal lips with a skin surround that blends out, front and 3/4, five states; mouth_module_r is its
# one revised item: the first's smile and sad barely differed from rest, its lips read human, its patch glowed),
# then per head the mouthless head with the module fitted at rest, smile, sad and O. Medium (exploration of a
# route), n = 1 ("One image per concept"); the composites are edits of this batch's own mouthless and module images.
# Standing permission art#196 comment 6291187194. No game, film, studio or character names; no real people.
id = "2026-10-22-alien-h1-mouthless"
service = "openai-images"
purpose = "art#196 H1: mouthless pilot heads, one shared mouth module and the heads with the module fitted, to judge the mouthless-head route in 2D."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
cost_cap_usd = 3.0
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-22"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6343841227"
model = "gpt-image-2.5-sunburst"
quality = "medium"

[defaults]
size = "1536x1024"
n = 1

