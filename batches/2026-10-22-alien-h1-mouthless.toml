kind = "edit"
prompt = "The reference image is a finished character turnaround sheet of the axolotl woman: front view, side profile facing left, back view. Make the same sheet with exactly one change: remove the mouth completely. Where the mouth and lips were, the lower face is now a smooth, clean, gently rounded muzzle of plain skin, with no lips, no mouth line, no slit, no crease, no dimples and no hint of a mouth, in the same pale skin colour blending into the teal as before, the same rounded volume of the lower face and chin as the original. Everything else stays exactly the same: the same three views in the same places and sizes, the same head shape, eyes, nostrils, freckle dots, gills, neck and shoulders, the same colours, the same smooth soft-sheen designer vinyl toy finish, the same soft even studio light on the same plain flat neutral grey background. No text, no labels, no logos, no numbers."
images = [
