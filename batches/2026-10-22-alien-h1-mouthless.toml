[[items]]
id = "mouth_module"
kind = "edit"
prompt = "The two reference images are turnaround sheets of two finished cartoon alien heads; use them only for the style, the colours and the material. Make a clean design sheet of one mouth module that could be fitted onto either head: a self-contained pair of soft, rounded, rolled cartoon lips in the same teal as the heads' lips, set in a small oval patch of pale mint skin that surrounds the lips and blends out softly to nothing at its edge, with no hard border. Moderate fullness, simple and appealing, not human, no teeth showing except where the mouth is open. Show it alone, floating, with no head, in a grid of five columns and two rows, every cell the same size and scale: the top row in a straight front view, the bottom row the same five in a three-quarter view turned to the left. The columns, left to right: at rest with the lips gently closed; a closed-mouth smile with the corners turned up; sad with the corners turned down; a round open O shape; talking, half open with a soft pink tongue visible inside a dark mouth. The same smooth soft-sheen designer vinyl toy finish, soft even studio light, a plain flat neutral grey background. No text, no labels, no logos, no numbers."
images = [
  { file = "raw:2026-10-22-alien-pilot-2d/ax_turn/image-0.png", provenance = "the axolotl woman's approved turnaround, our own OpenAI generation, batch 2026-10-22-alien-pilot-2d item ax_turn, image 0, art#196", sha256 = "f7d9916c4e887a84f3f36fdd1c489a126d20353d9a197d10ad6714f8e2481510" },
