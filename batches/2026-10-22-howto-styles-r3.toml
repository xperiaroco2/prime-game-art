# How-to card styles, round 3, for the UI track (prime-game#150). The engineer, 2026-10-22, UI chat (translated): round
# 2's direction 1 (the 1940s two-ink safety poster) has the graphics he likes, but not its red alien; round 1's cute
# little green alien (direction 1, the screenprint) is the character he liked. Ten variations of that cross, each an
# edit with two of our own generations as references: image 1 the rendering (r2 m01), image 2 the character (r1 s01).
# Two Cooking frames each, two images each, medium.
# The standing permission for OpenAI images: art#196 comment 6291187194 (2026-10-20). No game, film, studio, brand,
# artist or character names; no real people. Schema: docs/openai-images.md.

id = "2026-10-22-howto-styles-r3"
service = "openai-images"
purpose = "How-to card styles round 3 (prime-game#150): ten variations crossing the 1940s safety-poster rendering with round 1's cute green alien, on two Cooking frames each."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
cost_cap_usd = 3.0
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-20"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6291187194"
model = "gpt-image-2.5-sunburst"
quality = "medium"

[defaults]
size = "1024x768"
n = 2
background = "opaque"

[[items]]
id = "v01-fry"
kind = "edit"
prompt = "Two reference images. Image 1 sets the RENDERING only: a 1940s workplace-safety poster illustration, offset print on cream paper, thick confident brush outlines with real thick-and-thin, flat ink colours, their overprint, a consistent slight misregistration, the same scene layout. Image 2 sets the CHARACTER only: the small cute round-bodied alien with a big round head, big dark oval eyes, a small mouth and two antennae with ball tips; keep it cute and small, do not turn it into image 1's tall grinning red figure. Redraw the scene of image 1 with the alien of image 2, in the rendering of image 1. Inks: teal-green for the alien, signal red for the grill and the accents, navy for the line, on cream. Scene: the alien flips a golden-brown burger patty on a small barbecue grill at just the right moment; on a plate beside it a second patty is burnt black and sends up a curl of smoke; the alien glances at it, embarrassed. Wordless, no lettering, no text, no numbers, no logos, no photorealism, no 3D, no gradients, no glow. Plain cream background, nothing behind the scene. Big simple shapes that read as a 160 by 120 pixel thumbnail."
images = [{ file = "raw:2026-10-22-howto-styles-r2/m01-safety-fry/image-0.png", provenance = "r2 m01-safety-fry image 0 (the rendering), our own OpenAI generation (UI track, prime-game#150)", sha256 = "af385db8f43d31f20ba8a67c2c3ecbd5a580a02f300742c7ce6461b4e7021a86" }, { file = "raw:2026-10-22-howto-styles-r1/s01-screenprint-fry/image-0.png", provenance = "r1 s01-screenprint-fry image 0 (the character), our own OpenAI generation (UI track, prime-game#150)", sha256 = "df60ea72456cc86bf01515ddeb1f63a47a971bb445beb13b02ce8d8effa82204" }]

