# the burger are dropped (the agent's plate mark, unclear in one frame). One frame per step of the Cooking chain; the fry
# frame is the check's. Every item an edit with the check fry frame as the character and rendering master. High, two
# images each.
# The standing permission for OpenAI images: art#196 comment 6291187194 (2026-10-20). No game, film, studio, brand,
# artist or character names; no real people. Schema: docs/openai-images.md.

id = "2026-10-22-howto-cooking-card"
service = "openai-images"
purpose = "The whole Cooking how-to card (prime-game#150): six more frames in the chosen style, drawn from the check frame's alien."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
cost_cap_usd = 3.0
approved_by = "xperiaroco2 (the engineer)"
