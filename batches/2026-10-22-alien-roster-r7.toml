# art#196 roster round 7, ten new men by character type: the engineer (2026-10-22) rejected round 6's emotions
# and asked instead for heads whose base features hint at a character type at a calm, neutral rest, as the kept
# heads do (the catfish a count, the night ears a vampire). Ten men m81..m90, each a different, instantly guessable
# type carried by the shapes alone (no clothes, hats or props), by round 5's principles (one extreme soft base
# shape, a blend of 2-3 animals written as shapes, one eye idea, a big closed mouth with lips, heavy acting lids,
# one male signal). Each item is an edit with rf2 as the style reference only (round 5's lead, framing sentence
# and style tail, the head turned to the viewer's left), n 1: the engineer saw that three variants came out nearly
# alike, so a concept that misses gets one revised item (suffix r) instead. The source table:
# D:/prime-art-raw/research/2026-10-22-roster/design/r7/concepts_r7.src.json (the blend column is for us; the
# prompts describe shapes). The standing permission for OpenAI images: art#196 comment 6291187194 (2026-10-20),
# medium for exploration, within this batch's dollar cap. No game, film, studio or character names; no real
# people. Schema: docs/openai-images.md.
# m81 and m85 ran first (2026-10-22) and were looked at: m81 held (an old egghead with drooping brow lobes);
# m85 read as a woman (smoky eyeliner, full sensual lips), so m85r is its one revised prompt (a rugged angular jaw, a
# stubble-shadow tone, thin lips, no eyeliner) and m89's lips lost "full" before the rest ran. After the rest,
# m82 (a dopey pear, not a giant), m87 (the flat-topped block edged toward a famous movie monster), m89 (the hanging
# lobes read as a woman's bob) and m90 (the temple lobes read as headphones) missed; m82r, m87r, m89r and m90r are
# their one revised prompt each.
id = "2026-10-22-alien-roster-r7"
service = "openai-images"
purpose = "art#196 roster round 7: ten new alien men, each a different character type (an old professor, a gentle giant, a sleazy salesman, an old sea captain, a rock star, a hermit sage, a young jock, a mob boss, a monk, a butler) carried by the head and face shapes alone at a calm, neutral rest, one image each, as 2D concepts for the engineer to judge."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
cost_cap_usd = 3.0
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-20"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6291187194"
model = "gpt-image-2.5-sunburst"
quality = "medium"

[defaults]
size = "1024x1280"
n = 1

# m81: old professor (man, late sixties), rf2 for the style only
