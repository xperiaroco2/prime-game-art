prompt = "The reference image shows only the rendering style, the finish, the light, the background, and the neck and shoulders to use. The head itself is a completely new design, described below: do not copy the reference's crest, eyes, eyelids, nostrils, lips or coral colour. Framing: the whole head with a little room above it, then the long slender neck and the top of the narrow shoulders, ending in a clean rounded bust edge inside the frame, the head turned clearly into three-quarter view. The description of the head: A single alien head that reads as an adult man in his late sixties. At a glance, the features alone suggest the kind of man he is: an absent-minded old professor; the type is carried only by the shapes of the head and the face, never by anything worn or held, and never by an expression. The head is dominated by an enormous, smooth, round, bulging dome of a forehead and cranium, like a huge soft melon, swelling up and forward far beyond the small face below it, the widest and tallest part of the head; the face is small and tucked under the dome's front edge. Over each eye hangs a big, soft, drooping fleshy brow lobe of the same skin, shaggy in outline like an old man's bushy eyebrows, its tip hanging down past the outer corner of the eye. Two smallish round cartoon eyes with whites, dark irises and round pupils, set fairly close together, peer out from under the brow lobes, the upper lids heavy and half lowered, like a scholar peering over a page. A short, soft nose bump. A small mouth, closed, with thin, slightly pursed, readable lips in a deeper tone of the skin. A small, soft, receding chin with a thin, soft, pointed goatee of skin under it. The brow lobes and the goatee point are his male signal; his age shows in the drooping lobes, the heavy lids and the slightly sunken cheeks under the dome, never in wrinkles. A darker tone on the top of the dome, paler on the face and the throat. Not a baby, not a brain with a face, nothing veined, never grotesque. Resting face: absent-minded, thoughtful, mildly distracted, perfectly calm. A calm, neutral face at rest: no visible emotion, no frown, no grin, no open mouth, no teeth. Nothing worn and nothing held: no hat, no cap, no glasses, no pipe, no cigar, no jewellery, no props. Stylised 3D character render of the head alone: a head-and-shoulders bust in a three-quarter view turned about 45 degrees toward the viewer's left, centred and large in the frame, on a long slender neck with narrow smooth shoulders, the same neck and shoulders for every head of the set. Smooth soft-matte designer vinyl toy finish with a subtle soft glow in the skin, clean simple big shapes, no pores, no wrinkles, no fine texture, not clay, not realistic skin. One clean mid-teal skin with a paler tint of the same colour on the face and throat, so the colour can be changed later; every marking is only a darker or lighter tone of the skin, and the lips are a deeper tone of the skin. An alien, never a human with coloured skin: no human ears, no hair. Adult, cool and striking, never childish, never grotesque. One closed mouth. Soft even studio light with a gentle rim light; a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos."
