prompt = "The reference image shows only the rendering style, the finish, the light, the background, and the neck and shoulders to use. The head itself is a completely new design, described below: do not copy the reference's crest, eyes, eyelids, nostrils, lips or coral colour. Framing: the whole head with a little room above it, then the long slender neck and the top of the narrow shoulders, ending in a clean rounded bust edge inside the frame, the head turned clearly into three-quarter view. The description of the head: A single alien head that reads as a very young woman, about twenty, a deadpan gothic girl by her features alone: solemn, morbid, unimpressed, quietly unsettling, never sad, never scary. A long, narrow, pale oval face with a small pointed chin and hollow cheeks, a sharp widow's peak, and from a sharp centre parting two long, tight, smooth, rope-like braided lobes grown from the head fall straight down behind the ears to below the shoulders, part of her skin and colour, a darker tone of the skin. Large, dark, solid glossy eyes with no whites, ringed by deep darker sockets, under level, heavy, unblinking upper lids: a flat, steady, dead-calm stare straight at the viewer. Thin straight dark brows. A small nose with two tiny nostrils. A small closed mouth with thin, dark lips set in a perfectly flat line. Her face is the palest tone of the skin, the parting and the braids the darkest. Calm, neutral face at rest, completely deadpan: no smile, no frown, no open mouth, no teeth. Nothing worn and nothing held: no collar, no clothes, no hat, no jewellery, no props. Stylised 3D character render of the head alone: a head-and-shoulders bust in a three-quarter view turned about 45 degrees toward the viewer's left, centred and large in the frame, on a long slender neck with narrow smooth shoulders, the same neck and shoulders for every head of the set. Smooth soft-matte designer vinyl toy finish with a subtle soft glow in the skin, clean simple big shapes, no pores, no wrinkles, no fine texture, not clay, not realistic skin. One clean mid-teal skin with a paler tint of the same colour on the face and throat, so the colour can be changed later; every marking is only a darker or lighter tone of the skin, and the lips are a deeper tone of the skin. An alien, never a human with coloured skin: no human ears, no hair. Adult, cool and striking, never childish, never grotesque. One closed mouth. Soft even studio light with a gentle rim light; a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos."
