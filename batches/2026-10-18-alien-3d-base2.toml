# Meshy's target_polycount counts quads: t1 at 30,000 came out at 54,866 triangles, over the body cap of 30,000
# triangles. These two remesh the T-pose models to 15,000 quads (about 30,000 triangles).
[[items]]
id = "t1-remesh15"
kind = "remesh"
source = "t1"
params = { topology = "quad", target_polycount = 15000, target_formats = ["glb"] }

[[items]]
id = "t2-remesh15"
kind = "remesh"
source = "t2"
params = { topology = "quad", target_polycount = 15000, target_formats = ["glb"] }
