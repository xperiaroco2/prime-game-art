# art#196, the Meshy-native test (the engineer's note of 2026-10-18, comment 6250379091): can Meshy give the base a
# clean mesh at our density and a standard pose itself, instead of our decimate, remesh and heuristic skeleton fit?
# The same approved three views as base1 (sheet 10b's turnaround u1). t1: T-pose with Meshy's quad remesh at 30k in
# the generation; t2: T-pose at full density, then the Remesh API to 30k quad; t3 (control, run only if needed): the
# A-pose with the same remesh as t1. Meshy's rigger and four library clips (Idle, Run 2, Casual Walk, Talk with Hands
# Open) on t1 and t2 show its own joint placement on the hands and legs; b1-rig puts the same rigger and clips on the
# approved base1 sculpt itself (A-pose) as a control. Under the standing permission for Meshy
# generation within the plan's credits (2026-10-03, art#16). Schema: docs/meshy.md.

id = "2026-10-18-alien-3d-base2"
purpose = "The Meshy-native base test for art#196: T-pose, quad remesh at about 30k, Meshy's rig and clips, against the finished base."
plan = "Meshy paid plan (monthly; bought by the engineer on 2026-10-17)"
terms_url = "https://www.meshy.ai/terms-of-use"
licence = "owned by the customer on a paid plan (Meshy Terms of Use 3.2, updated 2026-09-19); no attribution required"
credit_cap = 190
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-03"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/16"

[defaults.multi_image_to_3d.params]
ai_model = "meshy-7.1"
geometry_resolution = "2k"
should_texture = true
texture_resolution = "2k"
pose_mode = "t-pose"
target_formats = ["glb"]

[defaults.rig.params]
height_meters = 1.81

[defaults.animate.params]
action_ids = [0, 14, 30, 313]

