[defaults.text_to_image.params]
ai_model = "gpt-image-2-5-sunburst"
aspect_ratio = "16:9"
remove_background = false

[variants.crests]
prompt = "Character design sheet for a stylized 3D game: one row of eight identical alien head-and-shoulders busts in front three-quarter view, the same size, evenly spaced on one plain mid-grey studio background, soft key light, gentle rim light, soft shadows. Premium handmade plasticine look: smooth clean sculpted forms, soft matte clay skin with a barely visible handmade surface, no pores, no wrinkles, no HD texture detail. Every bust is the same alien: a smooth back-swept domed head, teal skin with a lighter mint face and throat, a slim neck, no human nose (two tiny nostril slits), no human ears, big glossy white bead eyes set wide and high with small dark pupils, one sharp highlight and heavy half-closed upper lids with warm reddish rims, bored, and exactly the same closed wide frog-line mouth with rolled coral clay lips and a fuller lower lip. Only the top of the head changes, from left to right: 1 a short curved blade crest; 2 two swept-back fins in place of ears with warm reddish edges; 3 a smooth quiff-shaped ridge rolled forward like a clay wave; 4 two short antennae with round bobbles; 5 a slicked side-part hairstyle in deep violet; 6 a curtain-bangs bob in lilac; 7 a tall pompadour in tangerine; 8 a short punk crop of soft clay spikes in lime. Hair is sculpted as a few big smooth clay masses with simple grooves, never strands. Adult, cool, funny and appealing, made with care. Not realistic, not childish, not grotesque: no blush stickers, no sparkle eyes, no smile, no text, no numbers, no labels, no logo."

[variants.skins]
prompt = "Character design sheet for a stylized 3D game: two rows of six identical alien head-and-shoulders busts in front view, the same size, evenly spaced on one plain mid-grey studio background, soft key light, gentle rim light, soft shadows. Premium handmade plasticine look: smooth clean sculpted forms, soft matte clay skin with a barely visible handmade surface, no pores, no wrinkles, no HD texture detail. Every bust is the same alien: a smooth back-swept domed head with a short curved blade crest, a slim neck, no human nose (two tiny nostril slits), no human ears, big glossy white bead eyes set wide and high with small dark pupils, one sharp highlight and heavy half-closed upper lids, bored, and exactly the same closed wide frog-line mouth with rolled clay lips and a fuller lower lip. Only the skin colour changes, saturated but never candy or neon, top row left to right: teal, jade green, mint, lime olive, mustard, lemon yellow; bottom row: coral, tangerine, rose pink, lilac, periwinkle, cobalt blue. Every skin has the same recipe: a lighter second tone of its own hue on the face and throat with a soft organic split, and warmer, redder flush on the eyelid rims, lips, nostrils and crest edge. Adult, cool, funny and appealing, made with care. Not realistic, not childish, not grotesque: no blush stickers, no sparkle eyes, no smile, no text, no numbers, no labels, no logo."

