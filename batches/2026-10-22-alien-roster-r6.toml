# m71: the melting trunk, stoned (man, late thirties), rf2 for the style only
[[items]]
id = "m71"
kind = "edit"
prompt = "The reference image shows only the rendering style, the finish, the light, the background, and the neck and shoulders to use. The head itself is a completely new design, described below: do not copy the reference's crest, eyes, eyelids, nostrils, lips or coral colour. Framing: the whole head with a little room above it, then the long slender neck and the top of the narrow shoulders, ending in a clean rounded bust edge inside the frame, the head turned clearly into three-quarter view. The description of the head: A single alien head that reads as an adult man in his late thirties. The whole head looks as if it is slowly melting with contentment: a soft, rounded dome on top that sags and slides down into broad, heavy, pendulous cheeks and soft jowls hanging lower than the jaw, the widest part of the head at the bottom, every curve soft and heavy, nothing wet, nothing dripping. From the middle of the face hangs a short, soft, limp trunk-nose, about as long as the mouth is wide, drooping straight down in front and ending just above the upper lip, never covering the mouth. Three big round cartoon eyes with whites, dark irises and large dark pupils sit in a soft curved row across the upper face, the middle one a little higher; every one is almost hidden under a huge, puffy, heavy upper lid drooping past its middle, the lid rims slightly reddish pink, the gaze glazed, slow and unfocused. Below the trunk a wide mouth, closed, with thick, soft, readable lips in a deeper tone of the skin, spread in a slow, lazy, blissful goofy grin. The heavy jowls and the broad soft jaw are his male signal. A darker tone on the dome, paler on the cheeks and the throat. Nothing in or near the mouth, no smoke, nothing held. Not a slug, not an elephant, never grotesque. Expression at rest: blissed out, deeply mellow, floating, completely at peace. Stylised 3D character render of the head alone: a head-and-shoulders bust in a three-quarter view turned about 45 degrees toward the viewer's left, centred and large in the frame, on a long slender neck with narrow smooth shoulders, the same neck and shoulders for every head of the set. Smooth soft-matte designer vinyl toy finish with a subtle soft glow in the skin, clean simple big shapes, no pores, no wrinkles, no fine texture, not clay, not realistic skin. One clean mid-teal skin with a paler tint of the same colour on the face and throat, so the colour can be changed later; every marking is only a darker or lighter tone of the skin, and the lips are a deeper tone of the skin. An alien, never a human with coloured skin: no human ears, no hair. Adult, cool and striking, never childish, never grotesque. One closed mouth. Soft even studio light with a gentle rim light; a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos."
