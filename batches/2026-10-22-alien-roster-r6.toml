# art#196 roster round 6, "inner states": the engineer (2026-10-22) said the aliens all share one emotion and
# character (deadpan-bored or sly at rest) and asked for heads that carry an inner state: a stoned or blissed-out one,
# a sleepy one, an angry one, a scared one. Part A re-expresses seven kept heads: an edit of the kept head's own raw
# PNG alone (no rf2), "keep this exact head ... change ONLY the facial expression". Part B designs four new heads
# (m71, m72, w71, w72) whose shape itself expresses the state, by the principles of round 5's report, each an edit
# with rf2 as the style reference only (round 4's lead, framing sentence and style tail). The source table:
# D:/prime-art-raw/research/2026-10-22-roster/design/r6/concepts_r6.src.json (the blend column is for us; the
# prompts describe shapes). The stoned look is the face only: nothing smoked or held is drawn. The standing
# permission for OpenAI images: art#196 comment 6291187194 (2026-10-20), medium for exploration, within this batch's
# dollar cap. No game, film, studio or character names; no real people. Schema: docs/openai-images.md.
# h03 and m71 ran first (2026-10-22) and were looked at: both held (the same squid head, scared; a melting
# stoned man). After the other nine, every variant of h02 (stern, not furious: the kept look only nudged) and
# w71 (the forward blades swept up and back into a doubled crest like the kept pterosaur's) missed; h02r and
# w71r are their one revised prompt each.
id = "2026-10-22-alien-roster-r6"
service = "openai-images"
purpose = "art#196 roster round 6, inner states: seven kept alien heads re-expressed (angry, scared, stoned, sleepy, paranoid, irritated, smitten) from their own images, and four new heads whose shape expresses a state (a stoned and a sleepy man, an angry and a scared woman), three variants each, as 2D concepts for the engineer to judge."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
cost_cap_usd = 4.0
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-20"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/196#issuecomment-6291187194"
model = "gpt-image-2.5-sunburst"
quality = "medium"

[defaults]
size = "1024x1280"
n = 3

