prompt = "The reference image shows only the rendering style, the finish, the light, the background, and the neck and shoulders to use. The head itself is a completely new design, described below: do not copy the reference's crest, eyes, eyelids, nostrils, lips or coral colour. Framing: the whole head with a little room above it, then the long slender neck and the top of the narrow shoulders, ending in a clean rounded bust edge inside the frame, the head turned clearly into three-quarter view. The description of the head: A single alien head that reads as an adult woman in her early thirties. The head is a long, low, smooth, narrow wedge that lies almost level and thrusts forward far ahead of the long neck, like a striking eel: it is clearly longer from back to front than it is tall, the back of the skull tapering to a short soft rounded point behind, the face at the front end pointing toward the viewer. Nothing grows on top: no crest, no blades, no fins, no horns; the crown is smooth and low, and the silhouette is one long forward-pointing shape. A low, sharp, straight brow juts forward over the eyes; high, sharp, angular cheekbones; a long, sharp, pointed chin jutting forward with a slight underbite. Two narrow, slanted, almond eyes with bright whites, vivid irises and small dark slit pupils under fierce, sharply angled lids and brows pulled down into a hard V, a few long, sharp lashes on each upper lid. Small, defined, full lips in a deeper tone of the skin, pulled back in a tight snarl that shows just the tips of two small, sharp fangs, the nostrils flared. The slim long neck, the lashes, the defined lips and the elegant curve of the jaw make her read as a woman. A darker tone along the top of the head, paler on the face and the throat. Not a fish, not a snake, not a villain, no armour. Expression at rest: furious, fierce, about to lunge. Stylised 3D character render of the head alone: a head-and-shoulders bust in a three-quarter view turned about 45 degrees toward the viewer's left, centred and large in the frame, on a long slender neck with narrow smooth shoulders, the same neck and shoulders for every head of the set. Smooth soft-matte designer vinyl toy finish with a subtle soft glow in the skin, clean simple big shapes, no pores, no wrinkles, no fine texture, not clay, not realistic skin. One clean mid-teal skin with a paler tint of the same colour on the face and throat, so the colour can be changed later; every marking is only a darker or lighter tone of the skin, and the lips are a deeper tone of the skin. An alien, never a human with coloured skin: no human ears, no hair. Adult, cool and striking, never childish, never grotesque. One mouth. Soft even studio light with a gentle rim light; a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos."
