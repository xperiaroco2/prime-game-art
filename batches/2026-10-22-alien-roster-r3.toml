kind = "edit"
prompt = "The reference image shows only the rendering style, the finish, the light, the background, and the neck and shoulders to use. The head itself is a completely new design, described below: do not copy the reference's crest, eyes, eyelids, nostrils, lips or coral colour. Framing: the whole head with a little room above it, then the long slender neck and the top of the narrow shoulders, ending in a clean rounded bust edge inside the frame, the head turned clearly into three-quarter view. The description of the head: A single alien head that reads as an adult man in his early sixties. The head is heavy at the bottom: a massive hooked beak-jaw makes up the whole lower half of the head, a smooth hard-edged beak whose upper tip hooks down over the lower one, its closed line running back and turning slightly down at the corners. Above it a low, flat, sloping crown, clearly smaller than the jaw, with a few broad smooth rounded bumps along its midline. Small deep-set eyes high on the sides of the head under thick heavy hooded lids, a slow patient sidelong gaze. Two small nostril pits at the top of the beak. No chin: the beak flows into a thick, smooth, softly folded throat. A darker tone on the crown and the top of the beak, paler on the throat. His age shows in the heavy lids, the thick folded throat and the set of the face, not in wrinkles. No teeth. Expression at rest: patient, unimpressed, immovable. Stylised 3D character render of the head alone: a head-and-shoulders bust in a three-quarter view turned about 45 degrees toward the viewer's left, centred and large in the frame, on a long slender neck with narrow smooth shoulders, the same neck and shoulders for every head of the set. Smooth soft-matte designer vinyl toy finish with a subtle soft glow in the skin, clean simple big shapes, no pores, no wrinkles, no fine texture, not clay, not realistic skin. One clean mid-teal skin with a paler tint of the same colour on the face and throat, so the colour can be changed later; every marking is only a darker or lighter tone of the skin, and the lips are a deeper tone of the skin. An alien, never a human with coloured skin: no human ears, no hair. Adult, cool and striking, never childish, never grotesque. One closed mouth. Soft even studio light with a gentle rim light; a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos."
