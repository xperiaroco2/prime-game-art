# put h06 (mantis) on maybe and rejected h04, h05, h07, h10 (each read as a human face under headwear, or a cartoon
# villain). This batch: two new candidates per rejected slot (m4a/m4b, m5a/m5b for the men, w7a/w7b, w10a/w10b for
# the women; D:/prime-art-raw/research/2026-10-22-roster/design/r3/concepts_r3.json and .md), each an edit with rf2 as
# the style reference only, the round-2 lead, framing sentence and style tail unchanged; and two redraws as edits of
# their round-2 raw image plus rf2: h06 (h06-3 with big wrap-around compound eyes on the triangle's corners) and h08
# (h08-2 closer to the real axolotl: feathery gill stalks, small lidless bead eyes). The standing permission for
# OpenAI images: art#196 comment 6291187194 (2026-10-20), medium for exploration, within this batch's dollar cap. No
