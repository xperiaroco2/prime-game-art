# The empty ship's hull variant "meshy" (art #263, step 1, the mirrored rebuild): Meshy's smooth organic shapes as the
# outer skin. Three untextured generations from the approved 2D (prime-game-design ideas/ship-components/2d): two
# multi-image-to-3D runs from turnaround.jpg's views (the v1 crops of raw:ship/v1/meshy_in with the legs, the ramp and
# the neighbouring views' edges painted out in the background navy by tools/blender/ship_hull_meshy.py --prep) and
# one image-to-3D from hero.jpg's ship (cropped, the trees above it painted out). ship_hull_meshy.py --fit turns each
# into a skin fitted round the v2 rooms and the hull lane picks one; only the shape matters.

id = "2026-10-22-ship-hull-meshy"
purpose = "The ship's outer skin from Meshy generations of the approved 2D, a hull variant for art#263 step 1."
plan = "Meshy Pro (monthly)"
terms_url = "https://www.meshy.ai/terms-of-use"
licence = "owned by the customer on a paid plan (Meshy Terms of Use 3.2, updated 2026-09-19); no attribution required"
credit_cap = 120
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-22"
approval_ref = "https://github.com/xperiaroco2/prime-game-art/issues/263#issuecomment-6327428873"

[defaults.multi_image_to_3d.params]
ai_model = "meshy-7.1"
should_remesh = true
topology = "triangle"
target_polycount = 60000
should_texture = false
target_formats = ["glb"]

[defaults.image_to_3d.params]
ai_model = "meshy-7.1"
should_remesh = true
topology = "triangle"
target_polycount = 60000
should_texture = false
target_formats = ["glb"]

