quality = "medium"

[defaults]
size = "1536x1024"
n = 1
background = "opaque"

[variants.blade]
prompt = "Product shot of ONE single gill blade taken out of the machine in the reference images, alone, on a plain flat light grey studio background, nothing else in the picture. The blade is exactly like the reference's blades: a long, thick, heavy louver blade of worn warm bronze-brown cast metal, about seven times as long as it is wide, gently bowed along its length, its cross-section a thick wedge: a broad bright upper bevel facet meeting a broad front facet at a crisp ridge, tapering to a blunt trailing edge, a slightly concave underside. Thin bright worn edges on every corner, faint mottled patina, polished highlights on the upper facet. Both ends cut flat and square, each with one small round pivot hole at the thick back edge; no hinge caps, no bolts, no glow, no frame. Seen in three-quarter view from the front and above, the whole blade in the frame with margin all round, soft even studio light, a soft contact shadow under it. Clean stylised game-asset render, crisp facets, no text, no labels."

