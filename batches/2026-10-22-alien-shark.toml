[[items]]
id = "sh1"
kind = "edit"
prompt = "The reference image shows only the rendering style, the finish, the light, the background, and the neck and shoulders to use. The head itself is a completely new design, described below: do not copy the reference's crest, eyes, eyelids, nostrils, lips or coral colour. Framing: the whole head with a little room above it, then the long slender neck and the top of the narrow shoulders, ending in a clean rounded bust edge inside the frame, the head turned clearly into three-quarter view. The description of the head: A single alien head that reads as an adult man in his mid thirties. At a glance, the features alone suggest the kind of man he is: an aggressive, dangerous bruiser, a shark among men; the type is carried only by the shapes of the head and the face, never by anything worn or held. The head is a shark's, smooth and streamlined: a long, pointed, conical snout pushing forward, a sleek low skull sweeping back, and a tall, stiff, triangular dorsal fin rising from the top of the head and leaning back, like a shark's fin cutting the water. Small, flat, solid black eyes with no whites, set on the sides of the snout under a low, hard brow ridge: a cold, dead, unblinking stare. Two short slit nostrils under the snout. A very wide, low, closed mouth curving down at the corners under the snout, a thin hard line with no lips to speak of, the tips of a few small pointed teeth just showing at the corners. A broad, heavy jaw and a thick, strong neck line are his male signal. A darker tone on the snout, the crown and the fin, sharply paler on the jaw and the throat, like a shark's belly. Three long curved gill slits on each side of the neck, just below the jaw, like a shark's, clean and smooth. Not fat, not a monster, never grotesque, never a villain with a snarl. Resting face: still and cold, a man you would not argue with; the threat lives in the shapes, not in an expression. A calm, neutral face at rest: no visible emotion, no grin, no open mouth. Nothing worn and nothing held: no hat, no cap, no glasses, no jewellery, no props. Stylised 3D character render of the head alone: a head-and-shoulders bust in a three-quarter view turned about 45 degrees toward the viewer's left, centred and large in the frame, on a long slender neck with narrow smooth shoulders, the same neck and shoulders for every head of the set. Smooth soft-matte designer vinyl toy finish with a subtle soft glow in the skin, clean simple big shapes, no pores, no wrinkles, no fine texture, not clay, not realistic skin. One clean mid-teal skin with a paler tint of the same colour on the face and throat, so the colour can be changed later; every marking is only a darker or lighter tone of the skin, and the lips are a deeper tone of the skin. An alien, never a human with coloured skin: no human ears, no hair. Adult, cool and striking, never childish, never grotesque. One closed mouth. Soft even studio light with a gentle rim light; a plain flat neutral mid-grey background. No clothes, no text, no labels, no logos."
