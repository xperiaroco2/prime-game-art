[variants.outfits]
prompt = "Stylized 3D character concept render, one row of four full-body figures of the same humanoid alien adult woman, side by side, standing three-quarter view, whole figures in frame with feet visible, plain mid-grey studio background, soft key light, gentle rim light, soft contact shadows. Premium handmade plasticine look: smooth clean sculpted forms, soft matte clay skin with a barely visible handmade surface, no pores, no wrinkles, no HD texture detail. Adult proportions about seven heads tall, a normal attractive slim human body with normal shoulders, hips and hands, five fingers, never exaggerated. The same alien in every figure: a smooth back-swept domed head, a lilac curtain-bangs bob sculpted as a few big smooth clay masses, coral skin with a lighter peach face, throat and belly, no human nose (two tiny nostril slits), no human ears, big glossy white almond bead eyes set wide and high with small dark pupils, dark eyeliner rims, a few long simple lashes and heavy half-closed lids, smug deadpan, full glossy plum lipstick lips in a pout, slightly warmer knuckles. Only the outfit changes, present-day Earth clothes in calmer muted colours, simple clean fabric with a few large folds, one plum accent picked up from the lips, from left to right: 1 a black satin slip dress under a cropped denim jacket, plum nail polish, small gold hoop earrings, one hand on hip; 2 a cream knit sweater, a camel mini skirt and chunky black boots, a plum shoulder bag, arms crossed; 3 an oversized charcoal puffer jacket, a white tee, black leggings and plum high-top sneakers, phone in hand; 4 a softly iridescent party top under a black blazer, wide black trousers and plum heels, silver rings, holding a cocktail glass. Funny and appealing, cool, adult deadpan humour, made with care. Not realistic, not heroic, not childish, not grotesque, not sexualised: no blush stickers, no sparkle eyes, no mascot smile, no slime, no gore, no text, no logo."

