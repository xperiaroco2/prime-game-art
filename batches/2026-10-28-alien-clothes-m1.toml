# art #196, clothes step 2 (builder B): the two outfits as Meshy multi-image-to-3D models, of which only the cloth and
# the shoes are kept. The engineer's route (art #196 comment 6469797321): the aliens are always clothed, our own shared
# body stays the base, Meshy makes only the clothes; two outfits, each worn by both characters, the shoes part of each
# set. Meshy generation within the plan's credits is a standing permission (2026-10-03); this batch's cap is 80.
#
# Input: the front, left profile and back cut out of each outfit's turnaround on the chameleon base body (batch
# 2026-10-28-alien-clothes-s1b, items ch_overall and ch_track; gpt-image-2.5-sunburst), each padded to one square with
# the sheet's grey at the sheet's scale and ground line (tools/blender/clothes_views.py). meshy-7.1 at 2k geometry,
# textured (4k, PBR, lighting removed), Meshy's remesh to 30,000 triangles with the dense original kept; the head, hands
# and skin are cut off in Blender (tools/blender/clothes_clean.py). Price: 20 mesh + 5 for 2k + 10 texture = 35 each,
# 70 in all. No game, film, studio, brand, character or person names (the images are the prompt). Schema:
# docs/meshy.md.

id = "2026-10-28-alien-clothes-m1"
purpose = "art#196 clothes step 2: the dungarees and the tracksuit outfits (cloth and shoes only) as Meshy multi-image-to-3D models from their turnarounds on the chameleon base body."
plan = "Meshy paid plan (monthly; bought by the engineer on 2026-10-17)"
terms_url = "https://www.meshy.ai/terms-of-use"
licence = "owned by the customer on a paid plan (Meshy Terms of Use 3.2, updated 2026-09-19); no attribution required"
