meeting it on the mesh needs the hem at 19.17 +- 1, which the drawing's 17.76 +- 1 meets only between 18.17 and 18.76:
the drawing's hem wins."""

# --- the build's own numbers (tools/blender/dungarees_build.py; not sizes Gate 1 or 2 measure) --------------------
[build]
plate_lap_cm = 5.0           # G3f, the manager's option (a): the bib and the back panel go down over the band's front
                             # and back by 5 cm (the band is 4 cm), on Chest whole: they slide over it, hidden
plate_lap_clear_cm = 0.3     # their inner face this far off the band and the yoke where they lie over them
back_lap_cm = 4.0            # G3g: the back's lap ends at the band's foot (on Spine it never slides; 5 cm hung under it)
plate_lap_blend_cm = 3.0     # the push off the band eased out over the plates' lowest 3 cm above the band's top
band_ease_cm = 0.3           # the waistband off her shirt
body_half_w_cm = { front = 11.0, back = 12.0 }   # her front (back) over |x| under this: the bib's lean B, the
                                                 # back panel's envelope, and garment_drawing's gaps
strap_ray_origin_cm = { z = 117.0, y = 1.0 }     # the straps' rays start inside her chest here (x = the strap's)
turnup_wall_cm = 0.4         # the turn-up ring's wall, and its least ease off the leg
buckle_ring_cm = { pad = 0.4, half_h = 0.6, bar = 0.3 }   # the ring round the strap: past its edges, half height, bar
back_follows_across = true   # G3e: the back panel follows her back across each row (bridging her spine's hollow), not
                             # a flat board standing off her back's sides (G3d's close-ups); still one bone
back_column = "follow"       # G3g: down each column her back smoothed, not the hull (it stood the sides 15-31 mm off)
back_fit_deg = 4             # G3g: the rows' across curve of degree 4 (the quadratic stood off her sides)
back_lap_hug = true          # G3g: the back's lap drawn onto the band, not only pushed off it
back_cols = 41               # G3f: the back panel's columns (25 striped it), its rows a smoothed quadratic across
strap_tilt = true            # G3g: each strap row tilted across to her shoulder's slope (level, its edge stood off)
sharp_deg = 40.0             # G3f: the garment shaded smooth, edges sharper than this kept sharp (the plates' rims)
shirt_follow_fade_cm = 5.5   # G3e: the shirt under the dungarees takes their weights, eased back to its own over 5.5 cm
                             # (G3f: over 3 cm it ridged over her shoulder blades and at the back panel's edges)
shirt_follow_near_cm = 3.0   # and a shirt vertex within 3 cm of the garment whose normal misses it (the hem)
strap_follow_reach_cm = 1.0  # G3i: a strap gives its weights only to the shirt directly under it (its normal meets the
                             # strap within 1 cm; the near rule never takes a strap): in G3h every shirt vertex within
                             # 3 cm took a strap's whole, the collar sank 16-49 mm into her and her neck showed in a V
strap_follow_fade_cm = 1.5   # eased back to the shirt's own over 1.5 cm round the strap's footprint
collar_keep_cm = 1.0         # and the collar's band (1 cm from its edge) keeps its own, body-matched weights
shirt_trim_z_cm = 93.5       # G3g: the shirt ends here, inside the yoke under the band (its hem came out at the hip crease)
shirt_hem_in_cm = 0.25       # G3f: the shirt's hem drawn in 2.5 mm, eased out over its lowest 1.5 cm, inside the yoke
shirt_hem_h_cm = 1.5

# --- behaviour ------------------------------------------------------------------------------------------------
# G3m (2026-11-01, the manager's route review): every bib, pocket, back panel and strap vertex takes her skin's
# weights under it (her k nearest skin points of her whole skin, body_removed too, by inverse distance, without the
# skin_drop bones), smoothed along the cloth's edges and across to the cloth lying on it within skin_bridge_cm; only
# the hardware is rigid. G3h-G3l's hand-picked bones (bib Chest, back panel Spine, straps Chest eased to her skin) and
# their knobs are gone: wherever such a bone differed from her skin under it, the difference became stretch, lift or
# the shirt through (G3l: the back runs sank under the shirt, the panel lifted 52-68 mm off her upper back)
skin_k = 6
skin_drop = ["Head", "Jaw", "Eye", "Gill"]   # her skin's weights there lose these bones' shares (G3j; G3n: her Neck
                             # kept, G3m m1: without it the straps' back runs lifted 13 mm off her upper back, with it 1.7)
skin_smooth = 10             # passes of the weights' smoothing (each: half its own, half its neighbours' mean; G3n: 10,
                             # G3m m2: Crouch and Talk's strap stretch under 5 % with 10, 6.1 and 5.3 % with 4)
skin_bridge_cm = 0.6         # cloth within this of other cloth smooths with it (a strap on the bib, a slab's faces)
bib_smooth = 0               # further passes on the bib alone (step 2's grid)
plate_band_blend_cm = 3.0    # level with the band the plates take the band's weights (a rigid ring on Spine), eased
                             # to her skin's over this above its top: on her Hips/Spine there they would go through it
hardware_reach_cm = 0.5      # G3n: a buckle or ring rides the cloth's weights averaged over its footprint (its radius +
                             # this round its centre), not one vertex's (G3m: the strap fronts slipped 5.1 mm on the bib)
strap_inner_mm = 1.5         # the strap's inner face off the shirt (G3h 0.5; G3m 1.5, the shirt under its core gone)
shirt_hide_cm = 2.0          # G3m: the shirt's faces under the plates (one ring in, shirt_hide_rings) and under the
shirt_hide_rings = 1         # straps' central 1.9 cm go: five rays all meet them within 2 cm (clothes_top's rule)

[behaviour]
bib = "one piece, straight across, the single side-view bend of option B; never folds or wrinkles (flatness 3 mm); follows her skin under it (G3m: her skin's weights, smoothed), stretching no more than it; the buckles ride on it (slip under 3 mm)"
straps = "bend along their length only, stay 3.8 cm wide; on her skin's weights under them from the bib over the shoulder to the back panel, smoothed with both plates: one strip with the bib and the back panel (G3m)"
back_panel = "follows her upper back like her skin under it (G3m: her skin's weights, smoothed), never lifting off it (5 mm) nor stretching beyond it (5 %); the straps run into its top corners as one strip"
waistband = "stiff ring: follows the Hips/Spine, no stretch over 2 %"
buttons_buckles = "rigid hardware, each on the nearest panel's surface"
legs = "soft denim: bend at the hips and knees, the turn-up stays a rigid ring over the ankle strip"

# --- Gate 2: the build's automatic checks (tools/blender/garment_gate2.py; docs/clothes.md, "Gate 2") -------------
# Heights and boxes may name a measure: the build's measured value of a spec size (garment_drawing.measure_build),
# else the spec's cm, else her landmark; 'spec:NAME' always the spec's cm. Boxes in cm on her rest (T-pose).
[gate2]
clips = ["Idle", "Walk", "Jog_Fwd", "Sprint_Fwd", "Strafe_Left", "Crouch_Fwd", "Jump_Start", "Jump_Air", "Talk_Upper"]
# the motion is measured from Idle's first frame, the stand (from her T-pose rest every panel moves as the arms come
# down: on d79 the bib's flatness 13.6 mm and its stretch 18 % already in Idle)
reference_clip = "Idle"
overlap_min = { front = 0.8, side = 0.70, back = 0.8 }
# The side view's overlap from her crotch to her waist only, the concept's row spans filled (the manager, 2026-11-01,
# G3c; art #196): the concept's side legs stride, hers stand straight; over the chest its figure is turned a little
# (the bib's face shows, 17-35 px a row) while the build's bib is a plate seen edge-on (2 px); at the hips its hanging
# arm and hand cover the garment, so the holes inside each row's outline count as garment (b02: 0.435 over the trunk,
# 0.744 waist..crotch filled). The chest is judged by the front view and the spec's gaps (the bust station below).
# The side minimum 0.70, not the front's and back's 0.8 or 0.75: the concept's side figure is turned a little and its
# legs stride, so even a build true to the spec reads 0.744 there (c01); 0.70 keeps a margin for the 2 mm rasters
# and fails a bib or seat off by a few cm (the manager, G3d).
overlap_z = { side = ["crotch", "waist"] }
concept_fill_rows = ["side"]
# the concept's denim: blue over red and green, no bright grey; an opening of 4 rows drops the shirt's navy stripes;
# the holes inside (stitching, the pocket's seams, highlights) filled. A hand mask instead: mask_<view> = "PNG path"
concept_mask = { b_minus_r = 15, b_minus_g = 6, max = 215, open_ry = 4, close_r = 3, keep_share = 0.02 }

[gate2.classify]
over_z = "collarbone"        # a piece over this with points in front and behind goes over the shoulder: a strap
hardware_max_verts = 60      # buckles, buttons (d79: 21 and 32; its back panel 272, band halves 165, cuffs 240)

# The bib and the back panel ride Chest whole and go down over the band by [build] plate_lap_cm (G3f, the manager's
# option (a)). G3d's seam blend (their lowest 10 cm eased from Spine to Chest) held their feet on the band but
# squeezed the strip 37-80 % (p95) in the run and jump clips, and judged against her skin's stretch there (G3e,
# option (c)) still 20-63 % beyond it: linear skinning folds a blended strip, it cannot bow out like cloth. Over the
# band the plates slide, hidden: [[gate2.laps]] keeps the overlap and keeps them outside the band; the strip's stretch
# rule goes with the blend. A part on one bone has flatness and stretch 0 by construction (docs/clothes.md, "Gate 2"):
# the bib and back are judged over the plate above the band (the lap's push off the band eases out over 3 cm).
[gate2.parts.bib]
classes = ["panel"]
x_abs = [0, 11.5]
y = [-40, 0]
z = ["waistband_top_z+3.5", "bib_top_z+1"]
# the plates' strips over the band: the bib's piece (17 x 54 x 2 = 1836 vertices), the back's (41 x 30 x 2 = 2460),
# not the band's ring (384) nor the trousers' piece with the yoke (over 4000)
# G3m: the bib's sides (her skin's weights there; in G3l's three-quarter stills the bib stood off her side as a slab)
[gate2.parts.bib_sides]
classes = ["panel"]
x_abs = [8, 11.5]
y = [-40, 0]
z = ["waistband_top_z+3.5", "bib_top_z+1"]
[gate2.parts.bib_lap]
classes = ["panel"]
x_abs = [0, 12]
y = [-40, 0]
z = ["waistband_top_z-waistband_h-2", "waistband_top_z+0.3"]
piece_verts = [1001, 3600]
[gate2.parts.strap_fronts]
classes = ["strap", "hardware"]
x_abs = [0, 15]
y = [-40, 0]
z = ["waistband_top_z+1", "bib_top_z+0.5"]
[gate2.parts.back_panel]
classes = ["panel"]
x_abs = [0, 13]
y = [0, 40]
z = ["waistband_top_z+3.5", "back_top_z+1"]
[gate2.parts.back_lap]
classes = ["panel"]
x_abs = [0, 13]
y = [0, 40]
z = ["waistband_top_z-waistband_h-2", "waistband_top_z+0.3"]
piece_verts = [1001, 3600]
# G3j: the straps behind her shoulders' crest (their back runs, which end over the back panel's corners on Chest)
# and in front of it over the bib (their front tops): each judged by its lift off her skin under it ([[gate2.lifts]])
# G3k: both from 4 cm under her collarbone up, where the straps follow her skin; under it their ends ride the plates
# (the back panel's corners, the bib's top), whose lift off her bending back is the plate's (joined to the panel the
# back ends read 52-68 mm off her, 0-13 mm off the panel). Open: with strap_back_join_cm 0 the back ends hover 16-22 mm
# off the panel and no row judges that yet (G3k's lift.py probe)
[gate2.parts.strap_backs]
classes = ["strap"]
x_abs = [0, 40]
y = [0, 40]
z = ["collarbone-4", 200]
# G3l: the straps' back ends over the back panel's top, and that top (its V and corners) they lie on
[gate2.parts.strap_ends]
classes = ["strap"]
x_abs = [0, 40]
y = [0, 40]
z = [0, "back_top_z+3"]
[gate2.parts.back_top]
classes = ["panel"]
x_abs = [0, 15]
y = [0, 40]
z = ["back_top_z-4", "back_top_z+3.5"]
[gate2.parts.strap_tops]
classes = ["strap"]
x_abs = [0, 40]
y = [-40, 0]
z = ["collarbone-4", 200]
[gate2.parts.straps]
classes = ["strap"]
x_abs = [0, 40]
y = [-40, 40]
z = [0, 200]
# the band's ring alone (c01: 384 vertices; G3c's box missed its top row by a float and took the yoke's top in)
[gate2.parts.waistband]
classes = ["panel"]
x_abs = [0, 40]
y = [-40, 40]
z = ["waistband_top_z-waistband_h-0.05", "waistband_top_z+0.05"]
piece_verts = [100, 1000]
# the trousers' yoke where it rises inside the band (the trousers' piece, 4027 vertices on c01), not the plates' laps
[gate2.parts.yoke]
classes = ["panel"]
x_abs = [0, 40]
y = [-40, 40]
z = ["waistband_top_z-waistband_h-0.05", "waistband_top_z"]
piece_verts = [3601, 1000000]

[[gate2.joins]]
name = "strap fronts on the bib"
moving = "strap_fronts"
on = "bib"
reach_mm = 25
frame = "local"              # G3n (2026-11-01): the bib bends with her trunk, so each strap point's offset is turned back
                             # by the bib face it rides, not one rigid fit of the whole bib (n1: 3.7-4.6 mm by the one
                             # fit, which turns a point riding a bent face by the wrong angle); the one-fit value is reported
tol_mm = 3.0                 # [behaviour] bib: the buckles ride on it, slip under 3 mm
# G3j: no "strap backs on the back panel" join: since G3h the straps' back rows ride Chest whole and end over the
# panel's corners without lying on it (G3h/G3i: 80 strap-back vertices at z 117.4-119.1 cm, none within 25 mm of the
# panel's faces, the row unmeasured); what they ride is her back, so they are judged by their lift off it below

# The straps on her (G3j): per vertex its distance off her skin along the skin face it was tied to at the reference
# (garment_gate2_geom.skin_lift), less that distance at the reference, the largest over the clip, mm. On Chest the
# straps' back tops stood 27-51 mm off her upper back by the neck as she leaned in the runs (G3i): a flap
[[gate2.lifts]]
part = "strap_backs"
tol_mm = 5.0
[[gate2.lifts]]
part = "strap_tops"
tol_mm = 5.0
# G3m (2026-11-01, the manager's route review; the engineer may reverse it): the back panel and the bib's sides are
# judged by their lift off her skin like the straps, not as rigid plates (the panel lost its flat 3 mm and stretch 2 %)
[[gate2.lifts]]
part = "back_panel"
tol_mm = 5.0
[[gate2.lifts]]
part = "bib_sides"
tol_mm = 5.0
# G3l: the back ends off the panel they lie on: per strap vertex its distance along the panel's face it was tied to at the
# garment's rest (within reach_mm), less that at rest, where the build lays them on it, either way (off it or under it) (with Chest ends over a Spine
# panel: 6-10 mm off it at rest, 29 mm already in Idle's first frame)
[[gate2.lifts]]
part = "strap_ends"
on = "back_top"
reach_mm = 25.0
tol_mm = 5.0

# The yoke rides inside the band (the fresh review's major, G3d)
[[gate2.joins]]
name = "yoke inside the waistband"
moving = "yoke"
on = "waistband"
reach_mm = 25
tol_mm = 3.0

# The plates over the band (G3f, the manager's option (a)): a Chest-against-Spine twist slides them over it, hidden;
# in every clip the lowest row stays at least min_mm under the band's top (no band top shows under the edge) and no
# strip vertex goes inside the band's outer face deeper than through_mm (garment_motion's laps, in the band's frame)
[[gate2.laps]]
name = "bib"
plate = "bib_lap"
on = "waistband"
min_mm = 10.0
through_mm = 0.0
[[gate2.laps]]
name = "back panel"
plate = "back_lap"
on = "waistband"
min_mm = 10.0
through_mm = 0.0

# G3n (2026-11-01, the manager's decision; the engineer's "flat" means no folds, not rigid): on her skin's weights the
# bib bends with her trunk, and the old row (the largest distance from one rigid fit of it) read that bend as a fold,
# 61 mm in G3m. Folds are now measured as the bib's distance from a smooth fit of its own motion per frame (a cubic in
# its rest coordinates, garment_gate2_geom.smooth_residual): a bend with her trunk leaves nothing, a crease or a bulge
# narrower than the bib does; the rigid value is still reported beside it. The 3 mm stays for real folds
[[gate2.flat]]
part = "bib"
fit = "smooth"
deg = 3
tol_mm = 3.0                 # change from rest: lean B's drawn bend is the rest shape, a new fold counts

# judged on the 95th percentile of the edges' stretch over the clip (the largest is reported beside it)
[[gate2.stretch]]
part = "waistband"
tol_pct = 2.0                # [behaviour] waistband: no stretch over 2 %
# G3m: the bib and the back panel on her skin's weights stretch where her skin does: judged beyond it (the bib keeps
# its 2 %; the back panel 5 % like the straps it runs into, over her shoulder blades)
[[gate2.stretch]]
part = "bib"
vs_skin = true
tol_pct = 2.0
[[gate2.stretch]]
part = "back_panel"
vs_skin = true
tol_pct = 5.0
# The straps against her skin (G3e): their tops follow her shoulders, so they stretch where her shoulders fold and
# twist; linear skinning cannot bow them out like cloth, and the rule is that they follow her: per edge the stretch
# beyond her skin's at the same place in the same frame (her nearest skin points, the body and the skin under the
# cloth), p95 within 3 %. (G3e judged the plates' seam blend the same way; G3f's lap replaced the blend.)
[[gate2.stretch]]
part = "straps"
vs_skin = true
tol_pct = 5.0                # G3h, the manager's standing decision (3 %, or 5 % for the straps if needed): with their
                             # back rows on Chest they pass 3 % in every clip but Strafe_Left, 4.1 % (G3g: 5.8-95 %);
                             # they bend along their length; over the shoulder they may stretch as her skin there

[gate2.pokes]
max_count = 0                # clothes_proof.py's poke-through, every clip

[gate2.shirt]
max_count = 0                # the shirt under the dungarees stays under them (poke.json's top_under_panels, G3e)
tracked_max_count = 0        # G3h: and against the face it lay under at rest (top_under_panels_tracked): the nearest-
                             # face count missed the straps' fronts, 30-38 vertices 14-49 mm through in g1's videos
skin_max_count = 0           # G3i: her skin under the shirt over her chest, shoulders and upper back, each vertex
                             # against its own shirt point (poke.json's skin_under_top_tracked): G3h's g2 collar sank
                             # and 33-54 of them came 23-125 mm out (her neck and chest in a V); the pokes left them out

# Stations on the silhouettes: kind top / bottom (a row inside the columns u), width / front / back (a row's edges
# inside u at height z). dim: the spec size it checks (its cm and tol_cm); body_gap (side front / back only): her
# front (back) over |x| < 11 cm + the shirt + that spec gap (its tol_cm); else concept_tol_cm against the concept.
# Only where both pictures show the garment plainly: the concept's side arm hides the back at the bust, its bib is
# narrower than the spec's (no band top beside it), the straps rise over the bib top in side view.
[[gate2.stations]]
view = "front"
name = "bib top, centre"
kind = "top"
u = [-4, 4]
z = ["waist", "shoulder_top+8"]
dim = "bib_top_z"
[[gate2.stations]]
view = "front"
name = "bib width under its top"
kind = "width"
u = [-16, 16]
z = "spec:bib_top_z-1.5"
dim = "bib_top_w"
[[gate2.stations]]
view = "front"
name = "waistband width"
kind = "width"
u = [-25, 25]
z = "spec:waistband_top_z-1"
dim = "waistband_w"
[[gate2.stations]]
view = "front"
name = "her left thigh"
kind = "width"
u = [0.5, 30]
z = "crotch-3"
dim = "leg_thigh_w"
[[gate2.stations]]
view = "front"
name = "her left knee"
kind = "width"
u = [0.5, 30]
z = "knee"
dim = "leg_knee_w"
[[gate2.stations]]
view = "front"
name = "her left hem"
kind = "bottom"
u = [3, 30]
z = ["ankle", "knee"]
dim = "hem_z"
[[gate2.stations]]
view = "side"
name = "bib front at the bust"
kind = "front"
u = [-30, 30]
z = "bust"
# against her front + the shirt + the spec's bust gap (0.3 +- 0.3 cm), not the concept: her bust stands ahead of the
# concept's chest, so any bib outside her shirt is >= 15.8 mm ahead of the concept's (G3b; the manager, G3c)
body_gap = "bib_standoff_bust"
plus_cm = 0.15               # the pocket's face stands 1.5 mm ahead of the bib's over the bust (the fresh review, G3d)
[[gate2.stations]]
view = "side"
name = "seat's back under the waist"
kind = "back"
u = [-30, 30]
z = "waist-6"
concept_tol_cm = 1.5
[[gate2.stations]]
view = "back"
name = "back top, centre"
kind = "top"
# the V's centre-line point, as the drawing reads back_top_z: the highest row within 4 cm read the V's sides (+1.6 cm
# there; b02 +17 mm); the approved drawing's straight V is kept (the manager, G3c)
u = [-0.5, 0.5]
z = ["waist", "shoulder_top+8"]
dim = "back_top_z"
[[gate2.stations]]
view = "back"
name = "waistband width"
kind = "width"
u = [-25, 25]
z = "spec:waistband_top_z-1"
dim = "waistband_w"
[[gate2.stations]]
view = "back"
name = "her left hem"
kind = "bottom"
u = [-30, -3]
z = ["ankle", "knee"]
dim = "hem_z"
