# The House map's chill zone and photo gazebo props (art #81b, map #73): the dressing, fixtures and room-defining
# pieces of the two zones that #82's task props (props/tasks.toml: the grill, the speaker, the pose screen) do not
# cover. Built by `tools/run.sh props --spec props/zones.toml` (docs/props.md) with tools/blender/props_zone.py; every
# value is a proposal for the engineer (look, sizes, paints) and can change without touching code.
#
# The fields are props/tasks.toml's. Zone props have chain "zone" and station "-" (no game marker). Light fixtures
# carry their bulbs on the `emissive` material and name their light anchors as sockets (`light_<k>`), where the
# assembly puts the baked light (inventory.md section 8). mount "hang" is a strand hung from two hooks: its pivot
# is the middle of the hook line, the strand below it (y from -h to 0).

kit = "kits/house.json"
version = 1
out_dir = "zones"   # <raw>/props/zones/v<version>
label = "PROPS 81B"

[budget_tris]
hero = 4000      # look.md section 6
room = 1500      # room-defining (400 to 1,500)
dressing = 600   # dressing (150 to 600)
fixture = 400    # light fixtures (100 to 400)

[materials.surface_game]  # the props command's game surface (no zone prop has one)
source = ""
tile_m = 1.0
lum_std = 0.0
normal_strength = 0.0
roughness = 0.9

[materials.emissive]  # bulbs, candles and embers (look.md section 5, material 4): excluded from the bake as a source
source = ""
tile_m = 1.0
lum_std = 0.0
normal_strength = 0.0
roughness = 0.6
emission = "#ffd9ad"  # lamp c2 (1.0, 0.85, 0.68); the vertex colour carries each bulb's own tint
emission_strength = 2.0

[roles]
wood_light = { material = "wood", hex = "#8b6a48" }
wood_dark = { material = "wood", hex = "#4b3426" }
steel = { material = "metal", hex = "#6a6f72" }
steel_dark = { material = "metal", hex = "#34373a" }
rubber = { material = "plaster", hex = "#1e1c1b" }
plastic_dark = { material = "plaster", hex = "#2b2b2d" }
stripe_mustard = { material = "plaster", hex = "#d0a02c" }   # look.md section 7: deckchair stripes, mustard and teal
stripe_teal = { material = "plaster", hex = "#2f7d78" }
stripe_cream = { material = "plaster", hex = "#e2d6bd" }
cooler_red = { material = "plaster", hex = "#b8352b" }       # look.md section 7: a red cooler
cooler_lid = { material = "plaster", hex = "#e3ddcf" }
stone = { material = "concrete", hex = "#7a726a" }
stone_dark = { material = "concrete", hex = "#58514b" }
ash = { material = "concrete", hex = "#2f2b29" }
log_bark = { material = "wood", hex = "#5a3b26" }
log_end = { material = "wood", hex = "#a3815a" }
bean_rust = { material = "plaster", hex = "#b5593a" }       # look.md: striped cushions #b5593a
bean_seam = { material = "plaster", hex = "#8a3f28" }
backdrop_ink = { material = "plaster", hex = "#1f2a48" }     # look.md: ink-blue #1f2a48
backdrop_teal = { material = "plaster", hex = "#2f5f66" }
backdrop_sun = { material = "plaster", hex = "#e0906c" }     # the sky's horizon colour
backdrop_gold = { material = "plaster", hex = "#d0a02c" }
cable_black = { material = "plaster", hex = "#1b1a19" }
bulb = { material = "emissive", hex = "#ffd9ad" }            # lamp c2
ember = { material = "emissive", hex = "#ff8a3d" }
game_surface = { material = "surface_game", hex = "#2b3330" }

