enamel_cream = {material = "fine", layer = "enamel", hex = "#e0d9c6"}  # the stove
porcelain_white = {material = "fine", layer = "enamel", hex = "#d6d2c6"}
steel_warm = {material = "fine", layer = "steel", hex = "#c4bcb0"}
