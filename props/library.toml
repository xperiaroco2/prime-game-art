# The House dressing library (art #87, map request #73): one GLB per generic prop (furniture, dressing, fixtures,
# outdoor) in the kit's materials, painted by role as vertex colour. docs/props.md explains every field; the plan is
# D:/prime-art-raw/research/2026-10-10-house-plan (props.md, inventory.md section 9). Sizes are the engineer's
# inventory draft (L along X, W along Z, H up, metres); a size that does not work is reported, never changed silently.
# Paints and shapes are taste data: changing a hex or a prop's roles needs no code change.

library = "house"
version = 11
kit_spec = "kits/house.json"
# the build goes under the raw folder: D:/prime-art-raw/props/library/v11/<id>.glb (v11, #168: v10 with the attic's
# rebuilt and new pieces laid over it; v10, #166: v9 with the kids' room's
# and the study's props laid over it; v9, #164: v8 with the bedroom's and
# the guest room's props laid over it; v8, #162 round 2: v7 with the
# rebuilt landing runner and the landing's sitting area laid over it; v7, #162: v6 with the
# landing's and the bathroom's props laid over it; v6, #158: v5 with the WC's, the
# pantry's and the stairs' props laid over it; v5, #156: v4 with the hallway's props laid over it; v4, #153: v3 with the dining room's props; v3, #152: v2 with the cream sofa and armchairs
# rebuilt over it; v2, #150: v1 with the living room's 16 rebuilt props and the eight-slot fine pack laid over it;
# v1 stays the approved version-1 build; no folder is ever overwritten)
out = "props/library/v11"
review = "review/house/87"  # line-up sheets, under the raw folder
licences = ["CC0-1.0"]
max_materials = 8
# materials the props need that the kit lacks: emissive (kit v2, #86), and the world look's fine pack and tinted
# glass (docs/decisions/2026-10-13-house-world-look.md); their properties are in [material_props] and [fine]
new_materials = ["emissive", "fine", "glass_tint"]

# batch: the build order (1: indoor furniture and dressing; 2: outdoor, fixtures, vehicles).

# Library material -> the kit's material. Re-point a line here when the kit's material plan changes (kit v2, #86:
# look.md section 5 merges plaster, wood and concrete into one `set` material); nothing else names a material.
[materials]
plaster = "plaster"
wood = "wood"
concrete = "concrete"
metal = "metal"
glass = "glass"
emissive = "emissive"
fine = "fine"
glass_tint = "glass_tint"

# The properties of the new materials that are no kit material (fine's are per layer, in [fine]).
[material_props]
glass_tint = {roughness = 0.05, metallic = 0.15, alpha = 0.38}  # round 2: reads as glass, contents visible

# Triangles by class, [min, max] (look.md section 6). `vehicle` is the parked cars (the car of #79 has 3,000 to 5,000).
[budgets]
dressing = [150, 600]
room = [400, 1500]
fixture = [100, 400]
vehicle = [400, 3000]
clutter = [12, 400]  # small lived-in props on surfaces, walls and floors (art #104): no collider
hero = [1200, 4000]  # the pieces players look at up close: appliances and room centres (the world-look ADR;
# 1,200: the C2 fridge, a plain enamel box by design, is about 1,300 of real parts)

# Layers by preset (#140 item 4; the world-look ADR): a prop is `base` (the room reads clean with it alone, on the
# Low preset) or `detail` (small props and fine decor that High and Ultra add). A prop's `layer` field overrides
# its class's default here. A detail prop has no collider: the presets never change what blocks a player.
[layers]
default = "base"
clutter = "detail"

# The House's world look (docs/decisions/2026-10-13-house-world-look.md, the kitchen pilot's C2-white): the shared
# measures every room's procedural props are built with (tools/blender/prop_geom.py `Style`) and the direction's
# paints. Present-day, well made, never worn; not plasticine (only the characters are).
[style]
direction = "C2-white"
bevel_m = 0.010          # the chamfer of a body or a slab
bevel_small_m = 0.003    # the chamfer of a front, a top, a small part
segments = 16            # round parts of a hero prop (burners, knobs); 8 to 10 on room props
handle = "bar"           # one handle everywhere: a round bar on two standoffs
handle_radius_m = 0.007
handle_standoff_m = 0.03
front_gap_m = 0.003      # the seam around a door or drawer front
front_thickness_m = 0.019
plinth_m = 0.1           # one kick height for counters, sink, stove, fridge and island
plinth_setback_m = 0.075
worktop_m = 0.9          # one worktop line
worktop_thickness_m = 0.03
floor_shade = [0.82, 0.25]  # a soft occlusion toward the floor: x0.82 at the floor, none from 0.25 m up
paints = ["wood_front", "wood_front_dark", "worktop_wood", "worktop_stone", "tile_splash", "enamel_white",
          "steel_warm", "steel_black", "chrome", "glass_tint", "glass_dark", "rubber_black", "porcelain_white",
          "enamel_cream", "upholstery", "upholstery_light", "upholstery_warm", "cushion_teal",
          "soil_dark", "leaf_green", "leaf_dark", "art_white", "art_sky", "art_pink", "art_terracotta", "art_bun",
          "art_patty", "cushion_rust", "cushion_mustard", "throw_cream",
          "carpet_field", "carpet_border", "carpet_slate", "stone_light", "stone_dark", "book_cream", "book_teal", "book_mustard", "book_red", "book_navy", "book_sage",
          "book_grey", "mirror_glass", "coat_navy", "coat_camel", "kraft", "kraft_tape", "blueprint_blue", "carpet_navy",
          "coir", "carpet_rust"]

# The fine pack: ONE shared opaque material (`kit_fine-vcol`) for the world look's props, as the kit's `set` pack
# (docs/kit.md "Materials"): the paint is the vertex colour, its alpha picks the layer (1 - k/16 for layer k), and
# godot/props/prop_fine.gdshader reads the layer's grey detail and normal from shared textures, built once per tier
# from the same ambientCG sources (`tiers`, px) and VRAM-compressed on import. A layer without a source is a flat
# finish (metallic and roughness only). Order matters: the index is the layer.
[fine]
source = "ambientcg_materials_2k"  # the sources/ record every textured layer comes from (CC0)
tiers = {high = 1024, low = 512}
layers = [
    {name = "wood_front", source = "Wood092", roughness = 0.6, normal_strength = 0.45},
    {name = "worktop_wood", source = "Wood049", roughness = 0.5, normal_strength = 0.5},
    {name = "stone", source = "Concrete034", roughness = 0.4, normal_strength = 0.25},
    {name = "tile", source = "Tiles107", roughness = 0.22, normal_strength = 0.8},
    {name = "enamel", metallic = 0.0, roughness = 0.2},
    {name = "steel", metallic = 0.6, roughness = 0.42},  # warm brushed steel
    {name = "chrome", metallic = 0.8, roughness = 0.2},
    {name = "gloss", metallic = 0.3, roughness = 0.06},  # dark glass panels (oven window, clock)
    {name = "paint", metallic = 0.0, roughness = 0.7},   # rubber, plastic, painted parts
    # The living room's soft goods (#150): appended, so the kitchen's layers keep their index (a textured layer's
    # slot is its place among the textured ones: fabric 4, weave 5, carpet 6).
    {name = "fabric", source = "Fabric036", roughness = 0.92, normal_strength = 0.55},  # linen upholstery
    {name = "weave", source = "Fabric061", roughness = 0.88, normal_strength = 0.6},    # cushions, throws
    {name = "carpet", source = "Carpet016", roughness = 0.96, normal_strength = 0.7},   # rugs
]

# The props' paints: a library material and an sRGB hex (D1 palette, look.md section 7). The kit's roles
# (kits/house.json: trim, boards, lino, fence, concrete, glass ...) can be named too. A pack prop's source colours
# are clustered into as many groups as it has roles; the clusters, dark to light, take its roles, dark to light.
[roles]
wood_dark = {material = "wood", hex = "#3d2a1e"}
wood_mid = {material = "wood", hex = "#6b4a32"}
fabric = {material = "plaster", hex = "#6b5a52"}
fabric_accent = {material = "plaster", hex = "#b5593a"}
cream = {material = "plaster", hex = "#d8cdb4"}
mustard = {material = "plaster", hex = "#d0a02c"}
teal_stripe = {material = "plaster", hex = "#1f8a8a"}
porcelain = {material = "plaster", hex = "#d6d2c6"}
appliance = {material = "plaster", hex = "#c8c3b6"}
cardboard = {material = "plaster", hex = "#a8855e"}
rubber = {material = "plaster", hex = "#1c1b1a"}
plant = {material = "plaster", hex = "#4f7f4a"}
flower = {material = "plaster", hex = "#c25a7a"}
bottle_green = {material = "plaster", hex = "#2f4a32"}
metal_dark = {material = "metal", hex = "#23211f"}
metal_grey = {material = "metal", hex = "#6d6e6c"}
pipe_red = {material = "metal", hex = "#8a1f1a"}
rust_red = {material = "metal", hex = "#7a3a2a"}
safety_green = {material = "metal", hex = "#5f7a3a"}
car_paint = {material = "metal", hex = "#c4422c"}
