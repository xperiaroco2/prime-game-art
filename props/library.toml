wood_front_dark = {material = "fine", layer = "wood_front", hex = "#3d2a1e"}
worktop_wood = {material = "fine", layer = "worktop_wood", hex = "#a5774c"}
worktop_stone = {material = "fine", layer = "stone", hex = "#8a857c"}
tile_splash = {material = "fine", layer = "tile", hex = "#e4dfd4"}
