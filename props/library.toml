# The House dressing library (art #87, map request #73): one GLB per generic prop (furniture, dressing, fixtures,
# outdoor) in the kit's materials, painted by role as vertex colour. docs/props.md explains every field; the plan is
# D:/prime-art-raw/research/2026-10-10-house-plan (props.md, inventory.md section 9). Sizes are the engineer's
# inventory draft (L along X, W along Z, H up, metres); a size that does not work is reported, never changed silently.
# Paints and shapes are taste data: changing a hex or a prop's roles needs no code change.

library = "house"
version = 1
kit_spec = "kits/house.json"
out = "props/library/v1"  # under the raw folder: D:/prime-art-raw/props/library/v1/<id>.glb
review = "review/house/87"  # line-up sheets, under the raw folder
licences = ["CC0-1.0"]
max_materials = 6
new_materials = ["emissive"]  # materials the props need that kit v1 lacks (kit v2, #86, adds them)

# batch: the build order (1: indoor furniture and dressing; 2: outdoor, fixtures, vehicles).

# Library material -> the kit's material. Re-point a line here when the kit's material plan changes (kit v2, #86:
# look.md section 5 merges plaster, wood and concrete into one `set` material); nothing else names a material.
[materials]
plaster = "plaster"
wood = "wood"
concrete = "concrete"
metal = "metal"
glass = "glass"
emissive = "emissive"


# Triangles by class, [min, max] (look.md section 6). `vehicle` is the parked cars (the car of #79 has 3,000 to 5,000).
[budgets]
dressing = [150, 600]
room = [400, 1500]
fixture = [100, 400]
vehicle = [400, 3000]
clutter = [12, 400]  # small lived-in props on surfaces, walls and floors (art #104): no collider

# The props' paints: a library material and an sRGB hex (D1 palette, look.md section 7). The kit's roles
# (kits/house.json: trim, boards, lino, fence, concrete, glass ...) can be named too. A pack prop's source colours
# are clustered into as many groups as it has roles; the clusters, dark to light, take its roles, dark to light.
[roles]
wood_dark = {material = "wood", hex = "#3d2a1e"}
wood_mid = {material = "wood", hex = "#6b4a32"}
fabric = {material = "plaster", hex = "#6b5a52"}
fabric_accent = {material = "plaster", hex = "#b5593a"}
cream = {material = "plaster", hex = "#d8cdb4"}
mustard = {material = "plaster", hex = "#d0a02c"}
teal_stripe = {material = "plaster", hex = "#1f8a8a"}
porcelain = {material = "plaster", hex = "#d6d2c6"}
appliance = {material = "plaster", hex = "#c8c3b6"}
cardboard = {material = "plaster", hex = "#a8855e"}
rubber = {material = "plaster", hex = "#1c1b1a"}
plant = {material = "plaster", hex = "#4f7f4a"}
flower = {material = "plaster", hex = "#c25a7a"}
bottle_green = {material = "plaster", hex = "#2f4a32"}
metal_dark = {material = "metal", hex = "#23211f"}
metal_grey = {material = "metal", hex = "#6d6e6c"}
pipe_red = {material = "metal", hex = "#8a1f1a"}
rust_red = {material = "metal", hex = "#7a3a2a"}
safety_green = {material = "metal", hex = "#5f7a3a"}
car_paint = {material = "metal", hex = "#c4422c"}
stone = {material = "concrete", hex = "#7d786e"}
brick = {material = "concrete", hex = "#8a4a38"}
terracotta = {material = "concrete", hex = "#a85a3c"}
soil = {material = "concrete", hex = "#4a3a30"}
gravel = {material = "concrete", hex = "#8a8579"}
bulb = {material = "emissive", hex = "#ffd9ad"}
tube = {material = "emissive", hex = "#e6eef2"}
safelight = {material = "emissive", hex = "#d0201a"}

# Inventory props this library does not make, and who does (the manager's split of 2026-10-10).
