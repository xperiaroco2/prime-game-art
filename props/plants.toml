# One 2 m segment; flat ends, so segments in a row read as one hedge.
[[prop]]
id = "hedge"
batch = 1
name = "Hedge segment"
class = "vegetation"
size_m = [2.0, 0.7, 1.2]
count = 12
route = "proc"
shape = "hedge"
params = {lump = 0.16, per_row = 4}
roles = ["leaf_hedge", "leaf_hedge_light"]
pivot = "floor"
collision = "box"
