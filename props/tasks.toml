# The House map's task-station props (art #82, map #73) and the procedural room-defining props no other package
# owns. Built by `tools/run.sh props` (docs/props.md) with tools/blender/props_task.py; every value here is a
# proposal for the engineer (look, sizes, paints, mounts) and can change without touching code.
#
# Per prop: id, type (the builder), kind (the triangle budget), w, d, h (metres: width along X, depth along Z,
# height along Y; the built bounds must equal them within 1 cm), chain and station (the game's marker under
# `Stations`, inventory.md section 7), room, count (placements), surface (a `surface_game` quad the game draws on),
# nodes (extra meshes: lids are leaves with their hinge as origin; on/off are state meshes the game shows or hides),
# mount (where it stands), notes. Sizes come from the plan's props.md section 7; where a stand or a fitting adds to
# the size given there, `plan_size` keeps the plan's number and `notes` says why.

kit = "kits/house.json"
version = 1

[budget_tris]
hero = 4000      # task-critical pieces players use (look.md section 6: 1,000 to 4,000)
room = 1500      # room-defining (400 to 1,500)

[materials.surface_game]  # the game's writable surface; not a world material (look.md section 5)
source = ""
tile_m = 1.0
lum_std = 0.0
normal_strength = 0.0
roughness = 0.9

# Prop paints on the kit's five materials (the kit's roles, kits/house.json, are used as they are).
[roles]
wood_light = { material = "wood", hex = "#8b6a48" }
